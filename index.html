function uebungAktionenHtml(u, tippen) {
  const t = [];
  if (u.stufe === 'frage' || u.stufe === 'buchstaben' || u.stufe === 'wort') {
    if (tippen && u.stufe === 'frage' && !u.urteil) {
      t.push(`<div class="tipp-zeile">
        <input id="ueb-eingabe" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="Antwort eintippen …"
               aria-label="Antwort eintippen">
        <button class="btn primary" data-tu="lernboxTippPruefen">Prüfen</button>
      </div>`);
    }
    t.push(`<div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap">
      ${u.stufe !== 'wort'
        ? `<button class="btn" data-tu="lernboxTipp">${
             u.stufe === 'frage' ? 'Tipp' : 'Noch ein Tipp'}</button>` : ''}
      <button class="btn primary" data-tu="lernboxAufdecken">Antwort zeigen</button>
    </div>
    <p class="tastenhilfe"><kbd>Leertaste</kbd> aufdecken${
      u.stufe !== 'wort' ? ' · <kbd>T</kbd> Tipp' : ''}</p>`);
  } else if (u.stufe === 'antwort') {
    /* „Konnte ich“ steht dort, wo eben „Antwort zeigen“ war. Ein
       durchgerutschter Doppeltipp trifft dann den harmlosen Knopf — er
       schenkt schlimmstenfalls einen Treffer, statt einen erarbeiteten
       Stand auf null zurückzusetzen. Zusammen mit der Zeit- und
       Ortssperre ist der Fehlgriff damit in die ungefährliche Richtung
       gelenkt. */
    /* Zwei Zeilen, bewusst so herum:
       — Oben steht „Zudecken und üben“, also genau dort, wo eben „Antwort
         zeigen“ war. Ein durchgerutschter Doppeltipp landet damit auf dem
         harmlosesten Knopf überhaupt.
       — Unten stehen die beiden Urteile, so tief wie die Navileiste es
         zulässt. Gemessen auf dem iPhone SE liegen sie damit im unteren
         Bilddrittel, also im einhändig erreichbaren Bereich. */
    /* In der festen Aktionsleiste stehen nur die beiden URTEILE. „Zudecken
       und üben“ ist kein Urteil, sondern ein Zwischenschritt und sitzt
       deshalb direkt an der Antwort (siehe malUebungsKarte). Damit bleibt
       die Leiste einzeilig und liegt so tief, wie die Navigation es
       zulässt — auf dem iPhone SE im einhändig erreichbaren Bereich. */
    /* Gemessen wurde: „Konnte ich nicht“ überdeckte die Fläche von „Antwort
       zeigen“ zu 3052 px², „Konnte ich“ nur zu 224 px² — ein Nachtipp landete
       also mit hoher Wahrscheinlichkeit auf dem Knopf, der den erarbeiteten
       Stand auf null zurücksetzt.
       Die Anordnung zu drehen half nicht: Dann liegt eben der andere Knopf
       dort, und der Ortsschutz blockiert zusätzlich echte Tipper. Wirksam ist
       stattdessen eine kurze SPERRE: Die Urteilsknöpfe nehmen 350 ms lang
       keine Tipper an (`ueb-sperre`, reines CSS ohne Zeitgeber, setzt sich
       bei jedem Neuzeichnen zurück). Ein Nachtipp läuft damit ins Leere,
       ein bewusster Tipp danach kommt an. */
    t.push(`<div class="row ueb-sperre" style="gap:8px;justify-content:center">
      <button class="btn primary" data-tu="lernboxJa">Konnte ich</button>
      <button class="btn" data-tu="lernboxNein">Konnte ich nicht</button>
    </div>
    <p class="tastenhilfe">„Konnte ich“ nur, wenn du es <em>vor</em> dem Aufdecken wusstest.
      <kbd>J</kbd> ja · <kbd>N</kbd> nein · <kbd>Z</kbd> zudecken</p>`);
  } else if (u.stufe === 'zugedeckt') {
    if (tippen && !u.urteil) {
      t.push(`<div class="tipp-zeile">
        <input id="ueb-eingabe" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="Antwort eintippen …"
               aria-label="Antwort eintippen">
        <button class="btn primary" data-tu="lernboxTippPruefen">Prüfen</button>
      </div>`);
    } else {
      t.push(`<div class="row ueb-sperre" style="gap:8px;justify-content:center">
        <button class="btn primary" data-tu="lernboxJa">Konnte ich</button>
        <button class="btn" data-tu="lernboxNein">Konnte ich nicht</button>
      </div>`);
    }
  }
  return t.join('');
}

/** Auswertung beim Tippen — dieselbe Toleranz wie im Karteikasten. */
function uebungTippPruefen() {
  const u = uebung;
  if (!u?.aktiv) return;
  const k = S.cards.find(x => x.id === u.aktuell);
  if (!k) return;
  const eingabe = $('#ueb-eingabe')?.value ?? '';
  const art = antwortPruefen(eingabe, antwortText(k));
  if (art === 'leer') { u.stufe = 'antwort'; return malLernbox(); }
  u.urteil = art;
  /* „Fast“ zählt als Treffer: Ein Tippfehler ist kein Gedächtnisfehler, und
     bei einem Kriterium von zwei Treffern würde jede Vertipper-Runde die
     Karte sonst um zwei Durchgänge zurückwerfen. */
  const konnte = art === 'richtig' || art === 'fast';
  malLernbox();
  /* Das Urteil kommt verzögert, damit man die Auswertung noch lesen kann —
     und genau darin lag ein Datenverlust: In diesem Fenster standen wieder
     bedienbare Knöpfe da. Wer weiterklickte, bekam das Urteil auf die
     NÄCHSTE Karte gebucht, die er nie gesehen hatte; nach einem Abbruch
     traf es sogar die erste Karte der neuen Runde.
     Deshalb: Zeitgeber merken, an Karte UND Runde binden, und beim
     Weiterschalten löschen. */
  u.tippLauf = (u.tippLauf || 0) + 1;
  const lauf = u.tippLauf;
  const karteId = u.aktuell;
  clearTimeout(u.tippZeitgeber);
  u.tippZeitgeber = setTimeout(() => {
    const jetzt = uebung;
    if (!jetzt?.aktiv || jetzt !== u) return;          // Runde ist eine andere
    if (jetzt.tippLauf !== lauf) return;               // schon weitergeschaltet
    if (jetzt.aktuell !== karteId) return;             // andere Karte steht da
    jetzt.tippZeitgeber = null;
    uebungBewerten(konnte);
  }, konnte ? 700 : 1600);
}

/** Einen ausstehenden Tipp-Zeitgeber verwerfen. Muss überall dort passieren,
 *  wo die Runde weiterspringt, endet oder neu beginnt. */
function tippZeitgeberLoeschen(u) {
  if (u?.tippZeitgeber) { clearTimeout(u.tippZeitgeber); u.tippZeitgeber = null; }
  if (u) u.tippLauf = (u.tippLauf || 0) + 1;
}

function malUebungsAbschluss(ziel) {
  const u = uebungZuletzt;
  const min = Math.round(u.sekunden / 60);
  /* Der Rest der BOX, nicht der Rest des Stapels. Vorher hing der Hinweis an
     `u.stapel.length`, das nach einer regulär beendeten Runde immer 0 ist —
     bei 40 Karten in der Box stand dort „12 von 12 geschafft“ und kein Wort
     über die 28, die liegengeblieben sind. */
  /* Der Rest DIESES Kastens — die Runde hatte einen Filter. Vorher stand im
     Abschluss „Noch 25 Karten in der Lernbox“ und der Knopf „Noch eine
     Runde“ meldete danach „Die Lernbox ist leer“. */
  const rest = lernboxKarten(u.deckFilter).length;
  ziel.innerHTML = `
    <div class="abschluss">
      <div class="gross-ico">📦</div>
      <h1>Runde beendet</h1>
      <p>${u.fertig} von ${u.gesamt} ${u.gesamt === 1 ? 'Karte' : 'Karten'} haben die Lernbox
         verlassen und sind jetzt im Karteikasten.</p>
      <p class="mini">${u.versuche} Durchgänge · ${u.treffer} Treffer ·
         ${min < 1 ? 'weniger als eine Minute' : min + ' Minuten'}</p>
      ${u.zurueckgestellt ? `<p class="mini">${u.zurueckgestellt}
        ${u.zurueckgestellt === 1 ? 'Gegenrichtung wartet' : 'Gegenrichtungen warten'}
        auf die nächste Runde — dieselbe Vokabel zweimal hintereinander zu üben
        bringt nichts.</p>` : ''}
      ${rest ? `<div class="hinweis${rest > LERNBOX_STAPEL_MAX * 2 ? ' rot' : ' blau'} mt"
          style="text-align:left">
        <strong>Noch ${rest} ${rest === 1 ? 'Karte' : 'Karten'} in der Lernbox.</strong>
        ${rest > LERNBOX_STAPEL_MAX * 2
          ? `Das ist viel. Nimm dir ein paar über „Kann ich schon“ heraus oder
             schalte in den Einstellungen vorübergehend auf ein Treffer —
             eine volle Box, die nie leer wird, hilft niemandem.`
          : `Beim nächsten Mal geht es damit weiter — am besten an einem anderen
             Tag, das ist der wirksamere Abstand.`}
        ${rest > LERNBOX_STAPEL_MAX ? `<div style="margin-top:8px">
          <button class="btn klein primary" data-tu="lernboxNochmal">Noch eine Runde</button>
        </div>` : ''}</div>` : ''}
      <div class="row" style="gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn" data-tu="lernboxZurueck">Zur Übersicht</button>
        <button class="btn primary" data-tu="zumKarteikasten">Zum Karteikasten</button>
      </div>
    </div>`;
  verdrahten(ziel);
}

function farbwahlHtml(aktiv, palette) {
  return `<label class="feld"><span>Farbe</span><div class="row" id="m-farben">${
    (palette || DECK_FARBEN).map(f => `<button type="button" class="btn klein" data-farbe="${f}"
      aria-label="Farbe ${f}" style="background:${f};border-color:${f};width:34px;height:30px;${
      f === aktiv ? 'outline:2px solid var(--txt);outline-offset:1px' : ''}"></button>`).join('')
  }</div></label>`;
}
function farbwahlVerdrahten(m, start) {
  m.dataset.farbe = start;
  $('#m-farben', m)?.addEventListener('click', e => {
    const b = e.target.closest('[data-farbe]'); if (!b) return;
    m.dataset.farbe = b.dataset.farbe;
    $$('#m-farben button', m).forEach(x => x.style.outline = '');
    b.style.outline = '2px solid var(--txt)';
    b.style.outlineOffset = '1px';
  });
}

/** Legt einen Kasten an. Liefert die neue deckId oder null. */
async function deckAnlegen(vorschlag) {
  const r = await modal({
    titel: 'Neuer Kasten',
    html: `<label class="feld"><span>Name</span>
             <input id="m-name" maxlength="120" placeholder="z. B. Englisch" value="${esc(vorschlag || '')}"></label>
           ${farbwahlHtml(DECK_FARBEN[0])}`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, {
      text: 'Anlegen', wert: 'ok', art: 'primary',
      pruefen: () => {
        if (!$('#m-name').value.trim()) { toast('Bitte einen Namen eingeben.'); return false; }
      }
    }],
    beimOeffnen: m => farbwahlVerdrahten(m, DECK_FARBEN[0])
  });
  if (r !== 'ok') return null;
  const name = String(W('m-name', '')).trim();
  if (!name) return null;
  const id = neueId();
  schreibe(FB.setDoc(FB.doc(colDecks(), id), neuesDeck(name, W('farbe', DECK_FARBEN[0]))), 'Kasten anlegen');
  lernAuswahl?.add(id);
  toast('Kasten „' + name + '“ angelegt.');
  return id;
}

/* ---------- 11. Karten -------------------------------------------------- */

const KARTEN_FILTER = {
  alle:    ['Alle Karten',    () => true],
  faellig: ['Nur fällige',    istFaellig],
  neu:     ['Nur neue',       k => istNeu(k) && !k.suspendiert],
  problem: ['Problemkarten',  istProblemkarte],
  ruht:    ['Ruhende',        k => !!k.suspendiert]
};

/* Durchsuchbarer Klartext einer Karte, gepuffert.
   Ohne Puffer liefe bei jedem Tastendruck über den gesamten Bestand ein
   Regex-Durchlauf je Feld — bei 2.000 Karten spürbar. Der Schlüssel enthält
   die Feldlängen, damit eine geänderte Karte den Eintrag von selbst
   verwirft; ein Wörterbuch wächst dabei nie über den Bestand hinaus. */
const suchtextPuffer = new Map();
function suchtextVon(k) {
  const stempel = `${k.frage?.length || 0}:${k.antwort?.length || 0}:${k.notiz?.length || 0}:` +
                  `${k.extra?.length || 0}:${k.mark?.length || 0}:${(k.tags || []).length}:${k.deckId}`;
  const treffer = suchtextPuffer.get(k.id);
  if (treffer && treffer[0] === stempel) return treffer[1];
  const roh = [k.frage, k.antwort, k.notiz, k.extra, k.mark].map(f => String(f ?? '')).join(' ');
  // Bewusst der billige Regex-Weg statt htmlZuText(): Für die Suche genügt
  // es, die spitzen Klammern loszuwerden — sonst fände „b“ jedes <b>.
  const text = (k.format === 'html'
      ? roh.replace(/<[^>]*>/g, ' ').replace(/&(?:nbsp|amp|lt|gt|quot|#\d+);/g, ' ')
      : roh) + ' ' + deckName(k.deckId) + ' ' + (k.tags || []).join(' ');
  const fertig = text.toLowerCase().replace(/\s+/g, ' ');
  suchtextPuffer.set(k.id, [stempel, fertig]);
  return fertig;
}

function gefilterteKarten() {
  const q = S.kartenSuche.trim().toLowerCase();
  let l = S.cards;
  if (S.kartenFilterDeck !== 'alle') l = l.filter(k => k.deckId === S.kartenFilterDeck);
  const filter = KARTEN_FILTER[S.kartenFilter] ? S.kartenFilter : 'alle';
  if (filter !== 'alle') l = l.filter(KARTEN_FILTER[filter][1]);
  if (q) {
    const teile = q.split(/\s+/);
    l = l.filter(k => {
      const heu = suchtextVon(k);
      return teile.every(t => heu.includes(t));
    });
  }
  return l.slice().sort((a, b) =>
    (a.due || '').localeCompare(b.due || '') || (a.frage || '').localeCompare(b.frage || '', 'de'));
}

function malKarten() {
  const ziel = $('#seite-karten');
  const alle = gefilterteKarten();
  const zeigen = alle.slice(0, S.kartenLimit);
  const ausw = S.auswahl.size;

  ziel.innerHTML = `
    <div class="spread"><h1 style="margin:0">Karten</h1>
      <button class="btn primary" data-tu="neueKarte">+ Neue Karte</button></div>

    <div class="row mt" style="gap:8px">
      <input id="k-suche" placeholder="Suchen in Frage, Antwort, Notiz …"
             value="${esc(S.kartenSuche)}" style="flex:2;min-width:180px">
      <select id="k-deck" style="flex:1;min-width:140px">
        <option value="alle">Alle Kästen (${S.cards.length})</option>
        ${S.decks.map(d => `<option value="${esc(d.id)}" ${S.kartenFilterDeck === d.id ? 'selected' : ''}>
          ${esc(d.name)} (${kartenVon(d.id).length})</option>`).join('')}
      </select>
      <select id="k-filter" style="flex:1;min-width:140px">
        ${(() => {
          // Zählen im gerade gewählten Kasten, nicht im Gesamtbestand — sonst
          // stünde „Problemkarten (2)“ neben einer Liste mit einer Karte.
          const grund = S.kartenFilterDeck === 'alle' ? S.cards : kartenVon(S.kartenFilterDeck);
          return Object.entries(KARTEN_FILTER).map(([wert, [name, pruef]]) => {
            const n = wert === 'alle' ? grund.length : grund.filter(pruef).length;
            return `<option value="${wert}" ${S.kartenFilter === wert ? 'selected' : ''}>${esc(name)} (${n})</option>`;
          }).join('');
        })()}
      </select>
    </div>

    ${S.kartenFilter === 'problem' ? `<div class="hinweis mt">
      <strong>Problemkarten</strong> sind seit dem letzten Wiederaufnehmen mindestens
      ${leechGrenze()}× durchgefallen. Sie werden ausgesetzt, sobald sie erneut nicht gewusst
      werden — Karten ohne die Kennzeichnung „ruht“ laufen also noch mit.
      Weiter zu üben bringt hier wenig: Meist ist die Karte zu umfangreich, mehrdeutig oder
      verwechselt sich mit einer anderen. Formuliere sie um oder teile sie auf und nimm sie
      dann über „Bearbeiten“ wieder auf.</div>` : ''}

    ${S.letzterImport ? `<div class="hinweis blau mt row" style="justify-content:space-between;gap:10px">
      <span>Gerade eingelesen: <strong>${S.letzterImport.anzahl}</strong> Karten${
        S.letzterImport.kasten ? ` in „${esc(S.letzterImport.kasten)}“` : ''}.</span>
      <button class="btn klein" data-tu="importZurueck">Import zurücknehmen</button></div>` : ''}

    ${ausw ? `<div class="box flach mt row" style="justify-content:space-between">
      <span><strong>${ausw}</strong> ausgewählt${(() => {
        /* Die Auswahl kann Karten enthalten, die gerade nicht in der Liste
           stehen. Dann muss dabeistehen, worum es geht — sonst löscht man
           auf gut Glück eine Zahl. */
        const k = Array.from(S.auswahl).map(id => S.cards.find(c => c.id === id)).filter(Boolean);
        const namen = Array.from(new Set(k.map(c => deckName(c.deckId))));
        return namen.length === 1 ? ` aus „${esc(namen[0])}“`
          : namen.length ? ` aus ${namen.length} Kästen` : '';
      })()}</span>
      <span class="row">
        ${Array.from(S.auswahl).some(id => { const c = S.cards.find(x => x.id === id); return c && istProblemkarte(c); })
          ? `<button class="btn klein" data-tu="massAufnehmen">Wieder aufnehmen</button>` : ''}
        <button class="btn klein" data-tu="massVerschieben">Verschieben</button>
        <button class="btn klein gefahr" data-tu="massLoeschen">Löschen</button>
        <button class="btn klein" data-tu="massAus">Aufheben</button>
      </span></div>` : ''}

    <div class="spread mt" style="gap:8px">
      <p class="mini" style="margin:0">${alle.length} ${alle.length === 1 ? 'Karte' : 'Karten'}${
        S.kartenSuche ? ' gefunden' : ''}${alle.length > zeigen.length ? ` · ${zeigen.length} angezeigt` : ''}</p>
      ${alle.length ? (() => {
        // „Auswahl aufheben“ nur, wenn wirklich jede sichtbare Karte gewählt ist.
        // Ein Zahlenvergleich griff daneben, sobald die Suche die Liste kürzte.
        const allesGewaehlt = alle.every(k => S.auswahl.has(k.id));
        return `<button class="btn klein" data-tu="${allesGewaehlt ? 'massAus' : 'alleWaehlen'}">

      })() : ''}

    <div>${zeigen.length ? zeigen.map(k => {
      const f = istFaellig(k);
      return `<div class="liste-item">
        <input type="checkbox" data-sel="${esc(k.id)}" ${S.auswahl.has(k.id) ? 'checked' : ''}
               style="margin-top:3px" aria-label="Karte auswählen">
        <div class="haupt">
          <div class="frage">${esc(frageText(k)) || '<em class="muted">ohne Frage</em>'}</div>
          <div class="antwort">${esc(antwortText(k))}</div>
          <div class="row mini" style="gap:5px;margin-top:5px">
            <span class="badge" style="background:${esc(deckFarbe(k.deckId))}22;color:${esc(deckFarbe(k.deckId))}">
              ${esc(deckName(k.deckId))}</span>
            ${variantenMarke(k) ? `<span class="badge" style="background:var(--akzent-bg);color:var(--akzent)">${esc(variantenMarke(k))}</span>` : ''}
            <span class="badge">Fach ${fachVon(k)}</span>
            ${istProblemkarte(k) ? `<span class="badge" style="background:var(--bewertung-1-bg);color:var(--bewertung-1)">Problemkarte · ${Number(k.lapses) || 0}×</span>` : ''}

          </div>
        </div>
        <div class="werkzeuge">
          <button class="btn klein" data-tu="karteBearbeiten" data-id="${esc(k.id)}">Bearbeiten</button>
          <button class="btn klein gefahr" data-tu="karteLoeschen" data-id="${esc(k.id)}">×</button>
        </div></div>`;
    }).join('') : `<div class="leer">${S.kartenSuche || S.kartenFilterDeck !== 'alle'
        ? 'Nichts gefunden.' : 'Noch keine Karten.'}</div>`}</div>

    ${alle.length > zeigen.length
      ? `<button class="btn breit mt" data-tu="mehrKarten">Weitere ${
          Math.min(60, alle.length - zeigen.length)} laden</button>` : ''}`;

  verdrahten(ziel);
  const suche = $('#k-suche');
  suche.addEventListener('input', () => {
    S.kartenSuche = suche.value; S.kartenLimit = 60;
    clearTimeout(suche._t);
    suche._t = setTimeout(() => {
      const pos = suche.selectionStart;
      malKarten();
      const neu = $('#k-suche'); neu.focus(); neu.setSelectionRange(pos, pos);
    }, 220);
  });
  /* Beim Wechsel des Ausschnitts die Auswahl verwerfen. Sonst sammelt sich
     unsichtbar an, was in anderen Kästen angehakt war, und „Löschen“ trifft
     Karten, die der Nutzer beim Klicken gar nicht vor Augen hat. */
  $('#k-deck').addEventListener('change', e => {
    S.kartenFilterDeck = e.target.value; S.kartenLimit = 60; S.auswahl.clear(); malKarten();
  });
  $('#k-filter').addEventListener('change', e => {
    S.kartenFilter = e.target.value; S.kartenLimit = 60; S.auswahl.clear(); malKarten();
  });
  $$('#seite-karten input[data-sel]').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? S.auswahl.add(cb.dataset.sel) : S.auswahl.delete(cb.dataset.sel);
    malKarten();
  }));

/* ---------- 11a. Editor mit Auszeichnung (Stufe 5) ---------------------- */

/* Umgesetzt über contenteditable und document.execCommand. execCommand gilt
   als veraltet — es gibt aber bis heute keinen Ersatz, der ohne Framework
   auskommt, und alle Zielbrowser unterstützen es. Die Alternative wäre eine
   eigene Auszeichnungs-Engine gewesen; das steht in keinem Verhältnis.

   Sicherheit: Was hier hineingerät, ist gleich zweimal eingedampft — beim
   Speichern (edLesen) und beim Anzeigen (feldHtml). Doppelt, weil ein
   Datensatz auch aus einem Import oder von einem anderen Gerät kommen kann,
   ohne je durch diesen Editor gelaufen zu sein. */

const ED_WERKZEUGE = [
  ['bold', '<b>F</b>', 'Fett — Strg+B'],
  ['italic', '<i>K</i>', 'Kursiv — Strg+I'],
  ['underline', '<u>U</u>', 'Unterstrichen — Strg+U'],
  ['strikeThrough', '<s>S</s>', 'Durchgestrichen'],
  '|',
  ['superscript', 'x²', 'Hochgestellt'],
  ['subscript', 'x₂', 'Tiefgestellt'],
  '|',
  ['insertUnorderedList', '•', 'Aufzählung'],
  ['insertOrderedList', '1.', 'Nummerierung'],
  ['insertHorizontalRule', '—', 'Trennlinie'],
  '|',
  ['removeFormat', '<span style="text-decoration:line-through">A</span>', 'Formatierung entfernen']
];
/* Textfarben und Marker. Bewusst wenige und kräftige Werte: Eine freie
   Farbwahl führt auf Karteikarten zu Farben, die im Dunkelmodus verschwinden.
   Diese sechs sind auf beiden Hintergründen lesbar. */
const ED_TEXTFARBEN = [
  ['#e24b4a', 'Rot'], ['#ef9f27', 'Orange'], ['#639922', 'Grün'],
  ['#378add', 'Blau'], ['#8e6bd6', 'Violett'], ['', 'Standard']
];
const ED_MARKERFARBEN = [
  ['#fff3a3', 'Gelb'], ['#c9f0c0', 'Grün'], ['#ffd6d6', 'Rot'],
  ['#cfe4fb', 'Blau'], ['', 'Kein Marker']
];

function edLeisteHtml() {
  const knopf = (befehl, zeichen, titel) =>
    `<button type="button" class="ed-knopf" data-ed="${befehl}" title="${esc(titel)}"
             aria-label="${esc(titel)}">${zeichen}</button>`;
  const farbwahl = (art, liste, titel, symbol) =>
    `<span style="position:relative;display:inline-flex">
       <button type="button" class="ed-knopf" data-edfarbe="${art}" title="${esc(titel)}"
               aria-label="${esc(titel)}">${symbol}</button>
       <span class="ed-palette" data-fuer="${art}" hidden
             style="position:absolute;top:32px;left:0;z-index:9;display:flex;gap:4px;padding:6px;
                    background:var(--bg);border:1px solid var(--border);border-radius:9px;
                    box-shadow:var(--schatten)">
         ${liste.map(([wert, name]) => `<button type="button" class="ed-knopf" data-setfarbe="${art}"
             data-wert="${esc(wert)}" title="${esc(name)}" aria-label="${esc(name)}">${
             wert ? `<span class="ed-farbe" style="background:${esc(wert)}"></span>`
                  : '<span class="ed-farbe" style="background:transparent">⌀</span>'}</button>`).join('')}
       </span></span>`;
  return `<div class="ed-leiste" id="ed-leiste">
    ${ED_WERKZEUGE.map(w => w === '|' ? '<span class="tr"></span>' : knopf(...w)).join('')}
    <span class="tr"></span>
    ${farbwahl('fore', ED_TEXTFARBEN, 'Textfarbe', '<span style="border-bottom:3px solid var(--akzent)">A</span>')}
    ${farbwahl('hilite', ED_MARKERFARBEN, 'Marker',
        '<span style="background:#fff3a3;color:#333;border-radius:3px;padding:0 3px">A</span>')}
  </div>`;
}

/** Ein beschriftetes Eingabefeld mit Quelltext-Umschalter.
 *  Das versteckte <input> ist der eigentliche Wertträger — nur so kommt der
 *  Inhalt durch die Sammelmechanik von modal() (die liest input/textarea/
 *  select, kein contenteditable). */
function edFeldHtml(id, titel, wert, platzhalter, hoehe) {
  return `<div class="ed-block" data-edblock="${id}">
    <div class="ed-kopf"><span id="${id}-titel">${esc(titel)}</span>
      <button type="button" class="ed-knopf" data-edquelle="${id}"
              title="HTML-Quelltext anzeigen" aria-label="HTML-Quelltext anzeigen">&lt;/&gt;</button></div>
    <div class="ed-feld" id="${id}-ed" contenteditable="true" role="textbox" aria-multiline="true"
         aria-labelledby="${id}-titel" data-leer="${esc(platzhalter || '')}"
         ${hoehe ? `style="min-height:${hoehe}px"` : ''}>${htmlSauber(wert)}</div>
    <input type="hidden" id="${id}" value="${esc(htmlSauber(wert))}">
  </div>`;
}

/** Verdrahtet Werkzeugleiste, Felder, Quelltext-Umschalter und Tag-Eingabe.
 *  Liefert Helfer für Vorschau und Auslesen. */
function edVerdrahten(m, feldIds) {
  const quelleAn = new Set();
  const feld = id => $('#' + id + '-ed', m);
  const traeger = id => $('#' + id, m);
  let letztesFeld = feldIds[0];

  /* Wert vom sichtbaren Feld in den versteckten Träger spiegeln. Im
     Quelltextmodus ist der sichtbare Inhalt der Quelltext selbst. */
  const spiegeln = id => {
    const el = feld(id); if (!el) return;
    const roh = quelleAn.has(id) ? (el.textContent || '') : el.innerHTML;
    traeger(id).value = htmlSauber(roh);
  };

  feldIds.forEach(id => {
    const el = feld(id); if (!el) return;
    el.addEventListener('input', () => spiegeln(id));
    el.addEventListener('focus', () => { letztesFeld = id; leisteAuffrischen(); });
    el.addEventListener('keyup', leisteAuffrischen);
    el.addEventListener('mouseup', leisteAuffrischen);
    /* Einfügen immer als Klartext bzw. eingedampftes HTML. Ohne diesen
       Handler landet beim Einfügen aus Word ein Wust aus <o:p>, mso-Styles
       und Schriftgrößen im Feld — der Sanitizer räumt ihn zwar weg, aber
       erst beim Speichern, und bis dahin sieht die Karte falsch aus. */
    el.addEventListener('paste', ev => {
      ev.preventDefault();
      const zw = ev.clipboardData;
      const html = zw?.getData('text/html');
      const text = zw?.getData('text/plain') || '';
      if (quelleAn.has(id)) { document.execCommand('insertText', false, text); return; }
      if (html) document.execCommand('insertHTML', false, htmlSauber(html));
      else document.execCommand('insertText', false, text);
      spiegeln(id);
    });
    // Quelltext-Umschalter
    $(`[data-edquelle="${id}"]`, m)?.addEventListener('click', () => {
      const el2 = feld(id);
      if (quelleAn.has(id)) {
        const quelltext = el2.textContent || '';
        quelleAn.delete(id);
        el2.classList.remove('quelle');
        el2.innerHTML = htmlSauber(quelltext);
      } else {
        const html = htmlSauber(el2.innerHTML);
        quelleAn.add(id);
        el2.classList.add('quelle');
        el2.textContent = html;
      }
      $(`[data-edquelle="${id}"]`, m).classList.toggle('an', quelleAn.has(id));
      spiegeln(id);
    });
  });

  /* Werkzeugleiste. mousedown + preventDefault, damit die Markierung im
     Textfeld erhalten bleibt — ein normaler Klick nähme ihr vorher den
     Fokus, und execCommand wüsste nicht mehr, worauf es wirken soll. */
  const leiste = $('#ed-leiste', m);
  function befehl(name, wert) {
    const el = feld(letztesFeld);
    if (!el || quelleAn.has(letztesFeld)) return;
    el.focus();
    try {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand(name, false, wert);
    } catch (_) {}
    spiegeln(letztesFeld);
    leisteAuffrischen();
  }
  function leisteAuffrischen() {
    if (!leiste) return;
    const aus = quelleAn.has(letztesFeld);
    $$('.ed-knopf[data-ed]', leiste).forEach(b => {
      b.disabled = aus;
      if (aus) return b.classList.remove('an');
      try { b.classList.toggle('an', document.queryCommandState(b.dataset.ed)); } catch (_) {}
    });
    $$('.ed-knopf[data-edfarbe]', leiste).forEach(b => { b.disabled = aus; });
  }
  leiste?.addEventListener('mousedown', ev => {
    const b = ev.target.closest('button');
    if (b) ev.preventDefault();
  });
  /* Ein Tipp irgendwo anders schließt die Farbpalette. Vorher ging das nur
     über denselben 30-px-Knopf — auf dem Handy eine Falle. */
  const paletteZu = ev => {
    if (ev.target.closest('.ed-palette') || ev.target.closest('[data-edfarbe]')) return;
    $$('.ed-palette', m).forEach(x => { x.hidden = true; });
  };
  m.addEventListener('pointerdown', paletteZu);
  leiste?.addEventListener('click', ev => {
    const cmd = ev.target.closest('[data-ed]');
    if (cmd) return befehl(cmd.dataset.ed);
    const oeffner = ev.target.closest('[data-edfarbe]');
    if (oeffner) {
      const p = $(`.ed-palette[data-fuer="${oeffner.dataset.edfarbe}"]`, leiste);
      $$('.ed-palette', leiste).forEach(x => { if (x !== p) x.hidden = true; });
      p.hidden = !p.hidden;
      return;
    }
    const setzen = ev.target.closest('[data-setfarbe]');
    if (setzen) {
      const art = setzen.dataset.setfarbe, wert = setzen.dataset.wert;
      $$('.ed-palette', leiste).forEach(x => { x.hidden = true; });
      if (art === 'fore') befehl('foreColor', wert || 'currentColor');
      else befehl('hiliteColor', wert || 'transparent');
    }
  });
  // Tastenkürzel wirken im contenteditable von selbst (Strg+B/I/U) — der
  // Träger muss danach nur nachgezogen werden.
  feldIds.forEach(id => feld(id)?.addEventListener('keydown', ev => {
    if (ev.ctrlKey || ev.metaKey) setTimeout(() => { spiegeln(id); leisteAuffrischen(); }, 0);
  }));

  return {
    lesen: id => { spiegeln(id); return traeger(id)?.value || ''; },
    alle: () => { const o = {}; feldIds.forEach(id => { spiegeln(id); o[id] = traeger(id)?.value || ''; }); return o; },
    quelltextOffen: () => quelleAn.size > 0
  };
}

/** Tag-Eingabe: Chips mit Entfernen-Knopf, Komma oder Enter legt an. */
function edTagsHtml(tags) {
  return `<div class="ed-block"><div class="ed-kopf"><span>Schlagwörter</span></div>
    <div class="ed-tags" id="m-tag-wanne">
      <input id="m-tag-eingabe" placeholder="Schlagwort, dann Enter" autocomplete="off"
             maxlength="40" data-enter-eigen>
    </div>
    <input type="hidden" id="m-tags" value="${esc((tags || []).join('\u001f'))}"></div>`;
}
function edTagsVerdrahten(m) {
  const wanne = $('#m-tag-wanne', m), eingabe = $('#m-tag-eingabe', m), traeger = $('#m-tags', m);
  let liste = String(traeger.value || '').split('\u001f').map(t => t.trim()).filter(Boolean);
  const malen = () => {
    $$('.ed-tag', wanne).forEach(x => x.remove());
    liste.forEach((t, i) => {
      const chip = document.createElement('span');
      chip.className = 'ed-tag';
      chip.innerHTML = `${esc(t)}<button type="button" data-weg="${i}" aria-label="Entfernen">×</button>`;
      wanne.insertBefore(chip, eingabe);
    });
    traeger.value = liste.join('\u001f');
  };
  const zufuegen = roh => {
    String(roh).split(',').map(t => t.trim().replace(/\s+/g, '-').slice(0, 40)).filter(Boolean)
      .forEach(t => { if (liste.length < 30 && !liste.includes(t)) liste.push(t); });
    eingabe.value = ''; malen();
  };
  eingabe.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ',') {
      // Enter darf hier nicht den Speichern-Knopf des Dialogs auslösen.
      ev.preventDefault(); ev.stopPropagation();
      if (eingabe.value.trim()) zufuegen(eingabe.value);
    } else if (ev.key === 'Backspace' && !eingabe.value && liste.length) {
      liste.pop(); malen();
    }
  });
  // Auch ein nicht bestätigtes Wort soll nicht verloren gehen.
  eingabe.addEventListener('blur', () => { if (eingabe.value.trim()) zufuegen(eingabe.value); });
  wanne.addEventListener('click', ev => {
    const weg = ev.target.closest('[data-weg]');
    if (weg) { liste.splice(Number(weg.dataset.weg), 1); malen(); return; }
    if (ev.target === wanne) eingabe.focus();
  });

/* Trennzeichen ist U+001F (Unit Separator): Ein Schlagwort kann es nicht

   Trenner unsicher — beide kommen in Schlagwörtern durchaus vor. */

const ED_FELDER = ['m-frage', 'm-antwort', 'm-extra', 'm-mark', 'm-notiz'];

   Luft für Lernstand, Feldnamen und Auszeichnung. */
const KARTEN_TEXTFELDER = ED_FELDER.concat(['m-cloze', 'm-cloze-antwort', 'm-cloze-notiz']);
const KARTEN_ZEICHEN_GRENZE = 200000;

async function karteBearbeiten(id) {
  let k = id ? S.cards.find(x => x.id === id) : null;

  // eigenen Inhalt — bearbeitet wird immer die Quellkarte.
  if (k && k.quelleId) {

      // Abfrage wird eigenständig — sonst entstünden beim Speichern
      // Abfragen einer Abfrage, die niemand mehr auflösen kann.
      k.quelleId = null; k.variante = 'v';

    knoepfe: [{ text: 'Abbrechen', wert: null }, {

          <div class="vs-marke">${esc(titel)}</div>

          <div class="vs-text">${inhalt || '<span class="muted">— leer —</span>'}</div>
          ${zusatz || ''}</div>`;
        $('#m-vorschau', m).innerHTML =
          seite(cloze && nummern.length ? `Vorderseite — Lücke ${nummern[0]} von ${nummern.length}` : 'Vorderseite',
                frageHtml(probeK)) +
          seite('Rückseite', antwortHtml(probeK),

            (probeK.notiz ? `<div class="vs-extra">${feldHtml(probeK, probeK.notiz)}</div>` : ''));
      }

      /* Beim Wechsel des Kartentyps den Inhalt mitnehmen.
         Die beiden Feldsätze sind getrennt, damit ein versehentliches
         Umschalten nichts wegwirft. Genau dadurch stand der Lückentext-Satz

         musste seine Frage neu tippen, und Antwort, Notiz, Extra und Merker
         waren nach dem Speichern weg — angekündigt nur durch „Gespeichert.“

      let uebernommen = { cloze: false, standard: false };
      const inhaltUebernehmen = cloze => {

          uebernommen.cloze = true;
          const w = edApi.alle();
          frageFeld.value = htmlZuText(w['m-frage'] || '');
          const antw = $('#m-cloze-antwort', m), notiz = $('#m-cloze-notiz', m);
          if (!antw.value.trim()) antw.value = htmlZuText(w['m-antwort'] || '');
          if (!notiz.value.trim()) notiz.value = htmlZuText(w['m-notiz'] || '');
        }
        if (!cloze && !uebernommen.standard && !htmlZuText($('#m-frage-ed', m).innerHTML).trim()) {

          const roh = new Set((String(frageFeld.value).match(/\{\{c(\d{1,3})::/g) || [])

        if (/\{\{|\}\}/.test(auswahl))

  edApi = null; edZurAnsicht = () => {};
  if (r !== 'ok') return;

  const typNeu = KARTEN_TYPEN.includes(W('m-typ', 'standard')) ? W('m-typ', 'standard') : 'standard';

  const werte = typNeu === 'cloze'

        notiz: String(letzteWerte['m-cloze-notiz'] ?? '').trim(),

           aber sie dürfen deshalb nicht gelöscht werden. Die erste Fassung
           setzte hier hart '' und warf damit beides weg, sobald jemand eine
           per Karten-Check umgewandelte Karte nur öffnete und wieder
           speicherte. Angezeigt wurden sie im Lernbetrieb weiterhin; der
           Verlust fiel also erst beim nächsten Lernen auf, und die einzige
           Meldung war „Gespeichert.“
           Jetzt bleibt stehen, was auf der Karte steht. Beim Umbau einer

        extra: String(k?.extra ?? ''), mark: String(k?.mark ?? ''),

        // letzteWerte kommt aus dem DOM und wäre über die Entwicklerkonsole
        // manipulierbar. Der Sanitizer gehört an jede Schreibstelle, nicht
        // nur dorthin, wo im Normalfall getippt wird.
        frage: htmlSauber(W('m-frage', '')).trim(),
        antwort: htmlSauber(W('m-antwort', '')).trim(),
        notiz: htmlSauber(letzteWerte['m-notiz'] ?? '').trim(),
        extra: htmlSauber(letzteWerte['m-extra'] ?? '').trim(),
        mark: htmlSauber(letzteWerte['m-mark'] ?? '').trim(),
        format: 'html',
        deckId: W('m-deck', vorDeck), typ: typNeu
      };
  Object.assign(werte, {
    tags: tagsAusWert(letzteWerte['m-tags']),
    lautschrift: String(letzteWerte['m-lautschrift'] ?? '').trim().slice(0, 200),
    lautschriftAntwort: String(letzteWerte['m-lautschrift-antwort'] ?? '').trim().slice(0, 200)
  });
  // Gegen den Leerlauf prüfen, nicht gegen das Markup: „<b></b>“ ist nicht
  // leer, enthält aber keinen Text — und eine solche Karte wäre unlernbar.
  if (!htmlZuText(werte.frage).trim()) return;
  if (typNeu !== 'cloze' && !htmlZuText(werte.antwort).trim()) return;

  if (k) {
    // Terminierung nur im Klassik-Modus über das Fach neu berechnen — im
    // FSRS-Modus ist die Stabilität eine gemessene Größe, kein aus dem Fach
    // abgeleiteter Wert, und darf beim bloßen Bearbeiten von Text nicht
    // überschrieben werden (sonst geht echter FSRS-Fortschritt verloren).
    if (klassik) {
      const fachNeu = zahl(W('m-fach', fachVon(k)), 1, 12, fachVon(k));
      Object.assign(werte, { fach: fachNeu, stability: S.einstellungen.intervalle[fachNeu - 1] });
    }
    // Sämtliche Felder einlesen, bevor unten eine Rückfrage aufgehen kann —
    // die überschreibt letzteWerte.
    Object.assign(werte, {
      due: W('m-due', k.due || heute()),

    });
    // Problemkarte wieder aufnehmen (KONZEPT §6.3). Der Zähler bekommt einen
    // neuen Bezugspunkt — sonst wäre die Karte beim ersten Fehler sofort
    // wieder ausgesetzt, weil ihr Lebenszähler über der Grenze bleibt.
    // „Zurücksetzen“ allein wäre wirkungslos, weil die Karte weiter ruhte —
    // es schließt das Wiederaufnehmen deshalb ein.
    const wiederAuf = letzteWerte['m-leech-weg'] === true || letzteWerte['m-leech-reset'] === true;
    if (wiederAuf) {
      Object.assign(werte, { leech: false, suspendiert: false, leechBasis: Number(k.lapses) || 0 });
      if (letzteWerte['m-leech-reset'] === true) Object.assign(werte, {
        stability: 0, difficulty: 0, reps: 0, lapses: 0, state: 0, leechBasis: 0,
        fach: 1, lastReview: null, zeitGesamt: 0, zeitReps: 0, due: heute()
      });
      // Die Kennzeichnung kann an einer abgeleiteten Abfrage hängen — die
      // wird über die Quellkarte mitbefreit, sonst bliebe sie für immer als
      // Problemkarte gelistet und könnte nie wieder aussetzen.
      const geschwister = abgeleiteteVon(k.id);
      if (geschwister.length) {
        const patch = { leech: false, suspendiert: false, leechBasis: 0 };
        geschwister.forEach(g => Object.assign(g, patch));
        variantenOpsSchreiben(geschwister.map(g => ['merge', g.id, patch]), 'Problemkarte aufnehmen');
      }
    }

    // Trockenlauf: Entfällt durch diese Änderung eine Abfrage — etwa weil
    // eine Lücke gestrichen oder der Lückentext zur normalen Karte wurde —
    // geht deren Lernstand verloren. Vorher fragen.
    const vorschau = variantenPlan({ ...k, ...werte }, deckVon(werte.deckId));
    if (vorschau.entfernt && !await frage('Karte ändern',
      `Dadurch ${vorschau.entfernt === 1 ? 'entfällt eine eigenständig terminierte Abfrage'
        : `entfallen ${vorschau.entfernt} eigenständig terminierte Abfragen`} dieser Karte
       — mitsamt dem jeweiligen Lernfortschritt.`,
      'Trotzdem speichern', 'gefahr')) return;

    Object.assign(k, werte);
    schreibe(FB.updateDoc(FB.doc(colCards(), k.id), werte), 'Karte ändern');
    const bilanz = variantenAbgleichen(k, deckVon(werte.deckId));
    toast(bilanz.angelegt || bilanz.entfernt
      ? `Gespeichert. ${bilanz.angelegt} Abfragen angelegt, ${bilanz.entfernt} entfernt.`
      : 'Gespeichert.');
  } else {
    // Erst die Quellkarte, dann ihre weiteren Abfragen — die Quellkarte trägt
    // gleich die richtige Variante, damit sie nicht sofort nachgebessert
    // werden muss.
    const quellId = neueId();
    const soll = gewuenschteVarianten({ ...werte, id: quellId }, deckVon(werte.deckId));
    const quelle = neueKarte({ ...werte, variante: soll[0] });
    schreibe(FB.setDoc(FB.doc(colCards(), quellId), quelle), 'Karte anlegen');
    const weitere = soll.slice(1).map(v =>
      ['set', neueId(), neueKarte({ ...werte, quelleId: quellId, variante: v })]);
    variantenOpsSchreiben(weitere, 'Kartenvarianten');
    toast(weitere.length
      ? `Karte angelegt — ${soll.length} eigenständig terminierte Abfragen.`
      : 'Karte angelegt.');
    k = { ...quelle, id: quellId };
  }
  // Karten-Check ganz am Schluss und bewusst nach dem Speichern: Der Hinweis
  // soll nicht blockieren (KONZEPT §6.4), und niemand soll seine Eingabe
  // verlieren, weil die App sie für zu lang hält.
  // Nur prüfen, wenn sich der Inhalt tatsächlich geändert hat — sonst
  // erschiene der Hinweis auch beim bloßen Nachtragen einer Notiz erneut.
  // Klartext vergleichen, nicht das Markup: Beim ersten Speichern einer
  // Altkarte wechselt das Format von 'text' auf 'html', der Text bleibt aber
  // derselbe — ein Vergleich der Rohwerte böte dann jedes Mal den
  // Karten-Check an, obwohl niemand etwas geändert hat.
  if (typNeu !== 'cloze' && htmlZuText(werte.antwort).trim() !== antwortVorher)
    await kartenCheckAnbieten(k);
}

/** Nicht blockierender Hinweis auf schwer lernbare Karten, mit dem Angebot,
 *  eine Aufzählung mechanisch in einen Lückentext zu verwandeln — daraus
 *  werden dann eigenständig terminierte Einzelabfragen. */
async function kartenCheckAnbieten(k) {
  if (!k) return;
  // Auf dem Klartext prüfen: Auszeichnung soll weder als Länge zählen noch
  // eine Aufzählung vortäuschen.
  const pruef = kartenCheck(feldText(k, k.antwort));
  if (!pruef.gruende.length) return;
  // Mehr als 20 Lücken kann eine Karte nicht führen (clozeNummern). Statt
  // stillschweigend abzuschneiden wird das Angebot dann nicht gemacht.
  const zuViele = pruef.liste.length > 20;
  const kannTeilen = pruef.liste.length >= 2 && !zuViele;
  // Vorhandene Lückenmarkierungen abstreifen, sonst entstünde {{c1::c1::…}}
  // oder zweimal dieselbe Nummer im selben Text.
  const entkleiden = t => String(t ?? '')
    .replace(/\{\{c\d{1,2}::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g, '$1')
    .replace(/[{}]/g, '').trim();
  const clozeText = kannTeilen
    ? entkleiden(feldText(k, k.frage)) + (pruef.stamm ? '\n' + entkleiden(pruef.stamm) : '') + '\n' +
      pruef.liste.map((t, i) => `{{c${i + 1}::${entkleiden(t)}}}`).join('\n')
    : null;

  const wahl = await modal({
    titel: 'Diese Karte wird schwer zu lernen sein',
    breit: true,
    html: `${pruef.gruende.map(g => `<p>${g}</p>`).join('')}
      <p class="mini">Die Karte ist gespeichert — das hier ist nur ein Hinweis.</p>
      ${kannTeilen ? `<div class="hinweis blau mt">
        <strong>Vorschlag:</strong> als Lückentext speichern. Jeder Punkt wird dann einzeln
        abgefragt und einzeln terminiert — was schon sitzt, kommt seltener.
        <pre class="code" style="margin-top:8px">${esc(clozeText)}</pre></div>` : ''}
      ${zuViele ? `<div class="hinweis mt">Mit ${pruef.liste.length} Punkten ist die Antwort zu
        umfangreich für einen Lückentext (höchstens 20). Besser sind mehrere kleinere Karten.</div>` : ''}`,
    knoepfe: kannTeilen
      ? [{ text: 'So lassen', wert: null }, { text: 'Als Lückentext', wert: 'cloze', art: 'primary' }]
      : [{ text: 'Verstanden', wert: null, art: 'primary' }]
  });
  if (wahl !== 'cloze' || !clozeText) return;

  // Dieselbe Rückfrage wie beim normalen Bearbeiten: Aus einer Karte mit
  // Gegenrichtung wird durch den Lückentext eine ohne — die Rückwärtsabfrage
  // verschwindet dabei samt Lernstand.
  // format zurück auf 'text': Der erzeugte Lückentext ist Klartext, und ein
  // stehengebliebenes 'html' würde die {{c1::…}} durch den Sanitizer jagen.
  const werte = { frage: clozeText, typ: 'cloze', format: 'text',
                  antwort: feldText(k, k.antwort) };   // antwort bleibt als Sicherungsnetz stehen
  const vorschau = variantenPlan({ ...k, ...werte }, deckVon(k.deckId));
  if (vorschau.entfernt && !await frage('In Lückentext umwandeln',
    `Dabei ${vorschau.entfernt === 1 ? 'entfällt eine bestehende Abfrage' :
      `entfallen ${vorschau.entfernt} bestehende Abfragen`} dieser Karte — mitsamt Lernfortschritt.`,
    'Trotzdem umwandeln', 'gefahr')) return;

  Object.assign(k, werte);
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), werte), 'In Lückentext umwandeln');
  const bilanz = variantenAbgleichen(k, deckVon(k.deckId));
  toast(`Als Lückentext gespeichert — ${pruef.liste.length} einzeln terminierte Abfragen.`);
  return bilanz;
}

/* ---------- 12. Statistik ----------------------------------------------- */

async function reviewsLaden(alles) {
  if (S.reviewsGeladen && !alles) return;
  try {
    const ab = alles ? '0000-00-00' : plusTage(heute(), -70);
    const q = FB.query(colReviews(), FB.where('datum', '>=', ab));
    const snap = await FB.getDocs(q);
    S.reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.reviewsGeladen = true;
  } catch (e) {
    // Nicht erneut versuchen: malStatistik ruft diese Funktion beim Zeichnen
    // auf — ohne Merker entstünde eine Endlosschleife aus Abfrage und Neuzeichnen.
    console.warn('Statistik-Verlauf nicht ladbar', e);
    S.reviews = Array.isArray(S.reviews) ? S.reviews : [];
    S.reviewsGeladen = true;
    S.reviewsFehler = true;
  }
}

/** Der Mathematik-Block der Statistik. Steht nur da, wenn das Modul geladen
 *  ist UND schon einmal gerechnet wurde — ein leerer Kasten mit sechs Nullen
 *  hilft niemandem. Die Läufe zählen bewusst NICHT als Abfragen; ihre Zeit
 *  fließt aber in die Lernzeit, deshalb erscheint sie auch hier. */
function matheBlockHtml() {
  const T = MATHE?.__T;
  if (!T) return '';
  const stand = T.daten?.();
  if (!stand) return '';
  const zeilen = T.BEREICHE.map(b => {
    const sets = Object.values(stand[b.id]?.sets || {});
    const sterne = sets.filter(e => e?.stern).length;
    const sauber = sets.filter(e => e?.sauber).length;
    const versuche = sets.reduce((n, e) => n + (Number(e?.versuche) || 0), 0);
    const beste = sets.map(e => e?.beste?.s).filter(Number.isFinite);
    return { b, sterne, sauber, versuche, gesamt: b.sets.length,
             schnellste: beste.length ? Math.min(...beste) : null };
  });
  if (!zeilen.some(z => z.versuche)) return '';
  const sekunden = S.reviews.reduce((a, r) => a + (Number(r.matheSekunden) || 0), 0);
  const laeufe = S.reviews.reduce((a, r) => a + (Number(r.matheLaeufe) || 0), 0);
  const sterneAlle = zeilen.reduce((a, z) => a + z.sterne, 0);

  return `
    <div class="box">
      <div class="spread" style="margin-bottom:10px">
        <h2 style="margin:0">Zahlenakrobat</h2>
        <span class="mini">${laeufe} ${laeufe === 1 ? 'Lauf' : 'Läufe'} ·
          ${Math.round(sekunden / 60)} Minuten · <strong>${sterneAlle} ★</strong></span>
      </div>
      <table class="daten"><thead><tr>
        <th>Bereich</th><th style="text-align:right">Sterne</th>
        <th style="text-align:right">fehlerfrei</th><th style="text-align:right">Läufe</th>
        <th style="text-align:right">beste Zeit</th></tr></thead>
      <tbody>${zeilen.filter(z => z.versuche).map(z => `<tr>
        <td>${esc(z.b.name)}</td>
        <td style="text-align:right"><strong>${z.sterne}</strong> <span class="mini">/ ${z.gesamt}</span></td>
        <td style="text-align:right">${z.sauber}</td>
        <td style="text-align:right">${z.versuche}</td>
        <td style="text-align:right">${z.schnellste == null ? '—' : esc(T.zeitText(z.schnellste))}</td>
      </tr>`).join('')}</tbody></table>
      <p class="mini" style="margin-top:8px">Ein Stern heißt: ein Set in höchstens
        60 Sekunden fehlerfrei. Rechenläufe zählen nicht als Kartenabfragen — ihre
        Zeit zählt aber als Lernzeit.</p>
    </div>`;
}

function malStatistik() {
  const ziel = $('#seite-statistik');
  const imDeck = k => S.statDeck === 'alle' || k.deckId === S.statDeck;
  const karten = S.cards.filter(imDeck);
  const faellig = karten.filter(istFaellig);
  const heuteGenau = karten.filter(istHeuteGenau);
  const ueberf = faellig.length - heuteGenau.length;
  const neu = karten.filter(istNeu).length;
  const ruht = karten.filter(k => k.suspendiert).length;

  const proFach = Array.from({ length: 12 }, (_, i) =>
    karten.filter(k => !k.suspendiert && fachVon(k) === i + 1).length);
  const maxFach = Math.max(1, ...proFach);

  // Tageswerte immer über denselben Weg holen, damit die Kastenauswahl
  // überall greift — auch bei den Sekunden (Stufe 4, KONZEPT §6.7).
  const revAn = t => S.reviews.find(x => (x.datum || x.id) === t);
  const anzahlAn = t => {
    const r = revAn(t); if (!r) return 0;
    return Number(S.statDeck === 'alle' ? r.anzahl : r.proDeck?.[S.statDeck]) || 0;
  };
  const sekundenAn = t => {
    const r = revAn(t); if (!r) return 0;
    if (S.statDeck === 'alle') return Number(r.sekunden) || 0;
    const genau = Number(r.sekundenProDeck?.[S.statDeck]);
    if (Number.isFinite(genau)) return genau;
    // Tagesdokumente aus Stufe 1–3 kennen die Sekunden je Kasten nicht. Statt
    // „0 Minuten“ zu behaupten, wird der Tagesanteil des Kastens geschätzt —
    // sonst läse sich die eigene Lernhistorie als hätte sie keine Zeit gekostet.
    const anteil = Number(r.proDeck?.[S.statDeck]) || 0;
    const gesamt = Number(r.anzahl) || 0;
    return gesamt ? Math.round((Number(r.sekunden) || 0) * anteil / gesamt) : 0;
  };

  const tage = Array.from({ length: 14 }, (_, i) => plusTage(heute(), i - 13));
  const proTag = tage.map(anzahlAn);
  const maxTag = Math.max(1, ...proTag);
  const summe14 = proTag.reduce((a, b) => a + b, 0);
  const sekunden14 = tage.reduce((a, t) => a + sekundenAn(t), 0);

  /* --- Wochenbericht (Stufe 4) --- */
  const wocheTage = Array.from({ length: 7 }, (_, i) => plusTage(heute(), i - 6));
  const vorTage   = Array.from({ length: 7 }, (_, i) => plusTage(heute(), i - 13));
  const wKarten = wocheTage.reduce((a, t) => a + anzahlAn(t), 0);
  const vKarten = vorTage.reduce((a, t) => a + anzahlAn(t), 0);
  const wSek    = wocheTage.reduce((a, t) => a + sekundenAn(t), 0);
  const vSek    = vorTage.reduce((a, t) => a + sekundenAn(t), 0);
  const wAktiv  = wocheTage.filter(t => anzahlAn(t) > 0).length;
  const besterTag = wocheTage.reduce((b, t) => anzahlAn(t) > anzahlAn(b) ? t : b, wocheTage[0]);
  const schnittProKarte = wKarten ? wSek / wKarten : 0;
  const trend = (jetzt, vorher) => {
    if (!vorher && !jetzt) return { pfeil: '·', text: 'wie vorher', farbe: 'var(--txt3)' };
    if (!vorher) return { pfeil: '▲', text: 'neu', farbe: 'var(--bewertung-3)' };
    const p = Math.round((jetzt - vorher) / vorher * 100);
    if (Math.abs(p) < 8) return { pfeil: '·', text: 'wie in der Vorwoche', farbe: 'var(--txt3)' };
    return p > 0
      ? { pfeil: '▲', text: `+${p} % zur Vorwoche`, farbe: 'var(--bewertung-3)' }
      : { pfeil: '▼', text: `${p} % zur Vorwoche`, farbe: 'var(--faellig)' };
  };
  const trendKarten = trend(wKarten, vKarten);
  const trendZeit = trend(wSek, vSek);
  const WOCHENTAG = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const wochentag = iso => {
    const [y, m, t] = String(iso).split('-').map(Number);
    return WOCHENTAG[new Date(Date.UTC(y, m - 1, t)).getUTCDay()];
  };

  const fresser = zeitfresser(karten.filter(k => !k.suspendiert));
  const probleme = karten.filter(istProblemkarte);
  const pruefungen = anstehendePruefungen(
    S.statDeck === 'alle' ? null : new Set([S.statDeck]));

  const vorschauTage = Array.from({ length: 7 }, (_, i) => plusTage(heute(), i + 1));
  const vorschau = vorschauTage.map(t => karten.filter(k => !k.suspendiert && k.due === t).length);
  const maxVor = Math.max(1, ...vorschau, 1);

  ziel.innerHTML = `
    <div class="spread"><h1 style="margin:0">Statistik</h1>
      <select id="st-deck" style="width:auto;min-width:160px">
        <option value="alle">Alle Kästen</option>
        ${S.decks.map(d => `<option value="${esc(d.id)}" ${S.statDeck === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}
      </select></div>

    <div class="kennzahlen mt">
      <div class="kennzahl"><b>${karten.length}</b><span>Karten gesamt</span></div>
      <div class="kennzahl"><b style="color:var(--orange)">${heuteGenau.length}</b><span>heute fällig</span></div>
      <div class="kennzahl"><b>${ueberf}</b><span>überfällig</span></div>
      <div class="kennzahl"><b style="color:var(--blue)">${neu}</b><span>noch nie gelernt</span></div>
      <div class="kennzahl"><b style="color:var(--green)">${S.einstellungen.streak || 0}</b><span>${tageWort(S.einstellungen.streak || 0)} in Folge</span></div>
      ${ruht ? `<div class="kennzahl"><b>${ruht}</b><span>ruhend</span></div>` : ''}
      ${probleme.length ? `<div class="kennzahl"><b style="color:var(--bewertung-1)">${probleme.length}</b><span>Problemkarten</span></div>` : ''}
    </div>

    <div class="box mt2">
      <div class="spread" style="margin-bottom:10px">
        <h2 style="margin:0">Die Woche im Rückblick</h2>
        <span class="mini">${datumDeutsch(wocheTage[0])} – ${datumDeutsch(wocheTage[6])}</span>
      </div>
      ${wKarten ? `
      <div class="kennzahlen">
        <div class="kennzahl"><b>${wKarten}</b><span>Abfragen
          <span style="color:${trendKarten.farbe}">${trendKarten.pfeil} ${esc(trendKarten.text)}</span></span></div>
        <div class="kennzahl"><b>${Math.round(wSek / 60)}</b><span>Minuten
          <span style="color:${trendZeit.farbe}">${trendZeit.pfeil} ${esc(trendZeit.text)}</span></span></div>
        <div class="kennzahl"><b>${schnittProKarte.toFixed(1)}s</b><span>je Abfrage</span></div>
        <div class="kennzahl"><b>${wAktiv}/7</b><span>Tage gelernt</span></div>
      </div>
      ${(() => {
        /* Die Lernbox kostet fast doppelt so viele Tippvorgänge wie der
           Karteikasten allein. Wer das leistet, soll es auch sehen —
           geschrieben wurden die Zahlen bisher, gezeigt nie. */
        const u = uebungSummen();
        if (!u.durchgaenge) return '';
        return `<div class="kennzahlen" style="margin-top:10px">
          <div class="kennzahl"><b>${u.durchgaenge}</b><span>Übungsdurchgänge</span></div>
          <div class="kennzahl"><b>${Math.max(1, Math.round(u.sekunden / 60))}</b><span>Minuten geübt</span></div>
        </div>`;
      })()}
      <div class="tage" style="height:80px;margin-top:12px">${wocheTage.map(t => {
        const n = anzahlAn(t);
        const maxW = Math.max(1, ...wocheTage.map(anzahlAn));
        return `<div title="${datumDeutsch(t)}: ${n} Abfragen, ${Math.round(sekundenAn(t) / 60)} Minuten">
          <span class="mini" style="font-size:10px">${n || ''}</span>
          <span class="saeule ${n ? '' : 'null'}" style="height:${Math.round(n / maxW * 100)}%"></span>
          <span class="tag">${wochentag(t)}</span></div>`;

      <p class="mini" style="margin-top:10px">

          const zeiten = k.map(schnittSekunden).filter(x => x !== null);
          const zeitSchnitt = zeiten.length
            ? Math.round(zeiten.reduce((a, b) => a + b, 0) / zeiten.length) + ' s' : '—';

}

/* ---------- 14. Import / Export ---------------------------------------- */

function dateiHerunterladen(name, inhalt, typ = 'application/json') {
  const blob = new Blob([inhalt], { type: typ + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function dateiWaehlen(endung) {
  return new Promise(fertig => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = endung;
    i.addEventListener('cancel', () => fertig(null));
    i.addEventListener('change', () => {
      const f = i.files?.[0];
      if (!f) return fertig(null);
      const r = new FileReader();
      /* Erst UTF-8 versuchen, und zwar streng. Deutsches Excel schreibt beim
         Speichern als „CSV (Trennzeichen-getrennt)“ Windows-1252 — als UTF-8
         gelesen wird daraus Gr��e und Fu�. Schlägt die strenge Prüfung fehl,
         wird die Datei als Windows-1252 gelesen; das ist bei uns der einzige
         realistische Zweitfall. */
      r.onload = () => {
        const roh = r.result;
        let text = '';
        if (roh instanceof ArrayBuffer) {
          /* UTF-16 zuerst an seiner Bytefolge erkennen. Sonst scheitert die
             strenge UTF-8-Prüfung, und windows-1252 nimmt anschließend jedes
             Byte an — aus „Frage“ würde „ÿþF\u0000r\u0000a\u0000…“, ohne dass
             irgendwo ein Ersatzzeichen auftaucht, an dem man es merkt. */
          const b0 = new Uint8Array(roh, 0, Math.min(2, roh.byteLength));
          const kodierung = (b0[0] === 0xFF && b0[1] === 0xFE) ? 'utf-16le'
            : (b0[0] === 0xFE && b0[1] === 0xFF) ? 'utf-16be' : null;
          if (kodierung) text = new TextDecoder(kodierung).decode(roh);
          else {
            try { text = new TextDecoder('utf-8', { fatal: true }).decode(roh); }
            catch (e) {
              try { text = new TextDecoder('windows-1252').decode(roh); }
              catch (e2) { text = new TextDecoder('utf-8').decode(roh); }
            }
          }
          // UTF-16 ohne Kennzeichnung: viele Nullbytes, sonst kaum welche.
          if (!kodierung && /\u0000/.test(text.slice(0, 4000)))
            text = new TextDecoder(text.charCodeAt(0) === 0 ? 'utf-16be' : 'utf-16le').decode(roh);
          text = text.replace(/\u0000/g, '');
        } else text = String(roh || '');
        fertig({ name: f.name, text });
      };
      r.onerror = () => fertig(null);
      r.readAsArrayBuffer(f);
    });
    i.click();
  });
}

function csvFeld(s) { return '"' + String(s ?? '').replace(/"/g, '""') + '"'; }

/** Karten als CSV "Frage";"Antwort";"Kasten" — mit BOM, damit Excel die
 *  Umlaute richtig anzeigt. */
function csvBauen(karten) {
  // Nur Quellkarten: die zus\u00E4tzlichen Abfragen (R\u00FCckw\u00E4rtsrichtung, einzelne
  // Cloze-L\u00FCcken) tragen denselben Inhalt und st\u00FCnden sonst doppelt in der
  // Datei \u2014 beim Wiedereinlesen entst\u00FCnden Dubletten.
  /* Mit Kopfzeile, damit die eigene Sicherung auch wieder eingelesen werden
     kann: ohne sie erkennt der Import-Dialog die dritte Spalte nicht als
     Kasten und wirft alle K\u00E4sten in einen einzigen zusammen. */
  return '\uFEFF' + ['Frage', 'Antwort', 'Kasten'].map(csvFeld).join(';') + '\r\n'
    + karten.filter(istQuellkarte).map(k =>
    // Bei L\u00FCckentexten steht die L\u00F6sung in der Frage-Spalte; ohne Ersatz in
    // der Antwort-Spalte w\u00FCrde die Zeile beim Wiedereinlesen verworfen.
    // Auszeichnung fliegt raus: CSV ist ein Klartextformat, und ein <b> in
    // der Zelle w\u00E4re beim Wiedereinlesen als Klartext Teil der Frage.
    // Wer die Auszeichnung behalten will, nimmt die JSON-Sicherung.
    [feldText(k, k.frage),
     feldText(k, k.antwort) || (k.typ === 'cloze'
       ? clozeNummern(k.frage).map(n => clozeLoesung(k.frage, n)).join(' \u00B7 ') : ''),
     deckName(k.deckId)].map(csvFeld).join(';')).join('\r\n');
}
