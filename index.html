  wiederholungen:  'Abfragen insgesamt',
  karten:          'Karten insgesamt',
  fach:            'Karten im höchsten Fach',
  sterne:          'Sterne im Zahlenakrobat'
};
/* Einzahl und Mehrzahl getrennt, sonst steht überall „noch 1 karten“. */
const ABZEICHEN_EINHEIT = {
  streak:         ['Tag in Folge', 'Tage in Folge'],
  wiederholungen: ['Abfrage', 'Abfragen'],
  karten:         ['Karte', 'Karten'],
  fach:           ['Karte im höchsten Fach', 'Karten im höchsten Fach'],
  sterne:         ['Set unter 60 Sekunden', 'Sets unter 60 Sekunden']
};
const abzeichenEinheit = (art, n) => (ABZEICHEN_EINHEIT[art] || ['', ''])[n === 1 ? 0 : 1];
/* Dieselbe Sorgfalt schuldet die App auch den Kennzahlen: Bei einer Serie
   von einem Tag stand dort dreimal „1 Tage in Folge“. */
const tageWort = n => (Number(n) === 1 ? 'Tag' : 'Tage');
/* Beim ersten Ziel zählt, was erreichbar ist: die Reihenfolge der Arten
   entscheidet, wenn noch bei allem der Fortschritt 0 ist. Vorher gewann
   alphabetisch „fach“ — die App schlug einem leeren Konto als Erstes
   „Langzeitgedächtnis“ vor, ein Ziel etwa ein Jahr entfernt. */
const ABZEICHEN_RANG = { streak: 0, wiederholungen: 1, karten: 2, sterne: 3, fach: 4 };

const ABZEICHEN_STANDARD = [
  { id: 's3',    art: 'streak',         schwelle: 3,    name: 'Angefangen',       icon: '🌱', farbe: '#27AE60' },
  { id: 's7',    art: 'streak',         schwelle: 7,    name: 'Eine Woche',       icon: '🔥', farbe: '#F2994A' },
  { id: 's14',   art: 'streak',         schwelle: 14,   name: 'Zwei Wochen',      icon: '⚡', farbe: '#F2C94C' },
  { id: 's30',   art: 'streak',         schwelle: 30,   name: 'Ein Monat',        icon: '🏅', farbe: '#2D7FF9' },
  { id: 's60',   art: 'streak',         schwelle: 60,   name: 'Zwei Monate',      icon: '💎', farbe: '#1B9AAA' },
  { id: 's100',  art: 'streak',         schwelle: 100,  name: 'Hundert Tage',     icon: '👑', farbe: '#8e6bd6' },
  { id: 's180',  art: 'streak',         schwelle: 180,  name: 'Ein halbes Jahr',  icon: '🚀', farbe: '#d6538e' },
  { id: 's365',  art: 'streak',         schwelle: 365,  name: 'Ein ganzes Jahr',  icon: '🏆', farbe: '#E2584D' },
  { id: 'w100',  art: 'wiederholungen', schwelle: 100,  name: '100 Abfragen',     icon: '📚', farbe: '#639922' },
  { id: 'w500',  art: 'wiederholungen', schwelle: 500,  name: '500 Abfragen',     icon: '📗', farbe: '#27AE60' },
  { id: 'w2000', art: 'wiederholungen', schwelle: 2000, name: '2000 Abfragen',    icon: '🎓', farbe: '#2D7FF9' },
  { id: 'k100',  art: 'karten',         schwelle: 100,  name: '100 Karten',       icon: '🗂️', farbe: '#5b7083' },
  { id: 'f1',    art: 'fach',           schwelle: 1,    name: 'Langzeitgedächtnis', icon: '🧠', farbe: '#8e6bd6' },
  { id: 'm5',    art: 'sterne',         schwelle: 5,    name: 'Fünf Sterne',      icon: '⭐', farbe: '#F2C94C' },
  { id: 'm25',   art: 'sterne',         schwelle: 25,   name: 'Geläufig',         icon: '🧮', farbe: '#1B9AAA' },
  { id: 'm100',  art: 'sterne',         schwelle: 100,  name: 'Ein Bereich',      icon: '🎯', farbe: '#E2584D' }
];

/** Ein Abzeichen auf Form bringen. Kaputte Einträge (aus der Konfiguration
 *  oder einer Sicherung) werden ausgesiebt, nicht repariert — ein Abzeichen
 *  ohne Schwelle ergibt keinen Sinn. */
function abzeichenNormalisieren(a, i) {
  if (!a || typeof a !== 'object') return null;
  const art = ABZEICHEN_ARTEN[a.art] ? a.art : 'streak';
  const schwelle = zahl(a.schwelle, 1, 1000000, 0);
  if (!schwelle) return null;
  const farbe = String(a.farbe ?? '').trim();
  return {
    id: String(a.id ?? ('a' + i)).slice(0, 40) || ('a' + i),
    art, schwelle,
    name: String(a.name ?? '').trim().slice(0, 40) || (schwelle + ' ' + ABZEICHEN_ARTEN[art]),
    icon: Array.from(String(a.icon ?? '⭐').trim()).slice(0, 2).join('') || '⭐',
    farbe: /^#[0-9a-fA-F]{3,8}$/.test(farbe) ? farbe : '#1B9AAA'
  };
}
function abzeichenPruefen(liste) {
  if (!Array.isArray(liste)) return null;
  const sauber = liste.map(abzeichenNormalisieren).filter(Boolean);
  return sauber.length ? sauber : null;
}

/** Rangfolge: zentral vorgegebener Satz aus firebase-config.js, sonst der
 *  eigene aus den Einstellungen, sonst der eingebaute Standard. */
function abzeichenSatz() {
  const zentral = abzeichenPruefen(ABZEICHEN_ZENTRAL);
  if (zentral) return zentral;
  /* Dieselbe Unterscheidung wie in der Verwaltung: Eine ausdrücklich geleerte
     Liste bedeutet „keine Abzeichen“ und darf nicht zum Standardsatz
     zurückfallen — sonst zeigt die Verwaltung nichts und der Startbildschirm
     doch wieder dreizehn. */
  if (Array.isArray(S.einstellungen.abzeichen))
    return abzeichenPruefen(S.einstellungen.abzeichen) || [];
  return ABZEICHEN_STANDARD;
}
const abzeichenZentralVorhanden = () => !!abzeichenPruefen(ABZEICHEN_ZENTRAL);
/** Der Satz, den die Verwaltungsseite bearbeitet — immer der des Kontos.
 *  Eine ausdrücklich geleerte Liste bleibt leer: Wer das letzte Abzeichen
 *  löscht, will keins mehr und nicht den kompletten Standardsatz zurück. */
const eigenerAbzeichensatz = () => Array.isArray(S.einstellungen.abzeichen)
  ? (abzeichenPruefen(S.einstellungen.abzeichen) || [])
  : ABZEICHEN_STANDARD;
function abzeichensatzSchreiben(liste) {
  const sauber = liste.map(abzeichenNormalisieren).filter(Boolean);
  S.einstellungen.abzeichen = sauber;
  schreibe(FB.setDoc(refEinstellungen(), { abzeichen: sauber }, { merge: true }), 'Abzeichen');
  return sauber;
}

function abzeichenStand() {
  return {
    streak: Number(S.einstellungen.streak) || 0,
    wiederholungen: S.cards.reduce((a, k) => a + (Number(k.reps) || 0), 0),
    karten: S.cards.filter(istQuellkarte).length,
    fach: S.cards.filter(k => !k.suspendiert && fachVon(k) >= 12).length,
    /* Stufe 7: Sterne aus der Mathematik. Fehlt das Modul, ist der Wert 0 —
       dann taucht die Art einfach nirgends auf. */
    sterne: MATHE?.__T?.sterneGesamt?.() || 0
  };
}
function abzeichenListe() {
  const stand = abzeichenStand();
  return abzeichenSatz()
    .map(a => {
      const wert = Number(stand[a.art]) || 0;
      return { ...a, wert, erreicht: wert >= a.schwelle,
               anteil: Math.max(0, Math.min(1, wert / a.schwelle)) };
    })
    .sort((a, b) => (a.art === b.art ? a.schwelle - b.schwelle
      : (ABZEICHEN_RANG[a.art] ?? 9) - (ABZEICHEN_RANG[b.art] ?? 9)));
}
/** Das zuletzt erreichte Abzeichen und das nächste Ziel — für die kleine
 *  Anzeige neben dem Streak. */
function abzeichenAktuell() {
  const alle = abzeichenListe();
  /* „Zuletzt erreicht“ heißt: am knappsten geschafft. Vorher war es schlicht
     der letzte Eintrag der sortierten Liste — bei Streak 8 und 120 Karten
     stand dort „100 Abfragen“ statt der gerade erreichten Wochenmarke. */
  const erreicht = alle.filter(a => a.erreicht);
  const juengstes = erreicht.slice().sort((a, b) =>
    (a.wert / a.schwelle) - (b.wert / b.schwelle))[0] || null;
  /* Nächstes Ziel: das am weitesten fortgeschrittene. Steht alles bei null,
     entscheidet die Rangfolge der Arten, nicht der Zufall der Sortierung. */
  const offen = alle.filter(a => !a.erreicht)
    .sort((a, b) => (b.anteil - a.anteil)
      || ((ABZEICHEN_RANG[a.art] ?? 9) - (ABZEICHEN_RANG[b.art] ?? 9))
      || (a.schwelle - b.schwelle));
  return { erreicht, letztes: juengstes, naechstes: offen[0] || null, alle };
}
function abzeichenHtml(a, klein) {
  /* Der Fortschritt stand nur im title-Attribut — auf dem Handy also nirgends.
     Bei offenen Abzeichen gehört er sichtbar dazu. */
  const rest = Math.max(0, a.schwelle - (Number(a.wert) || 0));
  return `<span class="abzeichen${a.erreicht ? '' : ' offen'}${klein ? ' klein' : ''}"
    style="--ab:${esc(a.farbe)}" title="${esc(a.name)} — ${a.schwelle} ${esc(ABZEICHEN_ARTEN[a.art])}">
    <span class="ab-icon">${esc(a.icon)}</span>${klein ? '' : `<span class="ab-text">${esc(a.name)}${
      a.erreicht ? '' : `<span class="ab-rest">noch ${rest} ${esc(abzeichenEinheit(a.art, rest))}</span>`
    }</span>`}</span>`;
}

/** Neu erreichte Abzeichen einmalig feiern. */
function abzeichenFeiern() {
  const gesehen = Array.isArray(S.einstellungen.abzeichenGesehen) ? S.einstellungen.abzeichenGesehen : [];
  const liste = abzeichenListe();
  const neu = liste.filter(a => a.erreicht && !gesehen.includes(a.id));
  if (!neu.length) return [];
  /* Nur behalten, was im aktuellen Satz überhaupt vorkommt. Ein hartes
     slice(-200) ließ bei mehr als 200 Abzeichen jede Sitzung dieselben
     Abzeichen erneut feiern, weil die ältesten IDs immer wieder herausfielen. */
  const imSatz = new Set(liste.map(a => a.id));
  const alle = Array.from(new Set(gesehen.filter(id => imSatz.has(id)).concat(neu.map(a => a.id))));
  S.einstellungen.abzeichenGesehen = alle;
  schreibe(FB.setDoc(refEinstellungen(), { abzeichenGesehen: alle }, { merge: true }), 'Abzeichen');
  return neu;
}

/* ---------- 8. Navigation ---------------------------------------------- */

const SEITEN = ['lernen', 'ueben', 'mathe', 'kaesten', 'karten', 'statistik', 'einstellungen'];

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-seite]');
  if (b) seiteZeigen(b.dataset.seite);
});

function seiteZeigen(name) {
  if (!SEITEN.includes(name)) return;
  // Ein Klick auf die ohnehin offene Seite darf eine laufende Sitzung nicht
  // neu zeichnen — sonst wäre eine halb getippte Antwort weg.
  /* Die Sperre gilt nur für die Lernseite selbst — sonst startete die
     Lernbox bei geparkter Karteikasten-Sitzung erst beim ZWEITEN Tipp:
     lernboxStarten() legt die Runde an und ruft seiteZeigen('ueben'), das
     hier wegen `sitzung?.aktiv` sofort zurückkehrte, ohne neu zu zeichnen. */
  if (name === S.seite && name === 'lernen' && sitzung?.aktiv) return;
  /* Die laufende Sitzung wird beim Seitenwechsel geparkt, nicht verworfen.
     Vorher war sie beim Tippen auf „Karten“ ersatzlos weg — mitsamt
     Zwischenstand und Abschlussbildschirm; ein CSV-Import löste das sogar
     ungefragt aus, weil er am Ende auf die Kartenliste wechselt. */
  if (name !== 'lernen') { sprechenStoppen(); letzteSitzung = null; }
  S.seite = name;
  SEITEN.forEach(s => { $('#seite-' + s).hidden = (s !== name); });
  $$('#nav button').forEach(b => {
    b.classList.toggle('aktiv', b.dataset.seite === name);
    // Punkt am Lern-Knopf, solange eine Sitzung geparkt ist — sonst wüsste
    // niemand, dass sie beim Zurückwechseln weiterläuft.
    if (b.dataset.seite === 'lernen')
      b.classList.toggle('nav-laeuft', !!(sitzung?.aktiv) && name !== 'lernen');
  });
  window.scrollTo({ top: 0 });
  seiteMalen(name);
}

/* Wird nach jeder Firestore-Aktualisierung aufgerufen. Eine laufende Sitzung
   wird dabei bewusst nicht neu gezeichnet — sonst springt die Karte oder der
   Abschlussbildschirm verschwindet, sobald der eigene Schreibvorgang
   zurückkommt. */
function alleSeitenMalen() {
  // Nur die Lernseite selbst darf während einer Sitzung nicht neu gezeichnet
  // werden. Ist die Sitzung geparkt, müssen die übrigen Seiten weiter auf
  // Änderungen von anderen Geräten reagieren.
  lernboxZaehlerMalen();
  if ((sitzung?.aktiv || letzteSitzung) && S.seite === 'lernen') return;
  // Dasselbe für die Lernbox: Eine laufende Übungsrunde darf nicht unter den
  // Fingern neu gezeichnet werden.
  if ((uebung?.aktiv || uebungZuletzt) && S.seite === 'ueben') return;
  // Dasselbe für einen laufenden Rechendurchgang: Ein Neuzeichnen würde die
  // halb getippte Antwort verwerfen und den Ring zurücksetzen.
  if (MATHE?.aktiv() && S.seite === 'mathe') return;
  // Nicht mitten in eine Eingabe hineinzeichnen — sonst verliert das Suchfeld
  // den Fokus, sobald eine Aktualisierung von Firestore eintrifft.
  const f = document.activeElement;
  if (f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA') && f.closest('main')) return;
  seiteMalen(S.seite);
}

/** Der Zähler am Lernbox-Reiter. Ohne ihn wäre nicht zu sehen, dass etwas
 *  darin liegt — und eine Box, die man nicht sieht, wird zur Ablage. */
function lernboxZaehlerMalen() {
  const el = $('#nav-lernbox');
  if (!el) return;
  const n = lernboxAnzahl();
  el.textContent = n > 99 ? '99+' : String(n);
  el.hidden = !n;
  // Eine unterbrochene Runde sichtbar machen — sonst weiß nach einem
  // Seitenwechsel niemand, dass noch etwas offen ist.
  $('#nav button[data-seite="ueben"]')
    ?.classList.toggle('nav-laeuft', !!(uebung?.aktiv || uebungZuletzt));
}

/* Tastatur für die Lernbox. Am Rechner wurden aus vier Tastendrücken sonst
   vier Mausklicks — und die Sechzehnjährige lernt am Laptop. */
function lernboxTaste(e) {
  const u = uebung;
  if (!u?.aktiv) return false;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return false;
  const k = e.key.toLowerCase();
  if (e.key === ' ' || e.key === 'Enter') {
    if (u.stufe === 'frage' || u.stufe === 'buchstaben' || u.stufe === 'wort') {
      AKTION.lernboxAufdecken(); return true;
    }
    return false;
  }
  if (k === 't' && (u.stufe === 'frage' || u.stufe === 'buchstaben')) {
    AKTION.lernboxTipp(); return true;
  }
  if (u.stufe !== 'antwort' && u.stufe !== 'zugedeckt') return false;
  if (k === 'j' || e.key === '1') { AKTION.lernboxJa(); return true; }
  if (k === 'n' || e.key === '2') { AKTION.lernboxNein(); return true; }
  if (k === 'z' && u.stufe === 'antwort') { AKTION.lernboxZudecken(); return true; }
  return false;
}

function seiteMalen(name) {
  if (!S.uid) return;
  ({
    lernen: malLernen, ueben: malLernbox, kaesten: malKaesten, karten: malKarten,
    statistik: malStatistik, einstellungen: malEinstellungen,
    mathe: () => MATHE?.malen()
  })[name]?.();
}

/* ---------- 9. Lernen --------------------------------------------------- */

let lernAuswahl = null;      // Set von deckIds, null = alle
let letzteSitzung = null;    // hält den Abschlussbildschirm, bis er weggeklickt wird

function malLernen() {
  if (sitzung?.aktiv) return malSitzung();
  if (letzteSitzung) return malAbschluss();
  const ziel = $('#seite-lernen');

  if (!S.decks.length) {
    ziel.innerHTML = `<div class="leer">
      Noch kein Kasten vorhanden.<br><br>
      <button class="btn primary" data-tu="ersterKasten">Ersten Kasten anlegen</button>
      &nbsp;
      <button class="btn" data-tu="zuEinstellungen">Altbestand übernehmen</button>
    </div>`;
    return verdrahten(ziel);
  }

  if (!lernAuswahl) lernAuswahl = new Set(S.decks.map(d => d.id));
  const modus = lernModus();
  const gewaehlt = S.cards.filter(k => lernAuswahl.has(k.deckId));
  const heuteN = gewaehlt.filter(istHeuteGenau).length;
  const alleN  = gewaehlt.filter(istFaellig).length;
  const dran   = modus === 'heute' ? heuteN : alleN;

  const e = S.einstellungen;
  const zielKarten = e.zielEinheit === 'karten';
  const heutigerWert = zielKarten ? (S.heutigeAnzahl || 0) : Math.round((S.heutigeSekunden || 0) / 60);
  const zielWert = zielKarten ? zahl(e.zielKarten, 1, 2000, 30) : zahl(e.zielMinuten, 1, 600, 15);
  const anteil = Math.max(0, Math.min(1, zielWert ? heutigerWert / zielWert : 0));
  const UMFANG = Math.round(2 * Math.PI * 46);

  const proFach = Array.from({ length: 12 }, (_, i) =>
    gewaehlt.filter(k => !k.suspendiert && fachVon(k) === i + 1).length);
  const fachGesamt = proFach.reduce((a, b) => a + b, 0);

  const ueberfaellig = Math.max(0, alleN - heuteN);
  const ab = abzeichenAktuell();

  /* Wie viele Karten kommen in der Sitzung wirklich dran? Der Knopf versprach
     „200 Karten“, die Sitzung zeigte 20 — weil neue Karten gedeckelt und
     Geschwisterabfragen zurückgestellt werden. Beides hier vorwegnehmen,
     damit die Ankündigung stimmt. */
  const sitzungsVorschau = wahl => {
    let roh = gewaehlt.filter(wahl === 'heute' ? istHeuteGenau : istFaellig);
    /* Denselben Lernbox-Filter wie sitzungStarten anwenden — und VOR der
       Familienauswahl, genau wie dort. Vorher fehlte er ganz: Der Knopf
       versprach „Sitzung starten — 6 Karten“ und die Sitzung zeigte zwei. */
    if (lernboxAn()) roh = roh.filter(k =>
      !(istNeu(k) && (inLernbox(k) || k.uebungFertig === heute())));
    const familien = new Set();
    /* Dieselbe Reihenfolge wie in sitzungStarten: Wer die Familie vertritt,
       entscheidet darüber, ob sie als „neu“ zählt — und damit, ob der
       Tagesdeckel greift. Ohne die Sortierung verspricht der Knopf eine
       andere Zahl, als die Sitzung dann zeigt. */
    const ohneGeschwister = roh.slice()
      .sort((a, b) => String(a.due || '').localeCompare(String(b.due || '')))
      .filter(k => {
        const f = k.quelleId || k.id;
        if (familien.has(f)) return false;
        familien.add(f); return true;
      });
    const deckel = zahl(S.einstellungen.neuProTag, 5, 50, 20);
    const frei = Math.max(0, deckel - (S.heutigeNeu || 0));
    const neue = ohneGeschwister.filter(istNeu).length;
    return {
      gesamt: ohneGeschwister.length - Math.max(0, neue - frei),
      neueZurueck: Math.max(0, neue - frei),
      geschwister: roh.length - ohneGeschwister.length,
      deckel
    };
  };
  const vorschau = sitzungsVorschau(modus);
  const dranEcht = vorschau.gesamt;

  ziel.innerHTML = `
    <h1 class="dash-gruss">${esc(begruessung(dran, ueberfaellig))}</h1>
    <p class="dash-unter">${dranEcht
      ? `${dranEcht} ${dranEcht === 1 ? 'Karte wartet' : 'Karten warten'} auf dich.`
      : alleN ? `Heute planmäßig nichts — ${alleN} überfällige ${alleN === 1 ? 'Karte' : 'Karten'} liegen noch da.`
      : `Nichts fällig. Nächste Fälligkeit: ${esc(naechsteFaelligkeitText())}.`}${
      vorschau.neueZurueck ? ` <span class="mini">Von ${dran} fälligen sind
        ${vorschau.neueZurueck} neue Karten für heute zurückgestellt — es kommen höchstens
        ${vorschau.deckel} neue pro Tag dran, damit die Wiederholungen später nicht auf einmal
        anfallen. Ändern lässt sich das unter Einstellungen → Tagespensum.</span>` : ''}</p>

    <div class="dash-kopf">
      <div class="dash-ring">
        <svg viewBox="0 0 100 100">
          <circle class="spur" cx="50" cy="50" r="46"></circle>
          <circle class="fuell" cx="50" cy="50" r="46"
            stroke-dasharray="${UMFANG}" stroke-dashoffset="${Math.round(UMFANG * (1 - anteil))}"></circle>
        </svg>
        <div class="dash-ring-mitte"><b>${heutigerWert}/${zielWert}</b><span>${zielKarten ? 'Karten' : 'Minuten'}</span></div>
      </div>
      <div class="dash-kennzahlen">
        <div class="dash-kennzahl"><b>${dran}</b><span>${modus === 'heute' ? 'heute fällig' : 'fällig gesamt'}</span></div>
        <div class="dash-kennzahl"><b>${e.streak || 0}</b><span>${tageWort(e.streak || 0)} Streak</span></div>
        <div class="dash-kennzahl"><b>${gewaehlt.length}</b><span>Karten gewählt</span></div>
      </div>
      ${ab.letztes || ab.naechstes ? `<div style="flex:none">
        ${ab.letztes ? abzeichenHtml(ab.letztes) : ''}
        ${ab.naechstes ? `<div class="ab-fortschritt">Nächstes: ${esc(ab.naechstes.icon)}
          ${esc(ab.naechstes.name)} — noch ${Math.max(0, ab.naechstes.schwelle - ab.naechstes.wert)}
          ${esc(abzeichenEinheit(ab.naechstes.art, ab.naechstes.schwelle - ab.naechstes.wert))}</div>` : ''}
      </div>` : ''}
    </div>

    ${anstehendePruefungen(lernAuswahl).slice(0, 3).map(({ deck, lage }) => {
      const [wort, farbe] = PRUEFUNG_URTEIL[lage.urteil];
      return `<div class="hinweis" style="border-left-color:${farbe};margin-bottom:10px">
        <strong>${esc(deck.name)}: Prüfung ${lage.tage === 0 ? 'heute'
          : 'in ' + lage.tage + (lage.tage === 1 ? ' Tag' : ' Tagen')}</strong>
        (${datumDeutsch(lage.datum)}). ${lage.offen} ${lage.offen === 1 ? 'Karte' : 'Karten'}
        stehen an, das sind voraussichtlich <strong>${lage.abfragen} Abfragen</strong> bis dahin —
        rund <strong>${lage.proTag} pro Tag</strong> oder ${lage.minutenNoetig < 1
          ? 'weniger als eine Minute' : lage.minutenNoetig === 1
          ? 'eine Minute' : lage.minutenNoetig + ' Minuten'}:
        <span style="color:${farbe};font-weight:700">${wort}</span>.
        ${lage.ruhend ? `<br><span class="mini">${lage.ruhend} ruhende ${lage.ruhend === 1
          ? 'Karte ist' : 'Karten sind'} dabei nicht mitgerechnet.</span>` : ''}
        ${lage.urteil === 'kritisch' ? '<br><span class="mini">Weniger neue Karten pro Tag oder ein kleinerer Ausschnitt hilft mehr als längere Sitzungen.</span>' : ''}
      </div>`;
    }).join('')}

    ${(() => {
      const p = S.cards.filter(k => lernAuswahl.has(k.deckId) && istProblemkarte(k));
      return p.length ? `<div class="hinweis" style="margin-bottom:10px">
        <strong>${p.length} ${p.length === 1 ? 'Problemkarte' : 'Problemkarten'}</strong> in der
        Auswahl — Karten, die immer wieder durchfallen. Umformulieren bringt dort mehr als üben.
        <div style="margin-top:8px"><button class="btn klein" data-tu="zuProblemkarten">
          Ansehen</button></div></div>` : '';
    })()}

    ${abgelaufenePruefungen(lernAuswahl).map(({ deck, datum }) => `<div class="hinweis" style="margin-bottom:10px">
      <strong>${esc(deck.name)}: Der Termin vom ${datumDeutsch(datum)} ist vorbei.</strong>
      Solange er stehen bleibt, werden die Termine dieses Kastens weiter vorgezogen.
      <div style="margin-top:8px"><button class="btn klein" data-tu="pruefungBeenden" data-id="${esc(deck.id)}">
        Termin entfernen</button></div></div>`).join('')}

    ${fachGesamt ? `
    <div class="dash-fachleiste">${proFach.map((n, i) =>
      n ? `<div style="width:${(n / fachGesamt * 100).toFixed(2)}%;background:var(--akzent);opacity:${(0.28 + i * 0.06).toFixed(2)}" title="Fach ${i + 1}: ${n} Karten"></div>` : ''
    ).join('')}</div>
    <div class="dash-fach-legende"><span>Fach 1</span><span>Fach 12</span></div>` : ''}

    <div class="spread mt2" style="margin-bottom:8px">
      <h2 style="margin:0">Kästen</h2>
      <span class="row" style="gap:6px">
        <button class="btn klein" data-tu="alleAn">Alle</button>
        <button class="btn klein" data-tu="alleAus">Keiner</button>
      </span>
    </div>
    <!-- Ab einer gewissen Zahl wird die Kachelwand unbedienbar: Bei 180 Kästen
         lag „Sitzung starten“ rund 4600 Pixel unterhalb des Bildrandes. Dann
         bleibt die Auswahl eingeklappt, bis jemand sie wirklich braucht. -->
    <details class="dash-deckwahl" ${S.decks.length > 12 ? '' : 'open'}>
      ${S.decks.length > 12 ? `<summary class="mini">${lernAuswahl.size} von ${S.decks.length}
        Kästen gewählt — Auswahl ändern</summary>` : ''}
    <div class="dash-decks">
      ${S.decks.map(d => {
        const k = kartenVon(d.id);
        const f = k.filter(istFaellig).length;
        return `<button type="button" class="dash-deck ${lernAuswahl.has(d.id) ? 'gewaehlt' : ''}" data-deck="${esc(d.id)}" aria-pressed="${lernAuswahl.has(d.id)}">
          <div class="dd-name"><span class="punkt-farbe" style="background:${esc(d.farbe)};margin:0"></span>${esc(d.name)}</div>
          <div class="dd-faellig" ${f ? '' : 'style="color:var(--txt3)"'}>${f}</div>
          <div class="dd-rest">fällig · ${k.length} gesamt</div>
        </button>`;
      }).join('')}
    </div>
    </details>

    <div class="box mt">
      <h2>Umfang</h2>
      <label class="karo"><input type="radio" name="modus" value="heute" ${modus === 'heute' ? 'checked' : ''}>
        <span style="flex:1">Nur heute fällig</span><span class="badge">${heuteN}</span></label>
      <label class="karo"><input type="radio" name="modus" value="alle" ${modus === 'alle' ? 'checked' : ''}>
        <span style="flex:1">Alle fälligen, auch überfällige</span><span class="badge">${alleN}</span></label>
    </div>

    <div class="start-klebt">
    <button class="btn primary gross breit"
      data-tu="${!dran && alleN ? 'startenAlle' : 'starten'}" ${dran || alleN ? '' : 'disabled'}>
      ${dran ? `Sitzung starten — ${dranEcht} ${dranEcht === 1 ? 'Karte' : 'Karten'}`
        : alleN ? `Überfällige lernen — ${sitzungsVorschau('alle').gesamt} ${
            sitzungsVorschau('alle').gesamt === 1 ? 'Karte' : 'Karten'}`
        : 'Nichts fällig'}
    </button>
    </div>
    ${!dran && alleN ? `<p class="mini mt" style="text-align:center">
        Heute ist planmäßig nichts dran — diese Karten sind an früheren Tagen liegen geblieben.</p>` : ''}
    ${!dran && !alleN ? `<p class="mini mt" style="text-align:center">
        Alles erledigt. Nächste Fälligkeit: ${esc(naechsteFaelligkeitText())}</p>` : ''}

    <p class="tastenhilfe mt2"><kbd>Leertaste</kbd> umdrehen ·
      <kbd>1</kbd>–<kbd>4</kbd> bewerten · <kbd>Esc</kbd> beenden</p>`;

  verdrahten(ziel);
  $$('#seite-lernen .dash-deck').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.deck;
    lernAuswahl.has(id) ? lernAuswahl.delete(id) : lernAuswahl.add(id);
    malLernen();
  }));
  $$('#seite-lernen input[name=modus]').forEach(r => r.addEventListener('change', () => {
    try { localStorage.setItem('lk2:modus', r.value); } catch (_) {}
    malLernen();
  }));
}

function lernModus() {
  try { return localStorage.getItem('lk2:modus') === 'alle' ? 'alle' : 'heute'; }
  catch (_) { return 'heute'; }
}

function naechsteFaelligkeitText() {
  const offen = S.cards.filter(k => !k.suspendiert && k.due).map(k => k.due).sort();
  if (!offen.length) return 'keine Karten';
  const d = offen.find(x => x > heute());
  if (!d) return 'heute';
  const n = tageDiff(d, heute());
  return `${datumDeutsch(d)} (in ${n} ${n === 1 ? 'Tag' : 'Tagen'})`;
}

/** Heutige Tagesstatistik (neue Karten, Anzahl, Sekunden) — für den
 *  Tagesdeckel und den Fortschrittsring auf dem Startbildschirm. Bei
 *  Fehlern (offline, kein Cache) bleiben die zuletzt bekannten Werte
 *  stehen statt die App zu blockieren. */
async function heutigeStatistikLaden() {
  try {
    const snap = await FB.getDoc(FB.doc(colReviews(), heute()));
    const d = snap.exists() ? snap.data() : null;
    S.heutigeNeu = Number(d?.neu) || 0;
    S.heutigeAnzahl = Number(d?.anzahl) || 0;
    S.heutigeSekunden = Number(d?.sekunden) || 0;
  } catch (_) { /* Werte bleiben wie sie waren */ }
  return S.heutigeNeu;
}

async function sitzungStarten() {
  const modus = lernModus();
  let pool = S.cards.filter(k => lernAuswahl.has(k.deckId))
    .filter(modus === 'heute' ? istHeuteGenau : istFaellig);
  if (!pool.length) return toast('Keine fälligen Karten in der Auswahl.');

  // Geschwisterabfragen zurückstellen: Die Lücken eines Satzes und die
  // beiden Richtungen einer Vokabel gehören zusammen. Kämen sie in derselben
  // Sitzung dran, verriete die erste die Antwort der übrigen — der
  // Lückentext zeigt die anderen Lücken im Klartext, die Rückwärtsfrage ist
  // die Antwort der Vorwärtsfrage. Die Bewertung misst dann Wiedererkennen
  // statt Erinnern, und FSRS verlängert die Abstände auf falscher Grundlage.
  /* Der Lernbox-Filter muss VOR die Familienauswahl. Stand der Vertreter
     einer Familie in der Lernbox, fiel vorher die ganze Familie aus der
     Sitzung — auch die Rückwärtsabfrage, die gar nicht in der Box lag. */
  if (lernboxAn()) pool = pool.filter(k => !(istNeu(k) && inLernbox(k)));
  const familien = new Set();
  const zurueckgestellt = [];
  pool = pool.slice()
    .sort((a, b) => String(a.due || '').localeCompare(String(b.due || '')))
    .filter(k => {
      const familie = k.quelleId || k.id;
      if (familien.has(familie)) { zurueckgestellt.push(k); return false; }
      familien.add(familie);
      return true;
    });

  // Ohne Netz kann diese Abfrage hängen bleiben. Der Start darf davon nicht
  // abhängen — dieselbe Absicherung wie beim Erststart-Test.
  const heutigeNeu = await Promise.race([
    heutigeStatistikLaden(),
    new Promise(r => setTimeout(() => r(S.heutigeNeu), 3000))
  ]);
  const deckel = zahl(S.einstellungen.neuProTag, 5, 50, 20);
  const nochFrei = Math.max(0, deckel - heutigeNeu);
  /* Neue Karten, die gerade in der Lernbox eingeführt werden, gehören noch
     nicht in den Karteikasten. Ohne diese Zeile terminierte der Kasten
     genau die Karten, die die Lernbox eben aus dem Termindruck genommen
     hatte — also das Gegenteil dessen, wofür die Einführung da ist.
     Bereits gelernte Karten bleiben ausdrücklich im Pool: Ihr Termin ist
     eine gemessene Größe und darf nicht davon abhängen, ob sie geübt
     werden. */
  pool = pool.filter(k => !(istNeu(k) && inLernbox(k)));
  const alte = pool.filter(k => !istNeu(k));
  let neue = pool.filter(istNeu);
  const uebrig = Math.max(0, neue.length - nochFrei);
  if (neue.length > nochFrei) neue = mischen(neue).slice(0, nochFrei);
  pool = alte.concat(neue);
  if (!pool.length) return toast(
    `Tagesgrenze für neue Karten erreicht (${deckel}/Tag). In der Auswahl sind nur noch neue Karten fällig.`, 'fehler');

  sitzung = {
    // KONZEPT §6.5: Interleaving — die gewählten Kästen werden gemischt
    // abgearbeitet, nicht blockweise nacheinander.
    karten: mischen(pool), i: 0, aufgedeckt: false, aktiv: true,
    zaehler: { 1: 0, 2: 0, 3: 0, 4: 0 }, gesamt: pool.length,
    start: Date.now(), kartenStart: Date.now(), sekunden: 0,
    proDeck: {}, bewertet: 0, uebrigeNeue: uebrig,
    zurueckgestellt: zurueckgestellt.length
  };
  kartenZustandLeeren(sitzung);
  malSitzung();
}

/* Doppeltipp-Schutz. Auf dem Handy trifft der zweite Tipp eines
   Doppeltipps dieselbe Bildschirmstelle der bereits nachgerückten Karte —
   dort liegt „Antwort zeigen“ bzw. „Prüfen“, und die nächste Karte wäre
   ungefragt aufgedeckt. Bewusst an Ort UND Zeit festgemacht statt an einer
   pauschalen Sperre: Wer zügig lernt, drückt durchaus 200 ms nach der
   Bewertung schon wieder — nur eben nicht auf denselben Punkt. */
/* Stufe 6: Dasselbe gilt in der Lernbox, und dort sogar in einer schärferen
   Form. Gemessen auf dem iPhone SE: Nach „Antwort zeigen“ liegt „Konnte ich
   nicht“ mit 2172 px² Deckungsfläche genau dort, wo eben aufgedeckt wurde.
   Zwei Tipps im Abstand von 90 ms setzten damit einen erarbeiteten Stand von
   1 auf 0 zurück, ohne dass jemand etwas gedrückt hätte. Eine reine
   Zeitsperre in `uebungBewerten` greift hier nicht: Der erste Tipp war das
   Aufdecken und hat gar nicht bewertet. Deshalb merkt sich der Schutz auch
   die Stelle des Aufdeckens. */
const ORTS_MARKEN = '[data-bew],[data-tu="lernboxAufdecken"],[data-tu="lernboxTipp"],' +
  '[data-tu="lernboxJa"],[data-tu="lernboxNein"],[data-tu="lernboxZudecken"]';
let letzteBewertungsStelle = null;
document.addEventListener('click', e => {
  if (!(sitzung?.aktiv || uebung?.aktiv) || !e.clientX || !e.clientY) return;
  /* Erst prüfen, dann merken. Die erste Fassung kehrte bei einer Marke
     sofort zurück — damit war ausgerechnet der gefährlichste Fall
     ungeschützt: Tipp 1 auf „Antwort zeigen“, Tipp 2 auf das „Konnte ich
     nicht“, das an derselben Stelle nachgerückt ist. Beides sind Marken. */
  if (letzteBewertungsStelle) {
    const nah = Math.abs(e.clientX - letzteBewertungsStelle.x) < 45
             && Math.abs(e.clientY - letzteBewertungsStelle.y) < 45;
    /* Geschluckt wird nur, was AUSWERTET oder AUFDECKT — also alles, was
       Schaden anrichten kann. Ein harmloser Zwischenschritt wie „Zudecken
       und selbst wiedergeben“ darf auch unmittelbar nach dem Aufdecken
       gedrückt werden; ihn zu blockieren wäre eine Bevormundung, die
       niemand versteht. */
    /* Ausdrücklich harmlos: Diese Knöpfe richten keinen Schaden an und
       dürfen auch unmittelbar nach dem Aufdecken gedrückt werden. Sie
       vorsorglich zu schlucken wäre eine Bevormundung, die niemand
       versteht — und „Zudecken und selbst wiedergeben“ ist genau der
       Schritt, den das Verfahren erreichen will. */
    const harmlos = e.target.closest?.(
      '[data-tu="lernboxZudecken"],[data-tu="lernboxAbbrechen"]');
    const wirktAus = !harmlos && (e.target.closest?.(
      '[data-bew],[data-tu="lernboxJa"],[data-tu="lernboxNein"],' +
      '[data-tu="umdrehen"],[data-tu="lernboxAufdecken"],[data-tu="lernboxTipp"],' +
      '[data-tu="tippPruefen"],[data-tu="lernboxTippPruefen"],[data-tu="lernboxRaus"]')
      /* Auch ein Tipp ins Leere zählt, solange er auf die Karte fällt: Dort
         rückt nach einer Bewertung die nächste Karte nach, und ein Tipp auf
         die Karte deckt sie auf. */
      || e.target.closest?.('#flip, .ueb-karte'));
    /*
       Das Fenster bleibt bei 400 ms: Wer flüssig lernt, drückt alle 400 bis
       500 ms, und ein längeres Fenster verschluckte echte Bewertungen.
       Gegen den gemessenen Nachtipp nach 450 ms hilft nicht mehr Zeit,
       sondern eine andere Anordnung — siehe uebungAktionenHtml(). */
    if (nah && wirktAus && Date.now() - letzteBewertungsStelle.t < 400) {
      e.preventDefault(); e.stopPropagation(); return;
    }
  }
  if (e.target.closest?.(ORTS_MARKEN)) {
    letzteBewertungsStelle = {
      x: e.clientX, y: e.clientY, t: Date.now(),
      lernbox: !!e.target.closest?.('#seite-ueben')
    };
    if (sitzung) sitzung.letzteEingabeTastatur = false;
  }
}, true);

/** Zustand, der nur zur gerade gezeigten Karte gehört. */
function kartenZustandLeeren(s) {
  s.modus = null; s.urteil = null; s.mcOptionen = null; s.mcGewaehlt = null;
  s.gesprochenFuer = -1;
}

function malSitzung() {
  const ziel = $('#seite-lernen');
  const s = sitzung;
  if (!s) return malLernen();

  if (s.i >= s.karten.length) return malAbschluss();

  // Inhalt aus dem aktuellen Bestand nehmen, falls die Karte inzwischen
  // woanders bearbeitet wurde. Fehlt sie, bleibt die Kopie stehen —
  // bewerten() fängt den Fall ab.
  const frisch = S.cards.find(x => x.id === s.karten[s.i].id);
  if (frisch) s.karten[s.i] = frisch;

  const k = s.karten[s.i];
  if (!s.modus) {
    s.modus = modusFuer(k);
    if (s.modus === 'mc') {
      s.mcOptionen = mcOptionenBauen(k);
      if (!s.mcOptionen) s.modus = 'aufdecken';   // zu wenige Distraktoren
    }
  }
  const modi = deckModi(k.deckId);
  const hoeren = modi.includes('hoeren');
  // Reiner Hörmodus: ist „Hören“ der einzige gewählte Modus, bleibt die Frage
  // verdeckt und wird nur vorgelesen — sonst ist Hören eine Ergänzung.
  // Ohne Sprachausgabe wäre eine verdeckte Frage unbeantwortbar; dann wird
  // der Text gezeigt, statt den Nutzer vor eine leere Karte zu setzen.
  const nurHoeren = hoeren && modi.length === 1 && !istClozeVariante(k) && sprachAusgabeDa();
  if (hoeren && !sprachAusgabeDa() && !hoerenHinweisGezeigt) {
    hoerenHinweisGezeigt = true;
    setTimeout(() => toast('Dieser Browser bietet keine Sprachausgabe an — die Karten werden angezeigt.', 'fehler'), 300);
  }

  const fach = fachVon(k);
  const proz = Math.round((s.i / s.gesamt) * 100);
  const ueberfaellig = tageDiff(heute(), k.due || heute());
  const marke = variantenMarke(k);
  const markeHtml = marke ? esc(marke) + ' · ' : '';
  const lautsprecher = was =>
    hoeren ? `<button type="button" class="sprech-knopf" data-tu="vorlesen" data-id="${was}"
                 aria-label="Vorlesen" title="Vorlesen">🔊</button>` : '';
  // Merker steht auf beiden Seiten — er ist eine Eigenschaft der Karte, nicht
  // ihrer Antwort („unregelmäßig“ hilft nur, wenn man es vorher sieht).
  const merker = markHtml(k) ? `<div class="flip-mark">${markHtml(k)}</div>` : '';

  ziel.innerHTML = `
    <div class="spread" style="margin-bottom:8px">
      <span class="mini">${s.i + 1} / ${s.gesamt}${
        s.modus !== 'aufdecken' || hoeren ? ` · ${esc(modusEtikett(s.modus, hoeren))}` : ''}</span>
      <button class="btn klein" data-tu="abbrechen">Beenden</button>
    </div>
    <div class="fortschritt"><div style="width:${proz}%"></div></div>

    <div class="flip-buehne">
      <div class="flip-karte ${s.aufgedeckt ? 'gedreht' : ''}" id="flip">
        <div class="flip-seite vorn">
          <div class="flip-kopf">
            <span style="color:${esc(deckFarbe(k.deckId))}">${esc(deckName(k.deckId))}</span>
            <span>${markeHtml}Fach ${fach}${istNeu(k) ? ' · neu' : ''}${ueberfaellig > 0 ? ` · ${ueberfaellig} T. überfällig` : ''}</span>
          </div>
          ${merker}
          ${nurHoeren
            ? `<div class="nur-hoeren"><span class="gross-ico">🔊</span>Die Frage wird vorgelesen</div>`
            : `<div class="flip-text">${frageHtml(k)}</div>`}
          ${lautsprecher('frage')}
        </div>
        <div class="flip-seite hinten">
          <div class="flip-kopf">
            <span style="color:${esc(deckFarbe(k.deckId))}">${esc(deckName(k.deckId))}</span>
            <span>${markeHtml}Fach ${fach}</span>
          </div>
          ${merker}
          <div class="flip-text">${antwortHtml(k)}</div>
          ${extraHtml(k) ? `<div class="flip-extra">${extraHtml(k)}</div>` : ''}
          ${nurHoeren ? `<div class="flip-notiz">Frage: ${esc(frageText(k))}</div>` : ''}
          ${k.notiz ? `<div class="flip-notiz">${feldHtml(k, k.notiz)}</div>` : ''}
          ${lautsprecher('antwort')}
        </div>
      </div>
    </div>

    <div id="aktionen">${aktionenHtml(s, k)}</div>`;

  verdrahten(ziel);
  aktionenVerdrahten();
  // Klick auf die Karte deckt nur dort auf, wo es keine Eingabe gibt —
  // sonst würde ein Fehlklick die Tipp- oder Auswahlaufgabe überspringen.
  // Der Lautsprecher liegt innerhalb der Karte: ohne diese Ausnahme würde
  // jedes Nachhören die Antwort aufdecken, im reinen Hörmodus wäre die
  // Wiederholtaste damit unbrauchbar.
  if (s.modus === 'aufdecken')
    $('#flip')?.addEventListener('click', ev => {
      if (ev.target.closest('.sprech-knopf')) return;
      if (!sitzung?.aufgedeckt) umdrehen();
    });

  if (hoeren && s.gesprochenFuer !== s.i && !s.aufgedeckt) {
    s.gesprochenFuer = s.i;
    // .catch() ist Pflicht: sprechen() ist asynchron, und eine unbehandelte
    // Ablehnung landet sonst als Seitenfehler im Fenster.
    sprechen(frageText(k), spracheFuer(k, 'frage'), { lautschrift: lautschriftFuer(k, 'frage') })
      .catch(e => console.warn('[Sprachausgabe]', e));
  }
  if (s.modus === 'tippen' && !s.aufgedeckt) $('#tipp-eingabe')?.focus();
}

function modusEtikett(modus, hoeren) {
  const n = MODUS_NAME[modus] || MODUS_NAME.aufdecken;
  return hoeren && modus !== 'hoeren' ? n + ' + Hören' : n;
}

/** Der Bereich unter der Karte — je nach Modus und Auswertungsstand. */
function aktionenHtml(s, k) {
  const teile = [];
  if (s.modus === 'mc' && s.mcOptionen) teile.push(mcHtml(s));
  if (s.urteil) teile.push(urteilHtml(s.urteil, k));
  if (s.aufgedeckt) teile.push(bewertungsHtml(k, s.urteil));
  else if (s.modus === 'tippen') teile.push(tippenHtml());
  else if (s.modus !== 'mc') teile.push(aufdeckHtml());
  return teile.join('');
}

function aufdeckHtml() {
  return `<button class="btn primary gross breit" data-tu="umdrehen">Antwort zeigen</button>
          <p class="tastenhilfe"><kbd>Leertaste</kbd></p>`;
}

function tippenHtml() {
  return `<div class="tipp-zeile">
      <input id="tipp-eingabe" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Antwort eintippen …"
             aria-label="Antwort eintippen">
      <button class="btn primary" data-tu="tippPruefen">Prüfen</button>
    </div>
    <p class="tastenhilfe"><kbd>Enter</kbd> prüfen · leer lassen und <kbd>Enter</kbd> zeigt die Antwort</p>`;
}

const MC_BUCHSTABEN = ['A', 'B', 'C', 'D'];
function mcHtml(s) {
  return `<div class="mc-liste">${s.mcOptionen.map((o, i) => {
    const fertig = !!s.urteil;
    const klasse = !fertig ? '' : o.richtig ? ' richtig' : (i === s.mcGewaehlt ? ' falsch' : '');
    return `<button type="button" class="mc-option${klasse}" data-mc="${i}" ${fertig ? 'disabled' : ''}>
       <span class="mc-buchstabe">${MC_BUCHSTABEN[i]}</span><span>${esc(o.text)}</span></button>`;
  }).join('')}</div>
    ${s.urteil ? '' : `<p class="tastenhilfe"><kbd>A</kbd>–<kbd>D</kbd> oder anklicken</p>`}`;
}

/** Bewertungsvorschlag aus der automatischen Auswertung.
 *  Bewusst kein Vorschlag bei „falsch“: Die 1 wirft eine reife Karte um
 *  Monate zurück. Wer gerade getippt und Enter gedrückt hat, drückt Enter
 *  gern noch einmal — dieser Reflex darf nicht die härteste Bewertung
 *  auslösen, zumal die Auswertung selbst danebenliegen kann. */
function urteilVorschlag(art) {
  return (art === 'richtig' || art === 'fast') ? 3 : null;
}

function urteilHtml(u, k) {
  const titel = {
    richtig: 'Richtig',
    fast:    'Fast richtig — als gewusst werten?',
    falsch:  'Nicht richtig',
    leer:    'Antwort angesehen'
  }[u.art] || '';
  const ikon = { richtig: '✓', fast: '≈', falsch: '✗', leer: '👁' }[u.art] || '';
  const klasse = u.art === 'leer' ? '' : u.art;
  const zeilen = [];
  if (u.eingabe) zeilen.push(`Deine Antwort: <strong>${esc(u.eingabe)}</strong>`);
  if (u.art !== 'richtig') zeilen.push(`Richtig wäre: <strong>${esc(antwortText(k))}</strong>`);
  return `<div class="urteil ${klasse}">
      <span style="font-size:19px;line-height:1.15">${ikon}</span>
      <span><b>${titel}</b>${zeilen.length ? `<span class="ihre">${zeilen.join('<br>')}</span>` : ''}</span>
    </div>
    ${u.art === 'fast' ? `<div class="row" style="margin-bottom:12px">
      <button class="btn" data-tu="fastJa">Ja, als gewusst werten</button>
      <button class="btn" data-tu="fastNein">Nein, nicht gewusst</button>
    </div>` : ''}`;
}

function aktionenVerdrahten() {
  const a = $('#aktionen');
  if (!a) return;
  verdrahten(a);
  $$('[data-bew]', a).forEach(b =>
    b.addEventListener('click', () => bewerten(Number(b.dataset.bew))));
  $$('[data-mc]', a).forEach(b =>
    b.addEventListener('click', () => mcWaehlen(Number(b.dataset.mc))));
  const feld = $('#tipp-eingabe', a);
  if (feld) feld.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); tippAuswerten(); }
    // Der globale Tastaturhandler lässt Eingabefelder in Ruhe — ohne diese
    // Zeile wäre Esc genau dort wirkungslos, wo der Cursor immer steht.
    if (e.key === 'Escape') { e.preventDefault(); sitzungBeenden(false); }
  });
}

/** Aufdecken ohne die Karte neu zu zeichnen — sonst entstünde das Element neu
 *  und die Umdreh-Animation liefe gar nicht erst an. */
function aktionenAuffrischen() {
  const s = sitzung;
  if (!s) return;
  const k = s.karten[s.i];
  const karte = $('#flip'), a = $('#aktionen');
  if (!karte || !a || !k) return malSitzung();
  karte.classList.add('gedreht');
  a.innerHTML = aktionenHtml(s, k);
  aktionenVerdrahten();
  if (deckModi(k.deckId).includes('hoeren'))
    sprechen(antwortText(k), spracheFuer(k, 'antwort'), { lautschrift: lautschriftFuer(k, 'antwort') })
      .catch(e => console.warn('[Sprachausgabe]', e));
}

function tippAuswerten() {
  const s = sitzung;
  if (!s?.aktiv || s.aufgedeckt) return;
  const k = s.karten[s.i];
  if (!k) return;
  const eingabe = String($('#tipp-eingabe')?.value ?? '').trim();
  s.urteil = { art: antwortPruefen(eingabe, antwortText(k)), eingabe };
  s.aufgedeckt = true;
  aktionenAuffrischen();
}

function mcWaehlen(i) {
  const s = sitzung;
  if (!s?.aktiv || s.aufgedeckt || !s.mcOptionen) return;
  const opt = s.mcOptionen[i];
  if (!opt) return;
  s.mcGewaehlt = i;
  s.urteil = { art: opt.richtig ? 'richtig' : 'falsch', eingabe: opt.text };
  s.aufgedeckt = true;
  aktionenAuffrischen();
}

/** Text für "in wie vielen Tagen" unter jedem Bewertungsknopf. */
function intervallTextAus(tage) {
  return tage <= 0 ? 'heute' : tage === 1 ? 'morgen' : tage < 31 ? tage + ' Tage'
    : tage < 365 ? Math.round(tage / 30) + ' Mon.' : Math.round(tage / 365 * 10) / 10 + ' J.';
}
/** Vorschau für alle vier Bewertungen — je nach Modus aus der festen
 *  Intervalltabelle oder direkt von FSRS. repeat() liefert alle vier
 *  Ausgänge auf einen Schlag, genau passend für diese Vorschau. */
function intervallVorschauTexte(k) {
  // Der Prüfungstermin staucht die Fälligkeit — die Vorschau muss denselben
  // Weg nehmen, sonst verspricht sie „1,4 Jahre“ und die Karte kommt in vier
  // Tagen wieder.
  const gestaucht = iso => tageDiff(terminStauchen(iso, k.deckId, k.id), heute());
  if (S.einstellungen.klassikModus) {
    const iv = S.einstellungen.intervalle;
    const max = iv.length;
    const alt = fachVon(k);
    const out = {};
    [1, 2, 3, 4].forEach(r => {
      const neu = r === 1 ? 1 : r === 2 ? alt : Math.min(max, alt + (r === 3 ? 1 : 2));
      out[r] = intervallTextAus(gestaucht(plusTage(heute(), iv[neu - 1] ?? iv[max - 1])));
    });
    return out;
  }
  try {
    const vorschau = fsrsMotor().repeat(fsrsKarteAus(k), fsrsJetzt());
    const out = {};
    [1, 2, 3, 4].forEach(r => { out[r] = intervallTextAus(gestaucht(datumZuIso(vorschau[r].card.due))); });
    return out;
  } catch (e) {
    console.warn('[Vorschau]', e);
    return { 1: '–', 2: '–', 3: '–', 4: '–' };
  }
}

/** Die vier Bewertungsknöpfe. Kam die Karte aus einer automatischen
 *  Auswertung (Tippen, Multiple Choice), wird die dazu passende Bewertung
 *  hervorgehoben und liegt auf der Eingabetaste — die Feinabstufung 1–4
 *  bleibt aber immer beim Nutzer. */
function bewertungsHtml(k, urteil) {
  const vorschauTexte = intervallVorschauTexte(k);
  const empfohlen = urteil ? urteilVorschlag(urteil.art) : null;
  const knopf = (r, titel) =>
    `<button class="bew bew${r}${r === empfohlen ? ' empfohlen' : ''}" data-bew="${r}">
       <b>${r}</b><span>${titel}</span><small>${vorschauTexte[r]}</small></button>`;
  return `<div class="bewertung">
      ${knopf(1, 'Nicht gewusst')}${knopf(2, 'Schwer')}${knopf(3, 'Gewusst')}${knopf(4, 'Sehr leicht')}
    </div>
    <p class="tastenhilfe"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd>${
      empfohlen ? ` · <kbd>Enter</kbd> übernimmt ${empfohlen}` : ''}</p>`;
}

/* Nicht neu zeichnen, sondern nur umklappen — sonst entsteht das Element neu
   und die CSS-Animation läuft gar nicht erst an. */
function umdrehen() {
  if (!sitzung?.aktiv || sitzung.aufgedeckt) return;
  sitzung.aufgedeckt = true;
  aktionenAuffrischen();
}

/* ---------- 9b. FSRS (Stufe 2) ------------------------------------------ */

/** ts-fsrs rechnet mit echten Datumsobjekten und eigener Tagesarithmetik
 *  (dateDiffInDays, UTC-Kalendertage). Die App rechnet Tage konsequent über
 *  ISO-Strings und eine eigene Tagesgrenze (heute(), TAGESGRENZE). Damit
 *  beide dieselben Tage zählen, wird FSRS nie der reale Sekunden-Zeitpunkt
 *  übergeben, sondern die UTC-Mitternacht des App-"heute". */
function isoZuDatum(iso) { return new Date((iso || heute()) + 'T00:00:00.000Z'); }
function datumZuIso(d) {
  if (!(d instanceof Date) || isNaN(d.getTime())) return heute();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}
function fsrsJetzt() { return isoZuDatum(heute()); }

/** Parameter frisch aufbauen statt zu cachen — die Retention kann sich in
 *  den Einstellungen jederzeit ändern. Lernschritte bewusst auf einen
 *  kurzen Schritt reduziert (KONZEPT §4.1: „keine mehrstufigen Ketten“). */
function fsrsMotor() {
  return new FSRS.FSRS(FSRS.generatorParameters({
    request_retention: S.einstellungen.retention,
    learning_steps: ['10m'],
    relearning_steps: ['10m']
  }));
}

/** App-Karte in das von ts-fsrs erwartete Card-Objekt übersetzen.
 *
 *  ts-fsrs akzeptiert als Gedächtniszustand nur zwei Formen: exakt
 *  (stability:0, difficulty:0) = „noch kein Zustand, aus der ersten
 *  Bewertung initialisieren" — oder difficulty ≥ 1 UND stability > 0.
 *  Alles dazwischen wirft FSRSValidationError („Invalid memory state").
 *  Der Stufe-1-Altbestand enthält genau so einen Zwischenzustand: nie
 *  gelernte Karten wurden dort mit difficulty:5 bei stability:0 angelegt.
 *  Ohne die Normalisierung hier wären diese Karten im FSRS-Modus für
 *  immer unlernbar (jede Bewertung würde abgefangen und übersprungen). */
function fsrsKarteAus(k) {
  let stability = Number(k.stability) || 0;
  let difficulty = Number(k.difficulty) || 0;
  // ts-fsrs kennt eine Mindeststabilität (S_MIN = 0,001). Ein kleinerer Wert
  // aus einer fremden oder von Hand bearbeiteten Sicherung machte die Karte
  // dauerhaft unbewertbar.
  if (stability > 0 && stability < 0.001) stability = 0.001;
  if (!(difficulty >= 1 && stability > 0)) {
    if (Number(k.reps) > 0 && stability > 0) {
      // gelernt, aber difficulty fehlt/kaputt → reparieren statt verwerfen
      difficulty = Math.min(10, Math.max(1, difficulty || 5));
    } else {
      // nie gelernt (oder ohne brauchbare Stabilität) → frischer Zustand
      stability = 0; difficulty = 0;
    }
  }
  return {
    due: isoZuDatum(k.due),
    stability,
    difficulty,
    elapsed_days: 0,          // wird von ts-fsrs aus last_review + jetzt neu berechnet
    scheduled_days: 0,
    learning_steps: Number(k.learningSteps) || 0,
    reps: Number(k.reps) || 0,
    lapses: Number(k.lapses) || 0,
    state: [0, 1, 2, 3].includes(k.state) ? k.state : 0,
    /* Ein Abfragedatum in der Zukunft ergibt einen negativen Abstand, und
       ts-fsrs lehnt jede Bewertung mit `Invalid delta_t` ab — die Karte wäre
       dauerhaft unlernbar. Das passiert ohne jedes Zutun: Uhr zurückgestellt,
       Reise in eine westlichere Zeitzone, geänderte Tagesgrenze, Sicherung von
       einem Gerät, das voraus war. Deshalb hier auf heute begrenzen. */
    last_review: k.lastReview
      ? isoZuDatum(k.lastReview > heute() ? heute() : k.lastReview) : undefined
  };
}

const FSRS_STANDARD_GEWICHTE = [
  0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722,
  0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425,
  0.0912, 0.0658, 0.1542
];
/** Intervallformel von ts-fsrs (FSRS-6), unabhängig nachgebildet für die
 *  Folgeabschätzung des Retention-Reglers — eine echte Simulation über alle
 *  Karten wäre dafür zu teuer, eine Näherung reicht als Orientierung. */
function fsrsIntervallTage(stability, retention, w) {
  const decay = -w[20];
  const factor = Math.exp(Math.log(0.9) / decay) - 1;
  const modifier = (Math.pow(retention, 1 / decay) - 1) / factor;
  return Math.min(36500, Math.max(1, Math.round((stability || 0.5) * modifier)));
}
/** Renewal-Theorie-Näherung: Summe 1/Intervall über alle aktiven Karten
 *  ergibt die erwartete Anzahl Wiederholungen pro Tag im eingeschwungenen
 *  Zustand. Nur eine Orientierungshilfe, keine exakte Vorhersage. */
function geschaetzteWiederholungenProTag(retention) {
  // Nur Karten, die schon im Umlauf sind. Eine noch nie gelernte Karte
  // erzeugt heute keine Wiederholung — würde sie mitgezählt, spränge die
  // Schätzung nach jedem Import oder nach dem Einschalten der zweiten
  // Abfragerichtung um ein Vielfaches nach oben, und der Regler daneben
  // wäre nicht mehr sinnvoll einzustellen.
  const karten = S.cards.filter(k => !k.suspendiert && !istNeu(k));
  if (!karten.length) return 0;
  let summe = 0;
  karten.forEach(k => { summe += 1 / fsrsIntervallTage(Number(k.stability) || 0.5, retention, FSRS_STANDARD_GEWICHTE); });
  return Math.round(summe * 10) / 10;
}

/** Datenbank-Patch für eine Bewertung — Klassik-Modus (feste Fachintervalle,
 *  wie Stufe 1) oder FSRS, je nach Einstellung. */
function bewertungsPatch(k, rating) {
  if (S.einstellungen.klassikModus) {
    const iv = S.einstellungen.intervalle;
    const max = iv.length;
    const alt = fachVon(k);
    const neuFach = rating === 1 ? 1
                  : rating === 2 ? alt
                  : Math.min(max, alt + (rating === 3 ? 1 : 2));
    const tage = iv[neuFach - 1] ?? iv[max - 1];
    return {
      fach: neuFach,
      due: terminStauchen(plusTage(heute(), tage), k.deckId, k.id),
      stability: tage,
      lastReview: heute(),
      reps: (Number(k.reps) || 0) + 1,
      lapses: (Number(k.lapses) || 0) + (rating === 1 ? 1 : 0),
      state: rating === 1 ? 3 : 2
    };
  }
  const { card } = fsrsMotor().next(fsrsKarteAus(k), fsrsJetzt(), rating);
  const schwellen = STANDARD_INTERVALLE.filter(g => card.stability >= g).length;
  return {
    // Der Prüfungstermin staucht nur die Fälligkeit, nicht die Stabilität:
    // Die gemessene Gedächtnisstärke bleibt, was sie ist — vorgezogen wird
    // allein der Termin (KONZEPT §6.6).
    due: terminStauchen(datumZuIso(card.due), k.deckId, k.id),
    stability: card.stability,
    difficulty: card.difficulty,
    lastReview: heute(),
    reps: card.reps,
    lapses: card.lapses,
    state: card.state,
    learningSteps: card.learning_steps || 0,
    // "fach" wird auch im FSRS-Modus als Spiegel der Stabilität mitgeschrieben
    // (KONZEPT §4.3-Schwellen) — nicht weil FSRS ihn braucht, sondern damit
    // ein späteres Zurückschalten in den Klassik-Modus nicht auf einem
    // veralteten Fach-Wert aufsetzt und Monate an Fortschritt zurückwirft.
    fach: Math.max(1, Math.min(12, schwellen + 1))
  };
}

function bewerten(rating) {
  const s = sitzung;
  if (!s?.aktiv || !s.aufgedeckt) return;
  // Doppeltippen auf dem Handy: Der zweite Tipp landet sonst auf derselben
  // Stelle der nächsten Karte — dort liegt „Antwort zeigen“ bzw. „Prüfen“,
  // und die nächste Karte wäre ungefragt aufgedeckt.
  /* 300 ms sind die Handy-Sperre: Dort rückt der Bewertungsknopf auf die
     Stelle, an der eben „Antwort zeigen“ stand. An der Tastatur trägt diese
     Begründung nicht — wer zügig lernt, verlor bis zur Hälfte seiner
     Bewertungen, und zwar stumm (gemessen: 3 von 6 bei 200 ms Takt). */
  const sperre = s.letzteEingabeTastatur ? 60 : 300;
  if (s.zuletztBewertet && Date.now() - s.zuletztBewertet < sperre) return;
  const gezeigt = s.karten[s.i];
  if (!gezeigt) return;
  // Die Sitzung arbeitet mit Kopien vom Startzeitpunkt. Vor dem Schreiben
  // auf den aktuellen Stand beziehen — sonst überschriebe eine Bewertung
  // stillschweigend, was inzwischen auf einem anderen Gerät passiert ist.
  const k = S.cards.find(x => x.id === gezeigt.id);
  if (!k) {
    toast('Diese Karte gibt es nicht mehr — sie wird übersprungen.');
    s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
    kartenZustandLeeren(s);
    return malSitzung();
  }
  s.karten[s.i] = k;
  s.zuletztBewertet = Date.now();

  /* Deckel bei drei Minuten: Länger sitzt niemand an einer Karteikarte — was
     darüber liegt, ist eine Unterbrechung und keine Lernzeit. Eine Messung,
     die in den Deckel läuft, ist keine Messung: Sie geht deshalb weder in die
     Summe noch in den Zähler ein. Sonst schleppte eine einzige Pause
     drei Minuten in den Durchschnitt und ließe eine harmlose Karte für immer
     als Zeitfresser dastehen. */
  const rohSekunden = Math.round((Date.now() - s.kartenStart) / 1000);
  const brauchbar = rohSekunden >= 0 && rohSekunden < 180;
  const sekunden = brauchbar ? rohSekunden : 0;
  const warNeu = istNeu(k);
  let patch;
  try {
    patch = bewertungsPatch(k, rating);
  } catch (e) {
    console.error('[Terminierung]', e);
    toast('Terminierung fehlgeschlagen, Karte wird übersprungen: ' + (e?.message || e), 'fehler');
    s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
    kartenZustandLeeren(s);
    return malSitzung();
  }
  // Zeit je Karte mitschreiben (KONZEPT §6.7) — daraus wird in der Statistik
  // sichtbar, welche Karten unverhältnismäßig viel Zeit kosten. Eigener
  // Zähler dafür: Der Bestand aus Stufe 1–3 hat Wiederholungen ohne
  // Zeitmessung, und durch `reps` geteilt käme dort dauerhaft „0 s“ heraus.
  patch.zeitGesamt = (Number(k.zeitGesamt) || 0) + sekunden;
  if (brauchbar) patch.zeitReps = (Number(k.zeitReps) || 0) + 1;

  // Problemkarte (KONZEPT §6.3): Wer eine Karte immer wieder vergisst, lernt
  // nicht die Sache, sondern übt das Scheitern. Sie wird ausgesetzt und zur
  // Umformulierung vorgeschlagen, statt weiter Zeit zu binden.
  //
  // Ausgelöst wird das nur durch einen NEUEN Aussetzer. Ohne diese Bedingung
  // würde jede Bewertung — auch „sehr leicht“ — eine Karte aussetzen, sobald
  // ihr Lebenszähler über der Grenze liegt. Beim ersten Öffnen nach dem
  // Umstieg träfe das reihenweise Karten, die längst wieder sitzen.
  const grenze = leechGrenze();
  const neuerAussetzer = (Number(patch.lapses) || 0) > (Number(k.lapses) || 0);
  const zaehlerNeu = Math.max(0, (Number(patch.lapses) || 0) - (Number(k.leechBasis) || 0));
  const nunProblem = neuerAussetzer && zaehlerNeu >= grenze && !k.leech;
  if (nunProblem) {
    patch.leech = true; patch.suspendiert = true;
    /* Auch aus der Lernbox nehmen. `inLernbox` blendet ausgesetzte Karten
       aus — ohne diese Zeile fiel der Zähler am Reiter kommentarlos, der
       Übungsstand blieb aber stehen und war beim Wiederaufnehmen plötzlich
       wieder da. Eine Karte, die zur Problemkarte geworden ist, soll
       umformuliert werden, nicht weitergeübt. */
    patch.uebung = null; patch.uebungFertig = heute();
  }

  Object.assign(k, patch);                                   // lokal sofort
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), 'Bewertung');
  if (nunProblem) {
    // Ruhen gilt für die ganze Kartenfamilie — sonst kämen die übrigen
    // Lücken bzw. die Gegenrichtung weiter dran, obwohl die Karte in der
    // Oberfläche als ruhend geführt wird.
    const familie = mitVarianten([k.id]).filter(x => x !== k.id);
    if (familie.length) {
      familie.forEach(x => { const c = S.cards.find(y => y.id === x); if (c) c.suspendiert = true; });
      variantenOpsSchreiben(familie.map(x => ['merge', x, { suspendiert: true }]), 'Problemkarte aussetzen');
    }
    toast(`„${frageText(k).slice(0, 40)}“ ist ${zaehlerNeu}× durchgefallen und ruht jetzt. ` +
      'Unter Karten → Problemkarten kannst du sie umformulieren.', 'fehler');
    s.problemkarten = (s.problemkarten || 0) + 1;
  }

  /* Stufe 6: Was nicht saß, wandert in die Lernbox statt nur neu terminiert
     zu werden. Entscheidend ist die Reihenfolge — FSRS hat oben bereits die
     ECHTE Bewertung bekommen. Die Lernbox liegt darüber und fasst den
     Terminplan nicht an; sonst hielte der Scheduler eine mühsam erarbeitete
     Karte für leicht. */
  if (lernboxAn() && (rating === 1 || (rating === 2 && lernboxAuchSchwer()))
      && !patch.suspendiert && !k.suspendiert) {
    if (inLernboxLegen(k, 'In die Lernbox')) s.inLernbox = (s.inLernbox || 0) + 1;
  }

  s.zaehler[rating]++; s.bewertet++; s.sekunden += sekunden;
  s.proDeck[k.deckId] = (s.proDeck[k.deckId] || 0) + 1;
  tagesstatistikSchreiben(rating, sekunden, k.deckId, warNeu);
  streakPflegen();

  sprechenStoppen();
  s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
  kartenZustandLeeren(s);
  malSitzung();
}

function tagesstatistikSchreiben(rating, sekunden, deckId, warNeu) {
  const tag = heute();
  schreibe(FB.setDoc(FB.doc(colReviews(), tag), {
    datum: tag,
    anzahl: FB.increment(1),
    neu: FB.increment(warNeu ? 1 : 0),
    sekunden: FB.increment(sekunden),
    bewertungen: { [rating]: FB.increment(1) },
    proDeck: { [deckId]: FB.increment(1) },
    sekundenProDeck: { [deckId]: FB.increment(sekunden) }
  }, { merge: true }), 'Tagesstatistik');
  S.reviewsGeladen = false;
}

function streakPflegen() {
  const tag = heute();
  const e = S.einstellungen;
  if (e.lastLearnDate === tag) return;
  const neuerStreak = e.lastLearnDate === plusTage(tag, -1) ? (Number(e.streak) || 0) + 1 : 1;
  e.lastLearnDate = tag; e.streak = neuerStreak;
  schreibe(FB.setDoc(refEinstellungen(),
    { lastLearnDate: tag, streak: neuerStreak }, { merge: true }), 'Streak');
}

function sitzungBeenden(still) {
  sprechenStoppen();
  if (!sitzung) return;
  if (still) { sitzung = null; letzteSitzung = null; return; }
  sitzung.aktiv = false;
  malAbschluss();
}

function malAbschluss() {
  const s = sitzung || letzteSitzung;
  if (!s) return malLernen();
  s.aktiv = false;
  letzteSitzung = s;
  sitzung = null;
  heutigeStatistikLaden();   // im Hintergrund auffrischen, für den Ring auf dem Startbildschirm
  // Einmal ermitteln und an der Sitzung merken: malAbschluss() wird beim
  // Stehenbleiben des Bildschirms erneut aufgerufen, und abzeichenFeiern()
  // liefert beim zweiten Mal nichts mehr.
  if (!s.neueAbzeichen) s.neueAbzeichen = abzeichenFeiern();
  const min = Math.max(1, Math.round(s.sekunden / 60));
  const proKarte = s.bewertet ? (s.sekunden / s.bewertet).toFixed(1) : '0';
  const offenN = s.gesamt - s.bewertet;

  $('#seite-lernen').innerHTML = `
    <div style="text-align:center;padding:26px 0">
      <div style="font-size:44px;line-height:1">🎉</div>
      <h1 style="margin-top:12px">${offenN ? 'Sitzung beendet' : 'Sitzung abgeschlossen!'}</h1>
      <p class="muted">${s.bewertet} von ${s.gesamt} ${
        s.gesamt === 1 ? 'Karte' : 'Karten'} bewertet${offenN ? ` · ${offenN} offen` : ''}</p>
    </div>
    ${s.neueAbzeichen?.length ? `<div class="box" style="text-align:center">
      <h2 style="margin-bottom:10px">${s.neueAbzeichen.length === 1 ? 'Neues Abzeichen' : 'Neue Abzeichen'}</h2>
      <div class="abzeichen-reihe" style="justify-content:center">
        ${s.neueAbzeichen.map(a => abzeichenHtml(a)).join('')}</div>
    </div>` : ''}
    <div class="kennzahlen">
      <div class="kennzahl"><b>${s.bewertet}</b><span>${s.bewertet === 1 ? 'Karte' : 'Karten'}</span></div>
      <div class="kennzahl"><b>${min}</b><span>Minuten</span></div>
      <div class="kennzahl"><b>${proKarte}s</b><span>pro Karte</span></div>
      <div class="kennzahl"><b>${S.einstellungen.streak || 0}</b><span>${tageWort(S.einstellungen.streak || 0)} Streak</span></div>
    </div>
    <div class="box mt">
      ${[1, 2, 3, 4].map(r => {
        const n = s.zaehler[r], p = s.bewertet ? Math.round(n / s.bewertet * 100) : 0;
        const farbe = ['var(--bewertung-1)', 'var(--bewertung-2)', 'var(--bewertung-3)', 'var(--bewertung-4)'][r - 1];
        /* Vorher: `t.slice(0, 6) + '.'` — das ergab „1 Nicht .“, „3 Gewuss.“
           und „4 Sehr l.“. Die Namen stehen jetzt ganz da, die Beschriftung
           ist dafür eine Spur breiter. */
        const t = ['Nicht gewusst', 'Schwer', 'Gewusst', 'Sehr leicht'][r - 1];
        return `<div class="balken bew-balken"><span class="lab">${r} ${t}</span>
          <span class="spur"><span class="fuell" style="width:${p}%;background:${farbe}"></span></span>
          <span class="val">${n}</span></div>`;
      }).join('')}
    </div>
    ${s.uebrigeNeue ? `<p class="mini mt" style="text-align:center">
      ${s.uebrigeNeue} weitere neue ${s.uebrigeNeue === 1 ? 'Karte wartet' : 'Karten warten'} —
      Tagesgrenze für neue Karten erreicht.</p>` : ''}
    ${s.zurueckgestellt ? `<p class="mini mt" style="text-align:center">
      ${s.zurueckgestellt} ${s.zurueckgestellt === 1 ? 'Abfrage' : 'Abfragen'} zurückgestellt:
      weitere Lücken bzw. die Gegenrichtung von Karten, die heute schon dran waren.
      Sie kommen beim nächsten Mal.</p>` : ''}
    ${lernboxAn() && lernboxKarten().length >= LERNBOX_VOLL ? `<div class="hinweis rot mt">
      <strong>Die Lernbox ist voll (${LERNBOX_VOLL} Karten).</strong>
      Weitere Karten wandern vorerst nicht mehr hinein — sie werden ganz normal
      neu terminiert. Räum die Box ein Stück leer, dann geht es weiter.
      <div style="margin-top:8px"><button class="btn klein primary" data-tu="zurLernbox">
        Zur Lernbox</button></div></div>` : ''}
    ${s.inLernbox ? `<div class="hinweis blau mt">
      <strong>${s.inLernbox} ${s.inLernbox === 1 ? 'Karte liegt' : 'Karten liegen'} jetzt in der
      Lernbox</strong> — sie saßen noch nicht. Der wirksamste Zeitpunkt zum Üben ist
      <em>jetzt gleich</em>: Innerhalb derselben Sitzung mit Abstand abzurufen ist genau
      der Teil, der beim bloßen Neuterminieren fehlt.
      <div style="margin-top:8px"><button class="btn klein primary" data-tu="zurLernbox">
        Jetzt üben</button></div></div>` : ''}
    ${s.problemkarten ? `<div class="hinweis mt">
      <strong>${s.problemkarten} ${s.problemkarten === 1 ? 'Karte wurde' : 'Karten wurden'}
      als Problemkarte ausgesetzt</strong>, weil sie immer wieder durchfallen.
      Umformulieren hilft mehr als weiter üben.
      <div style="margin-top:8px"><button class="btn klein" data-tu="zuProblemkarten">
        Problemkarten ansehen</button></div></div>` : ''}
    <div class="row mt2" style="justify-content:center">
      <button class="btn primary" data-tu="nochmal">Zur Übersicht</button>
      <button class="btn" data-tu="zuStatistik">Statistik ansehen</button>
    </div>`;
  verdrahten($('#seite-lernen'));
}

/* ---------- 9c. Lernbox: Übersicht und Übungssitzung (Stufe 6) ---------- */

/* Der Zustand einer laufenden Übungssitzung. Bewusst getrennt von `sitzung`:
   Die beiden haben verschiedene Abläufe (Kriterium statt Bewertung,
   Stufen statt Umdrehen) und dürfen sich nicht gegenseitig beenden — man
   kann zwischen Karteikasten und Lernbox hin- und herwechseln, ohne dass
   eines von beidem verlorengeht. */
let uebung = null;
let uebungZuletzt = null;

const LERNBOX_STAPEL_MAX = 12;

/** Die nächste Karte nach der Abstandsregel.
 *  Der Wirkstoff des Verfahrens ist der Abstand, nicht die Wiederholung:
 *  Eine Karte unmittelbar noch einmal zu fragen misst das
 *  Kurzzeitgedächtnis. Deshalb wird die erste Karte genommen, die zuletzt
 *  NICHT dran war. Reicht der Stapel dafür nicht (am Ende bleibt eine
 *  einzelne Karte übrig), wird die Regel gelockert — sonst käme man nie zum
 *  Schluss. */
function uebungNaechste(u) {
  /* Tote Kennungen zuerst aussortieren. Ohne das lief die Runde in eine
     Endlosrekursion: uebungWeiter -> malUebungsKarte -> uebungWeiter, weil
     der Rückfall `u.stapel[0]` immer wieder dieselbe gelöschte Karte
     lieferte. Ausgelöst hat das jedes Löschen am zweiten Gerät, das
     Löschen eines Kastens und jeder Import mit „Ersetzen“ —
     `RangeError: Maximum call stack size exceeded`, Runde tot. */
  u.stapel = u.stapel.filter(id => S.cards.some(k => k.id === id));
  if (!u.stapel.length) return null;
  const sperre = u.zuletzt.slice(-lernboxAbstand());
  const frei = u.stapel.filter(id => !sperre.includes(id));
  /* NICHT immer der vorderste freie Eintrag: Damit rotierten bei zwölf
     Karten und Abstand 2 nur drei — neun kamen in 24 Durchgängen nie dran,
     während der Balken „0 / 12 geschafft" zeigte und die Übersicht „12 Karten
     üben" versprochen hatte. Genommen wird jetzt der, der am längsten nicht
     dran war; unter gleich alten entscheidet die Stapelreihenfolge. */
  const auswahl = frei.length ? frei : u.stapel;
  if (auswahl.length < 2) return auswahl[0];
  const alter = id => {
    const i = u.zuletzt.lastIndexOf(id);
    return i < 0 ? -1 : i;                       // nie gezeigt zuerst
  };
  return auswahl.slice().sort((a, b) => alter(a) - alter(b))[0];
}

/* Vor jeder Runde aufräumen. Zwei Fälle, die sonst still hängen bleiben:

   1. Wer das Kriterium von drei auf eins senkt, hat Karten mit Stand 1 oder
      2 in der Box, die es längst erfüllen. Vorher blieben sie liegen, und
      die Anzeige behauptete „1 / 1 Treffer“.
   2. Ein Treffer von vorgestern ist kein Treffer „mit Abstand“, sondern ein
      Treffer aus einer anderen Sitzung. Erlaubt ist ein angefangener Stand
      deshalb nur am selben Tag; danach beginnt die Karte wieder bei null.
      Das ist der Kern des Verfahrens — sonst sammelt sich über Wochen ein
      halber Treffer je Karte an und das Kriterium verliert seine Bedeutung. */
function lernboxAufraeumen() {
  const krit = lernboxKriterium();
  lernboxKarten().forEach(k => {
    /* Ein Stand ohne `uebungTag` (aus einer Sicherung) verfiel nie und ließ
       die Karte nach EINEM Treffer aus der Box. */
    const stand = Number(k.uebung) || 0;
    if (stand >= krit) return ausLernboxNehmen(k, 'Kriterium bereits erfüllt');
    if (stand > 0 && k.uebungTag && k.uebungTag !== heute()) {
      const patch = { uebung: 0 };
      Object.assign(k, patch);
      schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), 'Übungsstand erneuern');
    }
  });
}

/** Startet eine Übungssitzung über die Lernbox eines oder aller Kästen. */
async function lernboxStarten(deckId) {
  if (uebung?.aktiv) return malLernbox();
  lernboxAufraeumen();
  const filter = deckId && deckId !== 'alle' ? new Set([deckId]) : null;
  let karten = lernboxKarten(filter);

  /* Neue Karten werden erst beim Start übernommen, nicht schon beim
     Anzeigen. Sonst stünden nach einem Blick auf die Seite Dutzende Karten
     dauerhaft in der Box, auch wenn gar nicht geübt wurde. */
  if (lernboxNeueAn() && karten.length < LERNBOX_STAPEL_MAX) {
    await Promise.race([
      heutigeStatistikLaden(),
      new Promise(r => setTimeout(r, 3000))
    ]);
    const frei = Math.min(lernboxNeueFrei(), LERNBOX_STAPEL_MAX - karten.length);
    if (frei > 0) {
      /* Je Familie nur EINE Abfrage einführen. Vorher landeten bei
         „beide Richtungen" Vorwärts- und Rückwärtsabfrage beide in der Box
         und beide auf dem Tagesdeckel — gemessen: 12 Karten in der Box für
         8 Vokabeln, 12 auf den Deckel gebucht, geübt wurden 8. */
      const gesehen = new Set();
      const kandidaten = mischen(lernboxNeueKandidaten(filter)).filter(k => {
        const f = k.quelleId || k.id;
        if (gesehen.has(f)) return false;
        gesehen.add(f); return true;
      });
      const neue = kandidaten.slice(0, frei);
      neue.forEach(k => inLernboxLegen(k, 'Neue Karte einführen'));
      karten = karten.concat(neue);
      /* Eingeführte Karten auf das Tagespensum buchen. Ohne diese Zeilen
         führte die Lernbox bei einem Deckel von 20 in drei Runden 30 Karten
         ein — sie las `S.heutigeNeu`, das nur der Karteikasten füllte. */
      if (neue.length) {
        S.heutigeNeu = (Number(S.heutigeNeu) || 0) + neue.length;
        schreibe(FB.setDoc(FB.doc(colReviews(), heute()),
          { datum: heute(), neu: FB.increment(neue.length) }, { merge: true }),
          'Neue Karten eingeführt');
        S.reviewsGeladen = false;
      }
    }
  }

  if (!karten.length) return toast('Die Lernbox ist leer.');

  /* Je Kartenfamilie nur EINE Abfrage pro Runde. Bei „beide Richtungen“
     lagen sonst Vorwärts- und Rückwärtsabfrage im selben Stapel — und weil
     die eine die Antwort der anderen ist, sah die Runde so aus:
     Haus | house | Haus | house. Acht Tipper für eine einzige Vokabel, und
     der Abstand war keiner mehr. Der Karteikasten stellt Geschwister aus
     demselben Grund zurück. */
  const familien = new Set();
  const einzeln = mischen(karten).filter(k => {
    const f = k.quelleId || k.id;
    if (familien.has(f)) return false;
    familien.add(f); return true;
  });
  const zurueckgestellt = karten.length - einzeln.length;

  /* Gemischt, aber gedeckelt: Zwölf Karten sind schon viel für eine
     Übungsrunde — jede kommt mindestens zweimal dran, oft öfter. Was
     darüber liegt, bleibt für die nächste Runde liegen. */
  const stapel = einzeln.slice(0, LERNBOX_STAPEL_MAX);
  uebung = {
    aktiv: true,
    deckId: deckId || 'alle',
    /* Der Filter gehört an die Runde: Wird eine Karte mitten in der Runde in
       einen anderen Kasten verschoben, gehört sie nicht mehr dazu. */
    deckFilter: filter,
    stapel: stapel.map(k => k.id),
    zuletzt: [],
    aktuell: null,
    stufe: 'frage',
    urteil: null,
    treffer: 0,          // erreichte Treffer in dieser Runde
    versuche: 0,
    fertig: 0,           // Karten, die die Box verlassen haben
    gesamt: stapel.length,
    zurueckgestellt,     // Geschwisterabfragen, die auf die nächste Runde warten
    sekunden: 0,
    kartenStart: Date.now(),
    proDeck: {}
  };
  uebung.aktuell = uebungNaechste(uebung);
  seiteZeigen('ueben');
}

/** Eine Antwort in der Übungssitzung bewerten.
 *  `konnte` kommt entweder aus der Selbstauskunft oder aus der
 *  automatischen Auswertung beim Tippen. */
/* Zwei Treffer „mit Abstand" setzen voraus, dass etwas dazwischenliegt. Liegt
   nur EINE Karte im Stapel, gibt es diesen Abstand innerhalb der Runde nicht:
   Gemessen erfüllten zwei Tipper in 0,9 Sekunden das Kriterium — genau der
   Fall, wenn im Karteikasten eine einzige Karte durchfällt.
   Die Karte einfach hierzubehalten hilft nicht (dann steht sie zweihundert
   Mal hintereinander da). Richtig ist der zweite Teil der Methode: Abstand
   ÜBER Sitzungen hinweg. Die Runde endet, die Karte behält ihren Stand und
   schafft es beim nächsten Mal. */

function uebungBewerten(konnte) {
  const u = uebung;
  if (!u?.aktiv || !u.aktuell) return;
  const k = S.cards.find(x => x.id === u.aktuell);
  if (!k) {
    // Auf einem anderen Gerät gelöscht.
    u.stapel = u.stapel.filter(id => id !== u.aktuell);
    return uebungWeiter(u);
  }
  /* Auf einem anderen Gerät ausgesetzt oder in einen anderen Kasten
     verschoben: Dann gehört die Karte nicht mehr in diese Runde. Vorher
     wurde ihr weiter ein Übungsstand geschrieben, und beim Wiederaufnehmen
     war er da — dasselbe, was bewerten() bei Problemkarten verhindert. */
  if (k.suspendiert || (u.deckFilter && !u.deckFilter.has(k.deckId))) {
    u.stapel = u.stapel.filter(id => id !== u.aktuell);
    toast('Diese Karte gehört nicht mehr in diese Runde — sie wird übersprungen.');
    return uebungWeiter(u);
  }
  /* Doppeltipp-Sperre wie im Karteikasten. Ohne sie landete der zweite Tipp
     auf der NÄCHSTEN Karte — gemessen: eine nie gezeigte Karte bekam einen
     Treffer, und beim ungünstigen Layout (nach dem Aufdecken liegt „Konnte
     ich nicht“ genau dort, wo eben „Antwort zeigen“ war) fiel ein
     erarbeiteter Stand von 1 auf 0 zurück. Auf dem Handy passiert das
     ständig. */
  if (u.zuletztBewertet && Date.now() - u.zuletztBewertet < 350) return;
  u.zuletztBewertet = Date.now();

  const rohSekunden = Math.round((Date.now() - u.kartenStart) / 1000);
  const sekunden = rohSekunden >= 0 && rohSekunden < 300 ? rohSekunden : 0;
  u.sekunden += sekunden;
  u.proDeck[k.deckId] = (u.proDeck[k.deckId] || 0) + sekunden;
  u.versuche++;

  const vorher = Number(k.uebung) || 0;
  /* Kriterium heißt Kriterium: Ein Fehlversuch setzt den Zählstand zurück,
     er zieht ihn nicht bloß um eins ab. Sonst könnte eine Karte die Box
     verlassen, ohne sie je zweimal hintereinander gekonnt zu haben. */
  const neu = konnte ? vorher + 1 : 0;

  /* Kein Abstand möglich: Wenn dieselbe Karte gerade eben dran war und keine
     andere dazwischenlag, ist der Treffer kein Treffer „mit Abstand". */
  const ohneAbstand = u.letzteKarte === k.id;
  u.letzteKarte = k.id;

  if (konnte && neu >= lernboxKriterium() && ohneAbstand) {
    /* Der Stand wird gutgeschrieben, die Karte bleibt aber in der Box und die
       Runde endet: Der zweite Treffer gehört in die nächste Sitzung. */
    const patch = { uebung: neu, uebungTag: heute() };
    Object.assign(k, patch);
    schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), 'Übungsstand');
    u.treffer++;
    toast('Gut. Diese Karte kommt beim nächsten Mal noch einmal — ' +
          'mit Abstand sitzt sie besser.');
    return uebungBeenden();
  }

  if (konnte && neu >= lernboxKriterium()) {
    ausLernboxNehmen(k, 'Lernbox geschafft');
    u.stapel = u.stapel.filter(id => id !== k.id);
    u.fertig++;
    u.treffer++;
    toast(`„${frageText(k).slice(0, 32)}“ sitzt.`);
  } else {
    const patch = { uebung: neu, uebungTag: heute() };
    Object.assign(k, patch);
    schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), 'Übungsstand');
    if (konnte) u.treffer++;
  }

  uebungStatistikSchreiben(sekunden, k.deckId);
  streakPflegen();
  uebungWeiter(u);
}

function uebungWeiter(u) {
  u.zuletzt.push(u.aktuell);
  if (u.zuletzt.length > 20) u.zuletzt.shift();
  u.aktuell = uebungNaechste(u);
  u.stufe = 'frage';
  u.urteil = null;
  u.kartenStart = Date.now();
  if (!u.aktuell) {
    u.aktiv = false;
    uebungZuletzt = u;
    uebung = null;
  }
  malLernbox();
}

function uebungBeenden() {
  if (!uebung) return;
  uebung.aktiv = false;
  uebungZuletzt = uebung;
  uebung = null;
  malLernbox();
}

/** Eigene Zähler für die Tagesstatistik.
 *  Die Übungszeit ist echte Lernzeit und gehört in den Zielring — die
 *  Übungsdurchgänge sind aber KEINE Abfragen und dürfen `anzahl`,
 *  `bewertungen` und `proDeck` nicht aufblähen. Sonst zeigte die Statistik
 *  nach einer Übungsrunde dreimal so viele „Abfragen“ wie tatsächlich
 *  terminwirksam stattgefunden haben. */
/** Summe der Übungsdurchgänge und -zeit über den geladenen Zeitraum.
 *  Die Zahlen wurden bisher geschrieben und nirgends gezeigt — bei fast
 *  doppelt so vielen Tippvorgängen ist das die falsche Bilanz. */
function uebungSummen() {
  return (S.reviews || []).reduce((a, r) => ({
    durchgaenge: a.durchgaenge + (Number(r.uebungen) || 0),
    sekunden: a.sekunden + (Number(r.uebungSekunden) || 0)
  }), { durchgaenge: 0, sekunden: 0 });
}

function uebungStatistikSchreiben(sekunden, deckId) {
  const tag = heute();
  schreibe(FB.setDoc(FB.doc(colReviews(), tag), {
    datum: tag,
    uebungen: FB.increment(1),
    uebungSekunden: FB.increment(sekunden),
    sekunden: FB.increment(sekunden),
    sekundenProDeck: { [deckId]: FB.increment(sekunden) }
  }, { merge: true }), 'Übungsstatistik');
  S.reviewsGeladen = false;
}
