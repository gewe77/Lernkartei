<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lernkartei 2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231B9AAA'/><rect x='22' y='30' width='56' height='40' rx='6' fill='white'/><rect x='30' y='22' width='56' height='40' rx='6' fill='white' opacity='.55'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">
<style>
/* ===== Design-Tokens =====================================================
   KONZEPT §8: türkiser Akzent, warmes Orange für Fälligkeiten, eigene
   Bewertungsfarben 1–4. Alte Namen (--red/--orange/--green/--blue) bleiben
   als Aliase erhalten, damit nicht jede Fundstelle einzeln angefasst werden
   musste — sie zeigen jetzt auf die neuen Tokens. Einzige Ausnahme: die
   Bewertungsknöpfe (.bew1–4) und die Auswertungsfarben in malAbschluss()
   referenzieren --bewertung-1..4 direkt, weil --blue (jetzt Akzent-Türkis)
   und --bewertung-4 (Blau) zwei bewusst verschiedene Farben sind.
   ======================================================================== */
:root{
  --bg:#fff; --bg2:#f5f4f0; --bg3:#eeecea;
  --txt:#1a1a1a; --txt2:#555; --txt3:#888;
  --border:rgba(0,0,0,.12); --border2:rgba(0,0,0,.22);

  --akzent:#1B9AAA; --akzent-bg:#e3f3f4;
  --faellig:#F2994A; --faellig-bg:#fdeee0;
  --bewertung-1:#E2584D; --bewertung-1-bg:#fcebea;
  --bewertung-2:#F2994A; --bewertung-2-bg:#fdeee0;
  --bewertung-3:#27AE60; --bewertung-3-bg:#e3f6ec;
  --bewertung-4:#2D7FF9; --bewertung-4-bg:#e5effe;

  /* Alt-Namen — bewusst als Alias, siehe Kommentar oben */
  --red:var(--bewertung-1);   --red-bg:var(--bewertung-1-bg);
  --orange:var(--faellig);    --orange-bg:var(--faellig-bg);
  --green:var(--bewertung-3); --green-bg:var(--bewertung-3-bg);
  --blue:var(--akzent);       --blue-bg:var(--akzent-bg);

  --radius:16px; --radius2:var(--radius);
  --schatten:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --font:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
html[data-theme="dark"]{
  --bg:#1e1e1e; --bg2:#262626; --bg3:#323232;
  --txt:#ececec; --txt2:#b3b3b3; --txt3:#8a8a8a;
  --border:rgba(255,255,255,.14); --border2:rgba(255,255,255,.28);

  --akzent:#3dbbcb; --akzent-bg:#16333a;
  --faellig:#f5ac69; --faellig-bg:#3a2e1b;
  --bewertung-1:#ea7267; --bewertung-1-bg:#3b2321;
  --bewertung-2:#f5ac69; --bewertung-2-bg:#3a2e1b;
  --bewertung-3:#4fcb89; --bewertung-3-bg:#173828;
  --bewertung-4:#5b9bfb; --bewertung-4-bg:#1d2c3c;

  --schatten:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--txt);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0 0 12px;line-height:1.25}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
p{margin:0 0 10px}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px;flex:1;min-width:0}
.muted{color:var(--txt2)}
.mini{font-size:13px;color:var(--txt3)}
.mt{margin-top:18px}.mt2{margin-top:28px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--border);margin:22px 0}

/* ===== Bedienelemente =================================================== */
button{font:inherit;cursor:pointer}
.btn{
  border:1px solid var(--border2);background:var(--bg);color:var(--txt);
  border-radius:var(--radius);padding:9px 15px;font-size:14px;font-weight:500;
  transition:background .12s,transform .06s,border-color .12s;
}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.btn.primary:hover{opacity:.87;background:var(--txt)}
.btn.klein{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.gefahr{color:var(--red);border-color:var(--red)}
.btn.gefahr:hover{background:var(--red-bg)}
.btn.breit{width:100%;justify-content:center}
.btn.gross{padding:13px 22px;font-size:16px}
input,textarea,select{
  font:inherit;font-size:14px;background:var(--bg);color:var(--txt);
  border:1px solid var(--border2);border-radius:var(--radius);padding:9px 11px;width:100%;
}
input[type=checkbox],input[type=radio],input[type=range]{width:auto;accent-color:var(--akzent)}
input[type=range]{width:100%;padding:0}
textarea{resize:vertical;min-height:76px;line-height:1.45}
label.feld{display:block;margin-bottom:12px}
label.feld > span{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:4px}
.karo{display:flex;gap:8px;align-items:center;padding:7px 0;cursor:pointer}
.karo input{flex:none}

/* ===== Navigation: Seitenleiste (Desktop) / Bottom-Bar (Mobil) ========== */
#app{display:flex;min-height:100vh}
#topbar-mobil{
  display:none;position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);padding:12px 16px;
}
#seitenleiste{
  position:sticky;top:0;align-self:flex-start;height:100vh;
  width:220px;flex:none;display:flex;flex-direction:column;gap:4px;
  padding:20px 14px;border-right:1px solid var(--border);background:var(--bg);
}
.sl-marke{font-weight:800;font-size:17px;padding:0 10px 14px;white-space:nowrap}
.marke{font-weight:700;font-size:15px;white-space:nowrap}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{
  display:flex;align-items:center;gap:10px;
  border:0;background:transparent;color:var(--txt2);padding:10px 12px;
  border-radius:var(--radius);font-size:14.5px;font-weight:500;text-align:left;width:100%;
}
nav button:hover{background:var(--bg2);color:var(--txt)}
nav button.aktiv{background:var(--akzent-bg);color:var(--akzent);font-weight:700}
.nav-ico{font-size:16px;flex:none;line-height:1}
.statuszeile{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--txt3);white-space:nowrap;padding:10px 12px}
.punkt{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex:none}
.punkt.ok{background:var(--green)}
.punkt.warte{background:var(--orange)}
.punkt.aus{background:var(--txt3)}
.punkt.fehler{background:var(--red)}

/* ===== Karten / Listen ================================================== */
.box{
  border:1px solid var(--border);border-radius:var(--radius2);
  padding:16px 18px;background:var(--bg);margin-bottom:12px;
}
.box.flach{background:var(--bg2);border-color:transparent}
.liste-item{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:8px;background:var(--bg);
}
.liste-item .haupt{flex:1;min-width:0}
.liste-item .frage{font-weight:600;word-break:break-word}
.liste-item .antwort{color:var(--txt2);font-size:13.5px;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.liste-item .werkzeuge{display:flex;gap:5px;flex:none}
.badge{
  display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;
  border-radius:99px;background:var(--bg3);color:var(--txt2);white-space:nowrap;
}
.badge.faellig{background:var(--orange-bg);color:var(--orange)}
.badge.neu{background:var(--blue-bg);color:var(--blue)}
.badge.ruht{background:var(--bg3);color:var(--txt3)}
.punkt-farbe{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px}
.leer{text-align:center;color:var(--txt3);padding:36px 16px;font-size:14px}

/* ===== Startbildschirm (Dashboard) ======================================= */
.dash-kopf{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.dash-ring{position:relative;width:112px;height:112px;flex:none}
.dash-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.dash-ring circle{fill:none;stroke-width:10}
.dash-ring .spur{stroke:var(--bg3)}
.dash-ring .fuell{stroke:var(--akzent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.dash-ring-mitte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dash-ring-mitte b{font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.dash-ring-mitte span{font-size:10.5px;color:var(--txt3)}
.dash-kennzahlen{display:flex;gap:22px;flex-wrap:wrap}
.dash-kennzahl b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.dash-kennzahl span{font-size:12px;color:var(--txt2)}

.dash-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.dash-deck{
  border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg);
  cursor:pointer;transition:border-color .12s,background .12s;text-align:left;font:inherit;color:inherit;
}
.dash-deck:hover{background:var(--bg2)}
.dash-deck.gewaehlt{border-color:var(--akzent);background:var(--akzent-bg)}
.dash-deck .dd-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dash-deck .dd-faellig{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--faellig)}
.dash-deck .dd-rest{font-size:11.5px;color:var(--txt3);margin-top:2px}

.dash-fachleiste{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--bg3);margin:10px 0 4px}
.dash-fachleiste > div{height:100%}
.dash-fach-legende{display:flex;justify-content:space-between;font-size:10.5px;color:var(--txt3)}

/* ===== Lernen =========================================================== */
.flip-buehne{perspective:1400px;margin:14px 0}
.flip-karte{
  position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.15,.2,1);
  min-height:230px;
}
.flip-karte.gedreht{transform:rotateY(180deg)}
.flip-seite{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--border2);border-radius:var(--radius2);background:var(--bg);
  padding:26px 22px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;overflow:auto;box-shadow:var(--schatten);
}
.flip-seite.hinten{transform:rotateY(180deg);background:var(--bg2)}
.flip-text{font-size:20px;font-weight:600;white-space:pre-wrap;word-break:break-word;max-width:100%}
.flip-seite.hinten .flip-text{font-weight:500}
.flip-notiz{margin-top:14px;font-size:13.5px;color:var(--txt2);white-space:pre-wrap;
  border-top:1px solid var(--border);padding-top:10px;max-width:100%}
.flip-kopf{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 14px;font-size:11.5px;color:var(--txt3);font-weight:600}
.fortschritt{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.fortschritt > div{height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
.bewertung{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.bew{
  border:1px solid;border-radius:var(--radius);padding:11px 6px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .06s,background .12s;
}
.bew:active{transform:scale(.96)}
.bew b{font-size:17px;line-height:1.1}
.bew span{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.bew small{font-size:10.5px;color:var(--txt3);font-weight:500}
.bew1{color:var(--bewertung-1);border-color:var(--bewertung-1)} .bew1:hover{background:var(--bewertung-1-bg)}
.bew2{color:var(--bewertung-2);border-color:var(--bewertung-2)} .bew2:hover{background:var(--bewertung-2-bg)}
.bew3{color:var(--bewertung-3);border-color:var(--bewertung-3)} .bew3:hover{background:var(--bewertung-3-bg)}
.bew4{color:var(--bewertung-4);border-color:var(--bewertung-4)} .bew4:hover{background:var(--bewertung-4-bg)}
.tastenhilfe{font-size:12px;color:var(--txt3);text-align:center;margin-top:12px}
kbd{
  font-family:var(--font);font-size:11px;border:1px solid var(--border2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--txt2);background:var(--bg2);
}

/* ===== Statistik ======================================================== */
.kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kennzahl{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg)}
.kennzahl b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kennzahl span{font-size:12.5px;color:var(--txt2)}
.balken{display:flex;align-items:center;gap:9px;margin-bottom:5px;font-size:13px}
.balken .lab{width:62px;flex:none;color:var(--txt2);font-variant-numeric:tabular-nums}
.balken .spur{display:block;flex:1;height:17px;background:var(--bg3);border-radius:5px;overflow:hidden}
/* display:block ist zwingend — als inline-Element würde das span Breite und
   Höhe schlicht ignorieren und der Balken bliebe unsichtbar. */
.balken .fuell{display:block;height:100%;background:var(--blue);border-radius:5px;min-width:2px;transition:width .3s}
.balken .val{width:44px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2)}
.tage{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px}
.tage > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.tage .saeule{width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.tage .saeule.null{background:var(--bg3)}
.tage .tag{font-size:10px;color:var(--txt3);white-space:nowrap}
table.daten{width:100%;border-collapse:collapse;font-size:14px}
table.daten th,table.daten td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
table.daten th{font-size:12px;color:var(--txt2);font-weight:600}
table.daten td.num,table.daten th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ===== Modal / Toast / Overlays ========================================= */
#modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#modal{
  background:var(--bg);border-radius:var(--radius2);width:100%;max-width:480px;
  max-height:88vh;overflow:auto;padding:20px;box-shadow:0 12px 48px rgba(0,0,0,.3);
}
#modal h2{margin-bottom:14px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{
  /* Versteckt = eigene Höhe + 120px nach unten: garantiert außerhalb des
     Bildes, egal ob bottom 26px (Desktop) oder 74px (über der Bottom-Bar
     auf Mobil) — mit festen 140% lugte oben ein Streifen hervor. */
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 120px));
  background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:99px;
  font-size:14px;font-weight:500;z-index:200;transition:transform .25s;
  max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--schatten);
}
#toast.an{transform:translate(-50%,0)}
#toast.fehler{background:var(--red);color:#fff}
#boot,#fatal,#login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:60;padding:20px;
}
#boot{flex-direction:column;gap:14px;color:var(--txt2)}
.spinner{
  width:26px;height:26px;border:3px solid var(--border2);border-top-color:var(--blue);
  border-radius:50%;animation:dreh .8s linear infinite;
}
@keyframes dreh{to{transform:rotate(360deg)}}
#fatal,#login{overflow:auto;align-items:flex-start}
.mittig{width:100%;max-width:430px;margin:auto;padding:24px 0}
#fatal .mittig{max-width:640px}
.hinweis{
  border:1px solid var(--border);border-left:3px solid var(--orange);
  background:var(--orange-bg);color:var(--txt);border-radius:8px;padding:11px 13px;font-size:13.5px;
}
.hinweis.rot{border-left-color:var(--red);background:var(--red-bg)}
.hinweis.blau{border-left-color:var(--blue);background:var(--blue-bg)}
.hinweis code{font-size:12.5px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;word-break:break-all}
html[data-theme="dark"] .hinweis code{background:rgba(255,255,255,.1)}
pre.code{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px;
  font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:220px;
}
[hidden]{display:none !important}

@media(max-width:900px){
  #app{display:block}
  #topbar-mobil{display:flex;align-items:center;padding:12px 16px}
  #seitenleiste{
    position:fixed;top:auto;bottom:0;left:0;right:0;z-index:40;
    width:auto;height:auto;flex-direction:row;align-items:center;
    padding:6px 6px env(safe-area-inset-bottom);gap:0;
    border-right:0;border-top:1px solid var(--border);
  }
  .sl-marke{display:none}
  nav{flex-direction:row;gap:1px}
  nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;padding:7px 2px;
    font-size:11px;text-align:center;justify-content:center;border-radius:10px}
  .nav-txt{font-size:10.5px}
  .nav-ico{font-size:17px}
  .statuszeile{flex:none;padding:0 6px}
  #status-text{display:none}
  #toast{bottom:74px}
  .wrap{padding:14px 12px 84px}
  .bew span{font-size:10.5px}
  .bew small{display:none}
  .flip-text{font-size:18px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation-duration:.01ms !important}
  .flip-karte{transition:none !important}
}
</style>
</head>
<body>

<!-- ===== Ladeindikator ================================================= -->
<div id="boot">
  <div class="spinner"></div>
  <div id="boot-text">Lernkartei wird geladen …</div>
</div>

<!-- ===== Harter Fehler (Konfiguration/SDK) ============================= -->
<div id="fatal" hidden><div class="mittig">
  <h1>Lernkartei 2 startet nicht</h1>
  <div id="fatal-text"></div>
</div></div>

<!-- ===== Anmeldung ==================================================== -->
<div id="login" hidden><div class="mittig">
  <h1 style="margin-bottom:4px">Lernkartei 2</h1>
  <p class="mini" style="margin-bottom:22px">Anmeldung mit E-Mail und Passwort</p>
  <form id="login-form" autocomplete="on">
    <label class="feld"><span>E-Mail</span>
      <input type="email" id="login-mail" required autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
    </label>
    <label class="feld"><span>Passwort</span>
      <input type="password" id="login-pw" required autocomplete="current-password">
    </label>
    <div id="login-fehler" class="hinweis rot" hidden style="margin-bottom:12px"></div>
    <button class="btn primary breit gross" id="login-btn" type="submit">Anmelden</button>
  </form>
  <div class="row" style="justify-content:space-between;margin-top:14px">
    <button class="btn klein" id="login-reset" type="button">Passwort vergessen</button>
    <span class="mini" id="login-konten"></span>
  </div>
  <p class="mini mt2">
    Neue Konten werden ausschließlich in der Firebase-Konsole angelegt.
    Eine Registrierung in der App gibt es bewusst nicht.
  </p>
</div></div>

<!-- ===== App ========================================================== -->
<div id="app" hidden>
  <header id="topbar-mobil"><span class="marke">Lernkartei&nbsp;2</span></header>

  <div id="seitenleiste">
    <div class="sl-marke">Lernkartei&nbsp;2</div>
    <nav id="nav">

const $  = (s, w = document) => w.querySelector(s);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>

}

  const dunkelSystem = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
  const wirklich = wunsch === 'dunkel' ? 'dark'
                 : wunsch === 'hell'   ? 'light'
                 : (dunkelSystem ? 'dark' : 'light');
  document.documentElement.dataset.theme = wirklich;
}

/* ---------- 1. Konfiguration und SDK laden ------------------------------ */

      <div class="hinweis rot">Das Firebase-SDK konnte nicht geladen werden.</div>

          Aktuelle Nummer: <a href="https://firebase.google.com/docs/web/setup" target="_blank" rel="noopener">firebase.google.com/docs/web/setup</a></li>

  // 1c2. FSRS-Bibliothek (Stufe 2) — eigenständiges Bundle ohne Abhängigkeiten
  bootText('Lernalgorithmus wird geladen …');
  try {
    FSRS = await import('https://unpkg.com/ts-fsrs@5.4.1/dist/index.mjs');
  } catch (e) {
    return fatal(`
      <div class="hinweis rot">Die FSRS-Bibliothek (ts-fsrs) konnte nicht geladen werden.</div>
      <p class="mt">Versucht wurde <code>unpkg.com/ts-fsrs@5.4.1</code>. Mögliche Ursachen:</p>
      <ul><li>Keine Internetverbindung beim allerersten Start (danach läuft die App offline).</li>
      <li>Ein Inhaltsblocker verhindert den Zugriff auf unpkg.com.</li></ul>

  }

  // 1d. Initialisieren
  bootText('Verbindung wird hergestellt …');
  try {
    fbApp = FB.initializeApp(CFG);
    auth  = FB.getAuth(fbApp);
    db    = FB.initializeFirestore(fbApp, {
      localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() })
    });
  } catch (e) {
    return fatal(`
      <div class="hinweis rot">Firebase ließ sich nicht initialisieren.</div>
      <p class="mt">Meist stimmt ein Wert in <code>firebase-config.js</code> nicht.</p>
      <p class="mini">Technische Meldung: ${esc(e.message)}</p>`);
  }

  // Angemeldet bleiben, bis ausdrücklich abgemeldet wird
  try { await FB.setPersistence(auth, FB.browserLocalPersistence); } catch (_) {}

  loginVorbereiten();
  FB.onAuthStateChanged(auth, benutzerGewechselt);
}

let fbApp = null, auth = null, db = null;

/* ---------- 2. Zustand -------------------------------------------------- */

const STANDARD_INTERVALLE = [1, 3, 7, 14, 21, 30, 45, 60, 90, 120, 180, 365];

const STANDARD_EINSTELLUNGEN = () => ({

const S = {

  seite: 'lernen',
  bereitDecks: false, bereitCards: false, bereitSettings: false,

/* ---------- 3. Datum, Zufall, IDs -------------------------------------- */

function isoDatum(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
/** Heutiges Lerndatum. Tagesgrenze liegt lokal um TAGESGRENZE Uhr (KONZEPT §2):
 *  wer um 01:30 Uhr lernt, arbeitet noch am Vortag weiter. */
function heute() {
  const d = new Date();
  d.setHours(d.getHours() - TAGESGRENZE);
  return isoDatum(d);
}
/** Alles, was als Datum hereinkommt, auf YYYY-MM-DD zwingen. Fremde
 *  Sicherungen enthalten mitunter Zeitstempel als Zahl oder gar nichts —
 *  ein solcher Wert darf die Oberfläche nicht lahmlegen. */
function isoOder(v, ersatz) {
  if (typeof v === 'number' && Number.isFinite(v)) {
    const d = new Date(v);
    if (!isNaN(d.getTime())) return isoDatum(d);
  }
  if (v instanceof Date && !isNaN(v.getTime())) return isoDatum(v);
  if (v && typeof v === 'object' && typeof v.seconds === 'number') {   // Firestore-Timestamp
    const d = new Date(v.seconds * 1000);
    if (!isNaN(d.getTime())) return isoDatum(d);
  }
  const s = String(v ?? '').slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ersatz;
}
function plusTage(iso, n) {
  const [y, m, t] = isoOder(iso, heute()).split('-').map(Number);
  return isoDatum(new Date(y, m - 1, t + Number(n || 0)));
}
function tageDiff(isoA, isoB) {           // isoA - isoB in Tagen
  const p = s => {
    const [y, m, t] = isoOder(s, heute()).split('-').map(Number);
    return Date.UTC(y, m - 1, t);
  };
  return Math.round((p(isoA) - p(isoB)) / 86400000);
}
function datumDeutsch(iso) {
  const s = isoOder(iso, null);
  if (!s) return '—';
  const [y, m, t] = s.split('-');
  return `${t}.${m}.${y}`;
}
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
/** Firestore-Dokument-IDs dürfen kein "/" enthalten, nicht "." oder ".." sein
 *  und nicht dem Muster __xyz__ folgen. Alt-IDs werden entsprechend entschärft. */
function sichereId(roh) {
  let s = String(roh ?? '').replace(/\//g, '_').trim();
  if (!s || s === '.' || s === '..' || /^__.*__$/.test(s) || s.length > 200) return neueId();
  return s;
}
function mischen(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function zahl(v, min, max, ersatz) {
  const n = Number(v);
  if (!Number.isFinite(n)) return ersatz;
  return Math.min(max, Math.max(min, Math.round(n)));
}

/* ---------- 4. Toast und Modal ----------------------------------------- */

let toastTimer = null;
function toast(text, art) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.toggle('fehler', art === 'fehler');
  t.classList.add('an');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('an'), art === 'fehler' ? 5200 : 2600);
}

/* Werte des zuletzt geschlossenen Dialogs. Notwendig, weil der Dialog beim
   Schließen geleert wird — nach dem await gibt es die Felder nicht mehr. */
let letzteWerte = {};
function W(id, ersatz) {
  const v = letzteWerte[id];
  return v === undefined || v === '' ? ersatz : v;
}
function WRadio(name, ersatz) {
  return letzteWerte['radio:' + name] ?? ersatz;
}

/**
 * @param {{titel:string, html:string, knoepfe:Array, breit?:boolean,
 *          beimOeffnen?:Function}} opt
 * Knopf: {text, wert, art:'primary'|'gefahr'|'', pruefen?:Function}
 * Liefert den Wert des gedrückten Knopfes oder null bei Abbruch.
 * Die Feldinhalte stehen danach über W('feld-id') bereit.
 */
function modal(opt) {
  return new Promise(fertig => {
    const bg = $('#modal-bg'), m = $('#modal');
    Object.keys(m.dataset).forEach(k => delete m.dataset[k]);
    m.innerHTML =
      `<h2>${esc(opt.titel)}</h2><div id="modal-body">${opt.html || ''}</div>
       <div class="modal-btns">${(opt.knoepfe || []).map((k, i) =>
        `<button class="btn ${k.art || ''}" data-i="${i}">${esc(k.text)}</button>`).join('')}</div>`;
    m.style.maxWidth = opt.breit ? '640px' : '480px';
    bg.hidden = false;

    const schliesse = wert => {
      letzteWerte = Object.assign({}, m.dataset);
      $$('input,textarea,select', m).forEach(el => {
        if (el.id) letzteWerte[el.id] =
          (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
        if (el.type === 'radio' && el.checked && el.name) letzteWerte['radio:' + el.name] = el.value;
      });
      bg.hidden = true; m.innerHTML = '';
      document.removeEventListener('keydown', beiTaste, true);
      bg.removeEventListener('click', beiHintergrund);
      fertig(wert);
    };

    $$('.modal-btns button', m).forEach(b => b.addEventListener('click', () => {
      const k = opt.knoepfe[Number(b.dataset.i)];
      if (k.pruefen && k.pruefen() === false) return;
      schliesse(k.wert);
    }));
    function beiHintergrund(e) { if (e.target === bg) schliesse(null); }
    bg.addEventListener('click', beiHintergrund);

    function beiTaste(e) {
      if (e.key === 'Escape') { e.stopPropagation(); schliesse(null); }
      if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA') {
        const prim = opt.knoepfe?.findIndex(k => k.art === 'primary');
        if (prim >= 0) {
          e.preventDefault();
          $(`.modal-btns button[data-i="${prim}"]`, m)?.click();
        }
      }
    }
    document.addEventListener('keydown', beiTaste, true);
    opt.beimOeffnen?.(m);
    // Sofort setzen, nicht über einen Timer: sonst springt der Fokus dem
    // Nutzer unter den Fingern weg, wenn er gleich lostippt.
    (m.querySelector('input,textarea,select') || m.querySelector('button'))?.focus();
  });
}

function frage(titel, text, jaText = 'Ja', art = '') {
  return modal({
    titel, html: `<p>${text}</p>`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, { text: jaText, wert: true, art: art || 'primary' }]
  }).then(v => v === true);
}

/* ---------- 5. Anmeldung ------------------------------------------------ */

function loginVorbereiten() {
  if (KONTEN_HINWEIS.length) {
    $('#login-konten').textContent = KONTEN_HINWEIS.length + ' Konten eingerichtet';
    $('#login-konten').title = KONTEN_HINWEIS.join('\n');
  }
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#login-btn'), fehler = $('#login-fehler');
    fehler.hidden = true;
    btn.disabled = true; btn.textContent = 'Anmeldung läuft …';
    try {
      await FB.signInWithEmailAndPassword(auth, $('#login-mail').value.trim(), $('#login-pw').value);
      $('#login-pw').value = '';
    } catch (err) {
      fehler.innerHTML = esc(authFehler(err));
      fehler.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Anmelden';
    }
  });

  $('#login-reset').addEventListener('click', async () => {
    const mail = $('#login-mail').value.trim();
    if (!mail) { $('#login-mail').focus(); return toast('Bitte zuerst die E-Mail-Adresse eintragen.'); }
    if (!await frage('Passwort zurücksetzen',
      `An <strong>${esc(mail)}</strong> eine E-Mail zum Zurücksetzen des Passworts schicken?`,
      'E-Mail senden')) return;
    try {
      await FB.sendPasswordResetEmail(auth, mail);
      toast('E-Mail ist unterwegs. Bitte auch den Spam-Ordner prüfen.');
    } catch (err) { toast(authFehler(err), 'fehler'); }
  });
}

function authFehler(err) {
  const c = err?.code || '';
  const t = {
    'auth/invalid-credential':   'E-Mail oder Passwort stimmt nicht.',
    'auth/wrong-password':       'E-Mail oder Passwort stimmt nicht.',
    'auth/user-not-found':       'E-Mail oder Passwort stimmt nicht.',
    'auth/invalid-email':        'Diese E-Mail-Adresse sieht nicht gültig aus.',
    'auth/user-disabled':        'Dieses Konto wurde in der Firebase-Konsole deaktiviert.',
    'auth/too-many-requests':    'Zu viele Fehlversuche. Bitte einige Minuten warten.',
    'auth/network-request-failed': 'Keine Verbindung. Für die Anmeldung wird Internet gebraucht.',
    'auth/operation-not-allowed': 'E-Mail/Passwort ist in der Firebase-Konsole nicht aktiviert (Authentication → Sign-in method).',
    'auth/unauthorized-domain':  'Diese Domain ist in Firebase nicht freigegeben (Authentication → Settings → Authorized domains).',
    'auth/missing-password':     'Bitte ein Passwort eingeben.'
  }[c];
  return t || (err?.message || 'Unbekannter Fehler') + (c ? ` (${c})` : '');
}

async function benutzerGewechselt(user) {
  S.abmelder.forEach(f => { try { f(); } catch (_) {} });
  S.abmelder = [];
  sitzung = null;

  if (!user) {
    S.uid = null; S.email = null;
    S.decks = []; S.cards = []; S.reviews = [];
    S.bereitDecks = S.bereitCards = S.bereitSettings = false;
    S.einstellungen = STANDARD_EINSTELLUNGEN();
    S.kartenFilterDeck = 'alle'; S.kartenSuche = ''; S.kartenLimit = 60;
    S.statDeck = 'alle'; S.reviewsGeladen = false;
    S.auswahl.clear();
    lernAuswahl = null; letzteSitzung = null; bekannteDecks = new Set();
    // Wichtig: die gezeichneten Seiten leeren. Sonst stünden die Kästen und
    // Karten des abgemeldeten Kontos noch im (verborgenen) Dokument, wenn sich
    // jemand anderes an demselben Gerät anmeldet.
    S.seite = 'lernen';
    SEITEN.forEach(s => {
      const el = $('#seite-' + s);
      if (el) { el.innerHTML = ''; el.hidden = (s !== 'lernen'); }
    });
    $$('#nav button').forEach(b => b.classList.toggle('aktiv', b.dataset.seite === 'lernen'));
    $('#app').hidden = true; $('#boot').hidden = true; $('#fatal').hidden = true;
    $('#login').hidden = false;
    setTimeout(() => $('#login-mail')?.focus(), 40);
    return;
  }

  S.uid = user.uid; S.email = user.email;
  $('#login').hidden = true;
  $('#boot').hidden = false;
  bootText('Daten werden geladen …');
  try {
    await datenAnbinden();
  } catch (e) {
    console.error(e);
    fatal(`<div class="hinweis rot">Die Daten konnten nicht geladen werden.</div>
      <p class="mt">${esc(firestoreFehler(e))}</p>
      <button class="btn mt" onclick="location.reload()">Neu laden</button>`);
  }
}

function firestoreFehler(e) {
  const c = e?.code || '';
  if (c === 'permission-denied' || /permission/i.test(e?.message || ''))
    return 'Firestore verweigert den Zugriff. Sind die Security Rules aus firestore.rules veröffentlicht?';
  if (c === 'unavailable')
    return 'Firestore ist gerade nicht erreichbar. Die App arbeitet mit den lokal gespeicherten Daten weiter.';
  if (c === 'failed-precondition')
    return 'Der Offline-Zwischenspeicher konnte nicht angelegt werden (privates Fenster oder mehrere Tabs?).';
  return (e?.message || String(e)) + (c ? ` (${c})` : '');
}

/* ---------- 6. Firestore-Anbindung ------------------------------------- */

const refEinstellungen = () => FB.doc(db, 'users', S.uid, 'settings', 'app');
const colDecks   = () => FB.collection(db, 'users', S.uid, 'decks');
const colCards   = () => FB.collection(db, 'users', S.uid, 'cards');
const colReviews = () => FB.collection(db, 'users', S.uid, 'reviews');

/**
 * Firestore-Schreibvorgänge lösen ihr Promise erst auf, wenn der Server
 * bestätigt hat — offline bleiben sie liegen. Deshalb wird nirgends auf einen
 * Schreibvorgang gewartet: der lokale Zwischenspeicher aktualisiert die
 * Oberfläche sofort, der Server zieht nach, sobald wieder Netz da ist.
 */
function schreibe(promise, wobei) {
  Promise.resolve(promise).catch(e => {
    console.error('[Schreibfehler]', wobei, e);
    toast('Nicht gespeichert: ' + firestoreFehler(e), 'fehler');
  });
}

let statusZustand = { cache: false, offen: false };

function statusMalen() {
  const p = $('#status-punkt'), t = $('#status-text');
  if (!p) return;
  let klasse = 'ok', text = 'Synchronisiert';
  if (statusZustand.offen)      { klasse = 'warte'; text = 'Wird gespeichert …'; }
  else if (!navigator.onLine)   { klasse = 'aus';   text = 'Offline'; }
  else if (statusZustand.cache) { klasse = 'aus';   text = 'Aus Zwischenspeicher'; }
  p.className = 'punkt ' + klasse;
  t.textContent = text;
  $('#status').title = statusZustand.offen
    ? 'Änderungen liegen lokal und werden übertragen, sobald wieder Verbindung besteht.'
    : (navigator.onLine ? 'Alle Änderungen sind bei Firestore angekommen.'
                        : 'Ohne Netz. Lernen funktioniert weiter, alles wird lokal gespeichert.');
  const d = $('#diag-status'); if (d) diagnoseMalen();
}
window.addEventListener('online',  statusMalen);
window.addEventListener('offline', statusMalen);

function datenAnbinden() {
  return new Promise((fertig, schiefgegangen) => {
    let erledigt = false;
    const pruefen = () => {
      if (erledigt) return;
      if (S.bereitSettings && S.bereitDecks && S.bereitCards) {
        erledigt = true;
        // Der Erststart-Test darf den Programmstart nicht aufhalten, falls
        // Firestore ohne Netz keine Antwort liefert.
        Promise.race([
          erstStartPruefen().catch(e => console.warn('Erststart', e)),
          new Promise(r => setTimeout(r, 4000))
        ]).then(() => {
          $('#boot').hidden = true;
          $('#app').hidden = false;
          alleSeitenMalen();
          heutigeStatistikLaden().then(() => { if (S.seite === 'lernen' && !sitzung?.aktiv && !letzteSitzung) malLernen(); });
          if (migrationshinweisAusstehend) {
            migrationshinweisAusstehend = false;
            setTimeout(() => toast(
              'Neue Bewertungen laufen jetzt über FSRS statt feste Fachintervalle. ' +
              'Bereits vergebene Termine bleiben erhalten. Umschaltbar in Einstellungen.'), 500);
          }
          fertig();
        });
      }
    };
    const meta = { includeMetadataChanges: true };

    S.abmelder.push(FB.onSnapshot(refEinstellungen(), meta, snap => {
      const daten = snap.exists() ? snap.data() : null;
      S.einstellungen = Object.assign(STANDARD_EINSTELLUNGEN(), daten || {});
      if (!Array.isArray(S.einstellungen.intervalle) || S.einstellungen.intervalle.length !== 12)
        S.einstellungen.intervalle = STANDARD_INTERVALLE.slice();
      S.einstellungen.intervalle = S.einstellungen.intervalle.map((v, i) =>
        zahl(v, 1, 3650, STANDARD_INTERVALLE[i]));

      // Migration Stufe 1 -> Stufe 2: Konten von vor Stufe 2 (version < 3)
      // wechseln einmalig auf FSRS als neuen Standard-Scheduler (KONZEPT
      // §4.1). Termine bereits gelernter Karten bleiben unangetastet — nur
      // künftige Bewertungen laufen ab jetzt über FSRS statt feste Intervalle.
      if (daten && (!Number.isFinite(daten.version) || daten.version < 3)) {
        S.einstellungen.klassikModus = false;
        S.einstellungen.version = 3;
        schreibe(FB.setDoc(refEinstellungen(),
          { klassikModus: false, version: 3 }, { merge: true }), 'Stufe-2-Migration');
        migrationshinweisAusstehend = true;
      }

      themeWunsch = S.einstellungen.theme || 'auto';
      themeAnwenden(themeWunsch);
      try { localStorage.setItem('lk2:theme', themeWunsch); } catch (_) {}
      S.bereitSettings = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));

    S.abmelder.push(FB.onSnapshot(colDecks(), meta, snap => {
      S.decks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de'));
      // Neu hinzugekommene Kästen sind beim Lernen von Anfang an dabei
      if (lernAuswahl) S.decks.forEach(d => {
        if (!bekannteDecks.has(d.id)) lernAuswahl.add(d.id);
      });
      bekannteDecks = new Set(S.decks.map(d => d.id));
      statusAusSnapshot(snap);
      S.bereitDecks = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));

    S.abmelder.push(FB.onSnapshot(colCards(), meta, snap => {
      S.cards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (S.auswahl.size) {                       // gelöschte Karten aus der Auswahl nehmen
        const da = new Set(S.cards.map(k => k.id));
        S.auswahl.forEach(x => { if (!da.has(x)) S.auswahl.delete(x); });
      }
      statusAusSnapshot(snap);
      S.bereitCards = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));
  });
}

function statusAusSnapshot(snap) {
  statusZustand.cache = !!snap.metadata?.fromCache;
  statusZustand.offen = !!snap.metadata?.hasPendingWrites;
  statusMalen();
}

/** Erster Start eines Kontos: Einstellungen und Beispielkasten anlegen. */
async function erstStartPruefen() {
  if (S.decks.length || S.cards.length) {
    schreibe(FB.setDoc(refEinstellungen(),
      { lastSeen: new Date().toISOString() }, { merge: true }), 'lastSeen');
    return;
  }
  // Nur anlegen, wenn sicher feststeht, dass es noch keine Einstellungen gibt.
  // Schlägt die Abfrage fehl (offline, kein Cache), wird nichts erzeugt —
  // sonst entstünde bei jedem Start ein weiterer Beispielkasten.
  let snap = null;
  try { snap = await FB.getDoc(refEinstellungen()); } catch (_) { return; }
  if (!snap || snap.exists()) return;

  const deckId = neueId();
  const b = FB.writeBatch(db);
  b.set(refEinstellungen(), Object.assign(STANDARD_EINSTELLUNGEN(),
    { lastSeen: new Date().toISOString() }));
  b.set(FB.doc(colDecks(), deckId), neuesDeck('Beispiel'));
  [
    ['Was bedeutet „Spaced Repetition“?',
     'Wiederholen in wachsenden Abständen — kurz vor dem Vergessen.',
     'Der Effekt ist gut belegt: gleiche Behaltensleistung bei deutlich weniger Wiederholungen.'],
    ['Wofür stehen die Bewertungen 1 bis 4?',
     '1 = nicht gewusst, 2 = schwer, 3 = gewusst, 4 = sehr leicht',
     '1 setzt die Karte zurück, 4 verlängert den Abstand bis zur nächsten Abfrage am stärksten.'],
    ['Wie kommen meine alten Karten hierher?',
     'Einstellungen → Daten → Altbestand übernehmen',
     'Entweder aus dem Browser dieser Domain oder aus der JSON-Datei der alten App.']
  ].forEach(([f, a, n]) => {
    b.set(FB.doc(colCards(), neueId()), neueKarte({ deckId, frage: f, antwort: a, notiz: n }));
  });
  schreibe(b.commit(), 'Erststart');
}

/* ---------- 7. Datenmodell (KONZEPT §3) --------------------------------- */

function neuesDeck(name, farbe) {
  return {
    name: String(name || 'Neuer Kasten').slice(0, 120),
    farbe: farbe || DECK_FARBEN[Math.floor(Math.random() * DECK_FARBEN.length)],
    richtung: 'vorwaerts',      // Stufe 3
    pruefungsdatum: null,       // Stufe 4
    createdAt: heute(),
    archiviert: false
  };
}
const DECK_FARBEN = ['#378add', '#639922', '#ef9f27', '#e24b4a', '#8e6bd6', '#1B9AAA', '#d6538e', '#5b7083'];

function neueKarte({ deckId, frage, antwort, notiz }) {
  return {
    deckId,
    frage: String(frage || '').trim(),
    antwort: String(antwort || '').trim(),
    notiz: String(notiz || '').trim(),
    tags: [],
    typ: 'standard',            // Stufe 3: cloze | bild
    fach: 1,
    stability: 0,
    // difficulty MUSS bei einer noch nie gelernten Karte zusammen mit
    // stability:0 auf 0 stehen — ts-fsrs erkennt eine "frische" Karte genau
    // an dieser Kombination und initialisiert sie über die Erstbewertungs-
    // formel. Jeder andere Wert hier lässt FSRS bei der ersten Bewertung
    // mit "Invalid memory state" abstürzen.
    difficulty: 0,
    due: heute(),               // neue Karten sind sofort dran
    lastReview: null,
    reps: 0,
    lapses: 0,
    state: 0,                   // 0 neu, 1 lernen, 2 Wiederholung, 3 erneut lernen
    suspendiert: false,
    createdAt: heute()
  };
}

/** Karten, deren Kasten nicht (mehr) existiert. Sie kämen sonst in keiner
 *  Sitzung mehr vor, würden aber weiter mitgezählt. */
function verwaisteKarten() {
  const da = new Set(S.decks.map(d => d.id));
  return S.cards.filter(k => !da.has(k.deckId));
}

const istFaellig    = k => !k.suspendiert && (k.due || heute()) <= heute();
const istHeuteGenau = k => !k.suspendiert && (k.due || heute()) === heute();
const istNeu        = k => !k.reps;
const deckName      = id => S.decks.find(d => d.id === id)?.name || 'Ohne Kasten';
const deckFarbe     = id => S.decks.find(d => d.id === id)?.farbe || 'var(--txt3)';
const kartenVon     = id => S.cards.filter(k => k.deckId === id);

/** Fach ist die Anzeige-Ebene der Karteikarten-Metapher (KONZEPT §4.3).
 *  Klassik-Modus: Fach ist eine gespeicherte Terminierungsgröße (wie Stufe 1).
 *  FSRS-Modus: Fach ist eine reine Ableitung aus der Stabilität — keine
 *  gespeicherte Größe, ändert sich also automatisch mit jeder Bewertung. */
function fachVon(k) {
  if (S.einstellungen.klassikModus) {
    return Number.isFinite(k.fach) && k.fach >= 1 ? Math.min(12, Math.round(k.fach)) : 1;
  }
  const s = Number(k.stability) || 0;
  const schwellen = STANDARD_INTERVALLE.filter(g => s >= g).length;
  return Math.max(1, Math.min(12, schwellen + 1));
}

/* ---------- 8. Navigation ---------------------------------------------- */

const SEITEN = ['lernen', 'kaesten', 'karten', 'statistik', 'einstellungen'];

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-seite]');
  if (b) seiteZeigen(b.dataset.seite);
});

function seiteZeigen(name) {
  if (!SEITEN.includes(name)) return;
  if (name !== 'lernen') { sitzung = null; letzteSitzung = null; }
  S.seite = name;
  SEITEN.forEach(s => { $('#seite-' + s).hidden = (s !== name); });
  $$('#nav button').forEach(b => b.classList.toggle('aktiv', b.dataset.seite === name));
  window.scrollTo({ top: 0 });
  seiteMalen(name);
}

/* Wird nach jeder Firestore-Aktualisierung aufgerufen. Eine laufende Sitzung
   wird dabei bewusst nicht neu gezeichnet — sonst springt die Karte oder der
   Abschlussbildschirm verschwindet, sobald der eigene Schreibvorgang
   zurückkommt. */
function alleSeitenMalen() {
  if (sitzung?.aktiv || letzteSitzung) return;
  // Nicht mitten in eine Eingabe hineinzeichnen — sonst verliert das Suchfeld
  // den Fokus, sobald eine Aktualisierung von Firestore eintrifft.
  const f = document.activeElement;
  if (f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA') && f.closest('main')) return;
  seiteMalen(S.seite);
}

function seiteMalen(name) {
  if (!S.uid) return;
  ({
    lernen: malLernen, kaesten: malKaesten, karten: malKarten,
    statistik: malStatistik, einstellungen: malEinstellungen
  })[name]?.();
}

/* ---------- 9. Lernen --------------------------------------------------- */

let lernAuswahl = null;      // Set von deckIds, null = alle
let letzteSitzung = null;    // hält den Abschlussbildschirm, bis er weggeklickt wird

function malLernen() {
  if (sitzung?.aktiv) return malSitzung();
  if (letzteSitzung) return malAbschluss();
  const ziel = $('#seite-lernen');

  if (!S.decks.length) {
    ziel.innerHTML = `<div class="leer">
      Noch kein Kasten vorhanden.<br><br>
      <button class="btn primary" data-tu="ersterKasten">Ersten Kasten anlegen</button>
      &nbsp;
      <button class="btn" data-tu="zuEinstellungen">Altbestand übernehmen</button>
    </div>`;
    return verdrahten(ziel);
  }

  if (!lernAuswahl) lernAuswahl = new Set(S.decks.map(d => d.id));
  const modus = lernModus();
  const gewaehlt = S.cards.filter(k => lernAuswahl.has(k.deckId));
  const heuteN = gewaehlt.filter(istHeuteGenau).length;
  const alleN  = gewaehlt.filter(istFaellig).length;
  const dran   = modus === 'heute' ? heuteN : alleN;

  const e = S.einstellungen;
  const zielKarten = e.zielEinheit === 'karten';
  const heutigerWert = zielKarten ? (S.heutigeAnzahl || 0) : Math.round((S.heutigeSekunden || 0) / 60);
  const zielWert = zielKarten ? zahl(e.zielKarten, 1, 2000, 30) : zahl(e.zielMinuten, 1, 600, 15);
  const anteil = Math.max(0, Math.min(1, zielWert ? heutigerWert / zielWert : 0));
  const UMFANG = Math.round(2 * Math.PI * 46);

  const proFach = Array.from({ length: 12 }, (_, i) =>
    gewaehlt.filter(k => !k.suspendiert && fachVon(k) === i + 1).length);
  const fachGesamt = proFach.reduce((a, b) => a + b, 0);

  ziel.innerHTML = `
    <h1>Lernen</h1>

    <div class="dash-kopf">
      <div class="dash-ring">
        <svg viewBox="0 0 100 100">
          <circle class="spur" cx="50" cy="50" r="46"></circle>
          <circle class="fuell" cx="50" cy="50" r="46"
            stroke-dasharray="${UMFANG}" stroke-dashoffset="${Math.round(UMFANG * (1 - anteil))}"></circle>
        </svg>
        <div class="dash-ring-mitte"><b>${heutigerWert}/${zielWert}</b><span>${zielKarten ? 'Karten' : 'Minuten'}</span></div>
      </div>
      <div class="dash-kennzahlen">
        <div class="dash-kennzahl"><b>${dran}</b><span>${modus === 'heute' ? 'heute fällig' : 'fällig gesamt'}</span></div>
        <div class="dash-kennzahl"><b>${e.streak || 0}</b><span>Tage Streak</span></div>
        <div class="dash-kennzahl"><b>${gewaehlt.length}</b><span>Karten gewählt</span></div>
      </div>
    </div>

    ${fachGesamt ? `
    <div class="dash-fachleiste">${proFach.map((n, i) =>
      n ? `<div style="width:${(n / fachGesamt * 100).toFixed(2)}%;background:var(--akzent);opacity:${(0.28 + i * 0.06).toFixed(2)}" title="Fach ${i + 1}: ${n} Karten"></div>` : ''
    ).join('')}</div>
    <div class="dash-fach-legende"><span>Fach 1</span><span>Fach 12</span></div>` : ''}

    <div class="spread mt2" style="margin-bottom:8px">
      <h2 style="margin:0">Kästen</h2>
      <span class="row" style="gap:6px">
        <button class="btn klein" data-tu="alleAn">Alle</button>
        <button class="btn klein" data-tu="alleAus">Keiner</button>
      </span>
    </div>
    <div class="dash-decks">
      ${S.decks.map(d => {
        const k = kartenVon(d.id);
        const f = k.filter(istFaellig).length;
        return `<button type="button" class="dash-deck ${lernAuswahl.has(d.id) ? 'gewaehlt' : ''}" data-deck="${esc(d.id)}" aria-pressed="${lernAuswahl.has(d.id)}">
          <div class="dd-name"><span class="punkt-farbe" style="background:${esc(d.farbe)};margin:0"></span>${esc(d.name)}</div>
          <div class="dd-faellig" ${f ? '' : 'style="color:var(--txt3)"'}>${f}</div>
          <div class="dd-rest">fällig · ${k.length} gesamt</div>
        </button>`;
      }).join('')}
    </div>

    <div class="box mt">
      <h2>Umfang</h2>
      <label class="karo"><input type="radio" name="modus" value="heute" ${modus === 'heute' ? 'checked' : ''}>
        <span style="flex:1">Nur heute fällig</span><span class="badge">${heuteN}</span></label>
      <label class="karo"><input type="radio" name="modus" value="alle" ${modus === 'alle' ? 'checked' : ''}>
        <span style="flex:1">Alle fälligen, auch überfällige</span><span class="badge">${alleN}</span></label>
    </div>

    <button class="btn primary gross breit" data-tu="starten" ${dran ? '' : 'disabled'}>
      ${dran ? `Sitzung starten — ${dran} ${dran === 1 ? 'Karte' : 'Karten'}` : 'Nichts fällig'}
    </button>
    ${!dran && alleN ? `<p class="mini mt" style="text-align:center">
        Heute ist nichts dran, aber ${alleN} überfällige Karten warten. Umfang umstellen.</p>` : ''}
    ${!dran && !alleN ? `<p class="mini mt" style="text-align:center">
        Alles erledigt. Nächste Fälligkeit: ${esc(naechsteFaelligkeitText())}</p>` : ''}

    <p class="tastenhilfe mt2"><kbd>Leertaste</kbd> umdrehen ·
      <kbd>1</kbd>–<kbd>4</kbd> bewerten · <kbd>Esc</kbd> beenden</p>`;

  verdrahten(ziel);
  $$('#seite-lernen .dash-deck').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.deck;
    lernAuswahl.has(id) ? lernAuswahl.delete(id) : lernAuswahl.add(id);
    malLernen();
  }));
  $$('#seite-lernen input[name=modus]').forEach(r => r.addEventListener('change', () => {
    try { localStorage.setItem('lk2:modus', r.value); } catch (_) {}
    malLernen();
  }));
}

function lernModus() {
  try { return localStorage.getItem('lk2:modus') === 'alle' ? 'alle' : 'heute'; }
  catch (_) { return 'heute'; }
}

function naechsteFaelligkeitText() {
  const offen = S.cards.filter(k => !k.suspendiert && k.due).map(k => k.due).sort();
  if (!offen.length) return 'keine Karten';
  const d = offen.find(x => x > heute());
  if (!d) return 'heute';
  const n = tageDiff(d, heute());
  return `${datumDeutsch(d)} (in ${n} ${n === 1 ? 'Tag' : 'Tagen'})`;
}

/** Heutige Tagesstatistik (neue Karten, Anzahl, Sekunden) — für den
 *  Tagesdeckel und den Fortschrittsring auf dem Startbildschirm. Bei
 *  Fehlern (offline, kein Cache) bleiben die zuletzt bekannten Werte
 *  stehen statt die App zu blockieren. */
async function heutigeStatistikLaden() {
  try {
    const snap = await FB.getDoc(FB.doc(colReviews(), heute()));
    const d = snap.exists() ? snap.data() : null;
    S.heutigeNeu = Number(d?.neu) || 0;
    S.heutigeAnzahl = Number(d?.anzahl) || 0;
    S.heutigeSekunden = Number(d?.sekunden) || 0;
  } catch (_) { /* Werte bleiben wie sie waren */ }
  return S.heutigeNeu;
}

async function sitzungStarten() {
  const modus = lernModus();
  let pool = S.cards.filter(k => lernAuswahl.has(k.deckId))
    .filter(modus === 'heute' ? istHeuteGenau : istFaellig);
  if (!pool.length) return toast('Keine fälligen Karten in der Auswahl.');

  const heutigeNeu = await heutigeStatistikLaden();
  const deckel = zahl(S.einstellungen.neuProTag, 5, 50, 20);
  const nochFrei = Math.max(0, deckel - heutigeNeu);
  const alte = pool.filter(k => !istNeu(k));
  let neue = pool.filter(istNeu);
  const uebrig = Math.max(0, neue.length - nochFrei);
  if (neue.length > nochFrei) neue = mischen(neue).slice(0, nochFrei);
  pool = alte.concat(neue);
  if (!pool.length) return toast(
    `Tagesgrenze für neue Karten erreicht (${deckel}/Tag). In der Auswahl sind nur noch neue Karten fällig.`, 'fehler');

  sitzung = {
    karten: mischen(pool), i: 0, aufgedeckt: false, aktiv: true,
    zaehler: { 1: 0, 2: 0, 3: 0, 4: 0 }, gesamt: pool.length,
    start: Date.now(), kartenStart: Date.now(), sekunden: 0,
    proDeck: {}, bewertet: 0, uebrigeNeue: uebrig
  };
  malSitzung();
}

function malSitzung() {
  const ziel = $('#seite-lernen');
  const s = sitzung;
  if (!s) return malLernen();

  if (s.i >= s.karten.length) return malAbschluss();

  const k = s.karten[s.i];
  const fach = fachVon(k);
  const proz = Math.round((s.i / s.gesamt) * 100);
  const ueberfaellig = tageDiff(heute(), k.due || heute());

  ziel.innerHTML = `
    <div class="spread" style="margin-bottom:8px">
      <span class="mini">${s.i + 1} / ${s.gesamt}</span>
      <button class="btn klein" data-tu="abbrechen">Beenden</button>
    </div>
    <div class="fortschritt"><div style="width:${proz}%"></div></div>

    <div class="flip-buehne">
      <div class="flip-karte ${s.aufgedeckt ? 'gedreht' : ''}" id="flip">
        <div class="flip-seite vorn">
          <div class="flip-kopf">
            <span style="color:${esc(deckFarbe(k.deckId))}">${esc(deckName(k.deckId))}</span>
            <span>Fach ${fach}${istNeu(k) ? ' · neu' : ''}${ueberfaellig > 0 ? ` · ${ueberfaellig} T. überfällig` : ''}</span>
          </div>
          <div class="flip-text">${esc(k.frage)}</div>
        </div>
        <div class="flip-seite hinten">
          <div class="flip-kopf">
            <span style="color:${esc(deckFarbe(k.deckId))}">${esc(deckName(k.deckId))}</span>
            <span>Fach ${fach}</span>
          </div>
          <div class="flip-text">${esc(k.antwort)}</div>
          ${k.notiz ? `<div class="flip-notiz">${esc(k.notiz)}</div>` : ''}
        </div>
      </div>
    </div>

    <div id="aktionen">${s.aufgedeckt ? bewertungsHtml(k) : aufdeckHtml()}</div>`;

  verdrahten(ziel);
  aktionenVerdrahten();
  $('#flip')?.addEventListener('click', () => { if (!sitzung?.aufgedeckt) umdrehen(); });
}

function aufdeckHtml() {
  return `<button class="btn primary gross breit" data-tu="umdrehen">Antwort zeigen</button>
          <p class="tastenhilfe"><kbd>Leertaste</kbd></p>`;
}

function aktionenVerdrahten() {
  const a = $('#aktionen');
  if (!a) return;
  verdrahten(a);
  $$('[data-bew]', a).forEach(b =>
    b.addEventListener('click', () => bewerten(Number(b.dataset.bew))));
}

/** Text für "in wie vielen Tagen" unter jedem Bewertungsknopf. */
function intervallTextAus(tage) {
  return tage <= 0 ? 'heute' : tage === 1 ? 'morgen' : tage < 31 ? tage + ' Tage'
    : tage < 365 ? Math.round(tage / 30) + ' Mon.' : Math.round(tage / 365 * 10) / 10 + ' J.';
}
/** Vorschau für alle vier Bewertungen — je nach Modus aus der festen
 *  Intervalltabelle oder direkt von FSRS. repeat() liefert alle vier
 *  Ausgänge auf einen Schlag, genau passend für diese Vorschau. */
function intervallVorschauTexte(k) {
  if (S.einstellungen.klassikModus) {
    const iv = S.einstellungen.intervalle;
    const max = iv.length;
    const alt = fachVon(k);
    const out = {};
    [1, 2, 3, 4].forEach(r => {
      const neu = r === 1 ? 1 : r === 2 ? alt : Math.min(max, alt + (r === 3 ? 1 : 2));
      out[r] = intervallTextAus(iv[neu - 1] ?? iv[max - 1]);
    });
    return out;
  }
  try {
    const vorschau = fsrsMotor().repeat(fsrsKarteAus(k), fsrsJetzt());
    const out = {};
    [1, 2, 3, 4].forEach(r => { out[r] = intervallTextAus(tageDiff(datumZuIso(vorschau[r].card.due), heute())); });
    return out;
  } catch (e) {
    console.warn('[Vorschau]', e);
    return { 1: '–', 2: '–', 3: '–', 4: '–' };
  }
}

function bewertungsHtml(k) {
  const vorschauTexte = intervallVorschauTexte(k);
  const knopf = (r, titel) =>
    `<button class="bew bew${r}" data-bew="${r}">
       <b>${r}</b><span>${titel}</span><small>${vorschauTexte[r]}</small></button>`;
  return `<div class="bewertung">
      ${knopf(1, 'Nicht gewusst')}${knopf(2, 'Schwer')}${knopf(3, 'Gewusst')}${knopf(4, 'Sehr leicht')}
    </div>
    <p class="tastenhilfe"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></p>`;
}

/* ---------- 9b. FSRS (Stufe 2) ------------------------------------------ */

/** ts-fsrs rechnet mit echten Datumsobjekten und eigener Tagesarithmetik
 *  (dateDiffInDays, UTC-Kalendertage). Die App rechnet Tage konsequent über
 *  ISO-Strings und eine eigene Tagesgrenze (heute(), TAGESGRENZE). Damit
 *  beide dieselben Tage zählen, wird FSRS nie der reale Sekunden-Zeitpunkt
 *  übergeben, sondern die UTC-Mitternacht des App-"heute". */
function isoZuDatum(iso) { return new Date((iso || heute()) + 'T00:00:00.000Z'); }
function datumZuIso(d) {
  if (!(d instanceof Date) || isNaN(d.getTime())) return heute();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}
function fsrsJetzt() { return isoZuDatum(heute()); }

/** Parameter frisch aufbauen statt zu cachen — die Retention kann sich in
 *  den Einstellungen jederzeit ändern. Lernschritte bewusst auf einen
 *  kurzen Schritt reduziert (KONZEPT §4.1: „keine mehrstufigen Ketten“). */
function fsrsMotor() {
  return new FSRS.FSRS(FSRS.generatorParameters({
    request_retention: S.einstellungen.retention,
    learning_steps: ['10m'],
    relearning_steps: ['10m']
  }));
}

/** App-Karte in das von ts-fsrs erwartete Card-Objekt übersetzen.
 *
 *  ts-fsrs akzeptiert als Gedächtniszustand nur zwei Formen: exakt
 *  (stability:0, difficulty:0) = „noch kein Zustand, aus der ersten
 *  Bewertung initialisieren" — oder difficulty ≥ 1 UND stability > 0.
 *  Alles dazwischen wirft FSRSValidationError („Invalid memory state").
 *  Der Stufe-1-Altbestand enthält genau so einen Zwischenzustand: nie
 *  gelernte Karten wurden dort mit difficulty:5 bei stability:0 angelegt.
 *  Ohne die Normalisierung hier wären diese Karten im FSRS-Modus für
 *  immer unlernbar (jede Bewertung würde abgefangen und übersprungen). */
function fsrsKarteAus(k) {
  let stability = Number(k.stability) || 0;
  let difficulty = Number(k.difficulty) || 0;
  if (!(difficulty >= 1 && stability > 0)) {
    if (Number(k.reps) > 0 && stability > 0) {
      // gelernt, aber difficulty fehlt/kaputt → reparieren statt verwerfen
      difficulty = Math.min(10, Math.max(1, difficulty || 5));
    } else {
      // nie gelernt (oder ohne brauchbare Stabilität) → frischer Zustand
      stability = 0; difficulty = 0;
    }
  }
  return {
    due: isoZuDatum(k.due),
    stability,
    difficulty,
    elapsed_days: 0,          // wird von ts-fsrs aus last_review + jetzt neu berechnet
    scheduled_days: 0,
    learning_steps: Number(k.learningSteps) || 0,
    reps: Number(k.reps) || 0,
    lapses: Number(k.lapses) || 0,
    state: [0, 1, 2, 3].includes(k.state) ? k.state : 0,
    last_review: k.lastReview ? isoZuDatum(k.lastReview) : undefined
  };
}

const FSRS_STANDARD_GEWICHTE = [
  0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722,
  0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425,
  0.0912, 0.0658, 0.1542
];
/** Intervallformel von ts-fsrs (FSRS-6), unabhängig nachgebildet für die
 *  Folgeabschätzung des Retention-Reglers — eine echte Simulation über alle
 *  Karten wäre dafür zu teuer, eine Näherung reicht als Orientierung. */
function fsrsIntervallTage(stability, retention, w) {
  const decay = -w[20];
  const factor = Math.exp(Math.log(0.9) / decay) - 1;
  const modifier = (Math.pow(retention, 1 / decay) - 1) / factor;
  return Math.min(36500, Math.max(1, Math.round((stability || 0.5) * modifier)));
}
/** Renewal-Theorie-Näherung: Summe 1/Intervall über alle aktiven Karten
 *  ergibt die erwartete Anzahl Wiederholungen pro Tag im eingeschwungenen
 *  Zustand. Nur eine Orientierungshilfe, keine exakte Vorhersage. */
function geschaetzteWiederholungenProTag(retention) {
  const karten = S.cards.filter(k => !k.suspendiert);
  if (!karten.length) return 0;
  let summe = 0;
  karten.forEach(k => { summe += 1 / fsrsIntervallTage(Number(k.stability) || 0.5, retention, FSRS_STANDARD_GEWICHTE); });
  return Math.round(summe * 10) / 10;
}

/** Datenbank-Patch für eine Bewertung — Klassik-Modus (feste Fachintervalle,
 *  wie Stufe 1) oder FSRS, je nach Einstellung. */
function bewertungsPatch(k, rating) {
  if (S.einstellungen.klassikModus) {
    const iv = S.einstellungen.intervalle;
    const max = iv.length;
    const alt = fachVon(k);
    const neuFach = rating === 1 ? 1
                  : rating === 2 ? alt
                  : Math.min(max, alt + (rating === 3 ? 1 : 2));
    const tage = iv[neuFach - 1] ?? iv[max - 1];
    return {
      fach: neuFach,
      due: plusTage(heute(), tage),
      stability: tage,
      lastReview: heute(),
      reps: (Number(k.reps) || 0) + 1,
      lapses: (Number(k.lapses) || 0) + (rating === 1 ? 1 : 0),
      state: rating === 1 ? 3 : 2
    };
  }
  const { card } = fsrsMotor().next(fsrsKarteAus(k), fsrsJetzt(), rating);
  const schwellen = STANDARD_INTERVALLE.filter(g => card.stability >= g).length;
  return {
    due: datumZuIso(card.due),
    stability: card.stability,
    difficulty: card.difficulty,
    lastReview: heute(),
    reps: card.reps,
    lapses: card.lapses,
    state: card.state,
    learningSteps: card.learning_steps || 0,
    // "fach" wird auch im FSRS-Modus als Spiegel der Stabilität mitgeschrieben
    // (KONZEPT §4.3-Schwellen) — nicht weil FSRS ihn braucht, sondern damit
    // ein späteres Zurückschalten in den Klassik-Modus nicht auf einem
    // veralteten Fach-Wert aufsetzt und Monate an Fortschritt zurückwirft.
    fach: Math.max(1, Math.min(12, schwellen + 1))
  };
}

function bewerten(rating) {
  const s = sitzung;
  if (!s?.aktiv || !s.aufgedeckt) return;
  const k = s.karten[s.i];
  if (!k) return;

  const sekunden = Math.min(600, Math.round((Date.now() - s.kartenStart) / 1000));
  const warNeu = istNeu(k);
  let patch;
  try {
    patch = bewertungsPatch(k, rating);
  } catch (e) {
    console.error('[Terminierung]', e);
    toast('Terminierung fehlgeschlagen, Karte wird übersprungen: ' + (e?.message || e), 'fehler');
    s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
    return malSitzung();
  }
  Object.assign(k, patch);                                   // lokal sofort
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), 'Bewertung');

  s.zaehler[rating]++; s.bewertet++; s.sekunden += sekunden;
  s.proDeck[k.deckId] = (s.proDeck[k.deckId] || 0) + 1;
  tagesstatistikSchreiben(rating, sekunden, k.deckId, warNeu);
  streakPflegen();

  s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
  malSitzung();
}

function tagesstatistikSchreiben(rating, sekunden, deckId, warNeu) {
  const tag = heute();
  schreibe(FB.setDoc(FB.doc(colReviews(), tag), {
    datum: tag,
    anzahl: FB.increment(1),
    neu: FB.increment(warNeu ? 1 : 0),
    sekunden: FB.increment(sekunden),
    bewertungen: { [rating]: FB.increment(1) },
    proDeck: { [deckId]: FB.increment(1) }
  }, { merge: true }), 'Tagesstatistik');
  S.reviewsGeladen = false;
}

function streakPflegen() {
  const tag = heute();
  const e = S.einstellungen;
  if (e.lastLearnDate === tag) return;
  const neuerStreak = e.lastLearnDate === plusTage(tag, -1) ? (Number(e.streak) || 0) + 1 : 1;
  e.lastLearnDate = tag; e.streak = neuerStreak;
  schreibe(FB.setDoc(refEinstellungen(),
    { lastLearnDate: tag, streak: neuerStreak }, { merge: true }), 'Streak');
}

function sitzungBeenden(still) {
  if (!sitzung) return;
  if (still) { sitzung = null; letzteSitzung = null; return; }
  sitzung.aktiv = false;
  malAbschluss();
}

  const s = sitzung || letzteSitzung;

  s.aktiv = false;
  letzteSitzung = s;
  sitzung = null;
  heutigeStatistikLaden();   // im Hintergrund auffrischen, für den Ring auf dem Startbildschirm
  const min = Math.max(1, Math.round(s.sekunden / 60));
  const proKarte = s.bewertet ? (s.sekunden / s.bewertet).toFixed(1) : '0';
  const offenN = s.gesamt - s.bewertet;

  $('#seite-lernen').innerHTML = `
    <div style="text-align:center;padding:26px 0">
      <div style="font-size:44px;line-height:1">🎉</div>
      <h1 style="margin-top:12px">${offenN ? 'Sitzung beendet' : 'Sitzung abgeschlossen!'}</h1>
      <p class="muted">${s.bewertet} von ${s.gesamt} Karten bewertet${offenN ? ` · ${offenN} offen` : ''}</p>
    </div>
    <div class="kennzahlen">
      <div class="kennzahl"><b>${s.bewertet}</b><span>Karten</span></div>
      <div class="kennzahl"><b>${min}</b><span>Minuten</span></div>
      <div class="kennzahl"><b>${proKarte}s</b><span>pro Karte</span></div>
      <div class="kennzahl"><b>${S.einstellungen.streak || 0}</b><span>Tage Streak</span></div>
    </div>
    <div class="box mt">
      ${[1, 2, 3, 4].map(r => {
        const n = s.zaehler[r], p = s.bewertet ? Math.round(n / s.bewertet * 100) : 0;
        const farbe = ['var(--bewertung-1)', 'var(--bewertung-2)', 'var(--bewertung-3)', 'var(--bewertung-4)'][r - 1];
        const t = ['Nicht gewusst', 'Schwer', 'Gewusst', 'Sehr leicht'][r - 1];
        return `<div class="balken"><span class="lab">${r} ${t.slice(0, 6)}.</span>
          <span class="spur"><span class="fuell" style="width:${p}%;background:${farbe}"></span></span>
          <span class="val">${n}</span></div>`;
      }).join('')}
    </div>
    ${s.uebrigeNeue ? `<p class="mini mt" style="text-align:center">
      ${s.uebrigeNeue} weitere neue ${s.uebrigeNeue === 1 ? 'Karte wartet' : 'Karten warten'} —
      Tagesgrenze für neue Karten erreicht.</p>` : ''}
    <div class="row mt2" style="justify-content:center">
      <button class="btn primary" data-tu="nochmal">Zur Übersicht</button>
      <button class="btn" data-tu="zuStatistik">Statistik ansehen</button>
    </div>`;
  verdrahten($('#seite-lernen'));
}

function gefilterteKarten() {
  const q = S.kartenSuche.trim().toLowerCase();
  let l = S.cards;
  if (S.kartenFilterDeck !== 'alle') l = l.filter(k => k.deckId === S.kartenFilterDeck);
  if (q) {
    const teile = q.split(/\s+/);
    l = l.filter(k => {
      const heu = (k.frage + ' ' + k.antwort + ' ' + (k.notiz || '') + ' ' +
                   deckName(k.deckId) + ' ' + (k.tags || []).join(' ')).toLowerCase();
      return teile.every(t => heu.includes(t));
    });
  }
  return l.slice().sort((a, b) =>
    (a.due || '').localeCompare(b.due || '') || (a.frage || '').localeCompare(b.frage || '', 'de'));
}

        `<option value="${esc(d.id)}" ${d.id === vorDeck ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      ${k ? `<div class="row" style="justify-content:space-between;gap:10px">
        <label class="feld" style="flex:1;margin:0"><span>Fach (1–12)${klassik ? '' : ' — abgeleitet'}</span>
          ${klassik
            ? `<input type="number" id="m-fach" min="1" max="12" value="${fachVon(k)}">`
            : `<input type="text" value="${fachVon(k)}" disabled title="Im FSRS-Modus ergibt sich das Fach aus der Stabilität und ist hier nicht editierbar.">`}
        </label>
        <label class="feld" style="flex:1;margin:0"><span>Fällig am</span>
          <input type="date" id="m-due" value="${esc(k.due || heute())}"></label>
      </div>
      <label class="karo" style="margin-top:6px"><input type="checkbox" id="m-susp" ${k.suspendiert ? 'checked' : ''}>
        <span>Ruhen lassen (kommt nicht mehr dran)</span></label>
      <p class="mini">${k.reps || 0} Wiederholungen · ${k.lapses || 0} Aussetzer ·
         zuletzt ${datumDeutsch(k.lastReview)}${klassik ? '' : ` · Stabilität ${Math.round(Number(k.stability) || 0)} Tage`}</p>` : ''}`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, {
      text: k ? 'Speichern' : 'Anlegen', wert: 'ok', art: 'primary',
      pruefen: () => {
        if (!$('#m-frage').value.trim()) { toast('Die Frage darf nicht leer sein.'); return false; }
        if (!$('#m-antwort').value.trim()) { toast('Die Antwort darf nicht leer sein.'); return false; }
      }
    }]
  });
  if (r !== 'ok') return;

  const werte = {
    frage: String(W('m-frage', '')).trim(),
    antwort: String(W('m-antwort', '')).trim(),
    notiz: String(letzteWerte['m-notiz'] ?? '').trim(),
    deckId: W('m-deck', vorDeck)
  };
  if (!werte.frage || !werte.antwort) return;

  if (k) {
    // Terminierung nur im Klassik-Modus über das Fach neu berechnen — im
    // FSRS-Modus ist die Stabilität eine gemessene Größe, kein aus dem Fach
    // abgeleiteter Wert, und darf beim bloßen Bearbeiten von Text nicht
    // überschrieben werden (sonst geht echter FSRS-Fortschritt verloren).
    if (klassik) {
      const fachNeu = zahl(W('m-fach', fachVon(k)), 1, 12, fachVon(k));
      Object.assign(werte, { fach: fachNeu, stability: S.einstellungen.intervalle[fachNeu - 1] });
    }
    Object.assign(werte, {
      due: W('m-due', k.due || heute()),
      suspendiert: letzteWerte['m-susp'] === true
    });
    Object.assign(k, werte);
    schreibe(FB.updateDoc(FB.doc(colCards(), k.id), werte), 'Karte ändern');
    toast('Gespeichert.');
  } else {
    schreibe(FB.setDoc(FB.doc(colCards(), neueId()), neueKarte(werte)), 'Karte anlegen');
    toast('Karte angelegt.');
  }
}

/* ---------- 12. Statistik ----------------------------------------------- */

async function reviewsLaden(alles) {
  if (S.reviewsGeladen && !alles) return;
  try {
    const ab = alles ? '0000-00-00' : plusTage(heute(), -70);
    const q = FB.query(colReviews(), FB.where('datum', '>=', ab));
    const snap = await FB.getDocs(q);
    S.reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.reviewsGeladen = true;
  } catch (e) {
    // Nicht erneut versuchen: malStatistik ruft diese Funktion beim Zeichnen
    // auf — ohne Merker entstünde eine Endlosschleife aus Abfrage und Neuzeichnen.
    console.warn('Statistik-Verlauf nicht ladbar', e);
    S.reviews = Array.isArray(S.reviews) ? S.reviews : [];
    S.reviewsGeladen = true;
    S.reviewsFehler = true;
  }
}

/* ---------- 14. Import / Export ---------------------------------------- */

function dateiHerunterladen(name, inhalt, typ = 'application/json') {
  const blob = new Blob([inhalt], { type: typ + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function dateiWaehlen(endung) {
  return new Promise(fertig => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = endung;
    i.addEventListener('cancel', () => fertig(null));
    i.addEventListener('change', () => {
      const f = i.files?.[0];
      if (!f) return fertig(null);
      const r = new FileReader();
      r.onload = () => fertig({ name: f.name, text: String(r.result || '') });
      r.onerror = () => fertig(null);
      r.readAsText(f, 'utf-8');
    });
    i.click();
  });
}

function csvFeld(s) { return '"' + String(s ?? '').replace(/"/g, '""') + '"'; }

/** Karten als CSV "Frage";"Antwort";"Kasten" — mit BOM, damit Excel die
 *  Umlaute richtig anzeigt. */
function csvBauen(karten) {
  return '\uFEFF' + karten.map(k =>
    [k.frage, k.antwort, deckName(k.deckId)].map(csvFeld).join(';')).join('\r\n');
}
function dateiTeil(s) {
  return String(s).replace(/[^\wäöüÄÖÜß -]+/g, '_').trim().slice(0, 40) || 'export';
}

/* --- 14b. CSV lesen --- */

function csvZerlegen(text) {
  text = text.replace(/^\uFEFF/, '');
  const zeilen = [];
  let feld = '', zeile = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) {
      if (c === '"' && n === '"') { feld += '"'; i++; }
      else if (c === '"') inQ = false;
      else feld += c;
    } else if (c === '"') inQ = true;
    else if (c === ';' || c === '\t') { zeile.push(feld); feld = ''; }
    else if (c === '\r') { /* ignorieren */ }
    else if (c === '\n') { zeile.push(feld); zeilen.push(zeile); zeile = []; feld = ''; }
    else feld += c;
  }
  if (feld !== '' || zeile.length) { zeile.push(feld); zeilen.push(zeile); }
  return zeilen.filter(z => z.some(f => String(f).trim() !== ''));
}

  try {
