  verdrahten(ziel);
  $$('#seite-lernen .dash-deck').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.deck;
    lernAuswahl.has(id) ? lernAuswahl.delete(id) : lernAuswahl.add(id);
    malLernen();
  }));
  $$('#seite-lernen input[name=modus]').forEach(r => r.addEventListener('change', () => {
    try { localStorage.setItem('lk2:modus', r.value); } catch (_) {}
    malLernen();
  }));
}

function lernModus() {
  try { return localStorage.getItem('lk2:modus') === 'alle' ? 'alle' : 'heute'; }
  catch (_) { return 'heute'; }
}

function naechsteFaelligkeitText() {
  const offen = S.cards.filter(k => !k.suspendiert && k.due).map(k => k.due).sort();
  if (!offen.length) return 'keine Karten';
  const d = offen.find(x => x > heute());
  if (!d) return 'heute';
  const n = tageDiff(d, heute());
  return `${datumDeutsch(d)} (in ${n} ${n === 1 ? 'Tag' : 'Tagen'})`;
}

/** Heutige Tagesstatistik (neue Karten, Anzahl, Sekunden) — für den
 *  Tagesdeckel und den Fortschrittsring auf dem Startbildschirm. Bei
 *  Fehlern (offline, kein Cache) bleiben die zuletzt bekannten Werte
 *  stehen statt die App zu blockieren. */
async function heutigeStatistikLaden() {
  try {
    const snap = await FB.getDoc(FB.doc(colReviews(), heute()));
    const d = snap.exists() ? snap.data() : null;
    S.heutigeNeu = Number(d?.neu) || 0;
    S.heutigeAnzahl = Number(d?.anzahl) || 0;
    S.heutigeSekunden = Number(d?.sekunden) || 0;
  } catch (_) { /* Werte bleiben wie sie waren */ }
  return S.heutigeNeu;
}

async function sitzungStarten() {
  const modus = lernModus();
  let pool = S.cards.filter(k => lernAuswahl.has(k.deckId))
    .filter(modus === 'heute' ? istHeuteGenau : istFaellig);
  if (!pool.length) return toast('Keine fälligen Karten in der Auswahl.');

  // Geschwisterabfragen zurückstellen: Die Lücken eines Satzes und die
  // beiden Richtungen einer Vokabel gehören zusammen. Kämen sie in derselben
  // Sitzung dran, verriete die erste die Antwort der übrigen — der
  // Lückentext zeigt die anderen Lücken im Klartext, die Rückwärtsfrage ist
  // die Antwort der Vorwärtsfrage. Die Bewertung misst dann Wiedererkennen
  // statt Erinnern, und FSRS verlängert die Abstände auf falscher Grundlage.
  const familien = new Set();
  const zurueckgestellt = [];
  pool = pool.slice()
    .sort((a, b) => String(a.due || '').localeCompare(String(b.due || '')))
    .filter(k => {
      const familie = k.quelleId || k.id;
      if (familien.has(familie)) { zurueckgestellt.push(k); return false; }
      familien.add(familie);
      return true;
    });

  // Ohne Netz kann diese Abfrage hängen bleiben. Der Start darf davon nicht
  // abhängen — dieselbe Absicherung wie beim Erststart-Test.
  const heutigeNeu = await Promise.race([
    heutigeStatistikLaden(),
    new Promise(r => setTimeout(() => r(S.heutigeNeu), 3000))
  ]);
  const deckel = zahl(S.einstellungen.neuProTag, 5, 50, 20);
  const nochFrei = Math.max(0, deckel - heutigeNeu);
  const alte = pool.filter(k => !istNeu(k));
  let neue = pool.filter(istNeu);
  const uebrig = Math.max(0, neue.length - nochFrei);
  if (neue.length > nochFrei) neue = mischen(neue).slice(0, nochFrei);
  pool = alte.concat(neue);
  if (!pool.length) return toast(
    `Tagesgrenze für neue Karten erreicht (${deckel}/Tag). In der Auswahl sind nur noch neue Karten fällig.`, 'fehler');

  sitzung = {
    // KONZEPT §6.5: Interleaving — die gewählten Kästen werden gemischt
    // abgearbeitet, nicht blockweise nacheinander.
    karten: mischen(pool), i: 0, aufgedeckt: false, aktiv: true,
    zaehler: { 1: 0, 2: 0, 3: 0, 4: 0 }, gesamt: pool.length,
    start: Date.now(), kartenStart: Date.now(), sekunden: 0,
    proDeck: {}, bewertet: 0, uebrigeNeue: uebrig,
    zurueckgestellt: zurueckgestellt.length
  };
  kartenZustandLeeren(sitzung);
  malSitzung();
}

/* Doppeltipp-Schutz. Auf dem Handy trifft der zweite Tipp eines
   Doppeltipps dieselbe Bildschirmstelle der bereits nachgerückten Karte —
   dort liegt „Antwort zeigen“ bzw. „Prüfen“, und die nächste Karte wäre
   ungefragt aufgedeckt. Bewusst an Ort UND Zeit festgemacht statt an einer
   pauschalen Sperre: Wer zügig lernt, drückt durchaus 200 ms nach der
   Bewertung schon wieder — nur eben nicht auf denselben Punkt. */
let letzteBewertungsStelle = null;
document.addEventListener('click', e => {
  if (!sitzung?.aktiv || !e.clientX || !e.clientY) return;
  if (e.target.closest?.('[data-bew]')) {
    letzteBewertungsStelle = { x: e.clientX, y: e.clientY, t: Date.now() };
    return;
  }
  if (!letzteBewertungsStelle) return;
  const nah = Math.abs(e.clientX - letzteBewertungsStelle.x) < 45
           && Math.abs(e.clientY - letzteBewertungsStelle.y) < 45;
  if (nah && Date.now() - letzteBewertungsStelle.t < 400) { e.preventDefault(); e.stopPropagation(); }
}, true);

/** Zustand, der nur zur gerade gezeigten Karte gehört. */
function kartenZustandLeeren(s) {
  s.modus = null; s.urteil = null; s.mcOptionen = null; s.mcGewaehlt = null;
  s.gesprochenFuer = -1;
}

function malSitzung() {
  const ziel = $('#seite-lernen');
  const s = sitzung;
  if (!s) return malLernen();

  if (s.i >= s.karten.length) return malAbschluss();

  // Inhalt aus dem aktuellen Bestand nehmen, falls die Karte inzwischen
  // woanders bearbeitet wurde. Fehlt sie, bleibt die Kopie stehen —
  // bewerten() fängt den Fall ab.
  const frisch = S.cards.find(x => x.id === s.karten[s.i].id);
  if (frisch) s.karten[s.i] = frisch;

  const k = s.karten[s.i];
  if (!s.modus) {
    s.modus = modusFuer(k);
    if (s.modus === 'mc') {
      s.mcOptionen = mcOptionenBauen(k);
      if (!s.mcOptionen) s.modus = 'aufdecken';   // zu wenige Distraktoren
    }
  }
  const modi = deckModi(k.deckId);
  const hoeren = modi.includes('hoeren');
  // Reiner Hörmodus: ist „Hören“ der einzige gewählte Modus, bleibt die Frage
  // verdeckt und wird nur vorgelesen — sonst ist Hören eine Ergänzung.
  // Ohne Sprachausgabe wäre eine verdeckte Frage unbeantwortbar; dann wird
  // der Text gezeigt, statt den Nutzer vor eine leere Karte zu setzen.
  const nurHoeren = hoeren && modi.length === 1 && !istClozeVariante(k) && sprachAusgabeDa();
  if (hoeren && !sprachAusgabeDa() && !hoerenHinweisGezeigt) {
    hoerenHinweisGezeigt = true;
    setTimeout(() => toast('Dieser Browser bietet keine Sprachausgabe an — die Karten werden angezeigt.', 'fehler'), 300);
  }

  const fach = fachVon(k);
  const proz = Math.round((s.i / s.gesamt) * 100);
  const ueberfaellig = tageDiff(heute(), k.due || heute());
  const marke = variantenMarke(k);
  const markeHtml = marke ? esc(marke) + ' · ' : '';
  const lautsprecher = was =>
    hoeren ? `<button type="button" class="sprech-knopf" data-tu="vorlesen" data-id="${was}"
                 aria-label="Vorlesen" title="Vorlesen">🔊</button>` : '';

  ziel.innerHTML = `
    <div class="spread" style="margin-bottom:8px">
      <span class="mini">${s.i + 1} / ${s.gesamt}${
        s.modus !== 'aufdecken' || hoeren ? ` · ${esc(modusEtikett(s.modus, hoeren))}` : ''}</span>
      <button class="btn klein" data-tu="abbrechen">Beenden</button>
    </div>
    <div class="fortschritt"><div style="width:${proz}%"></div></div>

    <div class="flip-buehne">
      <div class="flip-karte ${s.aufgedeckt ? 'gedreht' : ''}" id="flip">
        <div class="flip-seite vorn">
          <div class="flip-kopf">
            <span style="color:${esc(deckFarbe(k.deckId))}">${esc(deckName(k.deckId))}</span>
            <span>${markeHtml}Fach ${fach}${istNeu(k) ? ' · neu' : ''}${ueberfaellig > 0 ? ` · ${ueberfaellig} T. überfällig` : ''}</span>
          </div>
          ${nurHoeren
            ? `<div class="nur-hoeren"><span class="gross-ico">🔊</span>Die Frage wird vorgelesen</div>`
            : `<div class="flip-text">${frageHtml(k)}</div>`}
          ${lautsprecher('frage')}
        </div>
        <div class="flip-seite hinten">
          <div class="flip-kopf">
            <span style="color:${esc(deckFarbe(k.deckId))}">${esc(deckName(k.deckId))}</span>
            <span>${markeHtml}Fach ${fach}</span>
          </div>
          <div class="flip-text">${antwortHtml(k)}</div>
          ${nurHoeren ? `<div class="flip-notiz">Frage: ${esc(frageText(k))}</div>` : ''}
          ${k.notiz ? `<div class="flip-notiz">${esc(k.notiz)}</div>` : ''}
          ${lautsprecher('antwort')}
        </div>
      </div>
    </div>

    <div id="aktionen">${aktionenHtml(s, k)}</div>`;

  verdrahten(ziel);
  aktionenVerdrahten();
  // Klick auf die Karte deckt nur dort auf, wo es keine Eingabe gibt —
  // sonst würde ein Fehlklick die Tipp- oder Auswahlaufgabe überspringen.
  // Der Lautsprecher liegt innerhalb der Karte: ohne diese Ausnahme würde
  // jedes Nachhören die Antwort aufdecken, im reinen Hörmodus wäre die
  // Wiederholtaste damit unbrauchbar.
  if (s.modus === 'aufdecken')
    $('#flip')?.addEventListener('click', ev => {
      if (ev.target.closest('.sprech-knopf')) return;
      if (!sitzung?.aufgedeckt) umdrehen();
    });

  if (hoeren && s.gesprochenFuer !== s.i && !s.aufgedeckt) {
    s.gesprochenFuer = s.i;
    sprechen(frageText(k), spracheFuer(k, 'frage'));
  }
  if (s.modus === 'tippen' && !s.aufgedeckt) $('#tipp-eingabe')?.focus();
}

function modusEtikett(modus, hoeren) {
  const n = MODUS_NAME[modus] || MODUS_NAME.aufdecken;
  return hoeren && modus !== 'hoeren' ? n + ' + Hören' : n;
}

/** Der Bereich unter der Karte — je nach Modus und Auswertungsstand. */
function aktionenHtml(s, k) {
  const teile = [];
  if (s.modus === 'mc' && s.mcOptionen) teile.push(mcHtml(s));
  if (s.urteil) teile.push(urteilHtml(s.urteil, k));
  if (s.aufgedeckt) teile.push(bewertungsHtml(k, s.urteil));
  else if (s.modus === 'tippen') teile.push(tippenHtml());
  else if (s.modus !== 'mc') teile.push(aufdeckHtml());
  return teile.join('');
}

function aufdeckHtml() {
  return `<button class="btn primary gross breit" data-tu="umdrehen">Antwort zeigen</button>
          <p class="tastenhilfe"><kbd>Leertaste</kbd></p>`;
}

function tippenHtml() {
  return `<div class="tipp-zeile">
      <input id="tipp-eingabe" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Antwort eintippen …"
             aria-label="Antwort eintippen">
      <button class="btn primary" data-tu="tippPruefen">Prüfen</button>
    </div>
    <p class="tastenhilfe"><kbd>Enter</kbd> prüfen · leer lassen und <kbd>Enter</kbd> zeigt die Antwort</p>`;
}

const MC_BUCHSTABEN = ['A', 'B', 'C', 'D'];
function mcHtml(s) {
  return `<div class="mc-liste">${s.mcOptionen.map((o, i) => {
    const fertig = !!s.urteil;
    const klasse = !fertig ? '' : o.richtig ? ' richtig' : (i === s.mcGewaehlt ? ' falsch' : '');
    return `<button type="button" class="mc-option${klasse}" data-mc="${i}" ${fertig ? 'disabled' : ''}>
       <span class="mc-buchstabe">${MC_BUCHSTABEN[i]}</span><span>${esc(o.text)}</span></button>`;
  }).join('')}</div>
    ${s.urteil ? '' : `<p class="tastenhilfe"><kbd>A</kbd>–<kbd>D</kbd> oder anklicken</p>`}`;
}

/** Bewertungsvorschlag aus der automatischen Auswertung.
 *  Bewusst kein Vorschlag bei „falsch“: Die 1 wirft eine reife Karte um
 *  Monate zurück. Wer gerade getippt und Enter gedrückt hat, drückt Enter
 *  gern noch einmal — dieser Reflex darf nicht die härteste Bewertung
 *  auslösen, zumal die Auswertung selbst danebenliegen kann. */
function urteilVorschlag(art) {
  return (art === 'richtig' || art === 'fast') ? 3 : null;
}

function urteilHtml(u, k) {
  const titel = {
    richtig: 'Richtig',
    fast:    'Fast richtig — als gewusst werten?',
    falsch:  'Nicht richtig',
    leer:    'Antwort angesehen'
  }[u.art] || '';
  const ikon = { richtig: '✓', fast: '≈', falsch: '✗', leer: '👁' }[u.art] || '';
  const klasse = u.art === 'leer' ? '' : u.art;
  const zeilen = [];
  if (u.eingabe) zeilen.push(`Deine Antwort: <strong>${esc(u.eingabe)}</strong>`);
  if (u.art !== 'richtig') zeilen.push(`Richtig wäre: <strong>${esc(antwortText(k))}</strong>`);
  return `<div class="urteil ${klasse}">
      <span style="font-size:19px;line-height:1.15">${ikon}</span>
      <span><b>${titel}</b>${zeilen.length ? `<span class="ihre">${zeilen.join('<br>')}</span>` : ''}</span>
    </div>
    ${u.art === 'fast' ? `<div class="row" style="margin-bottom:12px">
      <button class="btn" data-tu="fastJa">Ja, als gewusst werten</button>
      <button class="btn" data-tu="fastNein">Nein, nicht gewusst</button>
    </div>` : ''}`;
}

function aktionenVerdrahten() {
  const a = $('#aktionen');
  if (!a) return;
  verdrahten(a);
  $$('[data-bew]', a).forEach(b =>
    b.addEventListener('click', () => bewerten(Number(b.dataset.bew))));
  $$('[data-mc]', a).forEach(b =>
    b.addEventListener('click', () => mcWaehlen(Number(b.dataset.mc))));
  const feld = $('#tipp-eingabe', a);
  if (feld) feld.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); tippAuswerten(); }
    // Der globale Tastaturhandler lässt Eingabefelder in Ruhe — ohne diese
    // Zeile wäre Esc genau dort wirkungslos, wo der Cursor immer steht.
    if (e.key === 'Escape') { e.preventDefault(); sitzungBeenden(false); }
  });
}

/** Aufdecken ohne die Karte neu zu zeichnen — sonst entstünde das Element neu
 *  und die Umdreh-Animation liefe gar nicht erst an. */
function aktionenAuffrischen() {
  const s = sitzung;
  if (!s) return;
  const k = s.karten[s.i];
  const karte = $('#flip'), a = $('#aktionen');
  if (!karte || !a || !k) return malSitzung();
  karte.classList.add('gedreht');
  a.innerHTML = aktionenHtml(s, k);
  aktionenVerdrahten();
  if (deckModi(k.deckId).includes('hoeren')) sprechen(antwortText(k), spracheFuer(k, 'antwort'));
}

function tippAuswerten() {
  const s = sitzung;
  if (!s?.aktiv || s.aufgedeckt) return;
  const k = s.karten[s.i];
  if (!k) return;
  const eingabe = String($('#tipp-eingabe')?.value ?? '').trim();
  s.urteil = { art: antwortPruefen(eingabe, antwortText(k)), eingabe };
  s.aufgedeckt = true;
  aktionenAuffrischen();
}

function mcWaehlen(i) {
  const s = sitzung;
  if (!s?.aktiv || s.aufgedeckt || !s.mcOptionen) return;
  const opt = s.mcOptionen[i];
  if (!opt) return;
  s.mcGewaehlt = i;
  s.urteil = { art: opt.richtig ? 'richtig' : 'falsch', eingabe: opt.text };
  s.aufgedeckt = true;
  aktionenAuffrischen();
}

/** Text für "in wie vielen Tagen" unter jedem Bewertungsknopf. */
function intervallTextAus(tage) {
  return tage <= 0 ? 'heute' : tage === 1 ? 'morgen' : tage < 31 ? tage + ' Tage'
    : tage < 365 ? Math.round(tage / 30) + ' Mon.' : Math.round(tage / 365 * 10) / 10 + ' J.';
}
/** Vorschau für alle vier Bewertungen — je nach Modus aus der festen
 *  Intervalltabelle oder direkt von FSRS. repeat() liefert alle vier
 *  Ausgänge auf einen Schlag, genau passend für diese Vorschau. */
function intervallVorschauTexte(k) {
  // Der Prüfungstermin staucht die Fälligkeit — die Vorschau muss denselben
  // Weg nehmen, sonst verspricht sie „1,4 Jahre“ und die Karte kommt in vier
  // Tagen wieder.
  const gestaucht = iso => tageDiff(terminStauchen(iso, k.deckId, k.id), heute());
  if (S.einstellungen.klassikModus) {
    const iv = S.einstellungen.intervalle;
    const max = iv.length;
    const alt = fachVon(k);
    const out = {};
    [1, 2, 3, 4].forEach(r => {
      const neu = r === 1 ? 1 : r === 2 ? alt : Math.min(max, alt + (r === 3 ? 1 : 2));
      out[r] = intervallTextAus(gestaucht(plusTage(heute(), iv[neu - 1] ?? iv[max - 1])));
    });
    return out;
  }
  try {
    const vorschau = fsrsMotor().repeat(fsrsKarteAus(k), fsrsJetzt());
    const out = {};
    [1, 2, 3, 4].forEach(r => { out[r] = intervallTextAus(gestaucht(datumZuIso(vorschau[r].card.due))); });
    return out;
  } catch (e) {
    console.warn('[Vorschau]', e);
    return { 1: '–', 2: '–', 3: '–', 4: '–' };
  }
}

/** Die vier Bewertungsknöpfe. Kam die Karte aus einer automatischen
 *  Auswertung (Tippen, Multiple Choice), wird die dazu passende Bewertung
 *  hervorgehoben und liegt auf der Eingabetaste — die Feinabstufung 1–4
 *  bleibt aber immer beim Nutzer. */
function bewertungsHtml(k, urteil) {
  const vorschauTexte = intervallVorschauTexte(k);
  const empfohlen = urteil ? urteilVorschlag(urteil.art) : null;
  const knopf = (r, titel) =>
    `<button class="bew bew${r}${r === empfohlen ? ' empfohlen' : ''}" data-bew="${r}">
       <b>${r}</b><span>${titel}</span><small>${vorschauTexte[r]}</small></button>`;
  return `<div class="bewertung">
      ${knopf(1, 'Nicht gewusst')}${knopf(2, 'Schwer')}${knopf(3, 'Gewusst')}${knopf(4, 'Sehr leicht')}
    </div>
    <p class="tastenhilfe"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd>${
      empfohlen ? ` · <kbd>Enter</kbd> übernimmt ${empfohlen}` : ''}</p>`;
}

/* Nicht neu zeichnen, sondern nur umklappen — sonst entsteht das Element neu
   und die CSS-Animation läuft gar nicht erst an. */
function umdrehen() {
  if (!sitzung?.aktiv || sitzung.aufgedeckt) return;
  sitzung.aufgedeckt = true;
  aktionenAuffrischen();
}

/* ---------- 9b. FSRS (Stufe 2) ------------------------------------------ */

/** ts-fsrs rechnet mit echten Datumsobjekten und eigener Tagesarithmetik
 *  (dateDiffInDays, UTC-Kalendertage). Die App rechnet Tage konsequent über
 *  ISO-Strings und eine eigene Tagesgrenze (heute(), TAGESGRENZE). Damit
 *  beide dieselben Tage zählen, wird FSRS nie der reale Sekunden-Zeitpunkt
 *  übergeben, sondern die UTC-Mitternacht des App-"heute". */
function isoZuDatum(iso) { return new Date((iso || heute()) + 'T00:00:00.000Z'); }
function datumZuIso(d) {
  if (!(d instanceof Date) || isNaN(d.getTime())) return heute();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}
function fsrsJetzt() { return isoZuDatum(heute()); }

/** Parameter frisch aufbauen statt zu cachen — die Retention kann sich in
 *  den Einstellungen jederzeit ändern. Lernschritte bewusst auf einen
 *  kurzen Schritt reduziert (KONZEPT §4.1: „keine mehrstufigen Ketten“). */
function fsrsMotor() {
  return new FSRS.FSRS(FSRS.generatorParameters({
    request_retention: S.einstellungen.retention,
    learning_steps: ['10m'],
    relearning_steps: ['10m']
  }));
}

/** App-Karte in das von ts-fsrs erwartete Card-Objekt übersetzen.
 *
 *  ts-fsrs akzeptiert als Gedächtniszustand nur zwei Formen: exakt
 *  (stability:0, difficulty:0) = „noch kein Zustand, aus der ersten
 *  Bewertung initialisieren" — oder difficulty ≥ 1 UND stability > 0.
 *  Alles dazwischen wirft FSRSValidationError („Invalid memory state").
 *  Der Stufe-1-Altbestand enthält genau so einen Zwischenzustand: nie
 *  gelernte Karten wurden dort mit difficulty:5 bei stability:0 angelegt.
 *  Ohne die Normalisierung hier wären diese Karten im FSRS-Modus für
 *  immer unlernbar (jede Bewertung würde abgefangen und übersprungen). */
function fsrsKarteAus(k) {
  let stability = Number(k.stability) || 0;
  let difficulty = Number(k.difficulty) || 0;
  if (!(difficulty >= 1 && stability > 0)) {
    if (Number(k.reps) > 0 && stability > 0) {
      // gelernt, aber difficulty fehlt/kaputt → reparieren statt verwerfen
      difficulty = Math.min(10, Math.max(1, difficulty || 5));
    } else {
      // nie gelernt (oder ohne brauchbare Stabilität) → frischer Zustand
      stability = 0; difficulty = 0;
    }
  }
  return {
    due: isoZuDatum(k.due),
    stability,
    difficulty,
    elapsed_days: 0,          // wird von ts-fsrs aus last_review + jetzt neu berechnet
    scheduled_days: 0,
    learning_steps: Number(k.learningSteps) || 0,
    reps: Number(k.reps) || 0,
    lapses: Number(k.lapses) || 0,
    state: [0, 1, 2, 3].includes(k.state) ? k.state : 0,
    last_review: k.lastReview ? isoZuDatum(k.lastReview) : undefined
  };
}

const FSRS_STANDARD_GEWICHTE = [
  0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722,
  0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425,
  0.0912, 0.0658, 0.1542
];
/** Intervallformel von ts-fsrs (FSRS-6), unabhängig nachgebildet für die
 *  Folgeabschätzung des Retention-Reglers — eine echte Simulation über alle
 *  Karten wäre dafür zu teuer, eine Näherung reicht als Orientierung. */
function fsrsIntervallTage(stability, retention, w) {
  const decay = -w[20];
  const factor = Math.exp(Math.log(0.9) / decay) - 1;
  const modifier = (Math.pow(retention, 1 / decay) - 1) / factor;
  return Math.min(36500, Math.max(1, Math.round((stability || 0.5) * modifier)));
}
/** Renewal-Theorie-Näherung: Summe 1/Intervall über alle aktiven Karten
 *  ergibt die erwartete Anzahl Wiederholungen pro Tag im eingeschwungenen
 *  Zustand. Nur eine Orientierungshilfe, keine exakte Vorhersage. */
function geschaetzteWiederholungenProTag(retention) {
  // Nur Karten, die schon im Umlauf sind. Eine noch nie gelernte Karte
  // erzeugt heute keine Wiederholung — würde sie mitgezählt, spränge die
  // Schätzung nach jedem Import oder nach dem Einschalten der zweiten
  // Abfragerichtung um ein Vielfaches nach oben, und der Regler daneben
  // wäre nicht mehr sinnvoll einzustellen.
  const karten = S.cards.filter(k => !k.suspendiert && !istNeu(k));
  if (!karten.length) return 0;
  let summe = 0;
  karten.forEach(k => { summe += 1 / fsrsIntervallTage(Number(k.stability) || 0.5, retention, FSRS_STANDARD_GEWICHTE); });
  return Math.round(summe * 10) / 10;
}

/** Datenbank-Patch für eine Bewertung — Klassik-Modus (feste Fachintervalle,
 *  wie Stufe 1) oder FSRS, je nach Einstellung. */
function bewertungsPatch(k, rating) {
  if (S.einstellungen.klassikModus) {
    const iv = S.einstellungen.intervalle;
    const max = iv.length;
    const alt = fachVon(k);
    const neuFach = rating === 1 ? 1
                  : rating === 2 ? alt
                  : Math.min(max, alt + (rating === 3 ? 1 : 2));
    const tage = iv[neuFach - 1] ?? iv[max - 1];
    return {
      fach: neuFach,
      due: terminStauchen(plusTage(heute(), tage), k.deckId, k.id),
      stability: tage,
      lastReview: heute(),
      reps: (Number(k.reps) || 0) + 1,
      lapses: (Number(k.lapses) || 0) + (rating === 1 ? 1 : 0),
      state: rating === 1 ? 3 : 2
    };
  }
  const { card } = fsrsMotor().next(fsrsKarteAus(k), fsrsJetzt(), rating);
  const schwellen = STANDARD_INTERVALLE.filter(g => card.stability >= g).length;
  return {
    // Der Prüfungstermin staucht nur die Fälligkeit, nicht die Stabilität:
    // Die gemessene Gedächtnisstärke bleibt, was sie ist — vorgezogen wird
    // allein der Termin (KONZEPT §6.6).
    due: terminStauchen(datumZuIso(card.due), k.deckId, k.id),
    stability: card.stability,
    difficulty: card.difficulty,
    lastReview: heute(),
    reps: card.reps,
    lapses: card.lapses,
    state: card.state,
    learningSteps: card.learning_steps || 0,
    // "fach" wird auch im FSRS-Modus als Spiegel der Stabilität mitgeschrieben
    // (KONZEPT §4.3-Schwellen) — nicht weil FSRS ihn braucht, sondern damit
    // ein späteres Zurückschalten in den Klassik-Modus nicht auf einem
    // veralteten Fach-Wert aufsetzt und Monate an Fortschritt zurückwirft.
    fach: Math.max(1, Math.min(12, schwellen + 1))
  };
}

function bewerten(rating) {
  const s = sitzung;
  if (!s?.aktiv || !s.aufgedeckt) return;
  // Doppeltippen auf dem Handy: Der zweite Tipp landet sonst auf derselben
  // Stelle der nächsten Karte — dort liegt „Antwort zeigen“ bzw. „Prüfen“,
  // und die nächste Karte wäre ungefragt aufgedeckt.
  if (s.zuletztBewertet && Date.now() - s.zuletztBewertet < 300) return;
  const gezeigt = s.karten[s.i];
  if (!gezeigt) return;
  // Die Sitzung arbeitet mit Kopien vom Startzeitpunkt. Vor dem Schreiben
  // auf den aktuellen Stand beziehen — sonst überschriebe eine Bewertung
  // stillschweigend, was inzwischen auf einem anderen Gerät passiert ist.
  const k = S.cards.find(x => x.id === gezeigt.id);
  if (!k) {
    toast('Diese Karte gibt es nicht mehr — sie wird übersprungen.');
    s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
    kartenZustandLeeren(s);
    return malSitzung();
  }
  s.karten[s.i] = k;
  s.zuletztBewertet = Date.now();

  // Deckel bei drei Minuten: Länger sitzt niemand an einer Karteikarte —
  // was darüber liegt, ist eine Unterbrechung und keine Lernzeit.
  const sekunden = Math.min(180, Math.round((Date.now() - s.kartenStart) / 1000));
  const warNeu = istNeu(k);
  let patch;
  try {
    patch = bewertungsPatch(k, rating);
  } catch (e) {
    console.error('[Terminierung]', e);
    toast('Terminierung fehlgeschlagen, Karte wird übersprungen: ' + (e?.message || e), 'fehler');
    s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
    kartenZustandLeeren(s);
    return malSitzung();
  }
  // Zeit je Karte mitschreiben (KONZEPT §6.7) — daraus wird in der Statistik
  // sichtbar, welche Karten unverhältnismäßig viel Zeit kosten. Eigener
  // Zähler dafür: Der Bestand aus Stufe 1–3 hat Wiederholungen ohne
  // Zeitmessung, und durch `reps` geteilt käme dort dauerhaft „0 s“ heraus.
  patch.zeitGesamt = (Number(k.zeitGesamt) || 0) + sekunden;
  patch.zeitReps = (Number(k.zeitReps) || 0) + 1;

  // Problemkarte (KONZEPT §6.3): Wer eine Karte immer wieder vergisst, lernt
  // nicht die Sache, sondern übt das Scheitern. Sie wird ausgesetzt und zur
  // Umformulierung vorgeschlagen, statt weiter Zeit zu binden.
  //
  // Ausgelöst wird das nur durch einen NEUEN Aussetzer. Ohne diese Bedingung
  // würde jede Bewertung — auch „sehr leicht“ — eine Karte aussetzen, sobald
  // ihr Lebenszähler über der Grenze liegt. Beim ersten Öffnen nach dem
  // Umstieg träfe das reihenweise Karten, die längst wieder sitzen.
  const grenze = leechGrenze();
  const neuerAussetzer = (Number(patch.lapses) || 0) > (Number(k.lapses) || 0);
  const zaehlerNeu = Math.max(0, (Number(patch.lapses) || 0) - (Number(k.leechBasis) || 0));
  const nunProblem = neuerAussetzer && zaehlerNeu >= grenze && !k.leech;
  if (nunProblem) { patch.leech = true; patch.suspendiert = true; }

  Object.assign(k, patch);                                   // lokal sofort
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), 'Bewertung');
  if (nunProblem) {
    // Ruhen gilt für die ganze Kartenfamilie — sonst kämen die übrigen
    // Lücken bzw. die Gegenrichtung weiter dran, obwohl die Karte in der
    // Oberfläche als ruhend geführt wird.
    const familie = mitVarianten([k.id]).filter(x => x !== k.id);
    if (familie.length) {
      familie.forEach(x => { const c = S.cards.find(y => y.id === x); if (c) c.suspendiert = true; });
      variantenOpsSchreiben(familie.map(x => ['merge', x, { suspendiert: true }]), 'Problemkarte aussetzen');
    }
    toast(`„${frageText(k).slice(0, 40)}“ ist ${zaehlerNeu}× durchgefallen und ruht jetzt. ` +
      'Unter Karten → Problemkarten kannst du sie umformulieren.', 'fehler');
    s.problemkarten = (s.problemkarten || 0) + 1;
  }

  s.zaehler[rating]++; s.bewertet++; s.sekunden += sekunden;
  s.proDeck[k.deckId] = (s.proDeck[k.deckId] || 0) + 1;
  tagesstatistikSchreiben(rating, sekunden, k.deckId, warNeu);
  streakPflegen();

  sprechenStoppen();
  s.i++; s.aufgedeckt = false; s.kartenStart = Date.now();
  kartenZustandLeeren(s);
  malSitzung();
}

function tagesstatistikSchreiben(rating, sekunden, deckId, warNeu) {
  const tag = heute();
  schreibe(FB.setDoc(FB.doc(colReviews(), tag), {
    datum: tag,
    anzahl: FB.increment(1),
    neu: FB.increment(warNeu ? 1 : 0),
    sekunden: FB.increment(sekunden),
    bewertungen: { [rating]: FB.increment(1) },
    proDeck: { [deckId]: FB.increment(1) },
    sekundenProDeck: { [deckId]: FB.increment(sekunden) }
  }, { merge: true }), 'Tagesstatistik');
  S.reviewsGeladen = false;
}

function streakPflegen() {
  const tag = heute();
  const e = S.einstellungen;
  if (e.lastLearnDate === tag) return;
  const neuerStreak = e.lastLearnDate === plusTage(tag, -1) ? (Number(e.streak) || 0) + 1 : 1;
  e.lastLearnDate = tag; e.streak = neuerStreak;
  schreibe(FB.setDoc(refEinstellungen(),
    { lastLearnDate: tag, streak: neuerStreak }, { merge: true }), 'Streak');
}

function sitzungBeenden(still) {
  sprechenStoppen();
  if (!sitzung) return;
  if (still) { sitzung = null; letzteSitzung = null; return; }
  sitzung.aktiv = false;
  malAbschluss();
}

function malAbschluss() {
  const s = sitzung || letzteSitzung;
  if (!s) return malLernen();
  s.aktiv = false;
  letzteSitzung = s;
  sitzung = null;
  heutigeStatistikLaden();   // im Hintergrund auffrischen, für den Ring auf dem Startbildschirm
  const min = Math.max(1, Math.round(s.sekunden / 60));
  const proKarte = s.bewertet ? (s.sekunden / s.bewertet).toFixed(1) : '0';
  const offenN = s.gesamt - s.bewertet;

  $('#seite-lernen').innerHTML = `
    <div style="text-align:center;padding:26px 0">
      <div style="font-size:44px;line-height:1">🎉</div>
      <h1 style="margin-top:12px">${offenN ? 'Sitzung beendet' : 'Sitzung abgeschlossen!'}</h1>
      <p class="muted">${s.bewertet} von ${s.gesamt} Karten bewertet${offenN ? ` · ${offenN} offen` : ''}</p>
    </div>
    <div class="kennzahlen">
      <div class="kennzahl"><b>${s.bewertet}</b><span>Karten</span></div>
      <div class="kennzahl"><b>${min}</b><span>Minuten</span></div>
      <div class="kennzahl"><b>${proKarte}s</b><span>pro Karte</span></div>
      <div class="kennzahl"><b>${S.einstellungen.streak || 0}</b><span>Tage Streak</span></div>
    </div>
    <div class="box mt">
      ${[1, 2, 3, 4].map(r => {
        const n = s.zaehler[r], p = s.bewertet ? Math.round(n / s.bewertet * 100) : 0;
        const farbe = ['var(--bewertung-1)', 'var(--bewertung-2)', 'var(--bewertung-3)', 'var(--bewertung-4)'][r - 1];
        const t = ['Nicht gewusst', 'Schwer', 'Gewusst', 'Sehr leicht'][r - 1];
        return `<div class="balken"><span class="lab">${r} ${t.slice(0, 6)}.</span>
          <span class="spur"><span class="fuell" style="width:${p}%;background:${farbe}"></span></span>
          <span class="val">${n}</span></div>`;
      }).join('')}
    </div>
    ${s.uebrigeNeue ? `<p class="mini mt" style="text-align:center">
      ${s.uebrigeNeue} weitere neue ${s.uebrigeNeue === 1 ? 'Karte wartet' : 'Karten warten'} —
      Tagesgrenze für neue Karten erreicht.</p>` : ''}
    ${s.zurueckgestellt ? `<p class="mini mt" style="text-align:center">
      ${s.zurueckgestellt} ${s.zurueckgestellt === 1 ? 'Abfrage' : 'Abfragen'} zurückgestellt:
      weitere Lücken bzw. die Gegenrichtung von Karten, die heute schon dran waren.
      Sie kommen beim nächsten Mal.</p>` : ''}
    ${s.problemkarten ? `<div class="hinweis mt">
      <strong>${s.problemkarten} ${s.problemkarten === 1 ? 'Karte wurde' : 'Karten wurden'}
      als Problemkarte ausgesetzt</strong>, weil sie immer wieder durchfallen.
      Umformulieren hilft mehr als weiter üben.
      <div style="margin-top:8px"><button class="btn klein" data-tu="zuProblemkarten">
        Problemkarten ansehen</button></div></div>` : ''}
    <div class="row mt2" style="justify-content:center">
      <button class="btn primary" data-tu="nochmal">Zur Übersicht</button>
      <button class="btn" data-tu="zuStatistik">Statistik ansehen</button>
    </div>`;
  verdrahten($('#seite-lernen'));
}

const KARTEN_FILTER = {
  alle:    ['Alle Karten',    () => true],
  faellig: ['Nur fällige',    istFaellig],
  neu:     ['Nur neue',       k => istNeu(k) && !k.suspendiert],
  problem: ['Problemkarten',  istProblemkarte],
  ruht:    ['Ruhende',        k => !!k.suspendiert]
};

function gefilterteKarten() {
  const q = S.kartenSuche.trim().toLowerCase();
  let l = S.cards;
  if (S.kartenFilterDeck !== 'alle') l = l.filter(k => k.deckId === S.kartenFilterDeck);
  const filter = KARTEN_FILTER[S.kartenFilter] ? S.kartenFilter : 'alle';
  if (filter !== 'alle') l = l.filter(KARTEN_FILTER[filter][1]);
  if (q) {
    const teile = q.split(/\s+/);
    l = l.filter(k => {
      const heu = (k.frage + ' ' + k.antwort + ' ' + (k.notiz || '') + ' ' +
                   deckName(k.deckId) + ' ' + (k.tags || []).join(' ')).toLowerCase();
      return teile.every(t => heu.includes(t));
    });
  }
  return l.slice().sort((a, b) =>
    (a.due || '').localeCompare(b.due || '') || (a.frage || '').localeCompare(b.frage || '', 'de'));
}

  verdrahten(ziel);
  const suche = $('#k-suche');
  suche.addEventListener('input', () => {

    clearTimeout(suche._t);
    suche._t = setTimeout(() => {

      malKarten();

    }, 220);

  $('#k-deck').addEventListener('change', e => {

  });
  $('#k-filter').addEventListener('change', e => {
    S.kartenFilter = e.target.value; S.kartenLimit = 60; malKarten();

async function karteBearbeiten(id) {
  let k = id ? S.cards.find(x => x.id === id) : null;
  if (id && !k) return;
  // Abgeleitete Abfragen (Rückwärtskarte, einzelne Cloze-Lücke) tragen keinen
  // eigenen Inhalt — bearbeitet wird immer die Quellkarte.
  if (k && k.quelleId) {
    const quelle = S.cards.find(x => x.id === k.quelleId);
    if (quelle) { toast('Der Inhalt steht auf der Quellkarte — die wird geöffnet.'); k = quelle; }
    else {
      // Quellkarte fehlt (etwa nach einem unvollständigen Import). Die
      // Abfrage wird eigenständig — sonst entstünden beim Speichern
      // Abfragen einer Abfrage, die niemand mehr auflösen kann.
      k.quelleId = null; k.variante = 'v';
      schreibe(FB.setDoc(FB.doc(colCards(), k.id),
        { quelleId: null, variante: 'v' }, { merge: true }), 'Karte verselbständigen');
    }
  }
  if (!S.decks.length) return toast('Zuerst einen Kasten anlegen.');
  const vorDeck = k?.deckId || (S.kartenFilterDeck !== 'alle' ? S.kartenFilterDeck : S.decks[0].id);
  const klassik = S.einstellungen.klassikModus;
  const typAlt = KARTEN_TYPEN.includes(k?.typ) ? k.typ : 'standard';
  const antwortVorher = k ? String(k.antwort ?? '') : null;
  const abgeleitet = k ? abgeleiteteVon(k.id).length : 0;
  // Problemkarte kann auch an einer abgeleiteten Abfrage hängen (eine Lücke,
  // die Gegenrichtung). Bearbeitet wird trotzdem die Quellkarte — der
  // Wiederaufnehmen-Block muss deshalb auch dann erscheinen.
  const problemFamilie = k ? (istProblemkarte(k) || abgeleiteteVon(k.id).some(istProblemkarte)) : false;

  const r = await modal({
    titel: k ? 'Karte bearbeiten' : 'Neue Karte',
    breit: true,
    html: `
      <label class="feld"><span>Kartentyp</span>
        <select id="m-typ">
          <option value="standard" ${typAlt === 'standard' ? 'selected' : ''}>Frage und Antwort</option>
          <option value="cloze" ${typAlt === 'cloze' ? 'selected' : ''}>Lückentext</option>
        </select></label>
      <label class="feld"><span id="m-frage-titel">Frage</span><textarea id="m-frage">${esc(k?.frage || '')}</textarea></label>
      <div id="m-cloze-hilfe" hidden style="margin:-6px 0 12px">
        <div class="row" style="gap:8px">
          <button type="button" class="btn klein" id="m-cloze-einfuegen">Lücke aus Auswahl</button>
          <span class="mini" id="m-cloze-zahl"></span>
        </div>
        <p class="mini" style="margin-top:6px">Schreibweise <code>{{c1::Lösung}}</code>, mit Hinweis
          <code>{{c1::Lösung::Hinweis}}</code>. <strong>Jede Lücke wird eigenständig terminiert</strong> —
          aus einem Satz mit drei Lücken werden drei Abfragen.</p>
      </div>
      <label class="feld"><span id="m-antwort-titel">Antwort</span><textarea id="m-antwort">${esc(k?.antwort || '')}</textarea></label>
      <label class="feld"><span>Notiz (optional)</span><textarea id="m-notiz" style="min-height:56px">${esc(k?.notiz || '')}</textarea></label>
      <label class="feld"><span>Kasten</span><select id="m-deck">${S.decks.map(d =>
        `<option value="${esc(d.id)}" ${d.id === vorDeck ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      ${k ? `<div class="row" style="justify-content:space-between;gap:10px">
        <label class="feld" style="flex:1;margin:0"><span>Fach (1–12)${klassik ? '' : ' — abgeleitet'}</span>
          ${klassik
            ? `<input type="number" id="m-fach" min="1" max="12" value="${fachVon(k)}">`
            : `<input type="text" value="${fachVon(k)}" disabled title="Im FSRS-Modus ergibt sich das Fach aus der Stabilität und ist hier nicht editierbar.">`}
        </label>
        <label class="feld" style="flex:1;margin:0"><span>Fällig am</span>
          <input type="date" id="m-due" value="${esc(k.due || heute())}"></label>
      </div>
      <label class="karo" style="margin-top:6px"><input type="checkbox" id="m-susp" ${k.suspendiert ? 'checked' : ''}>
        <span>Ruhen lassen (kommt nicht mehr dran)</span></label>
      <p class="mini">${k.reps || 0} Wiederholungen · ${k.lapses || 0} Aussetzer ·
         zuletzt ${datumDeutsch(k.lastReview)}${klassik ? '' : ` · Stabilität ${Math.round(Number(k.stability) || 0)} Tage`}${
         schnittSekunden(k) ? ` · Ø ${Math.round(schnittSekunden(k))} s je Abfrage` : ''}</p>
      ${problemFamilie ? `<div class="hinweis rot" style="margin-bottom:12px">
        <strong>Problemkarte:</strong> ${leechZaehler(k) || Math.max(...abgeleiteteVon(k.id).map(leechZaehler), 0)}× nicht gewusst. Was meistens hilft:
        die Frage eindeutiger stellen, eine zu lange Antwort aufteilen, eine Eselsbrücke in die
        Notiz schreiben — oder prüfen, ob sie sich mit einer anderen Karte verwechselt.
        <label class="karo" style="margin-top:8px"><input type="checkbox" id="m-leech-weg">
          <span>Wieder aufnehmen (Problemkennzeichen entfernen, Karte lernt wieder mit)</span></label>
        <label class="karo" style="padding-top:0"><input type="checkbox" id="m-leech-reset">
          <span>Dabei den Lernstand zurücksetzen — sinnvoll, wenn du sie umformuliert hast</span></label>
      </div>` : ''}
      ${abgeleitet ? `<p class="mini">Diese Karte erzeugt ${abgeleitet + 1} eigenständig
         terminierte Abfragen. Termine und Fortschritt der zusätzlichen Abfragen bleiben beim
         Bearbeiten erhalten, solange die Lücken bzw. die Richtung bestehen bleiben.</p>` : ''}` : ''}`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, {
      text: k ? 'Speichern' : 'Anlegen', wert: 'ok', art: 'primary',
      pruefen: () => {
        const cloze = $('#m-typ').value === 'cloze';
        if (!$('#m-frage').value.trim()) {
          toast(cloze ? 'Der Lückentext darf nicht leer sein.' : 'Die Frage darf nicht leer sein.');
          return false;
        }
        if (cloze && !clozeNummern($('#m-frage').value).length) {
          toast('Bitte mindestens eine Lücke markieren, z. B. {{c1::Lösung}}.'); return false;
        }
        if (!cloze && !$('#m-antwort').value.trim()) {
          toast('Die Antwort darf nicht leer sein.'); return false;
        }
      }
    }],
    beimOeffnen: m => {
      const typSel = $('#m-typ', m), frageFeld = $('#m-frage', m);
      const aktualisieren = () => {
        const cloze = typSel.value === 'cloze';
        $('#m-cloze-hilfe', m).hidden = !cloze;
        $('#m-frage-titel', m).textContent = cloze ? 'Lückentext' : 'Frage';
        $('#m-antwort-titel', m).textContent = cloze ? 'Erläuterung (optional)' : 'Antwort';
        if (cloze) {
          const n = clozeNummern(frageFeld.value);
          $('#m-cloze-zahl', m).textContent = n.length
            ? `${n.length} ${n.length === 1 ? 'Lücke' : 'Lücken'} erkannt: c${n.join(' · c')}`
            : 'Noch keine Lücke markiert.';
        }
      };
      typSel.addEventListener('change', aktualisieren);
      frageFeld.addEventListener('input', aktualisieren);
      $('#m-cloze-einfuegen', m).addEventListener('click', () => {
        const anfang = frageFeld.selectionStart, ende = frageFeld.selectionEnd;
        const text = frageFeld.value;
        const auswahl = text.slice(anfang, ende) || 'Lösung';
        // Eine Lücke um eine bestehende Lücke herum ergäbe verschachtelte
        // Klammern — der Text wäre danach weder lesbar noch reparierbar,
        // und der Zähler zeigte trotzdem „alles in Ordnung“.
        if (/\{\{|\}\}/.test(auswahl))
          return toast('Die Auswahl enthält schon eine Lücke. Bitte nur reinen Text markieren.', 'fehler');
        const nummern = clozeNummern(text);
        const nr = (nummern.length ? nummern[nummern.length - 1] : 0) + 1;
        if (nr > 20) return toast('Mehr als 20 Lücken je Karte sind nicht vorgesehen.', 'fehler');
        const vorne = `{{c${nr}::`;
        frageFeld.value = text.slice(0, anfang) + vorne + auswahl + '}}' + text.slice(ende);
        frageFeld.focus();
        frageFeld.setSelectionRange(anfang + vorne.length, anfang + vorne.length + auswahl.length);
        aktualisieren();
      });
      aktualisieren();
    }
  });
  if (r !== 'ok') return;

  const typNeu = KARTEN_TYPEN.includes(W('m-typ', 'standard')) ? W('m-typ', 'standard') : 'standard';
  const werte = {
    frage: String(W('m-frage', '')).trim(),
    antwort: String(W('m-antwort', '')).trim(),
    notiz: String(letzteWerte['m-notiz'] ?? '').trim(),
    deckId: W('m-deck', vorDeck),
    typ: typNeu
  };
  if (!werte.frage) return;
  if (typNeu !== 'cloze' && !werte.antwort) return;

  if (k) {
    // Terminierung nur im Klassik-Modus über das Fach neu berechnen — im
    // FSRS-Modus ist die Stabilität eine gemessene Größe, kein aus dem Fach
    // abgeleiteter Wert, und darf beim bloßen Bearbeiten von Text nicht
    // überschrieben werden (sonst geht echter FSRS-Fortschritt verloren).
    if (klassik) {
      const fachNeu = zahl(W('m-fach', fachVon(k)), 1, 12, fachVon(k));
      Object.assign(werte, { fach: fachNeu, stability: S.einstellungen.intervalle[fachNeu - 1] });
    }
    // Sämtliche Felder einlesen, bevor unten eine Rückfrage aufgehen kann —
    // die überschreibt letzteWerte.
    Object.assign(werte, {
      due: W('m-due', k.due || heute()),
      suspendiert: letzteWerte['m-susp'] === true
    });
    // Problemkarte wieder aufnehmen (KONZEPT §6.3). Der Zähler bekommt einen
    // neuen Bezugspunkt — sonst wäre die Karte beim ersten Fehler sofort
    // wieder ausgesetzt, weil ihr Lebenszähler über der Grenze bleibt.
    // „Zurücksetzen“ allein wäre wirkungslos, weil die Karte weiter ruhte —
    // es schließt das Wiederaufnehmen deshalb ein.
    const wiederAuf = letzteWerte['m-leech-weg'] === true || letzteWerte['m-leech-reset'] === true;
    if (wiederAuf) {
      Object.assign(werte, { leech: false, suspendiert: false, leechBasis: Number(k.lapses) || 0 });
      if (letzteWerte['m-leech-reset'] === true) Object.assign(werte, {
        stability: 0, difficulty: 0, reps: 0, lapses: 0, state: 0, leechBasis: 0,
        fach: 1, lastReview: null, zeitGesamt: 0, zeitReps: 0, due: heute()
      });
      // Die Kennzeichnung kann an einer abgeleiteten Abfrage hängen — die
      // wird über die Quellkarte mitbefreit, sonst bliebe sie für immer als
      // Problemkarte gelistet und könnte nie wieder aussetzen.
      const geschwister = abgeleiteteVon(k.id);
      if (geschwister.length) {
        const patch = { leech: false, suspendiert: false, leechBasis: 0 };
        geschwister.forEach(g => Object.assign(g, patch));
        variantenOpsSchreiben(geschwister.map(g => ['merge', g.id, patch]), 'Problemkarte aufnehmen');
      }
    }

    // Trockenlauf: Entfällt durch diese Änderung eine Abfrage — etwa weil
    // eine Lücke gestrichen oder der Lückentext zur normalen Karte wurde —
    // geht deren Lernstand verloren. Vorher fragen.
    const vorschau = variantenPlan({ ...k, ...werte }, deckVon(werte.deckId));
    if (vorschau.entfernt && !await frage('Karte ändern',
      `Dadurch ${vorschau.entfernt === 1 ? 'entfällt eine eigenständig terminierte Abfrage'
        : `entfallen ${vorschau.entfernt} eigenständig terminierte Abfragen`} dieser Karte
       — mitsamt dem jeweiligen Lernfortschritt.`,
      'Trotzdem speichern', 'gefahr')) return;

    Object.assign(k, werte);
    schreibe(FB.updateDoc(FB.doc(colCards(), k.id), werte), 'Karte ändern');
    const bilanz = variantenAbgleichen(k, deckVon(werte.deckId));
    toast(bilanz.angelegt || bilanz.entfernt
      ? `Gespeichert. ${bilanz.angelegt} Abfragen angelegt, ${bilanz.entfernt} entfernt.`
      : 'Gespeichert.');
  } else {
    // Erst die Quellkarte, dann ihre weiteren Abfragen — die Quellkarte trägt
    // gleich die richtige Variante, damit sie nicht sofort nachgebessert
    // werden muss.
    const quellId = neueId();
    const soll = gewuenschteVarianten({ ...werte, id: quellId }, deckVon(werte.deckId));
    const quelle = neueKarte({ ...werte, variante: soll[0] });
    schreibe(FB.setDoc(FB.doc(colCards(), quellId), quelle), 'Karte anlegen');
    const weitere = soll.slice(1).map(v =>
      ['set', neueId(), neueKarte({ ...werte, quelleId: quellId, variante: v })]);
    variantenOpsSchreiben(weitere, 'Kartenvarianten');
    toast(weitere.length
      ? `Karte angelegt — ${soll.length} eigenständig terminierte Abfragen.`
      : 'Karte angelegt.');
    k = { ...quelle, id: quellId };
  }
  // Karten-Check ganz am Schluss und bewusst nach dem Speichern: Der Hinweis
  // soll nicht blockieren (KONZEPT §6.4), und niemand soll seine Eingabe
  // verlieren, weil die App sie für zu lang hält.
  // Nur prüfen, wenn sich der Inhalt tatsächlich geändert hat — sonst
  // erschiene der Hinweis auch beim bloßen Nachtragen einer Notiz erneut.
  if (typNeu !== 'cloze' && werte.antwort !== antwortVorher) await kartenCheckAnbieten(k);
}

/** Nicht blockierender Hinweis auf schwer lernbare Karten, mit dem Angebot,
 *  eine Aufzählung mechanisch in einen Lückentext zu verwandeln — daraus
 *  werden dann eigenständig terminierte Einzelabfragen. */
async function kartenCheckAnbieten(k) {
  if (!k) return;
  const pruef = kartenCheck(k.antwort);
  if (!pruef.gruende.length) return;
  // Mehr als 20 Lücken kann eine Karte nicht führen (clozeNummern). Statt
  // stillschweigend abzuschneiden wird das Angebot dann nicht gemacht.
  const zuViele = pruef.liste.length > 20;
  const kannTeilen = pruef.liste.length >= 2 && !zuViele;
  // Vorhandene Lückenmarkierungen abstreifen, sonst entstünde {{c1::c1::…}}
  // oder zweimal dieselbe Nummer im selben Text.
  const entkleiden = t => String(t ?? '')
    .replace(/\{\{c\d{1,2}::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g, '$1')
    .replace(/[{}]/g, '').trim();
  const clozeText = kannTeilen
    ? entkleiden(k.frage) + (pruef.stamm ? '\n' + entkleiden(pruef.stamm) : '') + '\n' +
      pruef.liste.map((t, i) => `{{c${i + 1}::${entkleiden(t)}}}`).join('\n')
    : null;

  const wahl = await modal({
    titel: 'Diese Karte wird schwer zu lernen sein',
    breit: true,
    html: `${pruef.gruende.map(g => `<p>${g}</p>`).join('')}
      <p class="mini">Die Karte ist gespeichert — das hier ist nur ein Hinweis.</p>
      ${kannTeilen ? `<div class="hinweis blau mt">
        <strong>Vorschlag:</strong> als Lückentext speichern. Jeder Punkt wird dann einzeln
        abgefragt und einzeln terminiert — was schon sitzt, kommt seltener.
        <pre class="code" style="margin-top:8px">${esc(clozeText)}</pre></div>` : ''}
      ${zuViele ? `<div class="hinweis mt">Mit ${pruef.liste.length} Punkten ist die Antwort zu
        umfangreich für einen Lückentext (höchstens 20). Besser sind mehrere kleinere Karten.</div>` : ''}`,
    knoepfe: kannTeilen
      ? [{ text: 'So lassen', wert: null }, { text: 'Als Lückentext', wert: 'cloze', art: 'primary' }]
      : [{ text: 'Verstanden', wert: null, art: 'primary' }]
  });
  if (wahl !== 'cloze' || !clozeText) return;

  // Dieselbe Rückfrage wie beim normalen Bearbeiten: Aus einer Karte mit
  // Gegenrichtung wird durch den Lückentext eine ohne — die Rückwärtsabfrage
  // verschwindet dabei samt Lernstand.
  const werte = { frage: clozeText, typ: 'cloze' };   // antwort bleibt als Sicherungsnetz stehen
  const vorschau = variantenPlan({ ...k, ...werte }, deckVon(k.deckId));
  if (vorschau.entfernt && !await frage('In Lückentext umwandeln',
    `Dabei ${vorschau.entfernt === 1 ? 'entfällt eine bestehende Abfrage' :
      `entfallen ${vorschau.entfernt} bestehende Abfragen`} dieser Karte — mitsamt Lernfortschritt.`,
    'Trotzdem umwandeln', 'gefahr')) return;

  Object.assign(k, werte);
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), werte), 'In Lückentext umwandeln');
  const bilanz = variantenAbgleichen(k, deckVon(k.deckId));
  toast(`Als Lückentext gespeichert — ${pruef.liste.length} einzeln terminierte Abfragen.`);
  return bilanz;
}

/* ---------- 12. Statistik ----------------------------------------------- */

async function reviewsLaden(alles) {
  if (S.reviewsGeladen && !alles) return;
  try {
    const ab = alles ? '0000-00-00' : plusTage(heute(), -70);
    const q = FB.query(colReviews(), FB.where('datum', '>=', ab));
    const snap = await FB.getDocs(q);
    S.reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.reviewsGeladen = true;
  } catch (e) {
    // Nicht erneut versuchen: malStatistik ruft diese Funktion beim Zeichnen
    // auf — ohne Merker entstünde eine Endlosschleife aus Abfrage und Neuzeichnen.
    console.warn('Statistik-Verlauf nicht ladbar', e);
    S.reviews = Array.isArray(S.reviews) ? S.reviews : [];
    S.reviewsGeladen = true;
    S.reviewsFehler = true;
  }
}

function malStatistik() {
  const ziel = $('#seite-statistik');
  const imDeck = k => S.statDeck === 'alle' || k.deckId === S.statDeck;
  const karten = S.cards.filter(imDeck);
  const faellig = karten.filter(istFaellig);
  const heuteGenau = karten.filter(istHeuteGenau);
  const ueberf = faellig.length - heuteGenau.length;
  const neu = karten.filter(istNeu).length;
  const ruht = karten.filter(k => k.suspendiert).length;

  const proFach = Array.from({ length: 12 }, (_, i) =>
    karten.filter(k => !k.suspendiert && fachVon(k) === i + 1).length);
  const maxFach = Math.max(1, ...proFach);

  // Tageswerte immer über denselben Weg holen, damit die Kastenauswahl
  // überall greift — auch bei den Sekunden (Stufe 4, KONZEPT §6.7).
  const revAn = t => S.reviews.find(x => (x.datum || x.id) === t);
  const anzahlAn = t => {
    const r = revAn(t); if (!r) return 0;
    return Number(S.statDeck === 'alle' ? r.anzahl : r.proDeck?.[S.statDeck]) || 0;
  };
  const sekundenAn = t => {
    const r = revAn(t); if (!r) return 0;
    if (S.statDeck === 'alle') return Number(r.sekunden) || 0;
    const genau = Number(r.sekundenProDeck?.[S.statDeck]);
    if (Number.isFinite(genau)) return genau;
    // Tagesdokumente aus Stufe 1–3 kennen die Sekunden je Kasten nicht. Statt
    // „0 Minuten“ zu behaupten, wird der Tagesanteil des Kastens geschätzt —
    // sonst läse sich die eigene Lernhistorie als hätte sie keine Zeit gekostet.
    const anteil = Number(r.proDeck?.[S.statDeck]) || 0;
    const gesamt = Number(r.anzahl) || 0;
    return gesamt ? Math.round((Number(r.sekunden) || 0) * anteil / gesamt) : 0;
  };

  const tage = Array.from({ length: 14 }, (_, i) => plusTage(heute(), i - 13));
  const proTag = tage.map(anzahlAn);
  const maxTag = Math.max(1, ...proTag);
  const summe14 = proTag.reduce((a, b) => a + b, 0);
  const sekunden14 = tage.reduce((a, t) => a + sekundenAn(t), 0);

  /* --- Wochenbericht (Stufe 4) --- */
  const wocheTage = Array.from({ length: 7 }, (_, i) => plusTage(heute(), i - 6));
  const vorTage   = Array.from({ length: 7 }, (_, i) => plusTage(heute(), i - 13));
  const wKarten = wocheTage.reduce((a, t) => a + anzahlAn(t), 0);
  const vKarten = vorTage.reduce((a, t) => a + anzahlAn(t), 0);
  const wSek    = wocheTage.reduce((a, t) => a + sekundenAn(t), 0);
  const vSek    = vorTage.reduce((a, t) => a + sekundenAn(t), 0);
  const wAktiv  = wocheTage.filter(t => anzahlAn(t) > 0).length;
  const besterTag = wocheTage.reduce((b, t) => anzahlAn(t) > anzahlAn(b) ? t : b, wocheTage[0]);
  const schnittProKarte = wKarten ? wSek / wKarten : 0;
  const trend = (jetzt, vorher) => {
    if (!vorher && !jetzt) return { pfeil: '·', text: 'wie vorher', farbe: 'var(--txt3)' };
    if (!vorher) return { pfeil: '▲', text: 'neu', farbe: 'var(--bewertung-3)' };
    const p = Math.round((jetzt - vorher) / vorher * 100);
    if (Math.abs(p) < 8) return { pfeil: '·', text: 'wie in der Vorwoche', farbe: 'var(--txt3)' };
    return p > 0
      ? { pfeil: '▲', text: `+${p} % zur Vorwoche`, farbe: 'var(--bewertung-3)' }
      : { pfeil: '▼', text: `${p} % zur Vorwoche`, farbe: 'var(--faellig)' };
  };
  const trendKarten = trend(wKarten, vKarten);
  const trendZeit = trend(wSek, vSek);
  const WOCHENTAG = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const wochentag = iso => {
    const [y, m, t] = String(iso).split('-').map(Number);
    return WOCHENTAG[new Date(Date.UTC(y, m - 1, t)).getUTCDay()];
  };

  const fresser = zeitfresser(karten.filter(k => !k.suspendiert));
  const probleme = karten.filter(istProblemkarte);
  const pruefungen = anstehendePruefungen(
    S.statDeck === 'alle' ? null : new Set([S.statDeck]));

  const vorschauTage = Array.from({ length: 7 }, (_, i) => plusTage(heute(), i + 1));
  const vorschau = vorschauTage.map(t => karten.filter(k => !k.suspendiert && k.due === t).length);
  const maxVor = Math.max(1, ...vorschau, 1);

  ziel.innerHTML = `
    <div class="spread"><h1 style="margin:0">Statistik</h1>
      <select id="st-deck" style="width:auto;min-width:160px">
        <option value="alle">Alle Kästen</option>
        ${S.decks.map(d => `<option value="${esc(d.id)}" ${S.statDeck === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}
      </select></div>

    <div class="kennzahlen mt">
      <div class="kennzahl"><b>${karten.length}</b><span>Karten gesamt</span></div>
      <div class="kennzahl"><b style="color:var(--orange)">${heuteGenau.length}</b><span>heute fällig</span></div>
      <div class="kennzahl"><b>${ueberf}</b><span>überfällig</span></div>
      <div class="kennzahl"><b style="color:var(--blue)">${neu}</b><span>noch nie gelernt</span></div>
      <div class="kennzahl"><b style="color:var(--green)">${S.einstellungen.streak || 0}</b><span>Tage in Folge</span></div>
      ${ruht ? `<div class="kennzahl"><b>${ruht}</b><span>ruhend</span></div>` : ''}
      ${probleme.length ? `<div class="kennzahl"><b style="color:var(--bewertung-1)">${probleme.length}</b><span>Problemkarten</span></div>` : ''}
    </div>

    <div class="box mt2">
      <div class="spread" style="margin-bottom:10px">
        <h2 style="margin:0">Die Woche im Rückblick</h2>
        <span class="mini">${datumDeutsch(wocheTage[0])} – ${datumDeutsch(wocheTage[6])}</span>
      </div>
      ${wKarten ? `
      <div class="kennzahlen">
        <div class="kennzahl"><b>${wKarten}</b><span>Abfragen
          <span style="color:${trendKarten.farbe}">${trendKarten.pfeil} ${esc(trendKarten.text)}</span></span></div>
        <div class="kennzahl"><b>${Math.round(wSek / 60)}</b><span>Minuten
          <span style="color:${trendZeit.farbe}">${trendZeit.pfeil} ${esc(trendZeit.text)}</span></span></div>
        <div class="kennzahl"><b>${schnittProKarte.toFixed(1)}s</b><span>je Abfrage</span></div>
        <div class="kennzahl"><b>${wAktiv}/7</b><span>Tage gelernt</span></div>
      </div>
      <div class="tage" style="height:80px;margin-top:12px">${wocheTage.map(t => {
        const n = anzahlAn(t);
        const maxW = Math.max(1, ...wocheTage.map(anzahlAn));
        return `<div title="${datumDeutsch(t)}: ${n} Abfragen, ${Math.round(sekundenAn(t) / 60)} Minuten">
          <span class="mini" style="font-size:10px">${n || ''}</span>
          <span class="saeule ${n ? '' : 'null'}" style="height:${Math.round(n / maxW * 100)}%"></span>

/* ---------- 14. Import / Export ---------------------------------------- */

function dateiHerunterladen(name, inhalt, typ = 'application/json') {
  const blob = new Blob([inhalt], { type: typ + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function dateiWaehlen(endung) {
  return new Promise(fertig => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = endung;
    i.addEventListener('cancel', () => fertig(null));
    i.addEventListener('change', () => {
      const f = i.files?.[0];
      if (!f) return fertig(null);
      const r = new FileReader();
      r.onload = () => fertig({ name: f.name, text: String(r.result || '') });
      r.onerror = () => fertig(null);
      r.readAsText(f, 'utf-8');
    });
    i.click();
  });
}

function csvFeld(s) { return '"' + String(s ?? '').replace(/"/g, '""') + '"'; }

/** Karten als CSV "Frage";"Antwort";"Kasten" — mit BOM, damit Excel die
 *  Umlaute richtig anzeigt. */
function csvBauen(karten) {
  // Nur Quellkarten: die zus\u00E4tzlichen Abfragen (R\u00FCckw\u00E4rtsrichtung, einzelne
  // Cloze-L\u00FCcken) tragen denselben Inhalt und st\u00FCnden sonst doppelt in der
  // Datei \u2014 beim Wiedereinlesen entst\u00FCnden Dubletten.
  return '\uFEFF' + karten.filter(istQuellkarte).map(k =>
    // Bei L\u00FCckentexten steht die L\u00F6sung in der Frage-Spalte; ohne Ersatz in
    // der Antwort-Spalte w\u00FCrde die Zeile beim Wiedereinlesen verworfen.
    [k.frage,
     k.antwort || (k.typ === 'cloze'
       ? clozeNummern(k.frage).map(n => clozeLoesung(k.frage, n)).join(' \u00B7 ') : ''),
     deckName(k.deckId)].map(csvFeld).join(';')).join('\r\n');
}
function dateiTeil(s) {
  return String(s).replace(/[^\wäöüÄÖÜß -]+/g, '_').trim().slice(0, 40) || 'export';
}

/* --- 14b. CSV lesen --- */

function csvZerlegen(text) {
  text = text.replace(/^\uFEFF/, '');
  const zeilen = [];
  let feld = '', zeile = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) {
      if (c === '"' && n === '"') { feld += '"'; i++; }
      else if (c === '"') inQ = false;
      else feld += c;
    } else if (c === '"') inQ = true;
    else if (c === ';' || c === '\t') { zeile.push(feld); feld = ''; }
    else if (c === '\r') { /* ignorieren */ }
    else if (c === '\n') { zeile.push(feld); zeilen.push(zeile); zeile = []; feld = ''; }
    else feld += c;
  }
  if (feld !== '' || zeile.length) { zeile.push(feld); zeilen.push(zeile); }
  return zeilen.filter(z => z.some(f => String(f).trim() !== ''));
}

/* --- 14c. Altbestand aus dem Browser --- */

function altdatenImBrowser() {
  try {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('lk:')) out[k] = localStorage.getItem(k);
    }
    return Object.keys(out).length ? out : null;
  } catch (_) { return null; }
}

/* --- 14d. Alt-Format deuten --- */

function jsonSanft(v) {
  if (typeof v !== 'string') return v;
  try { return JSON.parse(v); } catch (_) { return null; }
}

/**
 * Erkennt und normalisiert:
 *  - den JSON-Export von Lernkartei 1   { "lk:boxes":[…], "lk:cards:ID":[…], … }
 *  - den „Referenz-Dump“ (gleiche Schlüssel, Werte als Zeichenketten)
 *  - eine Verpackung  { data: { … } }  oder { storage: { … } }
 *  - den eigenen Export von Lernkartei 2 { app:'Lernkartei 2', decks:[], cards:[] }
 * Liefert { decks, cards, intervalle, meta, quelle } oder null.
 */
/** Kasten aus fremden Daten auf das eigene Schema bringen. */
function deckNormalisieren(d, i) {
  const q = (d && typeof d === 'object') ? d : {};
  const farbe = String(q.farbe ?? q.color ?? '').trim();
  return {
    id: sichereId(q.id || neueId()),
    name: String(q.name ?? 'Kasten').slice(0, 120) || 'Kasten',
    farbe: /^#[0-9a-fA-F]{3,8}$/.test(farbe) ? farbe : DECK_FARBEN[i % DECK_FARBEN.length],
    richtung: RICHTUNGEN.includes(q.richtung) ? q.richtung : 'vorwaerts',
    modi: Array.isArray(q.modi) && q.modi.filter(x => MODI_ALLE.includes(x)).length
      ? q.modi.filter(x => MODI_ALLE.includes(x)) : ['aufdecken'],
    sprache: typeof q.sprache === 'string' && /^[a-z]{2}(-[A-Z]{2})?$/.test(q.sprache) ? q.sprache : 'de-DE',
    spracheAntwort: typeof q.spracheAntwort === 'string' && /^[a-z]{2}(-[A-Z]{2})?$/.test(q.spracheAntwort)
      ? q.spracheAntwort
      : (typeof q.sprache === 'string' && /^[a-z]{2}(-[A-Z]{2})?$/.test(q.sprache) ? q.sprache : 'de-DE'),
    pruefungsdatum: isoOder(q.pruefungsdatum, null),
    createdAt: isoOder(q.createdAt, heute()),
    archiviert: !!q.archiviert
  };
}

/** Karte aus fremden Daten auf das eigene Schema bringen.
 *  Gilt für beide Quellen — jedes Feld wird erzwungen, damit kein Zahlenwert
 *  in einem Datumsfeld später die Kartenliste blockiert. */
function karteNormalisieren(k, deckId, ivListe) {
  const q = (k && typeof k === 'object') ? k : {};
  const hist = Array.isArray(q.history) ? q.history.filter(h => h && typeof h === 'object') : null;
  const fach = zahl(q.fach, 1, 12, 1);
  const reps = hist ? hist.length : zahl(q.reps, 0, 99999, 0);
  const lapses = hist ? hist.filter(h => Number(h.rating) === 1).length : zahl(q.lapses, 0, 99999, 0);
  const letzte = hist && hist.length ? hist[hist.length - 1] : null;
  const zuletzt = letzte ? isoOder(letzte.date, null) : isoOder(q.lastReview, null);
  const stabRoh = Number(q.stability);
  const hatStab = Number.isFinite(stabRoh) && stabRoh > 0;
  const schwRoh = Number(q.difficulty);
  // Nur eine Karte, an der nichts auf eine frühere Abfrage hindeutet, darf
  // als frischer Gedächtniszustand (0/0) ankommen — den braucht ts-fsrs für
  // die Ersteinschätzung. Würde er auf 1/1 hochgeklemmt, hielte die
  // Bibliothek sie für eine bereits gelernte Karte am unteren Anschlag.
  // Alles andere behält seinen Platz (KONZEPT §9: Fach → Stabilität).
  const unberuehrt = !hatStab && reps === 0 && fach <= 1 && !zuletzt;
  return {
    id: sichereId(q.id || neueId()),
    deckId,
    frage: String(q.frage ?? q.front ?? '').trim(),
    antwort: String(q.antwort ?? q.back ?? '').trim(),
    notiz: String(q.notiz ?? '').trim(),
    tags: Array.isArray(q.tags) ? q.tags.map(t => String(t).slice(0, 60)).slice(0, 30) : [],
    typ: KARTEN_TYPEN.includes(q.typ) ? q.typ : 'standard',
    // Stufe 3: Zugehörigkeit zur Quellkarte mitnehmen, sonst würden aus
    // Rückwärtsabfragen beim Import eigenständige Karten ohne Inhalt.
    quelleId: q.quelleId ? sichereId(q.quelleId) : null,
    variante: /^(v|r|c\d{1,2})$/.test(String(q.variante || '')) ? q.variante : 'v',
    fach,
    stability: unberuehrt ? 0
      : (hatStab ? Math.min(3650, stabRoh) : (ivListe[fach - 1] ?? 1)),   // KONZEPT §9
    difficulty: unberuehrt ? 0
      : (Number.isFinite(schwRoh) && schwRoh >= 1 ? Math.min(10, Math.round(schwRoh)) : 5),
    due: isoOder(q.faellig ?? q.due, heute()),
    lastReview: zuletzt,
    reps,
    lapses,
    state: [0, 1, 2, 3].includes(q.state) ? q.state : (reps ? 2 : 0),
    suspendiert: !!q.suspendiert,
    leech: !!q.leech,
    leechBasis: zahl(q.leechBasis, 0, 99999, 0),
    zeitGesamt: zahl(q.zeitGesamt, 0, 9999999, 0),
    zeitReps: zahl(q.zeitReps, 0, 99999, 0),
    createdAt: isoOder(q.createdAt, heute())
  };
}

/** Intervallliste absichern: genau zwölf Werte, jeder eine sinnvolle Zahl.
 *  Liefert null, wenn die Quelle gar keine Intervalle mitbrachte — dann wird
 *  auch nicht angeboten, die eigenen Einstellungen zu überschreiben. */
/** Basis für die Stabilität beim Import: die Intervalle aus der Quelle, falls
 *  vorhanden — sonst die, die in diesem Konto tatsächlich gelten. Nur so passt
 *  die abgeleitete Stabilität zum Fach, wenn jemand eigene Intervalle pflegt. */
function aktuelleIntervalle() {
  const iv = S.einstellungen?.intervalle;
  return (Array.isArray(iv) && iv.length === 12) ? iv : STANDARD_INTERVALLE;
}

function intervalleNormalisieren(roh) {
  if (!Array.isArray(roh) || !roh.length) return null;
  return Array.from({ length: 12 }, (_, i) =>
    zahl(roh[i], 1, 3650, STANDARD_INTERVALLE[i]));
}

function altdatenDeuten(roh) {
  let o = roh;
  if (typeof o === 'string') o = jsonSanft(o);
  if (!o || typeof o !== 'object') return null;

  // Verpackungen abstreifen
  for (const schluessel of ['data', 'storage', 'daten', 'payload']) {
    if (o[schluessel] && typeof o[schluessel] === 'object' &&
        Object.keys(o).some(k => !k.startsWith('lk:'))) {
      const inner = o[schluessel];
      if (Object.keys(inner).some(k => k.startsWith('lk:'))) { o = inner; break; }
    }
  }

  // Eigener Export (Lernkartei 2)
  if (Array.isArray(o.cards) && Array.isArray(o.decks)) {
    const ivL2 = intervalleNormalisieren(o.settings?.intervalle);
    const decks = o.decks.map(deckNormalisieren);
    const bekannt = new Map(decks.map(d => [d.id, d.id]));
    const auffang = { id: null };
    const cards = o.cards.map(k => {
      const roheId = sichereId((k && k.deckId) || '');
      let ziel = bekannt.get(roheId);
      if (!ziel) {                       // Karte ohne passenden Kasten auffangen
        if (!auffang.id) {
          const d = deckNormalisieren({ name: 'Ohne Kasten' }, decks.length);
          auffang.id = d.id; decks.push(d);
        }
        ziel = auffang.id;
      }
      return karteNormalisieren(k, ziel, ivL2 || aktuelleIntervalle());
    });
    // Kartenkennungen können beim Einlesen entschärft werden (sichereId).
    // Dann müssen die quelleId-Verweise mitwandern, sonst hinge eine
    // Rückwärtsabfrage im Leeren und wäre nicht mehr zu bearbeiten.
    const idKarteNeu = new Map();
    o.cards.forEach((roh, i) => {
      const alt = String(roh && roh.id != null ? roh.id : '');
      if (alt && cards[i]) idKarteNeu.set(alt, cards[i].id);
    });
    const vorhandeneIds = new Set(cards.map(c => c.id));
    cards.forEach(c => {
      if (!c.quelleId) return;
      const neu = idKarteNeu.get(String(c.quelleId)) || c.quelleId;
      // Zeigt der Verweis ins Nichts, wird aus der Abfrage eine eigenständige
      // Karte — besser als ein Datensatz, den niemand mehr öffnen kann.
      if (vorhandeneIds.has(neu) && neu !== c.id) c.quelleId = neu;
      else { c.quelleId = null; c.variante = 'v'; }
    });
    return {
      quelle: 'Lernkartei 2',
      decks, cards,
      intervalle: ivL2,
      meta: {
        streak: zahl(o.settings?.streak, 0, 99999, 0),
        lastLearnDate: isoOder(o.settings?.lastLearnDate, null)
      },
      reviews: Array.isArray(o.reviews) ? o.reviews.filter(r => r && typeof r === 'object') : []
    };
  }

  const hol = k => jsonSanft(o[k]) ?? (typeof o[k] === 'object' ? o[k] : null);
  const boxen = hol('lk:boxes');
  if (!Array.isArray(boxen)) return null;

  const meta = hol('lk:meta') || {};
  const ivRoh = intervalleNormalisieren(hol('lk:intervals'));
  const ivListe = ivRoh || aktuelleIntervalle();

  const decks = [], cards = [];
  const idKarte = new Map();     // alte deckId -> neue deckId

  boxen.forEach(b => {
    if (!b || typeof b !== 'object') return;
    const alt = String(b.id ?? '');
    const d = deckNormalisieren(b, decks.length);
    idKarte.set(alt, d.id);
    decks.push(d);
  });

  // Kartenlisten einsammeln — auch für Kästen, die in lk:boxes fehlen
  Object.keys(o).filter(k => /^lk:cards:/.test(k)).forEach(schluessel => {
    const altDeck = schluessel.slice('lk:cards:'.length);
    let deckId = idKarte.get(altDeck);
    if (!deckId) {                                    // verwaister Kartenstapel
      const d = deckNormalisieren({ id: altDeck, name: 'Wiederhergestellt' }, decks.length);
      deckId = d.id;
      idKarte.set(altDeck, deckId);
      decks.push(d);
    }
    const liste = hol(schluessel);
    if (!Array.isArray(liste)) return;
    liste.forEach(k => cards.push(karteNormalisieren(k, deckId, ivListe)));
  });

  return {
    quelle: 'Lernkartei 1', decks, cards, reviews: [],
    intervalle: ivRoh,
    meta: {
      streak: zahl(meta.streak, 0, 99999, 0),
      lastLearnDate: isoOder(meta.lastLearnDate, null)
    }
  };
}

/** Deuten mit Netz und doppeltem Boden: eine kaputte Sicherungsdatei darf
 *  nicht dazu führen, dass beim Klick einfach nichts geschieht. */
function sicherDeuten(roh) {
  try {
    return altdatenDeuten(roh);
  } catch (e) {
    console.error('[Import]', e);
    modal({
      titel: 'Die Datei ließ sich nicht lesen',
      html: `<p>Beim Auswerten der Daten ist etwas schiefgegangen. Der Bestand
             im Konto wurde nicht angefasst.</p>
             <p class="mini">Technische Meldung: ${esc(e?.message || String(e))}</p>
             <p class="mini">Wenn es die JSON-Sicherung der alten App ist, hilft
             oft der Weg über „Aus diesem Browser“ — dort werden die Daten direkt
             gelesen statt aus der Datei.</p>`,
      knoepfe: [{ text: 'Schließen', wert: 'ok', art: 'primary' }]
    });
    return null;
  }
}

/* --- 14e. Import ausführen --- */

async function importAusfuehren(geparst, quelleName) {
  const leer = !geparst || (!geparst.decks.length && !geparst.cards.length);
  if (leer) return toast('Keine übernehmbaren Daten gefunden.', 'fehler');

  const gueltig = geparst.cards.filter(k => k.frage || k.antwort);
  const bestand = S.cards.length;

  const wahl = await modal({
    titel: 'Import',
    breit: true,
    html: `
      <p>Gefunden in <strong>${esc(quelleName)}</strong> (${esc(geparst.quelle)}):</p>
      <div class="kennzahlen" style="margin:12px 0">
        <div class="kennzahl"><b>${geparst.decks.length}</b><span>Kästen</span></div>
        <div class="kennzahl"><b>${gueltig.length}</b><span>Karten</span></div>
      </div>
      ${bestand ? `
        <p>In diesem Konto liegen bereits <strong>${bestand}</strong> Karten. Was soll passieren?</p>
        <label class="karo"><input type="radio" name="konflikt" value="merge" checked>
          <span><strong>Zusammenführen</strong> — Vorhandenes bleibt, Neues kommt dazu.
          Karten mit gleicher Kennung werden übersprungen, gleichnamige Kästen wiederverwendet.</span></label>
        <label class="karo"><input type="radio" name="konflikt" value="replace">
          <span><strong>Ersetzen</strong> — alle bestehenden Kästen und Karten dieses Kontos
          werden vorher gelöscht.</span></label>`
        : '<p class="mini">Das Konto ist leer — es wird einfach alles angelegt.</p>'}
      ${geparst.intervalle ? `<label class="karo" style="margin-top:8px">
        <input type="checkbox" id="m-iv" checked>
        <span>Intervalle aus der Sicherung übernehmen
        (${esc(geparst.intervalle.slice(0, 6).join(' · '))} …)</span></label>` : ''}`,
    knoepfe: [{ text: 'Abbrechen', wert: null },
              { text: 'Übernehmen', wert: 'ok', art: 'primary' }]
  });
  if (wahl !== 'ok') return;

  const modus = bestand ? WRadio('konflikt', 'merge') : 'merge';
  const ivUebernehmen = letzteWerte['m-iv'] === true;

  await importSchreiben(geparst, modus, ivUebernehmen);
}

async function importSchreiben(geparst, modus, ivUebernehmen) {
  const ops = [];

  if (modus === 'replace') {
    // Nur das löschen, was nicht ohnehin gleich überschrieben wird. Sonst
    // könnten Löschen und Neuschreiben in getrennten Stapeln in falscher
    // Reihenfolge beim Server ankommen und die Karte wäre weg.
    const kommtNeu = new Set(geparst.cards.map(k => k.id));
    const deckKommtNeu = new Set(geparst.decks.map(d => d.id));
    S.decks.forEach(d => { if (!deckKommtNeu.has(d.id)) ops.push(['del', FB.doc(colDecks(), d.id)]); });
    S.cards.forEach(k => { if (!kommtNeu.has(k.id)) ops.push(['del', FB.doc(colCards(), k.id)]); });
  }

  // Kästen: bei Zusammenführen gleichnamige wiederverwenden
  const deckZuordnung = new Map();
  const vorhandenNachName = new Map(
    modus === 'replace' ? [] : S.decks.map(d => [(d.name || '').toLowerCase(), d.id]));
  const vorhandenIds = new Set(modus === 'replace' ? [] : S.decks.map(d => d.id));

  geparst.decks.forEach(d => {
    const gleichName = vorhandenNachName.get((d.name || '').toLowerCase());
    if (modus === 'merge' && gleichName) { deckZuordnung.set(d.id, gleichName); return; }
    if (modus === 'merge' && vorhandenIds.has(d.id)) { deckZuordnung.set(d.id, d.id); return; }
    deckZuordnung.set(d.id, d.id);
    const { id, ...rest } = d;
    ops.push(['set', FB.doc(colDecks(), d.id), rest]);
  });

  const vorhandeneKarten = new Set(modus === 'replace' ? [] : S.cards.map(k => k.id));
  let uebersprungen = 0, geschrieben = 0;

  geparst.cards.forEach(k => {
    if (!k.frage && !k.antwort) return;
    if (modus === 'merge' && vorhandeneKarten.has(k.id)) { uebersprungen++; return; }
    const { id, ...rest } = k;
    rest.deckId = deckZuordnung.get(k.deckId) || k.deckId;
    if (!rest.deckId) return;
    ops.push(['set', FB.doc(colCards(), id), rest]);
    geschrieben++;
  });

  // Beides in EINEN Schreibvorgang: zwei Änderungen am selben Dokument
  // innerhalb eines Stapels lehnt Firestore ab.
  const einstellungenPatch = {};
  if (ivUebernehmen && geparst.intervalle)
    einstellungenPatch.intervalle = geparst.intervalle.slice(0, 12);
  if (geparst.meta && (geparst.meta.streak || geparst.meta.lastLearnDate)) {
    einstellungenPatch.streak = geparst.meta.streak || 0;
    einstellungenPatch.lastLearnDate = geparst.meta.lastLearnDate || null;
  }
  if (Object.keys(einstellungenPatch).length)
    ops.push(['set', refEinstellungen(), einstellungenPatch, true]);
  (geparst.reviews || []).forEach(r => {
    const tag = String(r.datum || r.id || '').slice(0, 10);
    if (/^\d{4}-\d{2}-\d{2}$/.test(tag)) {
      const { id, ...rest } = r;
      ops.push(['set', FB.doc(colReviews(), tag), { ...rest, datum: tag }, true]);
    }
  });

  // In Häppchen schreiben (Firestore erlaubt 500 Vorgänge pro Stapel)
  const GROESSE = 400;
  for (let i = 0; i < ops.length; i += GROESSE) {
    const b = FB.writeBatch(db);
    ops.slice(i, i + GROESSE).forEach(([art, ref, daten, merge]) => {
      if (art === 'del') b.delete(ref);
      else b.set(ref, daten, merge ? { merge: true } : undefined);
    });
    schreibe(b.commit(), 'Import-Stapel ' + (i / GROESSE + 1));
  }

  S.reviewsGeladen = false;
  await modal({
    titel: 'Import abgeschlossen',
    html: `<p><strong>${geschrieben}</strong> Karten und
      <strong>${geparst.decks.length}</strong> Kästen übernommen.
      ${uebersprungen ? `<br>${uebersprungen} Karten waren schon vorhanden und wurden übersprungen.` : ''}</p>
      <p class="mini">Die Daten sind sofort nutzbar. Die Übertragung zu Firestore läuft im
      Hintergrund weiter — der Punkt oben rechts wird grün, sobald alles angekommen ist.</p>
      <p class="mini">Wenn ein Kasten Rückwärtsabfragen oder Lückentexte vorsieht, prüft
      <em>Einstellungen → Diagnose → Abfragen abgleichen</em>, ob dazu alle Abfragen vorhanden sind.</p>`,
    knoepfe: [{ text: 'Gut', wert: 'ok', art: 'primary' }]
  });
  seiteZeigen('kaesten');
}

/* ---------- 15. Aktionen verdrahten ------------------------------------ */

function aktionsFehler(e) {
  console.error('[Aktion]', e);
  toast('Das hat nicht geklappt: ' + (e?.message || e), 'fehler');
}

function verdrahten(wurzel) {
  $$('[data-tu]', wurzel).forEach(el => {
    if (el._verdrahtet) return;
    el._verdrahtet = true;
    el.addEventListener('click', () => {
      // Ohne diesen Mantel würde ein Fehler in einer Aktion stumm in der
      // Konsole verschwinden — der Nutzer sähe nur, dass nichts passiert.
      try {
        const r = AKTION[el.dataset.tu]?.(el.dataset.id, el);
        if (r && typeof r.then === 'function') r.catch(aktionsFehler);
      } catch (e) { aktionsFehler(e); }
    });
  });
}
