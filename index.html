    const name = teil.slice(0, p).trim().toLowerCase();
    const wert = teil.slice(p + 1).trim();
    if (!CSS_ERLAUBT.includes(name)) return;
    // Klammern schließen url(), expression() und var() gemeinsam aus. Kein
    // erlaubter Wert braucht sie — Farben stehen als #rgb, rgb(...) wäre
    // zwar harmlos, ist aber den Sonderfall nicht wert.
    if (/[(){}<>\\"']|url|expression|image-set/i.test(wert)) return;
    if (wert.length > 60) return;
    raus.push(name + ':' + wert);
  });
  return raus.join(';');
}

/** Ausgezeichneten Text auf die Positivliste eindampfen. Liefert HTML. */
function htmlSauber(roh) {
  const text = String(roh ?? '');
  if (!text) return '';
  if (typeof DOMParser === 'undefined') return esc(text);   // Node-Testlauf
  /* Geparst wird in ein <template>. Zwei frühere Fassungen sind daran
     gescheitert:

     1. '<div id="w">' + text + '</div>': Ein '</div>' im Text schloss die
        Umhüllung vorzeitig, alles danach wurde Geschwister und fiel beim
        Zurückgeben weg. Eine Karte über HTML verlor also stillschweigend
        ihre halbe Antwort.
     2. doc.body nach DOMParser: Ein '<frameset>' am Feldanfang lässt den
        Parser überhaupt keinen <body> anlegen — das ganze Feld fiel dann
        auf esc() zurück und verlor seine Auszeichnung.

     <template> kennt beide Fallen nicht: Es hat einen eigenen
     Einfügemodus, in dem ein herrenloses '</div>' folgenlos bleibt und ein
     '<frameset>' schlicht überlesen wird. Und sein Inhalt ist inert —
     Bilder laden nicht, Skripte laufen nicht, auch nicht während des
     Säuberns. */
  let wurzel;
  try {
    const vorlage = document.createElement('template');
    vorlage.innerHTML = text;
    wurzel = vorlage.content;
  } catch (_) { return esc(text); }
  if (!wurzel) return esc(text);
  const doc = document;

  (function saeubern(knoten) {
    Array.from(knoten.childNodes).forEach(kind => {
      if (kind.nodeType === 3) return;                       // Text bleibt
      if (kind.nodeType !== 1) { kind.remove(); return; }     // Kommentare weg
      const tag = kind.tagName;
      if (!Object.prototype.hasOwnProperty.call(HTML_ERLAUBT, tag)) {
        // Element auflösen, Inhalt behalten. Bei <script>/<style> wäre der
        // „Inhalt“ der Programmtext selbst — der muss mit weg.
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEMPLATE') { kind.remove(); return; }
        saeubern(kind);
        const halter = doc.createDocumentFragment();
        while (kind.firstChild) halter.appendChild(kind.firstChild);
        kind.replaceWith(halter);
        return;
      }
      const erlaubt = HTML_ERLAUBT[tag];
      Array.from(kind.attributes).forEach(a => {
        const name = a.name.toLowerCase();
        if (!erlaubt.includes(name)) { kind.removeAttribute(a.name); return; }
        if (name === 'style') {
          const s = styleSauber(a.value);
          if (s) kind.setAttribute('style', s); else kind.removeAttribute('style');
        } else if (name === 'color') {
          if (!/^#[0-9a-f]{3,8}$/i.test(a.value.trim())) kind.removeAttribute('color');
        }
      });
      saeubern(kind);
    });
  })(wurzel);

  /* Ein DocumentFragment hat kein innerHTML. Der Umweg über ein frisches
     <template> serialisiert den gesäuberten Baum, ohne ihn erneut zu
     parsen — es wird angehängt, nicht neu interpretiert. */
  const halter = document.createElement('template');
  halter.content.appendChild(wurzel);
  return halter.innerHTML;
}

/** Klartext aus ausgezeichnetem Text — für Sprachausgabe, Tippen, Multiple
 *  Choice, Suche und CSV-Export. Blockenden werden zu Zeilenumbrüchen, damit
 *  aus zwei Absätzen nicht ein zusammengeklebtes Wort wird. */
/* Blockelemente, die einen Zeilenwechsel bedeuten. */
const HTML_BLOCK = new Set(['P', 'DIV', 'LI', 'UL', 'OL', 'HR', 'BLOCKQUOTE',
  'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'TR', 'TABLE', 'PRE']);

/* Nur Leerraum am ZEILENENDE fällt weg. Die erste Fassung strich zusätzlich
   die Einrückung am Zeilenanfang und dampfte Leerzeilen ein — damit sah
   derselbe Text je nachdem, ob irgendwo ein „&“ oder ein <b> vorkam,
   verschieden aus (ohne Sonderzeichen steigt htmlZuText vorher aus). Das
   traf CSV-Export, Tippen-Vergleich und Sprachausgabe. */
const textAufraeumen = t => String(t)
  .replace(/\u00a0/g, ' ')
  .replace(/[ \t]+\n/g, '\n')
  .trim();

function htmlZuText(roh) {
  const text = String(roh ?? '');
  if (!text) return '';
  if (!/[<&]/.test(text)) return text;
  if (typeof DOMParser === 'undefined') {
    // Node-Testlauf: derselbe Gedanke, nur gröber. Öffnende UND schließende
    // Blockmarken werden zum Umbruch — sonst klebt der Text vor dem ersten
    // <div> am Inhalt des <div> fest (Begründung unten).
    return textAufraeumen(text
      .replace(/<\/?(?:p|div|li|ul|ol|tr|table|pre|blockquote|h[1-6])\b[^>]*>/gi, '\n')
      .replace(/<(?:br|hr)\b[^>]*>/gi, '\n')
      .replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'));
  }
  // Aus demselben Grund wie in htmlSauber über ein <template>, siehe dort.
  let w;
  try {
    const vorlage = document.createElement('template');
    vorlage.innerHTML = text;
    w = vorlage.content;
  } catch (_) { return text; }
  if (!w) return text;

  /* Der Umbruch gehört VOR das Blockelement, nicht nur dahinter.
     Ein contenteditable erzeugt beim Drücken von Enter die Form
        Zeile1<div>Zeile2</div><div>Zeile3</div>
     — die erste Zeile steht also nackt davor. Wer nur hinter jedem <div>
     umbricht, bekommt „Zeile1Zeile2\nZeile3“: Die ersten beiden Zeilen sind
     zu einem Wort verschmolzen. Aufgefallen ist das an der
     Aufzählungserkennung (vier Punkte wurden als drei gezählt); getroffen
     hätte es genauso die Auswertung beim Tippen und den vorgelesenen Text. */
  let raus = '';
  (function gehen(knoten) {
    Array.from(knoten.childNodes).forEach(kind => {
      if (kind.nodeType === 3) { raus += kind.nodeValue; return; }
      if (kind.nodeType !== 1) return;
      if (kind.tagName === 'BR') { raus += '\n'; return; }
      const block = HTML_BLOCK.has(kind.tagName);
      if (block && raus && !raus.endsWith('\n')) raus += '\n';
      gehen(kind);
      if (block && raus && !raus.endsWith('\n')) raus += '\n';
    });
  })(w);
  return textAufraeumen(raus);
}

/** Ist das Feld dieser Karte ausgezeichneter Text? */
const istHtmlKarte = k => k?.format === 'html';
/** Ein einzelnes Kartenfeld anzeigefertig machen. */
function feldHtml(k, roh) {
  return istHtmlKarte(k) ? htmlSauber(roh) : esc(String(roh ?? ''));
}
/** Ein einzelnes Kartenfeld als Klartext. */
function feldText(k, roh) {
  return istHtmlKarte(k) ? htmlZuText(roh) : String(roh ?? '');
}

/* --- Inhalt einer Abfrage ------------------------------------------------ */

/* Welches gespeicherte Feld steht bei dieser Abfrage vorn bzw. hinten?
   Bei der Rückwärtsvariante sind die beiden Seiten vertauscht. */
const frageRoh   = k => varianteVon(k) === 'r' ? String(k.antwort || '') : String(k.frage || '');
const antwortRoh = k => varianteVon(k) === 'r' ? String(k.frage || '')   : String(k.antwort || '');

/** Klartext der Frageseite — auch für die Sprachausgabe. */
function frageText(k) {
  if (istClozeVariante(k)) {
    const ziel = clozeNrVon(k);
    return String(k.frage || '').replace(clozeRegex(),
      (_, nr, loesung, hinweis) => Number(nr) === ziel ? (hinweis || '…') : loesung);
  }
  return feldText(k, frageRoh(k));
}
/** Klartext der erwarteten Antwort — für Tippen, Multiple Choice, Vorlesen. */
function antwortText(k) {
  if (istClozeVariante(k)) return clozeLoesung(k.frage, clozeNrVon(k));
  return feldText(k, antwortRoh(k));
}
/* Lückentexte bleiben bewusst Klartext (siehe Editor): Ein {{c1::…}} darf
   nicht von einem <b> zerschnitten werden, sonst findet die Regex die Lücke
   nicht mehr und die Lösung stünde offen in der Abfrage. */
function frageHtml(k)   { return istClozeVariante(k) ? clozeHtml(k.frage, clozeNrVon(k), false) : feldHtml(k, frageRoh(k)); }
function antwortHtml(k) { return istClozeVariante(k) ? clozeHtml(k.frage, clozeNrVon(k), true)  : feldHtml(k, antwortRoh(k)); }
/** Zusatzfeld „Extra“ — steht bei der Antwort. */
function extraHtml(k)   { return k?.extra ? feldHtml(k, k.extra) : ''; }
/** Merker „Mark“ — steht auf beiden Seiten im Kartenkopf. */
function markHtml(k)    { return k?.mark ? feldHtml(k, k.mark) : ''; }
function variantenMarke(k) {
  if (istClozeVariante(k)) return 'Lücke ' + clozeNrVon(k);
  return varianteVon(k) === 'r' ? 'rückwärts' : '';
}

/* --- Tippen: Auswertung mit Tippfehlertoleranz --------------------------- */

function levenshtein(a, b) {
  a = String(a); b = String(b);
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let vorher = Array.from({ length: b.length + 1 }, (_, i) => i);
  let jetzt = new Array(b.length + 1);
  for (let i = 0; i < a.length; i++) {
    jetzt[0] = i + 1;
    for (let j = 0; j < b.length; j++) {
      jetzt[j + 1] = Math.min(jetzt[j] + 1, vorher[j + 1] + 1, vorher[j] + (a[i] === b[j] ? 0 : 1));
    }
    const tausch = vorher; vorher = jetzt; jetzt = tausch;
  }
  return vorher[b.length];
}

/** Vergleichsform einer Antwort.
 *  Akzente und ß werden bewusst eingeebnet: Auf einer Handytastatur tippt
 *  kaum jemand „hôtel“ oder „Straße“ mit dem richtigen Sonderzeichen. Ohne
 *  diese Einebnung gälte eine sachlich richtige Antwort als falsch — und
 *  weil daraufhin die Bewertung 1 vorgeschlagen wird, kostete das der Karte
 *  Monate an Intervall. */
function antwortNormalisieren(s) {
  return String(s ?? '').toLowerCase()
    .replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // Akzente ablegen
    .replace(/[.,;:!?¿¡"'„“”‚‘’()[\]{}]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
/** Zulässige Schreibweisen: „a / b“, „a; b“ und „a oder b“ gelten als
 *  Alternativen, Klammerzusätze sind optional. */
function antwortAlternativen(erwartet) {
  const roh = String(erwartet ?? '');
  const teile = roh.split(/\s*[/;]\s*|\s+oder\s+/i).map(t => t.trim()).filter(Boolean);
  const menge = new Set();
  (teile.length ? teile : [roh]).forEach(t => {
    menge.add(antwortNormalisieren(t));
    menge.add(antwortNormalisieren(t.replace(/\([^)]*\)/g, ' ')));
  });
  menge.add(antwortNormalisieren(roh));
  return Array.from(menge).filter(Boolean);
}
/** 'richtig' | 'fast' | 'falsch' | 'leer'.
 *  KONZEPT §5: Tippfehlertoleranz erst über fünf Zeichen, Levenshtein ≤ 2.
 *  Die erlaubte Distanz ist nach Länge gestaffelt, weil ein pauschales „≤ 2“
 *  bei kurzen Wörtern keine Vertipper mehr erkennt, sondern andere Wörter:
 *  „Ratten“ für „Katzen“, „fahnen“ für „fahren“. Ein falsches Zeichen ab
 *  sechs Zeichen, zwei erst ab zwölf. */
function antwortPruefen(eingabe, erwartet) {
  const e = antwortNormalisieren(eingabe);
  if (!e) return 'leer';
  const alt = antwortAlternativen(erwartet);
  if (!alt.length) return 'falsch';
  if (alt.includes(e)) return 'richtig';
  const fast = alt.some(a => {
    if (a.length <= 5) return false;
    return levenshtein(e, a) <= (a.length >= 12 ? 2 : 1);
  });
  return fast ? 'fast' : 'falsch';
}

/* --- Multiple Choice ----------------------------------------------------- */

/** Drei Distraktoren aus demselben Kasten (KONZEPT §5). Liefert null, wenn
 *  der Kasten zu wenige unterschiedliche Antworten hergibt — dann greift ein
 *  anderer Modus. */
function mcOptionenBauen(k) {
  const richtig = antwortText(k).trim();
  if (!richtig) return null;
  // Die eigene Frage darf nie unter den Vorgaben stehen — bei „beide
  //  Richtungen“ ist die Antwort der Geschwisterabfrage genau dieser Text.
  const gesehen = new Set([antwortNormalisieren(richtig), antwortNormalisieren(frageText(k))]);
  const familie = k.quelleId || k.id;
  const richtung = varianteVon(k);
  const pool = [];
  S.cards.forEach(x => {
    if (x.id === k.id || x.deckId !== k.deckId || x.suspendiert) return;
    if ((x.quelleId || x.id) === familie) return;      // Geschwisterabfragen
    // Nur Vorgaben derselben Richtung: In einem Kasten mit beiden Richtungen
    // lieferten die Rückwärtsabfragen sonst Wörter der anderen Sprache. Die
    // Aufgabe wäre dann „welches ist das englische Wort“ statt „welches ist
    // die richtige Übersetzung“.
    if (varianteVon(x) !== richtung) return;
    const t = antwortText(x).trim();
    const n = antwortNormalisieren(t);
    if (!t || !n || gesehen.has(n)) return;
    gesehen.add(n); pool.push(t);
  });
  if (pool.length < 3) return null;
  return mischen(mischen(pool).slice(0, 3).concat([richtig]))
    .map(t => ({ text: t, richtig: t === richtig }));
}

/* --- Modusauswahl je Karte ---------------------------------------------- */

/** Kleiner, stabiler Hash für die Formatvielfalt (KONZEPT §7): dieselbe Karte
 *  wird mal getippt, mal aufgedeckt abgefragt — aber nicht zufällig innerhalb
 *  einer Sitzung, sondern reproduzierbar aus Kennung und Wiederholungszahl. */
function textHash(s) {
  let h = 2166136261;
  const t = String(s);
  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h | 0);
}

function modusFuer(k) {
  const modi = deckModi(k.deckId);
  // Multiple Choice ist der Einstieg für Karten, die noch nie dran waren.
  // Danach greift automatisch Tippen bzw. Aufdecken (KONZEPT §5).
  if (modi.includes('mc') && istNeu(k) && !istClozeVariante(k) && mcOptionenBauen(k)) return 'mc';
  const kandidaten = [];
  if (modi.includes('tippen')) kandidaten.push('tippen');
  if (modi.includes('aufdecken')) kandidaten.push('aufdecken');
  // „Hören“ allein trägt keine Bewertung — dann bleibt Aufdecken der Träger.
  if (!kandidaten.length) kandidaten.push('aufdecken');
  return kandidaten[textHash(k.id + ':' + (Number(k.reps) || 0)) % kandidaten.length];
}

/* --- Sprachausgabe ------------------------------------------------------- */

/* Zwei Wege, in dieser Reihenfolge:
 *
 *  1. Vorproduzierte Dateien (Stufe 5). Ein Skript auf dem eigenen Rechner
 *     erzeugt sie mit Google Chirp 3 HD und legt sie unter audio/ ins
 *     Repository. Die App spielt nur ab — kein Schlüssel im Browser, keine
 *     laufenden Kosten, funktioniert offline.
 *  2. speechSynthesis des Browsers als Rückfall. Nötig für alles, was noch
 *     nicht produziert wurde: eine gerade angelegte Karte spricht sonst gar
 *     nicht, und das wäre schlechter als eine mittelmäßige Stimme.
 *
 * Der Dateiname ist ein Hash über Sprache, Stimme und Text — nicht über die
 * Karten-ID. Damit teilen sich alle drei Konten dieselbe Datei, sobald sie
 * dieselbe Vokabel haben, und eine umbenannte oder verschobene Karte behält
 * ihre Aufnahme. */

const sprachAusgabeDa = () => typeof window !== 'undefined' && 'speechSynthesis' in window;

/* Die Stimmen von Chirp 3 HD heißen in jeder Sprache gleich; die Sprache
   steckt allein im Präfix (de-DE-Chirp3-HD-Kore). Deshalb reicht eine Liste
   für alle Sprachen. */
const CHIRP_STIMMEN = [
  ['Achernar', 'w'], ['Aoede', 'w'], ['Autonoe', 'w'], ['Callirrhoe', 'w'],
  ['Despina', 'w'], ['Erinome', 'w'], ['Gacrux', 'w'], ['Kore', 'w'],
  ['Laomedeia', 'w'], ['Leda', 'w'], ['Pulcherrima', 'w'], ['Sulafat', 'w'],
  ['Vindemiatrix', 'w'], ['Zephyr', 'w'],
  ['Achird', 'm'], ['Algenib', 'm'], ['Algieba', 'm'], ['Alnilam', 'm'],
  ['Charon', 'm'], ['Enceladus', 'm'], ['Fenrir', 'm'], ['Iapetus', 'm'],
  ['Orus', 'm'], ['Puck', 'm'], ['Rasalgethi', 'm'], ['Sadachbia', 'm'],
  ['Sadaltager', 'm'], ['Schedar', 'm'], ['Umbriel', 'm'], ['Zubenelgenubi', 'm']
];
const CHIRP_STIMME_VORGABE = 'Kore';

/** Welche Stimme gilt für diese Sprache? Je Sprache einstellbar, damit die
 *  Frageseite anders klingt als die Antwortseite — im Hörmodus der
 *  Unterschied zwischen „zwei Sprachen“ und „ein Brei“. */
function stimmeFuer(sprache) {
  const gewaehlt = S.einstellungen?.stimmen?.[sprache];
  return CHIRP_STIMMEN.some(([n]) => n === gewaehlt) ? gewaehlt : CHIRP_STIMME_VORGABE;
}
const kiStimmeAn = () => S.einstellungen?.kiStimme !== false;
function sprachTempo() {
  const t = Number(S.einstellungen?.sprachTempo);
  return Number.isFinite(t) && t >= 0.5 && t <= 1.5 ? t : 0.95;
}

/* Verzeichnis der vorproduzierten Dateien. Ohne diese Liste müsste die App
   jede Wiedergabe blind versuchen und würde für jede fehlende Aufnahme einen
   404 erzeugen — bei einem frischen Bestand also bei jeder einzelnen Karte. */
let audioVerzeichnis = null;          // Set der vorhandenen Schlüssel
let audioVerzeichnisLauf = null;      // die laufende Zusage, nicht bloß eine Marke
const audioVerzeichnisGeladen = () => audioVerzeichnis !== null;

/* Gepuffert wird die ZUSAGE, nicht ein Flag. Die erste Fassung setzte
   `geladen = true` vor dem fetch — ein zweiter Aufruf im Ladefenster bekam
   damit `null` zurück und stürzte an `verzeichnis.has(...)` ab, noch bevor
   der Rückfall auf die Browserstimme erreicht war. Getroffen hat das genau
   die erste Karte jeder Hörsitzung: Autoplay und Umdrehen fallen dort
   zusammen, und das Manifest ist bei größerem Bestand keine kleine Datei. */
function audioVerzeichnisLaden() {
  if (!audioVerzeichnisLauf) audioVerzeichnisLauf = (async () => {
    try {
      /* 'default' statt 'no-cache': Das Manifest wächst mit dem Bestand
         (bei 6.000 Aufnahmen rund 250 KB) und würde sonst in jeder Sitzung
         neu geladen. Der Stand im Namen sorgt trotzdem für Aktualität,
         sobald neue Dateien ausgerollt sind. */
      const a = await fetch('audio/manifest.json', { cache: 'default' });
      if (!a.ok) throw new Error('HTTP ' + a.status);
      const j = await a.json();
      audioVerzeichnis = new Set(Array.isArray(j.dateien) ? j.dateien : []);
    } catch (_) {
      // Kein Verzeichnis heißt schlicht: noch nichts produziert. Das ist der
      // Normalzustand vor dem ersten Lauf des Skripts und kein Fehler.
      audioVerzeichnis = new Set();
    }
    return audioVerzeichnis;
  })();
  return audioVerzeichnisLauf;
}

/** Text so vereinheitlichen, dass Groß-/Kleinschreibung und Leerraum nicht zu
 *  zwei verschiedenen Aufnahmen desselben Wortes führen. */
const audioTextNormalisieren = t => String(t ?? '').replace(/\s+/g, ' ').trim();

const audioSchluesselPuffer = new Map();
/** Dateiname (ohne Endung) für eine Aufnahme. SHA-256 gekürzt auf 40 Zeichen:
 *  bei einem Bestand in der Größenordnung 10^4 ist eine Kollision damit
 *  ausgeschlossen, und der Name bleibt handhabbar. */
async function audioSchluessel(text, sprache, stimme) {
  const roh = `${sprache}|${stimme}|${audioTextNormalisieren(text)}`;
  const treffer = audioSchluesselPuffer.get(roh);
  if (treffer) return treffer;
  let hex;
  try {
    const puffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(roh));
    hex = Array.from(new Uint8Array(puffer)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 40);
  } catch (_) {
    // Ohne Web-Crypto (etwa auf einer unverschlüsselten Verbindung) bleibt
    // nur der Rückfall auf die Browserstimme — dafür genügt ein leerer Wert.
    return null;
  }
  audioSchluesselPuffer.set(roh, hex);
  return hex;
}

let laufendesAudio = null;

/* Laufende Nummer der Sprachausgabe.
   `sprechen` ist asynchron: Zwischen dem Aufruf und dem tatsächlichen
   Abspielen liegen zwei Wartepunkte (Hash-Berechnung und das Verzeichnis).
   In dieser Zeit kann die Karte längst gewechselt haben. Ohne diese Nummer
   erklang die Frage der verlassenen Karte, während die nächste auf dem
   Schirm stand — und zwei Aufnahmen konnten übereinanderliegen, weil
   `sprechenStoppen()` am Anfang lief, das Abspielen aber erst danach.
   Jeder Aufruf merkt sich seine Nummer und bricht nach jedem Wartepunkt ab,
   sobald sie nicht mehr die aktuelle ist. */
let sprechLauf = 0;

/**
 * Liest einen Text vor. Bevorzugt die vorproduzierte Aufnahme.
 * @param {string} text     Was gesprochen wird
 * @param {string} sprache  BCP-47, z. B. 'en-GB'
 * @param {{lautschrift?:string}} [opt]  Lautschrift geht in den Schlüssel ein,
 *        weil sie eine andere Aufnahme ergibt.
 */
async function sprechen(text, sprache, opt) {
  const t = audioTextNormalisieren(text);
  if (!t) return false;
  sprechenStoppen();                 // erhöht sprechLauf
  const meins = sprechLauf;
  const spr = sprache || 'de-DE';

  if (kiStimmeAn()) {
    const stimme = stimmeFuer(spr);
    const lautschrift = String(opt?.lautschrift || '').trim();
    const schluessel = await audioSchluessel(lautschrift ? t + '\u0001' + lautschrift : t, spr, stimme);
    if (meins !== sprechLauf) return false;
    if (schluessel) {
      // Der Gurt `|| new Set()` bleibt, obwohl audioVerzeichnisLaden jetzt
      // immer ein Set liefert: Genau an dieser Zeile ist die App vorher
      // abgestürzt, wenn zwei Aufrufe ins selbe Ladefenster fielen.
      const verzeichnis = (await audioVerzeichnisLaden()) || new Set();
      if (meins !== sprechLauf) return false;
      if (verzeichnis.has(schluessel)) {
        const a = new Audio('audio/' + schluessel + '.mp3');
        try {
          a.playbackRate = sprachTempo();
          laufendesAudio = a;
          await a.play();
          if (meins !== sprechLauf) { try { a.pause(); } catch (_) {} return false; }
          return true;
        } catch (e) {
          // Autoplay verweigert, Datei fehlt oder ist kaputt.
          console.warn('[Sprachausgabe] Aufnahme nicht abspielbar', e);
          // Nur den EIGENEN Verweis löschen. Vorher setzte ein scheiternder
          // Aufruf `laufendesAudio` bedingungslos auf null und nahm damit
          // einer parallel laufenden, funktionierenden Aufnahme den Griff —
          // die ließ sich danach nie mehr stoppen.
          if (laufendesAudio === a) laufendesAudio = null;
          /* Steht die Datei im Verzeichnis, fehlt aber tatsächlich (nicht
             ausgerollt, von .gitignore verschluckt), wäre die Karte sonst
             für immer stumm: Der Meldezweig unten wird ja nie erreicht.
             Also Eintrag verwerfen und Bedarf nachtragen. Ein verweigertes
             Autoplay trifft das ebenfalls — dort ist die Nachmeldung
             folgenlos, weil das Skript vorhandene Dateien überspringt. */
          verzeichnis.delete(schluessel);
          audioBedarfMelden(t, spr, stimme, lautschrift);
          if (meins !== sprechLauf) return false;
        }
      } else {
        audioBedarfMelden(t, spr, stimme, lautschrift);
      }
    }
  }
  return browserSprechen(t, spr);
}

/* Die Browserstimme nimmt je Äußerung nur begrenzt Text an; 500 Zeichen sind
   der übliche sichere Wert. Vorher wurde einfach abgeschnitten — eine lange
   Antwort brach mitten im Satz ab, ohne dass etwas darauf hinwies. Jetzt
   wird an Satzgrenzen zerlegt und stückweise in die Warteschlange gelegt. */
function textHaeppchen(text, grenze = 460) {
  const raus = [];
  let rest = String(text).trim();
  while (rest.length > grenze) {
    const fenster = rest.slice(0, grenze);
    let schnitt = Math.max(fenster.lastIndexOf('. '), fenster.lastIndexOf('! '),
                           fenster.lastIndexOf('? '), fenster.lastIndexOf('\n'));
    if (schnitt < grenze * 0.4) schnitt = fenster.lastIndexOf(' ');
    if (schnitt <= 0) schnitt = grenze;
    raus.push(rest.slice(0, schnitt + 1).trim());
    rest = rest.slice(schnitt + 1).trim();
  }
  if (rest) raus.push(rest);
  return raus;
}

function browserSprechen(text, sprache) {
  if (!sprachAusgabeDa() || !text) return false;
  try {
    window.speechSynthesis.cancel();
    textHaeppchen(String(text)).forEach(stueck => {
      const u = new SpeechSynthesisUtterance(stueck);
      u.lang = sprache || 'de-DE';
      u.rate = sprachTempo();
      window.speechSynthesis.speak(u);
    });
    return true;
  } catch (e) { console.warn('[Sprachausgabe]', e); return false; }
}

function sprechenStoppen() {
  sprechLauf++;                      // entwertet alle laufenden Aufrufe
  try { if (sprachAusgabeDa()) window.speechSynthesis.cancel(); } catch (_) {}
  try { if (laufendesAudio) { laufendesAudio.pause(); laufendesAudio = null; } } catch (_) {}
}

/* --- Sammelliste für die Vorproduktion ---------------------------------- */

/* Die Karten der drei Konten liegen getrennt unter users/{uid}/cards, und
   dort kommt kein Vorproduktions-Skript ohne Weiteres heran. Statt die
   Kartenbestände zu öffnen, meldet die App nur, WAS gesprochen werden soll:
   Text, Sprache, Stimme. Aus dieser gemeinsamen Liste erzeugt das Skript die
   Dateien; über den Inhalts-Hash profitieren danach alle Konten davon.

   Was das bedeutet und was nicht: In die Liste geraten Kartentexte — für die
   anderen beiden Konten also lesbar. Für Vokabeln und Prüfungsstoff ist das
   unerheblich, aber es ist eine bewusste Entscheidung und in den
   Einstellungen abschaltbar (`bedarfMelden`). Lernstand, Termine und
   Statistik bleiben in jedem Fall privat. */

const colAudioBedarf = () => FB.collection(db, 'audioBedarf');

/* Welche Schlüssel dieses Gerät schon gemeldet hat.
   Erste Fassung: ein Set je Sitzung. Das hatte zwei Folgen, die beide erst
   beim Prüfen auffielen.

   Erstens die Schreibmenge. Bei jedem Neustart begann die Liste von vorn,
   also wurde in JEDER Sitzung für jede noch nicht vertonte Kartenseite
   erneut geschrieben. Gemessen hat die Sammelliste die Schreibmenge einer
   Hörsitzung glatt verdoppelt; auf 2.000 Karten und drei Konten kommt man
   damit über das Tageskontingent des kostenlosen Firebase-Tarifs (20.000
   Schreibvorgänge, projektweit) — und wenn das erschöpft ist, scheitern
   auch die echten Kartenschreibungen.

   Zweitens der Regelverstoß. Firestore entscheidet `create` gegen `update`
   daran, ob das Dokument existiert, nicht daran, welche SDK-Funktion man
   ruft. Ein zweites `setDoc` auf denselben Schlüssel ist also ein `update`
   und wird von den Regeln abgelehnt. Funktional harmlos — der Eintrag steht
   ja schon drin —, aber es waren rund 4.000 abgelehnte Anfragen je Sitzung.

   localStorage ist hier richtig: Die Liste ist reine Buchführung dieses
   Geräts, sie muss nicht zwischen Geräten stimmen, und ein Verlust kostet
   nur eine überflüssige Schreibrunde. */
const BEDARF_SPEICHER = 'lk2:bedarf';
const bedarfGemeldet = new Set((() => {
  try { return JSON.parse(localStorage.getItem(BEDARF_SPEICHER) || '[]'); }
  catch (_) { return []; }
})());
let bedarfSichernTimer = null;
function bedarfJetztSichern() {
  clearTimeout(bedarfSichernTimer);
  bedarfSichernTimer = null;
  try {
    // Deckel gegen unbegrenztes Wachstum: Die jüngsten 20.000 Einträge
    // reichen weit über jeden realistischen Bestand hinaus.
    const liste = Array.from(bedarfGemeldet).slice(-20000);
    localStorage.setItem(BEDARF_SPEICHER, JSON.stringify(liste));
  } catch (_) { /* Speicher voll oder gesperrt — dann eben nicht */ }
}
function bedarfSichern() {
  // Gepuffert, weil beim Aufbau einer Sitzung viele Meldungen dicht
  // aufeinander folgen und jede sonst die ganze Liste neu serialisieren
  // würde.
  clearTimeout(bedarfSichernTimer);
  bedarfSichernTimer = setTimeout(bedarfJetztSichern, 1200);
}

function audioBedarfMelden(text, sprache, stimme, lautschrift) {
  if (S.einstellungen?.bedarfMelden === false || !db || !S.uid) return;
  const t = audioTextNormalisieren(text);
  if (!t || t.length > 900) return;   // Chirp nimmt mehr, aber Karten nicht
  audioSchluessel(lautschrift ? t + '' + lautschrift : t, sprache, stimme).then(schluessel => {
    if (!schluessel || bedarfGemeldet.has(schluessel)) return;
    bedarfGemeldet.add(schluessel);
    bedarfSichern();
    /* Bewusst ohne schreibe(): Ein Fehlschlag darf hier keinen Fehlertoast
       auslösen. Die Meldung ist eine Nebensache — wenn sie nicht ankommt,
       spricht die Karte eben weiter mit der Browserstimme. */
    Promise.resolve(FB.setDoc(FB.doc(colAudioBedarf(), schluessel), {
      text: t, sprache, stimme,
      lautschrift: String(lautschrift || '').slice(0, 200),
      gemeldetAm: heute()
    })).catch(e => {
      // Ein abgelehnter Zweitversuch heißt: Der Eintrag ist schon da. Das
      // ist der Normalfall auf einem zweiten Gerät und kein Grund für eine
      // Meldung in der Konsole.
      if (e?.code === 'permission-denied') return;
      console.warn('[Sprachbedarf]', e?.code || e);
    });
  });
}

/* ---------- 7c. Prüfung, Problemkarten, Karten-Check (Stufe 4) ---------- */

/* --- Prüfungstermin je Kasten (KONZEPT §6.6) ---------------------------- */

/* Auch auf Gültigkeit prüfen, nicht nur auf die Form: „2026-02-30“ rollt in
   JavaScript stillschweigend auf den 2. März weiter, und aus einer von Hand
   bearbeiteten Sicherung kommt so etwas durchaus. */
const deckPruefung = deckId => {
  const p = deckVon(deckId)?.pruefungsdatum;
  if (typeof p !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(p)) return null;
  const [y, m, t] = p.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1, t));
  return (d.getUTCFullYear() === y && d.getUTCMonth() === m - 1 && d.getUTCDate() === t) ? p : null;
};

/** Stauchen: Liegt der errechnete Termin hinter der Prüfung, wäre die Karte
 *  bis dahin kein einziges Mal mehr dran. Sie wird deshalb in die letzten
 *  Tage davor vorgezogen — verteilt über ein Fenster statt alles auf den
 *  Prüfungstag, sonst entstünde am Vortag ein unbearbeitbarer Berg. */
function terminStauchen(iso, deckId, kartenId) {
  const p = deckPruefung(deckId);
  if (!p || p < heute()) return iso;      // kein Termin oder schon vorbei
  if (iso <= p) return iso;               // passt ohnehin davor
  const rest = tageDiff(p, heute());
  // In den letzten beiden Tagen nicht mehr eingreifen: Die Karte war ja
  // gerade dran, ein weiterer Termin davor bringt nichts. Früher wurde hier
  // auf „morgen“ gesetzt — dadurch türmten sich am Prüfungstag und am Tag
  // danach sämtliche Karten des Kastens auf.
  if (rest <= 1) return iso;
  const fenster = Math.min(rest, 7);
  return plusTage(p, -(textHash(String(kartenId)) % fenster));
}

/** Ein Termin allein bewirkt nichts: Karten, deren Fälligkeit schon hinter
 *  der Prüfung liegt, kommen bis dahin nie dran und werden folglich auch nie
 *  neu terminiert. Beim Setzen des Termins müssen sie deshalb einmalig
 *  vorgezogen werden — sonst bleibt genau der reife Teil des Bestands, um
 *  den es vor einer Prüfung geht, unangetastet liegen. */
function pruefungTermineVorziehen(deckId) {
  const p = deckPruefung(deckId);
  if (!p || p < heute()) return 0;
  const ops = [];
  kartenVon(deckId).forEach(k => {
    if (k.suspendiert) return;
    const alt = k.due || heute();
    if (alt <= p) return;
    const neu = terminStauchen(alt, deckId, k.id);
    if (neu === alt) return;
    k.due = neu;                                   // lokal sofort
    ops.push(['merge', k.id, { due: neu }]);
  });
  variantenOpsSchreiben(ops, 'Termine vorziehen');
  return ops.length;
}

const deckPruefungAktiv = deckId => {
  const p = deckPruefung(deckId);
  return (p && p >= heute()) ? p : null;
};

/** Gemessene Sekunden je Abfrage aus dem eigenen Bestand. Damit rechnet die
 *  Machbarkeitsschätzung statt mit einer Pauschale — die App weiß ja, wie
 *  schnell dieser Nutzer tatsächlich ist. */
function gemesseneSekundenJeKarte() {
  let zeit = 0, n = 0;
  S.cards.forEach(k => {
    const z = Number(k.zeitGesamt) || 0, r = Number(k.zeitReps) || 0;
    if (z > 0 && r > 0) { zeit += z; n += r; }
  });
  return n >= 20 ? zeit / n : null;      // erst ab 20 Messungen aussagekräftig
}

/** Wie viele Abfragen fallen bis zum Termin voraussichtlich an? Eine Karte
 *  kommt in dieser Zeit nicht einmal dran, sondern so oft, wie ihr Intervall
 *  in die verbleibenden Tage passt. Genau das war der Fehler der ersten
 *  Fassung: Sie zählte jede Karte einmal und versprach damit ein Vielfaches
 *  zu wenig Aufwand. */
function erwarteteAbfragen(karten, tage) {
  if (tage <= 0) return karten.length;
  const retention = Math.min(0.95, Math.max(0.8, Number(S.einstellungen.retention) || 0.88));
  const iv = S.einstellungen.intervalle;
  let summe = 0;
  karten.forEach(k => {
    // Neue Karten: Einführung plus die kurzen Folgewiederholungen.
    if (istNeu(k)) { summe += Math.min(tage, 3); return; }
    const s = Number(k.stability) || 0;
    const intervall = S.einstellungen.klassikModus
      ? Math.max(1, iv[Math.min(11, Math.max(0, fachVon(k) - 1))] || 1)
      : Math.max(1, fsrsIntervallTage(s || 1, retention, FSRS_STANDARD_GEWICHTE));
    summe += Math.max(1, Math.round(tage / intervall));
  });
  return Math.round(summe);
}

/** Wie steht es vor der Prüfung? Liefert die nötige Tagesmenge und ein
 *  Urteil dazu, gemessen an der tatsächlichen eigenen Geschwindigkeit. */
function pruefungsLage(deckId) {
  const datum = deckPruefung(deckId);
  if (!datum) return null;
  const tage = tageDiff(datum, heute());
  const alle = kartenVon(deckId);
  const karten = alle.filter(k => !k.suspendiert);
  const ruhend = alle.length - karten.length;
  const dran = karten.filter(k => istNeu(k) || (k.due || heute()) <= datum);
  const offen = dran.length;
  const neue = dran.filter(istNeu).length;

  // Je Kartenfamilie kommt pro Sitzung nur eine Abfrage dran (Geschwister
  // werden zurückgestellt, Stufe 3).
  const jeFamilie = new Map();
  dran.forEach(k => {
    const f = k.quelleId || k.id;
    jeFamilie.set(f, (jeFamilie.get(f) || 0) + 1);
  });
  const familien = jeFamilie.size;
  const maxJeFamilie = Math.max(0, ...jeFamilie.values());

  const abfragen = erwarteteAbfragen(dran, tage);
  const proTag = tage > 0 ? Math.ceil(abfragen / tage) : abfragen;

  // Tagesziel in Karten. Liegen eigene Messungen vor, wird damit gerechnet —
  // sonst mit 15 Sekunden je Karte als Näherung.
  const sekJeKarte = gemesseneSekundenJeKarte() || 15;
  const ziel = S.einstellungen.zielEinheit === 'karten'
    ? zahl(S.einstellungen.zielKarten, 1, 2000, 30)
    : Math.max(5, Math.round(zahl(S.einstellungen.zielMinuten, 1, 600, 15) * 60 / sekJeKarte));
  const minutenNoetig = Math.round(proTag * sekJeKarte / 60);

  // Harte Schranken, unabhängig vom Tempo:
  //  – mehr Lücken/Richtungen an einer Karte als Tage übrig,
  //  – mehr Abfragen je Tag als es überhaupt Kartenfamilien gibt,
  //  – mehr neue Karten als der Tagesdeckel bis dahin durchlässt.
  const deckel = zahl(S.einstellungen.neuProTag, 5, 50, 20);
  const unmoeglich = maxJeFamilie > Math.max(1, tage)
    || (tage > 0 && proTag > familien)
    || neue > deckel * Math.max(1, tage + 1);

  const urteil = tage < 0 ? 'vorbei'
    : offen === 0 ? 'gut'
    : unmoeglich ? 'kritisch'
    : proTag <= ziel ? 'gut'
    : proTag <= ziel * 1.5 ? 'eng' : 'kritisch';
  return { datum, tage, offen, neue, ruhend, proTag, abfragen, ziel, minutenNoetig,
           urteil, familien, maxJeFamilie, sekJeKarte };
}
const PRUEFUNG_URTEIL = {
  gut:      ['machbar', 'var(--bewertung-3)'],
  eng:      ['eng', 'var(--faellig)'],
  kritisch: ['kaum zu schaffen', 'var(--bewertung-1)'],
  vorbei:   ['Termin vorbei', 'var(--txt3)']
};
/** Kästen mit anstehender Prüfung, die nächste zuerst. */
function anstehendePruefungen(nurDecks) {
  return S.decks
    .filter(d => (!nurDecks || nurDecks.has(d.id)) && deckPruefungAktiv(d.id))
    .map(d => ({ deck: d, lage: pruefungsLage(d.id) }))
    .sort((a, b) => a.lage.datum.localeCompare(b.lage.datum));
}
/** Termine, die verstrichen sind und noch am Kasten hängen. Ohne Hinweis
 *  bliebe der Kasten dauerhaft auf Prüfungsbetrieb getrimmt. */
function abgelaufenePruefungen(nurDecks) {
  return S.decks
    .filter(d => (!nurDecks || nurDecks.has(d.id)) && deckPruefung(d.id) && deckPruefung(d.id) < heute())
    .map(d => ({ deck: d, datum: deckPruefung(d.id) }));
}

/* --- Problemkarten (KONZEPT §6.3) --------------------------------------- */

const leechGrenze = () => zahl(S.einstellungen.leechGrenze, 3, 20, 7);
/** Aussetzer seit dem letzten Wiederaufnehmen. Ohne diesen Bezugspunkt würde
 *  eine wieder aufgenommene Karte beim allerersten Fehler sofort erneut
 *  ausgesetzt — sie liegt ja weiterhin über der Grenze. */
const leechZaehler = k => Math.max(0, (Number(k.lapses) || 0) - (Number(k.leechBasis) || 0));
const istProblemkarte = k => !!k.leech || leechZaehler(k) >= leechGrenze();
const problemkarten = () => S.cards.filter(istProblemkarte);

/* --- Karten-Check beim Anlegen (KONZEPT §6.4) --------------------------- */

/* Eine gewöhnliche deutsche Definition hat gut 20 Wörter. Bei 15 hätte der
   Hinweis bei fast jeder Prüfungskarte angeschlagen und wäre zur reinen
   Belästigung geworden. */
const WORTGRENZE = 28;

/** Zerlegt eine Antwort in Aufzählungspunkte — aber nur, wenn sie wirklich
 *  wie eine Aufzählung aussieht. Ein Komma allein reicht nicht: „Berlin, die
 *  Hauptstadt Deutschlands“ ist keine Liste. Deshalb greift die
 *  Komma-Trennung erst ab drei kurzen Gliedern. */
const LISTEN_MARKE = /^\s*(?:[-–—•*·]|\d{1,2}[.)])\s+/;
function aufzaehlungTeilen(text) {
  const leer = { stamm: '', teile: [] };
  const s = String(text ?? '').trim();
  if (!s) return leer;
  const abstreifen = z => z.replace(LISTEN_MARKE, '').trim();
  const zeilen = s.split(/\r?\n+/).map(z => z.trim()).filter(Boolean);

  if (zeilen.length >= 2) {
    // Eine Einleitungszeile mit Doppelpunkt gehört in den Kartenkopf und
    // nicht in eine eigene Lücke — sonst würde „Die drei Gewalten sind:“
    // zu einer eigenständig terminierten Abfrage.
    let stamm = '';
    let roh = zeilen;
    if (zeilen.length >= 3 && /:$/.test(zeilen[0]) && !LISTEN_MARKE.test(zeilen[0])) {
      stamm = zeilen[0]; roh = zeilen.slice(1);
    }
    const mitMarke = roh.length >= 2 && roh.every(z => LISTEN_MARKE.test(z));
    const teile = roh.map(abstreifen).filter(Boolean);
    // Ohne Aufzählungszeichen nur dann als Liste werten, wenn die Zeilen
    // wirklich kurz sind. Zwei Sätze auf zwei Zeilen sind keine Liste, und
    // daraus zwei „Satz wörtlich wiedergeben“-Lücken zu machen wäre schlimmer
    // als die Ausgangskarte.
    const kurz = teile.length >= 2 && teile.every(t => t.split(/\s+/).length <= 6);
    if (teile.length >= 2 && (mitMarke || kurz)) return { stamm, teile };
    return leer;
  }

  // Einzeilig: „Die drei Gewalten: Legislative, Exekutive, Judikative“
  let stamm = '', rest = s;
  const dp = s.indexOf(':');
  if (dp > 0 && dp < 60) { stamm = s.slice(0, dp + 1).trim(); rest = s.slice(dp + 1); }
  const kandidaten = rest.split(/\s*;\s*|\s*,\s*(?=\S)/).map(t => abstreifen(t)).filter(Boolean);
  if (kandidaten.length >= 3 && kandidaten.every(t => t.split(/\s+/).length <= 4))
    return { stamm, teile: kandidaten };
  return leer;
}

/** Prüft eine Karte auf die beiden Muster, die erfahrungsgemäß viel Zeit
 *  kosten und schlecht behalten werden: sehr lange Antworten und getarnte
 *  Aufzählungen. Nur ein Hinweis, nie eine Sperre (KONZEPT §6.4). */
function kartenCheck(antwort) {
  const woerter = String(antwort ?? '').trim().split(/\s+/).filter(Boolean).length;
  const { stamm, teile } = aufzaehlungTeilen(antwort);
  const gruende = [];
  if (woerter > WORTGRENZE)
    gruende.push(`Die Antwort hat <strong>${woerter} Wörter</strong>. Lange Antworten werden
      schlechter behalten, weil beim Abfragen unklar bleibt, wie viel davon genau gefragt ist.`);
  if (teile.length >= 2)
    gruende.push(`Die Antwort sieht nach einer Aufzählung mit <strong>${teile.length} Punkten</strong>
      aus. Aufzählungen lernt man einzeln deutlich schneller als am Stück.`);
  return { woerter, liste: teile, stamm, gruende };
}

/* --- Zeitauswertung (KONZEPT §6.7) -------------------------------------- */

/** Durchschnittliche Sekunden je gemessener Abfrage. null, wenn noch nichts
 *  gemessen wurde. Geteilt wird durch zeitReps, nicht durch reps: Karten aus
 *  Stufe 1–3 haben Wiederholungen aus einer Zeit ohne Zeitmessung, und die
 *  würden den Schnitt dauerhaft gegen null drücken. */
function schnittSekunden(k) {
  const zeit = Number(k.zeitGesamt) || 0;
  const n = Number(k.zeitReps) || 0;
  return (zeit > 0 && n > 0) ? zeit / n : null;
}
/** Die Karten, die am meisten Zeit kosten — erst ab zwei gemessenen
 *  Abfragen, damit ein einzelner Ausreißer (Telefonat mitten in der Sitzung)
 *  niemanden in die Liste bringt. */
function zeitfresser(karten, anzahl = 8) {
  return karten
    .map(k => ({ k, schnitt: schnittSekunden(k) }))
    .filter(x => x.schnitt !== null && (Number(x.k.zeitReps) || 0) >= 2)
    .sort((a, b) => b.schnitt - a.schnitt)
    .slice(0, anzahl);
}

/* ---------- 7e. Lernbox (Stufe 6) --------------------------------------- */

/* Bis Stufe 5 konnte HAN CROCO nur eine der beiden Hälften des Lernens:
   den ERHALT. FSRS bestimmt den richtigen Zeitpunkt, und das sehr gut. Der
   ERWERB fehlte vollständig — `bewerten()` schob jede Karte weiter, ganz
   gleich wie sie bewertet wurde. Eine mit „nicht gewusst“ bewertete Karte
   kam in derselben Sitzung kein einziges Mal wieder.

   Das ist nicht bloß eine Lücke. Karpicke und Roediger haben genau diese
   Bedingung gemessen — eine Karte aus dem Verkehr ziehen, sobald sie einmal
   saß —, und sie schnitt von allen geprüften Verfahren AM SCHLECHTESTEN ab:
   21 % Behalten nach einer Woche gegenüber 44 %, wenn weiter abgefragt wird.

   Die Lernbox baut das nach, was am Papierkasten funktioniert hat: Karten,
   die nicht saßen, wandern zur Seite und werden dort bis zu einem Kriterium
   geübt, bevor sie in den Umlauf zurückkehren. In der Forschung heißt das
   „successive relearning“ — Kriterium innerhalb der Sitzung, verteilt über
   mehrere Sitzungen.

   ZWEI ENTWURFSPUNKTE, an denen das Verfahren sonst kippt:

   1. ABSTAND. Der Wirkstoff ist nicht die Wiederholung, sondern der Abstand
      dazwischen. Eine Karte fünfmal hintereinander zu fragen ist geballtes
      Üben und misst nur das Kurzzeitgedächtnis. Deshalb ist die Lernbox ein
      STAPEL, kein Einzelplatz: Zwischen zwei Anläufen derselben Karte
      müssen andere liegen (`lernboxAbstand`).

   2. FSRS BEKOMMT DIE ERSTE BEWERTUNG, NICHT DIE LETZTE. Wer eine Karte
      erst im vierten Anlauf kann, hat sie nicht gekonnt. Würde die Lernbox
      am Ende „gewusst“ melden, hielte der Scheduler sie für leichter als
      sie ist und der Termin rutschte zu weit nach hinten. Die Lernbox liegt
      also ÜBER dem Scheduler und fasst ihn nicht an. */

const lernboxAn = () => S.einstellungen?.lernboxAn !== false;
function lernboxKriterium() {
  const n = Number(S.einstellungen?.lernboxKriterium);
  return Number.isFinite(n) && n >= 1 && n <= 5 ? Math.round(n) : 2;
}
function lernboxAbstand() {
  const n = Number(S.einstellungen?.lernboxAbstand);
  return Number.isFinite(n) && n >= 0 && n <= 10 ? Math.round(n) : 2;
}
const lernboxAuchSchwer = () => S.einstellungen?.lernboxAusloeser !== '1';
const lernboxNeueAn = () => S.einstellungen?.lernboxNeue !== false;
const lernboxTippenAn = () => S.einstellungen?.lernboxTippen === true;

/** Liegt diese Abfrage in der Lernbox?
 *  Die Prüfung auf null muss VOR Number() stehen: `Number(null)` ist 0 und
 *  damit endlich und nicht negativ — ohne diese Zeile gälte jede Karte als
 *  in der Lernbox liegend, und `inLernboxLegen` hätte nie etwas geschrieben. */
const inLernbox = k => k != null && k.uebung != null
  && Number.isFinite(Number(k.uebung)) && Number(k.uebung) >= 0
  && !k.suspendiert;

/** Alle Karten der Lernbox, wahlweise auf Kästen eingegrenzt. */
function lernboxKarten(deckIds) {
  /* Ist die Lernbox abgeschaltet, gibt es auch keine Karten darin. Vorher
     prüfte nur der Zähler am Reiter `lernboxAn()`, die Liste nicht — die
     Seite bot „5 Karten üben“ an, während der Reiter nichts anzeigte. */
  if (!lernboxAn()) return [];
  const filter = deckIds instanceof Set ? deckIds : null;
  // Karten ohne Kasten kommen in keiner Sitzung mehr vor; sie dürfen auch
  // die Lernbox nicht mehr belegen (sonst zeigt der Zähler dauerhaft eine
  // Zahl, hinter der nichts Erreichbares steht).
  const kaesten = new Set(S.decks.map(d => d.id));
  return S.cards.filter(k => inLernbox(k) && kaesten.has(k.deckId)
    && (!filter || filter.has(k.deckId)));
}

/** Neue Karten, die noch eingeführt werden könnten.
 *  Bewusst NICHT automatisch in die Box geschrieben: Bei einem frisch
 *  wiederhergestellten Bestand lägen sonst auf einen Schlag Hunderte darin.
 *  Sie werden angeboten und beim Start portionsweise übernommen — begrenzt
 *  durch dasselbe Tagespensum, das auch für den Karteikasten gilt. */
function lernboxNeueKandidaten(deckIds) {
  if (!lernboxNeueAn()) return [];
  const filter = deckIds instanceof Set ? deckIds : null;
  return S.cards.filter(k =>
    istNeu(k) && !k.suspendiert && !inLernbox(k)
    && k.uebungFertig !== heute()          // heute schon eingeführt
    && (!filter || filter.has(k.deckId)));
}

/** Wie viele neue Karten dürfen heute noch eingeführt werden?
 *  Teilt sich das Kontingent mit dem Karteikasten — sonst führte die Lernbox
 *  zwanzig Karten ein und der Kasten legte am selben Tag zwanzig weitere
 *  obendrauf. */
function lernboxNeueFrei() {
  // S.heutigeNeu pflegt die Sitzung des Karteikastens; heutigeStatistikLaden()
  // frischt sie auf. Für die Anzeige genügt der bekannte Stand — beim Start
  // der Übungssitzung wird er neu geholt.
  return Math.max(0, zahl(S.einstellungen.neuProTag, 5, 50, 20) - (Number(S.heutigeNeu) || 0));
}

/** Zahl für den Zähler am Reiter. */
function lernboxAnzahl() {
  if (!lernboxAn()) return 0;
  return lernboxKarten().length;
}

/** Eine Abfrage in die Lernbox legen. Ohne Wirkung, wenn sie schon drin ist —
 *  sonst setzte eine zweite schlechte Bewertung den mühsam erarbeiteten
 *  Zählstand zurück. */
const LERNBOX_VOLL = 30;
function inLernboxLegen(k, wobei) {
  if (!k || inLernbox(k)) return false;
  /* Zufluss deckeln. Gemessen: Ab etwa 30 bewerteten Karten je Sitzung
     wächst die Box um rund vier Karten am Tag, weil je Runde nur zwölf
     herauskommen. Eine Box, die nie leer wird, wird zur Ablage — und bei
     einer Vierzehnjährigen zum Grund, die Funktion abzuschalten.
     Was hier abgewiesen wird, ist nicht verloren: Die Karte bleibt im
     Karteikasten regulär terminiert. */
  if (lernboxKarten().length >= LERNBOX_VOLL) return false;
  const patch = { uebung: 0 };
  Object.assign(k, patch);
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), wobei || 'In die Lernbox');
  return true;
}

/** Eine Abfrage aus der Lernbox nehmen. */
function ausLernboxNehmen(k, wobei) {
  if (!k || !inLernbox(k)) return false;
  const patch = { uebung: null, uebungFertig: heute() };
  Object.assign(k, patch);
  schreibe(FB.updateDoc(FB.doc(colCards(), k.id), patch), wobei || 'Aus der Lernbox');
  return true;
}

/* --- Stufenweises Aufdecken (Cover-Copy-Compare) ------------------------ */

/* Das digitale Gegenstück zum Umdrehen der Papierkarte: erst ein, zwei
   Buchstaben, dann mehr, dann alles — und danach wieder zudecken und selbst
   erzeugen. Als Cover-Copy-Compare ist das Verfahren seit Jahrzehnten
   untersucht und gilt als wirksam über Fertigkeiten, Lernende und
   Situationen hinweg.

   Wichtig: Die App verlangt NICHT, dass getippt wird. Sie stellt die Stufen
   bereit und führt Buch über das Kriterium. Ob dabei zur Tastatur oder zum
   Zettel gegriffen wird, bleibt offen — sonst wäre der Papierweg, mit dem
   der Nutzer jahrelang gut gefahren ist, plötzlich versperrt. */

/** Stufe 1: Wortlängen und erste Buchstaben. „Legislative, Exekutive“ wird
 *  zu „L__________, E________“. Interpunktion bleibt stehen, sie ist Teil
 *  des Gerüsts und verrät nichts. */
function tippErsteBuchstaben(text) {
  /* Ziffern gehören mit: „1789", „H2O" und „a² + b² = c²" standen nach dem
     ersten Tipp unverändert da — der Tipp verriet die ganze Antwort. */
  return String(text ?? '').replace(/[\p{L}\p{N}][\p{L}\p{N}\p{M}'’-]*/gu,
    w => w.length === 1 ? w : w[0] + '_'.repeat(Math.min(w.length - 1, 14)));
}

/** Stufe 2: das erste Wort vollständig, der Rest wie in Stufe 1. */
function tippErstesWort(text) {
  const roh = String(text ?? '');
  const treffer = roh.match(/[\p{L}\p{N}][\p{L}\p{N}\p{M}'’-]*/u);
  if (!treffer) return tippErsteBuchstaben(roh);
  const bis = treffer.index + treffer[0].length;
  return roh.slice(0, bis) + tippErsteBuchstaben(roh.slice(bis));
}

const LERNBOX_STUFEN = [
  ['frage', 'Nur die Frage'],
  ['buchstaben', 'Erste Buchstaben'],
  ['wort', 'Erstes Wort'],
  ['antwort', 'Ganze Antwort'],
  ['zugedeckt', 'Zugedeckt — jetzt selbst']
];

/** Der Text, der auf der aktuellen Stufe zu sehen ist. */
function lernboxStufenText(k, stufe) {
  const antwort = antwortText(k);
  if (stufe === 'buchstaben') return tippErsteBuchstaben(antwort);
  if (stufe === 'wort') return tippErstesWort(antwort);
  if (stufe === 'antwort') return antwort;
  return '';
}

/* ---------- 7d. Begrüßung und Abzeichen -------------------------------- */

/** Anzeigename. Ohne eigenen Eintrag wird der vordere Teil der E-Mail
 *  genommen — besser als gar keine Ansprache, aber jederzeit überschreibbar. */
function anzeigeName() {
  const eigen = String(S.einstellungen.name || '').trim();
  if (eigen) return eigen.slice(0, 30);
  const vorn = String(S.email || '').split('@')[0] || '';
  const teil = vorn.split(/[._-]/)[0] || '';
  return teil ? teil.charAt(0).toUpperCase() + teil.slice(1) : '';
}

/** Tagesabschnitt nach der Uhr — bewusst nicht nach der Lern-Tagesgrenze:
 *  Wer um 2 Uhr lernt, lernt für die Statistik noch den Vortag, soll aber
 *  trotzdem nicht mit „Guten Morgen“ begrüßt werden. */
function tagesabschnitt(stunde) {
  const h = Number.isFinite(stunde) ? stunde : new Date().getHours();
  if (h < 5) return 'nacht';
  if (h < 11) return 'morgen';
  if (h < 14) return 'mittag';
  if (h < 18) return 'nachmittag';
  if (h < 22) return 'abend';
  return 'nacht';
}

const BEGRUESSUNG = {
  morgen:     ['Guten Morgen{N}', 'Früh dran{N}', 'Ein paar Karten zum Wachwerden{N}?'],
  mittag:     ['Guten Tag{N}', 'Mittagsrunde{N}?', 'Schön, dass du da bist{N}'],
  nachmittag: ['Guten Nachmittag{N}', 'Nachmittagsrunde{N}?', 'Weiter geht’s{N}'],
  abend:      ['Bereit für eine Abendschicht{N}?', 'Guten Abend{N}', 'Noch eine Runde zum Feierabend{N}?'],
  nacht:      ['Späte Runde{N}?', 'Noch wach{N}?', 'Die Nachtschicht{N}?']
};

/* Eigene Ansprache für die Lernbox. Der Karteikasten grüßt seit Stufe 4 mit
   Namen, die Lernbox nicht — dabei ist gerade sie der Ort, an dem man sich
   überwindet. Dieselbe Machart: an Datum und Tagesabschnitt gebunden, nicht
   gewürfelt, sonst spränge der Text bei jeder Firestore-Aktualisierung um. */
const BEGRUESSUNG_LERNBOX = {
  leer:  ['Die Lernbox ist leer{N}', 'Nichts zu üben{N} — gut gemacht',
          'Alles durch{N}'],
  neue:  ['Neue Karten warten{N}', 'Etwas Neues{N}?', 'Frisch dabei{N}'],
  wenig: ['Ein kleiner Stapel{N}', 'Das ist schnell erledigt{N}', 'Los geht’s{N}'],
  viel:  ['Da liegt einiges{N}', 'Nimm dir einen Teil vor{N}', 'Schritt für Schritt{N}'],
  voll:  ['Die Box ist voll{N}', 'Erst aufräumen{N}, dann Neues']
};

/** Ansprache über der Lernbox — abhängig davon, was tatsächlich drin liegt. */
function lernboxBegruessung(drinN, freiN) {
  const name = anzeigeName();
  const anrede = name ? ', ' + name : '';
  /* Die Fülle gilt für die GANZE Box, nicht für den gefilterten Ausschnitt:
     Sonst stand über drei sichtbaren Karten „Das ist schnell erledigt“,
     während der Karteikasten meldete, die Box sei voll und nehme nichts
     mehr auf. */
  const gesamt = lernboxKarten().length;
  const lage = gesamt >= LERNBOX_VOLL ? 'voll'
             : drinN > 12            ? 'viel'
             : drinN > 0             ? 'wenig'
             : freiN > 0             ? 'neue'
             : 'leer';
  const kandidaten = BEGRUESSUNG_LERNBOX[lage];
  const i = textHash(heute() + ':' + tagesabschnitt() + ':' + lage) % kandidaten.length;
  return kandidaten[i].replace('{N}', anrede);
}

/** Begrüßung passend zu Tageszeit und Lage. Die Auswahl hängt an Datum und
 *  Tagesabschnitt, nicht am Zufall — sonst spränge der Text bei jeder
 *  Firestore-Aktualisierung um. */
function begruessung(faellig, ueberfaellig) {
  const name = anzeigeName();
  const anrede = name ? ', ' + name : '';
  const abschnitt = tagesabschnitt();
  const streak = Number(S.einstellungen.streak) || 0;
  const rueckstand = Number(ueberfaellig) || 0;
  const kandidaten = BEGRUESSUNG[abschnitt].slice();
  /* „Alles erledigt“ darf nur dastehen, wenn wirklich nichts mehr offen ist.
     Zählt man nur die heute fälligen Karten, meldete die App Feierabend,
     während direkt darunter „400 überfällige Karten“ stand. */
  if (!faellig && !rueckstand) kandidaten.push('Alles erledigt{N}', 'Heute nichts fällig{N}');
  else if (rueckstand > 20) {
    kandidaten.length = 0;
    kandidaten.push('Da hat sich etwas angesammelt{N}', 'Zeit zum Aufholen{N}?',
      `${rueckstand} Karten warten schon länger{N}`);
  } else {
    if (streak >= 7) kandidaten.push(`Tag ${streak} in Folge{N}`);
  }
  const lage = (faellig ? 'f' : 'l') + (rueckstand > 20 ? 'r' : '');
  const i = textHash(heute() + ':' + abschnitt + ':' + lage) % kandidaten.length;
  return kandidaten[i].replace('{N}', anrede);
}

const ABZEICHEN_ARTEN = {
