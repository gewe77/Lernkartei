/* --- 14b. CSV lesen --- */

/* Ein Anf\u00FChrungszeichen gilt nur dann als Feldbegrenzer, wenn das Feld noch
   leer ist \u2014 also direkt nach Zeilenanfang oder Trennzeichen. Sonst ist es
   ein ganz normales Zeichen. Vorher schaltete jedes " mitten im Text den
   Zitatmodus um: aus  Zoll;5" (L\u00E4nge)  wurde eine einzige Karte, die den
   ganzen Rest der Datei verschluckte, und aus  Er sagte "hallo"  wurde
   klammheimlich  Er sagte hallo. */
function csvZerlegen(text, trenner) {
  text = String(text ?? '').replace(/^\uFEFF/, '');
  const trenn = trenner || ';';
  const zeilen = [];
  csvZerlegen.offenesZitat = false;
  let feld = '', zeile = [], inQ = false, offen = true;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) {
      if (c === '"' && n === '"') { feld += '"'; i++; }
      else if (c === '"') { inQ = false; offen = false; }
      else feld += c;
    } else if (c === '"' && offen && feld === '') { inQ = true; }
    else if (c === trenn) { zeile.push(feld); feld = ''; offen = true; }
    else if (c === '\r') { /* ignorieren */ }
    else if (c === '\n') { zeile.push(feld); zeilen.push(zeile); zeile = []; feld = ''; offen = true; }
    else { feld += c; offen = false; }
  }
  if (feld !== '' || zeile.length) { zeile.push(feld); zeilen.push(zeile); }
  // Endet die Datei mitten in einem Zitat, fehlt irgendwo ein Anf\u00FChrungszeichen
  // und alles danach steckt in einem einzigen Feld. Der Dialog sagt das an.
  csvZerlegen.offenesZitat = inQ;
  return zeilen.filter(z => z.some(f => String(f).trim() !== ''));
}

const CSV_TRENNER = [[';', 'Semikolon'], ['\t', 'Tabulator'], [',', 'Komma']];

/** Trennzeichen aus der Datei erraten. Vorher kannte die App nur Semikolon und
 *  Tabulator \u2014 eine kommagetrennte Datei landete komplett im Papierkorb, ohne
 *  dass jemand erfuhr warum.
 *
 *  Entscheidend ist die Gleichm\u00E4\u00DFigkeit, nicht die Spaltenzahl: \u201ENenne die
 *  Grundfarben;rot, gelb, blau\u201C ergibt mit Komma drei gleichm\u00E4\u00DFige Spalten und
 *  mit Semikolon zwei \u2014 nach Spaltenzahl gew\u00E4nne das Komma und zerschnitte die
 *  Antwort. Bei gleicher Gleichm\u00E4\u00DFigkeit entscheidet deshalb die feste
 *  Rangfolge Semikolon \u2192 Tabulator \u2192 Komma. Das Komma steht hinten, weil es in
 *  Antworttexten am h\u00E4ufigsten vorkommt. */
function csvTrennerErkennen(text, dateiname) {
  if (/\.tsv$/i.test(String(dateiname || ''))) return '\t';
  /* F\u00FCr die Erkennung reichen die ersten Zeilen \u2014 bei 20.000 Zeilen sonst
     dreimal die ganze Datei zerlegen, nur um 40 Zeilen anzusehen. */
  const probe = String(text ?? '').slice(0, 120000);
  let bester = ';', bestesMass = -1;
  CSV_TRENNER.forEach(([t]) => {
    const zeilen = csvZerlegen(probe, t).slice(0, 40);
    if (zeilen.length < 1) return;
    const zahlen = zeilen.map(z => z.length);
    const haeufig = new Map();
    zahlen.forEach(n => haeufig.set(n, (haeufig.get(n) || 0) + 1));
    let modus = 0, wie = 0;
    haeufig.forEach((anzahl, n) => { if (anzahl > wie || (anzahl === wie && n > modus)) { modus = n; wie = anzahl; } });
    if (modus < 2) return;
    const anteil = wie / zahlen.length;
    if (anteil > bestesMass + 0.001) { bestesMass = anteil; bester = t; }
  });
  return bester;
}

/* \u00DCbliche Spalten\u00FCberschriften \u2014 auch die aus anderen Lernprogrammen. */
const CSV_KOPFWORTE = {
  frage:   ['frage', 'front', 'vorderseite', 'begriff', 'wort', 'vokabel', 'question', 'term', 'word'],
  antwort: ['antwort', 'back', 'r\u00FCckseite', 'rueckseite', 'bedeutung', '\u00FCbersetzung',
            'uebersetzung', 'answer', 'definition', 'translation', 'meaning',
            'erkl\u00E4rung', 'erklaerung', 'erl\u00E4uterung', 'erlaeuterung',
            'l\u00F6sung', 'loesung', 'beschreibung', 'explanation', 'solution'],
  notiz:   ['notiz', 'note', 'notes', 'bemerkung', 'beispiel', 'hinweis', 'kommentar', 'example'],
  kasten:  ['kasten', 'deck', 'kategorie', 'thema', 'stapel', 'category', 'topic']
};
/* Eine \u00DCberschrift wird nur angenommen, wenn mindestens ZWEI verschiedene
   Rollen erkannt werden. Ein einzelnes Stichwort gen\u00FCgt nicht: Die Zeile
   \u201EWort;word\u201C ist eine ganz normale Vokabelkarte, wurde vorher aber als
   \u00DCberschrift gewertet und stillschweigend verschluckt. Lieber eine sichtbare
   Karte zuviel \u2014 die kann man l\u00F6schen \u2014 als eine unsichtbar fehlende. */
const csvIstKopfzeile = zeile => {
  const rollen = new Set();
  zeile.forEach(f => {
    const w = String(f).trim().toLowerCase();
    Object.keys(CSV_KOPFWORTE).forEach(art => { if (CSV_KOPFWORTE[art].includes(w)) rollen.add(art); });
  });
  return rollen.size >= 2;
};
/** Spaltenvorschlag: nach \u00DCberschrift, sonst Spalte 1 und 2. Keine Spalte darf
 *  dabei zwei Rollen bekommen \u2014 sonst entst\u00FCnden Karten, deren Antwort die
 *  Frage wiederholt, oder je Zeile ein eigener Kasten. */
function csvSpaltenRaten(kopf, spalten) {
  const anzahl = Math.max(1, spalten || (kopf ? kopf.length : 2));
  const finde = art => {
    if (!kopf) return -1;
    const i = kopf.findIndex(f => CSV_KOPFWORTE[art].includes(String(f).trim().toLowerCase()));
    return i < anzahl ? i : -1;
  };
  const notiz = finde('notiz');
  let kasten = finde('kasten');
  let frage = finde('frage'), antwort = finde('antwort');
  const frei = ausser => { for (let i = 0; i < anzahl; i++) if (!ausser.includes(i)) return i; return -1; };
  if (frage < 0)   frage   = frei([antwort, notiz, kasten]);
  if (antwort < 0) antwort = frei([frage, notiz, kasten]);
  /* Bleibt nichts frei, weil Notiz- und Kastenspalte alles belegen, wird deren
     Rolle aufgegeben — eine Datei „Thema;Begriff;Beispiel“ ist einwandfrei und
     darf nicht in einer roten Sackgasse enden. */
  if (frage < 0)   frage   = frei([antwort]);
  if (antwort < 0) antwort = frei([frage]);
  if (frage < 0)   frage   = 0;
  if (antwort < 0) antwort = anzahl > 1 ? (frage === 0 ? 1 : 0) : 0;
  if (notiz === frage || notiz === antwort) notiz = -1;
  /* Eine Kastenspalte, die zugleich Frage oder Antwort ist, w\u00E4re genau der
     alte Unfall: aus jeder Zeile ein eigener Kasten. */
  if (kasten === frage || kasten === antwort) kasten = -1;
  return { frage, antwort, notiz, kasten };
}

/* --- 14b2. CSV einlesen mit Vorschau ------------------------------------
   Früher galt starr: Spalte 1 = Frage, 2 = Antwort, 3 = Kasten, 4 = Notiz.
   Steht in Spalte 3 etwas Zeilenspezifisches — eine Notiz, ein Schlagwort,
   eine Beispielsatz-Spalte —, entstand aus jeder Zeile ein eigener Kasten:
   180 Zeilen ergaben 180 Kästen. Kommagetrennte Dateien wurden zudem
   vollständig verworfen, ohne dass jemand erfuhr warum. Deshalb wird jetzt
   vor dem Schreiben gezeigt, was passieren wird, und alles ist einstellbar.
   ------------------------------------------------------------------------ */

async function csvEinlesenDialog(datei) {
  const z = {
    trenner: csvTrennerErkennen(datei.text, datei.name),
    zeilen: [], spalten: 1, kopf: false, sp: null
  };
  const neuLesen = () => {
    z.zeilen = csvZerlegen(datei.text, z.trenner);
    z.kopf = z.zeilen.length ? csvIstKopfzeile(z.zeilen[0]) : false;
    /* Maßgeblich sind die Datenzeilen. Eine Kopfzeile „Frage;Antwort;Notiz;Kasten“
       über zweispaltigen Daten ergäbe sonst eine leere vierte Spalte — und aus
       jeder Zeile einen Kasten namens „Ohne Kasten“. */
    const daten = z.zeilen.slice(z.kopf ? 1 : 0);
    z.spalten = Math.max(1, ...(daten.length ? daten : z.zeilen).map(r => r.length));
    z.sp = csvSpaltenRaten(z.kopf ? z.zeilen[0] : null, z.spalten);
  };
  neuLesen();
  if (!z.zeilen.length) return toast('In der Datei stehen keine verwertbaren Zeilen.', 'fehler');
  const offenesZitat = () => csvZerlegen.offenesZitat;
  /* Kaputte Umlaute fallen sonst erst auf den fertigen Karten auf. */
  const kaputteZeichen = datei.text.includes('�');

  const vorschlag = String(datei.name || '').replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 120) || 'Import';
  // Nur wenn eine Spalte ausdrücklich „Kasten“/„Deck“ heißt, wird sie auch
  // als Kasten vorgeschlagen. Sonst landet alles in einem neuen Kasten —
  // das ist die Erwartung, wenn man eine Liste einliest.
  const kastenSpalteGefuellt = () => {
    if (z.sp.kasten < 0) return false;
    const daten = z.zeilen.slice(z.kopf ? 1 : 0);
    if (!daten.length) return false;
    const voll = daten.filter(r => String(r[z.sp.kasten] ?? '').trim()).length;
    return voll > daten.length / 2;
  };
  const zielVorgabe = kastenSpalteGefuellt() ? 'spalte' : 'neu';

  const spaltenName = i => {
    const k = z.kopf && z.zeilen[0] ? String(z.zeilen[0][i] ?? '').trim() : '';
    return `Spalte ${i + 1}${k ? ' — ' + k.slice(0, 24) : ''}`;
  };
  const auswahl = (id, wert, mitKeine) => `<select id="${id}">
      ${mitKeine ? `<option value="-1" ${wert < 0 ? 'selected' : ''}>— keine —</option>` : ''}
      ${Array.from({ length: z.spalten }, (_, i) =>
        `<option value="${i}" ${wert === i ? 'selected' : ''}>${esc(spaltenName(i))}</option>`).join('')}
    </select>`;

  const koerper = () => `
    <div class="row" style="gap:10px;align-items:flex-end;margin-bottom:10px">
      <label class="feld" style="flex:1;margin:0"><span>Trennzeichen</span>
        <select id="m-trenner">${CSV_TRENNER.map(([t, n]) =>
          `<option value="${t === '\t' ? 'tab' : t}" ${z.trenner === t ? 'selected' : ''}>${n}</option>`).join('')}
        </select></label>
      <label class="karo" style="flex:1"><input type="checkbox" id="m-kopf" ${z.kopf ? 'checked' : ''}>
        <span>Erste Zeile ist eine Überschrift</span></label>
    </div>
    <div class="row" style="gap:10px">
      <label class="feld" style="flex:1;min-width:130px"><span>Frage</span>${auswahl('m-sp-frage', z.sp.frage)}</label>
      <label class="feld" style="flex:1;min-width:130px"><span>Antwort</span>${auswahl('m-sp-antwort', z.sp.antwort)}</label>
      <label class="feld" style="flex:1;min-width:130px"><span>Notiz</span>${auswahl('m-sp-notiz', z.sp.notiz, true)}</label>
    </div>
    <label class="feld"><span>Wohin?</span>
      <select id="m-ziel">
        <option value="neu" ${zielVorgabe === 'neu' ? 'selected' : ''}>In einen neuen Kasten</option>
        ${S.decks.map(d => `<option value="d:${esc(d.id)}">In den vorhandenen Kasten „${esc(d.name)}“</option>`).join('')}
        <option value="spalte" ${zielVorgabe === 'spalte' ? 'selected' : ''}>Kastenname steht in einer Spalte</option>
      </select></label>
    <label class="feld" id="m-zielname-feld"><span>Name des neuen Kastens</span>
      <input id="m-zielname" maxlength="120" value="${esc(vorschlag)}"></label>
    <label class="feld" id="m-spkasten-feld" hidden><span>Spalte mit dem Kastennamen</span>
      ${auswahl('m-sp-kasten', z.sp.kasten >= 0 ? z.sp.kasten : 0)}</label>
    <label class="karo" id="m-dubletten-feld" hidden><input type="checkbox" id="m-dubletten" ${
      z.dubletten === false ? '' : 'checked'}>
      <span>Karten überspringen, die dort schon stehen</span></label>
    <div id="m-csv-vorschau"></div>
    <div id="m-csv-bilanz" class="hinweis" style="margin-top:10px"></div>`;

  /** Liest die Einstellungen aus dem Dialog. */
  const einstellungLesen = m => {
    const t = $('#m-trenner', m)?.value;
    return {
      trenner: t === 'tab' ? '\t' : (t || ';'),
      kopf: !!$('#m-kopf', m)?.checked,
      frage: Number($('#m-sp-frage', m)?.value ?? 0),
      antwort: Number($('#m-sp-antwort', m)?.value ?? 1),
      notiz: Number($('#m-sp-notiz', m)?.value ?? -1),
      kastenSpalte: Number($('#m-sp-kasten', m)?.value ?? -1),
      ziel: $('#m-ziel', m)?.value || 'neu',
      zielname: String($('#m-zielname', m)?.value || '').trim(),
      ohneDubletten: $('#m-dubletten', m) ? !!$('#m-dubletten', m).checked : true
    };
  };

  /* Was steht schon in den Kästen? Damit dieselbe Datei nicht beim zweiten
     Einlesen alles verdoppelt — der häufigste Fehlgriff, wenn man sich beim
     ersten Mal bei der Zuordnung vertan hat. */
  const nameZuId = new Map(S.decks.map(d => [(d.name || '').toLowerCase(), d.id]));
  const fragenJeDeck = new Map();
  S.cards.filter(istQuellkarte).forEach(k => {
    const s = fragenJeDeck.get(k.deckId) || new Set();
    s.add(String(k.frage || '').trim().toLowerCase());
    fragenJeDeck.set(k.deckId, s);
  });
  const zielIdFuer = (e, name) =>
    e.ziel === 'spalte' ? nameZuId.get(String(name || '').toLowerCase())
      : e.ziel === 'neu' ? nameZuId.get(String(e.zielname || vorschlag).toLowerCase())
        : e.ziel.slice(2);

  /** Wertet die Datei nach den gewählten Einstellungen aus — ohne zu schreiben. */
  const auswerten = e => {
    const daten = z.zeilen.slice(e.kopf ? 1 : 0);
    const karten = [];
    const kaesten = new Map();          // Name (klein) -> Anzeigename
    const gesehen = new Map();          // Zielkasten -> bereits gelesene Fragen
    let leer = 0, dubletten = 0;
    daten.forEach(r => {
      const frage = String(r[e.frage] ?? '').trim();
      const antwort = String(r[e.antwort] ?? '').trim();
      if (!frage || !antwort) { leer++; return; }
      const name = e.ziel === 'spalte'
        ? (String(r[e.kastenSpalte] ?? '').trim() || 'Ohne Kasten')
        : null;
      if (name) kaesten.set(name.toLowerCase(), name);
      const zielId = zielIdFuer(e, name) || ('neu:' + (name || '').toLowerCase());
      const schluessel = frage.toLowerCase();
      const bekannt = (fragenJeDeck.get(zielId)?.has(schluessel)) || gesehen.get(zielId)?.has(schluessel);
      if (!gesehen.has(zielId)) gesehen.set(zielId, new Set());
      gesehen.get(zielId).add(schluessel);
      if (bekannt) {
        dubletten++;
        if (e.ohneDubletten !== false) return;
      }
      karten.push({ frage, antwort, notiz: e.notiz >= 0 ? String(r[e.notiz] ?? '').trim() : '', name });
    });
    return { karten, kaesten, leer, dubletten, zeilen: daten.length };
  };

  const zeichnen = m => {
    const e = einstellungLesen(m);
    $('#m-zielname-feld', m).hidden = e.ziel !== 'neu';
    $('#m-spkasten-feld', m).hidden = e.ziel !== 'spalte';

    const daten = z.zeilen.slice(e.kopf ? 1 : 0).slice(0, 5);
    const rolle = i => i === e.frage ? 'Frage' : i === e.antwort ? 'Antwort'
      : i === e.notiz ? 'Notiz' : (e.ziel === 'spalte' && i === e.kastenSpalte) ? 'Kasten' : '';
    $('#m-csv-vorschau', m).innerHTML = `
      <p class="mini" style="margin-bottom:4px">Vorschau der ersten Zeilen:</p>
      <div class="csv-vorschau"><table class="daten"><thead><tr>${
        Array.from({ length: z.spalten }, (_, i) => {
          const r = rolle(i);
          return `<th${r ? ' class="rolle"' : ''}>${r || '·'}</th>`;
        }).join('')}</tr></thead><tbody>${
        daten.map(r => `<tr>${Array.from({ length: z.spalten }, (_, i) => {
          const voll = String(r[i] ?? '');
          return `<td${rolle(i) ? ' class="rolle"' : ''} title="${esc(voll.slice(0, 300))}">${
            esc(voll.slice(0, 40))}${voll.length > 40 ? '…' : ''}</td>`;
        }).join('')}</tr>`).join('')
      }</tbody></table></div>`;

    const b = auswerten(e);
    const vorhanden = new Set(S.decks.map(d => (d.name || '').toLowerCase()));
    const neueKaesten = Array.from(b.kaesten.keys()).filter(n => !vorhanden.has(n)).length;
    const bilanz = $('#m-csv-bilanz', m);
    let text = '';
    /* Zeigt Frage und Antwort auf dieselbe Spalte, entstünden Karten, deren
       Antwort die Frage wiederholt. Das ist nie gewollt und passiert vor allem
       dann, wenn das Trennzeichen nicht passt und die Datei nur eine Spalte
       hat. Darum hier deutlich sagen, was zu tun ist, statt eine Kartenzahl
       zu versprechen, die es so nicht geben wird. */
    if (e.frage === e.antwort) {
      const tname = (CSV_TRENNER.find(([t]) => t === e.trenner) || [, 'dem gewählten Zeichen'])[1];
      text = z.spalten < 2
        ? `<strong>Keine verwertbaren Zeilen.</strong> Mit dem Trennzeichen „${esc(tname)}“
           hat die Datei nur eine Spalte — Frage und Antwort lassen sich so nicht trennen.
           Probiere ein anderes Trennzeichen.`
        : `<strong>Keine verwertbaren Zeilen.</strong> Frage und Antwort zeigen auf dieselbe
           Spalte. Bitte zwei verschiedene Spalten wählen.`;
      bilanz.className = 'hinweis rot';
      bilanz.innerHTML = text;
      return;
    }
    if (!b.karten.length && !b.dubletten) {
      text = `<strong>Keine verwertbaren Zeilen.</strong> Mit dieser Zuordnung ist bei allen
        ${b.zeilen} Zeilen Frage oder Antwort leer. Stimmt das Trennzeichen?`;
      bilanz.className = 'hinweis rot';
    } else if (e.ziel === 'spalte') {
      const viele = b.kaesten.size > 5;
      text = `<strong>${b.karten.length} Karten</strong> in <strong>${b.kaesten.size} Kästen</strong>
        (${neueKaesten} davon neu).`
        + (viele ? `<br>Das sind auffällig viele Kästen. Enthält die gewählte Spalte wirklich
             Kastennamen — oder eher Notizen und Schlagwörter? Dann besser „In einen neuen
             Kasten“ wählen.` : '');
      bilanz.className = viele ? 'hinweis' : 'hinweis blau';
    } else {
      /* „In einen neuen Kasten“ mit dem Namen eines vorhandenen Kastens legt
         keinen zweiten an, sondern schreibt hinein. Das muss dastehen, sonst
         stimmt die Ankündigung nicht mit dem Ergebnis überein. */
      const zielName = e.ziel === 'neu' ? (e.zielname || vorschlag)
        : (S.decks.find(d => 'd:' + d.id === e.ziel)?.name || '');
      const trifftVorhandenen = e.ziel === 'neu' && vorhanden.has(String(zielName).toLowerCase());
      const drin = trifftVorhandenen
        ? (fragenJeDeck.get(nameZuId.get(String(zielName).toLowerCase()))?.size || 0) : 0;
      text = `<strong>${b.karten.length} ${b.karten.length === 1 ? 'Karte' : 'Karten'}</strong> ${
        e.ziel === 'neu' && !trifftVorhandenen
        ? 'in den neuen Kasten' : 'in den Kasten'} „${esc(zielName)}“`
        + (trifftVorhandenen ? ` — den gibt es schon, er enthält bereits ${drin}
             ${drin === 1 ? 'Karte' : 'Karten'}.` : '.');
      bilanz.className = 'hinweis blau';
    }
    if (b.leer) text += `<br><span class="mini">${b.leer} Zeilen ohne Frage oder Antwort werden übersprungen.</span>`;
    if (b.dubletten) text += `<br><span class="mini">${b.dubletten} ${b.dubletten === 1
      ? `Karte steht dort schon und wird ${e.ohneDubletten !== false ? 'übersprungen' : 'trotzdem angelegt'}`
      : `Karten stehen dort schon und werden ${e.ohneDubletten !== false ? 'übersprungen' : 'trotzdem angelegt'}`}.</span>`;
    /* Was nicht als Überschrift erkannt wurde, wird zur Karte. Lieber vorher
       zeigen, was in Zeile 1 steht, als hinterher eine Karte „Deutsch → Englisch“
       im Kasten zu finden. */
    if (!e.kopf && z.zeilen[0] && b.karten.length) {
      const erste = [z.zeilen[0][e.frage], z.zeilen[0][e.antwort]]
        .map(s => String(s ?? '').trim().slice(0, 30)).filter(Boolean).join(' → ');
      if (erste) text += `<br><span class="mini">Zeile 1 wird als Karte eingelesen: „${esc(erste)}“.
        Ist das eine Überschrift, oben den Haken setzen.</span>`;
    }
    if (kaputteZeichen) text += `<br><strong>Die Umlaute sehen falsch aus.</strong> In der Datei stehen
      unlesbare Zeichen (�). Die Datei noch einmal als „CSV UTF-8“ speichern und erneut einlesen.`;
    if (offenesZitat()) text += `<br><strong>In der Datei fehlt ein Anf\u00FChrungszeichen.</strong>
      Irgendwo beginnt eines, das nie geschlossen wird \u2014 alles danach steckt in einer einzigen
      Karte. Bitte in der Datei nachsehen.`;
    bilanz.innerHTML = text;
    if (kaputteZeichen || offenesZitat()) bilanz.className = 'hinweis rot';
    $('#m-dubletten-feld', m).hidden = !b.dubletten && e.ohneDubletten !== false;
  };

  const antwort = await modal({
    titel: 'CSV einlesen — ' + (datei.name || 'Datei'),
    breit: true,
    ohneEnter: true,
    html: `<div id="m-csv">${koerper()}</div>`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, {
      text: 'Einlesen', wert: 'ok', art: 'primary',
      pruefen: () => {
        const m = $('#modal');
        const e = einstellungLesen(m);
        if (e.frage === e.antwort) { toast('Frage und Antwort dürfen nicht dieselbe Spalte sein.'); return false; }
        if (e.ziel === 'spalte' && (e.kastenSpalte === e.frage || e.kastenSpalte === e.antwort)) {
          toast('Die Kasten-Spalte darf nicht zugleich Frage oder Antwort sein — sonst entsteht je Zeile ein eigener Kasten.');
          return false;
        }
        if (e.ziel === 'neu' && !e.zielname) { toast('Bitte einen Namen für den neuen Kasten eingeben.'); return false; }
        if (!auswerten(e).karten.length) {
          toast(auswerten(e).dubletten
            ? 'Alle Karten stehen dort schon — es gibt nichts einzulesen.'
            : 'Mit dieser Zuordnung gibt es nichts einzulesen.');
          return false;
        }
      }
    }],
    beimOeffnen: m => {
      const verdrahte = () => {
        $$('#m-csv select, #m-csv input', m).forEach(el => {
          if (el._csv) return;
          el._csv = true;
          el.addEventListener(el.tagName === 'INPUT' && el.type === 'text' ? 'input' : 'change', () => {
            if (el.id === 'm-trenner') {
              z.trenner = el.value === 'tab' ? '\t' : el.value;
              const merken = { ziel: $('#m-ziel', m).value, name: $('#m-zielname', m).value };
              z.dubletten = $('#m-dubletten', m) ? !!$('#m-dubletten', m).checked : true;
              neuLesen();
              $('#m-csv', m).innerHTML = koerper();
              $('#m-ziel', m).value = [...$$('#m-ziel option', m)].some(o => o.value === merken.ziel)
                ? merken.ziel : 'neu';
              $('#m-zielname', m).value = merken.name;
              verdrahte();
              /* Der Dialogkörper wurde neu gebaut — ohne das hier landet der
                 Fokus im Nichts und Tastaturbedienung fängt von vorn an. */
              $('#m-trenner', m)?.focus();
            }
            zeichnen(m);
          });
        });
      };
      verdrahte();
      zeichnen(m);
    }
  });
  if (antwort !== 'ok') return;

  /* --- Schreiben --- */
  const e = {
    trenner: letzteWerte['m-trenner'] === 'tab' ? '\t' : (letzteWerte['m-trenner'] || ';'),
    kopf: letzteWerte['m-kopf'] === true,
    frage: Number(W('m-sp-frage', 0)),
    antwort: Number(W('m-sp-antwort', 1)),
    notiz: Number(W('m-sp-notiz', -1)),
    kastenSpalte: Number(W('m-sp-kasten', -1)),
    ziel: W('m-ziel', 'neu'),
    zielname: String(W('m-zielname', vorschlag)).trim() || vorschlag,
    ohneDubletten: W('m-dubletten', true) !== false
  };
  z.trenner = e.trenner;
  neuLesen();
  const b = auswerten(e);
  if (!b.karten.length) return toast('Keine verwertbaren Zeilen.', 'fehler');

  const nachName = new Map(S.decks.map(d => [(d.name || '').toLowerCase(), d.id]));
  const neueDecks = [];
  const deckFuer = name => {
    const schluessel = name.toLowerCase();
    let id = nachName.get(schluessel);
    if (!id) {
      id = neueId();
      nachName.set(schluessel, id);
      neueDecks.push({ id, daten: neuesDeck(name) });
    }
    return id;
  };

  let zielId = null;
  if (e.ziel === 'neu') zielId = deckFuer(e.zielname);
  else if (e.ziel !== 'spalte') zielId = e.ziel.slice(2);
  if (e.ziel !== 'spalte' && !S.decks.some(d => d.id === zielId) && !neueDecks.some(d => d.id === zielId))
    return toast('Der gewählte Kasten gibt es nicht mehr.', 'fehler');

  const karten = b.karten.map(k => {
    const deckId = e.ziel === 'spalte' ? deckFuer(k.name) : zielId;
    return { id: neueId(), ...neueKarte({ deckId, frage: k.frage, antwort: k.antwort, notiz: k.notiz }) };
  });

  const ops = [
    ...neueDecks.map(d => ['set', FB.doc(colDecks(), d.id), d.daten]),
    ...karten.map(k => { const { id, ...rest } = k; return ['set', FB.doc(colCards(), id), rest]; })
  ];
  for (let i = 0; i < ops.length; i += 400) {
    const stapel = FB.writeBatch(db);
    ops.slice(i, i + 400).forEach(([, ref, daten]) => stapel.set(ref, daten));
    schreibe(stapel.commit(), 'CSV-Import');
  }
  // Sieht der Zielkasten Rückwärtsabfragen vor, fehlen sie den frisch
  // eingelesenen Karten noch. Gleich nachziehen statt den Nutzer später
  // über die Diagnose stolpern zu lassen.
  neueDecks.forEach(d => { if (!S.decks.some(x => x.id === d.id)) S.decks.push({ id: d.id, ...d.daten }); });
  const neueIds = new Set(karten.map(k => k.id));
  karten.forEach(k => { if (!S.cards.some(c => c.id === k.id)) S.cards.push(k); });
  const bilanz = alleVariantenAbgleichen(k => neueIds.has(k.id));
  /* Für die Rücknahme merken. Nur im Arbeitsspeicher: Nach einem Neuladen ist
     der Import Vergangenheit, und ein Knopf, der Wochen später noch Karten
     löscht, wäre gefährlicher als nützlich. */
  S.letzterImport = {
    // Kasten je Karte mitschreiben \u2014 die R\u00FCcknahme pr\u00FCft damit, ob eine Karte
    // seither verschoben wurde.
    karten: karten.map(k => ({ id: k.id, deckId: k.deckId })),
    decks: neueDecks.map(d => d.id),
    anzahl: karten.length,
    kasten: e.ziel === 'spalte' ? '' : (deckName(zielId) || e.zielname)
  };
  toast(`${karten.length} Karten eingelesen`
    + (neueDecks.length ? `, ${neueDecks.length} ${neueDecks.length === 1 ? 'Kasten' : 'Kästen'} angelegt` : '')
    + (bilanz.angelegt ? `, ${bilanz.angelegt} Gegenabfragen ergänzt` : '') + '.');
  seiteZeigen('karten');
}

/* --- 14c. Altbestand aus dem Browser --- */

function altdatenImBrowser() {
  try {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('lk:')) out[k] = localStorage.getItem(k);
    }
    return Object.keys(out).length ? out : null;
  } catch (_) { return null; }
}

/* --- 14d. Alt-Format deuten --- */

function jsonSanft(v) {
  if (typeof v !== 'string') return v;
  try { return JSON.parse(v); } catch (_) { return null; }
}

/**
 * Erkennt und normalisiert:
 *  - den JSON-Export der Vorgängerversion   { "lk:boxes":[…], "lk:cards:ID":[…], … }
 *  - den „Referenz-Dump“ (gleiche Schlüssel, Werte als Zeichenketten)
 *  - eine Verpackung  { data: { … } }  oder { storage: { … } }
 *  - den eigenen Export        { app:'HAN CROCO', decks:[], cards:[] }
 * Liefert { decks, cards, intervalle, meta, quelle } oder null.
 */
/** Kasten aus fremden Daten auf das eigene Schema bringen. */
function deckNormalisieren(d, i) {
  const q = (d && typeof d === 'object') ? d : {};
  const farbe = String(q.farbe ?? q.color ?? '').trim();
  return {
    id: sichereId(q.id || neueId()),
    name: String(q.name ?? 'Kasten').slice(0, 120) || 'Kasten',
    farbe: /^#[0-9a-fA-F]{3,8}$/.test(farbe) ? farbe : DECK_FARBEN[i % DECK_FARBEN.length],
    richtung: RICHTUNGEN.includes(q.richtung) ? q.richtung : 'vorwaerts',
    modi: Array.isArray(q.modi) && q.modi.filter(x => MODI_ALLE.includes(x)).length
      ? q.modi.filter(x => MODI_ALLE.includes(x)) : ['aufdecken'],
    sprache: typeof q.sprache === 'string' && /^[a-z]{2}(-[A-Z]{2})?$/.test(q.sprache) ? q.sprache : 'de-DE',
    spracheAntwort: typeof q.spracheAntwort === 'string' && /^[a-z]{2}(-[A-Z]{2})?$/.test(q.spracheAntwort)
      ? q.spracheAntwort
      : (typeof q.sprache === 'string' && /^[a-z]{2}(-[A-Z]{2})?$/.test(q.sprache) ? q.sprache : 'de-DE'),
    pruefungsdatum: isoOder(q.pruefungsdatum, null),
    createdAt: isoOder(q.createdAt, heute()),
    archiviert: !!q.archiviert
  };
}

/** Karte aus fremden Daten auf das eigene Schema bringen.
 *  Gilt für beide Quellen — jedes Feld wird erzwungen, damit kein Zahlenwert
 *  in einem Datumsfeld später die Kartenliste blockiert. */
function karteNormalisieren(k, deckId, ivListe) {
  const q = (k && typeof k === 'object') ? k : {};
  const hist = Array.isArray(q.history) ? q.history.filter(h => h && typeof h === 'object') : null;
  const fach = zahl(q.fach, 1, 12, 1);
  const reps = hist ? hist.length : zahl(q.reps, 0, 99999, 0);
  const lapses = hist ? hist.filter(h => Number(h.rating) === 1).length : zahl(q.lapses, 0, 99999, 0);
  const letzte = hist && hist.length ? hist[hist.length - 1] : null;
  const zuletzt = letzte ? isoOder(letzte.date, null) : isoOder(q.lastReview, null);
  const stabRoh = Number(q.stability);
  const hatStab = Number.isFinite(stabRoh) && stabRoh > 0;
  const schwRoh = Number(q.difficulty);
  // Nur eine Karte, an der nichts auf eine frühere Abfrage hindeutet, darf
  // als frischer Gedächtniszustand (0/0) ankommen — den braucht ts-fsrs für
  // die Ersteinschätzung. Würde er auf 1/1 hochgeklemmt, hielte die
  // Bibliothek sie für eine bereits gelernte Karte am unteren Anschlag.
  // Alles andere behält seinen Platz (KONZEPT §9: Fach → Stabilität).
  const unberuehrt = !hatStab && reps === 0 && fach <= 1 && !zuletzt;
  return {
    id: sichereId(q.id || neueId()),
    deckId,
    frage: String(q.frage ?? q.front ?? '').trim(),
    antwort: String(q.antwort ?? q.back ?? '').trim(),
    notiz: String(q.notiz ?? '').trim(),
    // Stufe 5. Die Aliase decken den Anki-Export ab, wo die Felder Extra
    // bzw. Marker heißen.
    extra: String(q.extra ?? q.Extra ?? '').trim(),
    mark: String(q.mark ?? q.Mark ?? '').trim(),
    lautschrift: String(q.lautschrift ?? '').trim().slice(0, 200),
    lautschriftAntwort: String(q.lautschriftAntwort ?? '').trim().slice(0, 200),
    // Fremde Daten gelten grundsätzlich als Klartext. Nur wer ausdrücklich
    // 'html' mitschickt — also eine eigene Sicherung aus Stufe 5 — bekommt
    // den Auszeichnungspfad. Andernfalls würde ein Anki-Export mit rohem
    // Markup unbesehen als HTML gedeutet.
    format: q.format === 'html' ? 'html' : 'text',
    /* Anki exportiert Schlagwörter als eine leerzeichengetrennte
       Zeichenkette, nicht als Liste — vorher fielen sie kommentarlos weg.
       Steuerzeichen werden entfernt, weil U+001F intern als Trennzeichen
       dient und ein importiertes Schlagwort sonst beim Bearbeiten in zwei
       zerfiele. */
    tags: (Array.isArray(q.tags) ? q.tags
            : typeof q.tags === 'string' ? q.tags.split(/[\s,;]+/) : [])
          .map(t => String(t).replace(/[\u0000-\u001f]/g, '').trim().slice(0, 60))
          .filter(Boolean).slice(0, 30),
    typ: KARTEN_TYPEN.includes(q.typ) ? q.typ : 'standard',
    // Stufe 3: Zugehörigkeit zur Quellkarte mitnehmen, sonst würden aus
    // Rückwärtsabfragen beim Import eigenständige Karten ohne Inhalt.
    quelleId: q.quelleId ? sichereId(q.quelleId) : null,
    variante: /^(v|r|c\d{1,2})$/.test(String(q.variante || '')) ? q.variante : 'v',
    fach,
    stability: unberuehrt ? 0
      : (hatStab ? Math.min(3650, stabRoh) : (ivListe[fach - 1] ?? 1)),   // KONZEPT §9
    /* Nicht runden: FSRS rechnet mit Nachkommastellen, und `Math.round`
       machte aus 8,34176 beim Rücksichern eine 8 — bei jeder Sicherung ein
       Stück mehr Abweichung. */
    difficulty: unberuehrt ? 0
      : (Number.isFinite(schwRoh) && schwRoh >= 1
         ? Math.min(10, Math.round(schwRoh * 10000) / 10000) : 5),
    due: isoOder(q.faellig ?? q.due, heute()),
    // Ein Abfragedatum aus der Zukunft (Sicherung von einem Gerät, das voraus
    // war) macht die Karte für ts-fsrs unbewertbar — hier gleich begrenzen.
    lastReview: zuletzt && zuletzt > heute() ? heute() : zuletzt,
    reps,
    lapses,
    /* FSRS schreibt `learningSteps` mit (index.html, bewertungsPatch). Das
       Feld kannte weder `neueKarte` noch dieser Normalisierer — es ging bei
       jeder Sicherung verloren. */
    learningSteps: zahl(q.learningSteps, 0, 20, 0),
    state: [0, 1, 2, 3].includes(q.state) ? q.state : (reps ? 2 : 0),
    suspendiert: !!q.suspendiert,
    leech: !!q.leech,
    leechBasis: zahl(q.leechBasis, 0, 99999, 0),
    // Stufe 6: Ein Zählstand über dem Kriterium wäre sinnlos; null heißt
    // „nicht in der Lernbox“.
    /* `q.uebung != null` MUSS zuerst stehen: Number(null) ist 0, und eine 0
       heißt „liegt in der Lernbox". Ohne diese Prüfung landete nach jeder
       Wiederherstellung einer JSON-Sicherung JEDE Karte in der Lernbox — und
       weil der Karteikasten neue Lernbox-Karten überspringt, ließ sich
       danach überhaupt nichts Neues mehr lernen. Derselbe Fehler war in
       Stufe 6 schon einmal in inLernbox() (Zeile 2791). */
    uebung: q.uebung != null && Number.isFinite(Number(q.uebung)) && Number(q.uebung) >= 0
      ? Math.min(9, Math.round(Number(q.uebung))) : null,
    uebungTag: isoOder(q.uebungTag, null),
    uebungFertig: isoOder(q.uebungFertig, null),
    zeitGesamt: zahl(q.zeitGesamt, 0, 9999999, 0),
    zeitReps: zahl(q.zeitReps, 0, 99999, 0),
    createdAt: isoOder(q.createdAt, heute())
  };
}

/** Intervallliste absichern: genau zwölf Werte, jeder eine sinnvolle Zahl.
 *  Liefert null, wenn die Quelle gar keine Intervalle mitbrachte — dann wird
 *  auch nicht angeboten, die eigenen Einstellungen zu überschreiben. */
/** Basis für die Stabilität beim Import: die Intervalle aus der Quelle, falls
 *  vorhanden — sonst die, die in diesem Konto tatsächlich gelten. Nur so passt
 *  die abgeleitete Stabilität zum Fach, wenn jemand eigene Intervalle pflegt. */
function aktuelleIntervalle() {
  const iv = S.einstellungen?.intervalle;
  return (Array.isArray(iv) && iv.length === 12) ? iv : STANDARD_INTERVALLE;
}

function intervalleNormalisieren(roh) {
  if (!Array.isArray(roh) || !roh.length) return null;
  return Array.from({ length: 12 }, (_, i) =>
    zahl(roh[i], 1, 3650, STANDARD_INTERVALLE[i]));
}

function altdatenDeuten(roh) {
  let o = roh;
  if (typeof o === 'string') o = jsonSanft(o);
  if (!o || typeof o !== 'object') return null;

  // Verpackungen abstreifen
  for (const schluessel of ['data', 'storage', 'daten', 'payload']) {
    if (o[schluessel] && typeof o[schluessel] === 'object' &&
        Object.keys(o).some(k => !k.startsWith('lk:'))) {
      const inner = o[schluessel];
      if (Object.keys(inner).some(k => k.startsWith('lk:'))) { o = inner; break; }
    }
  }

  // Eigener Export (Lernkartei 2)
  if (Array.isArray(o.cards) && Array.isArray(o.decks)) {
    const ivL2 = intervalleNormalisieren(o.settings?.intervalle);
    const decks = o.decks.map(deckNormalisieren);
    const bekannt = new Map(decks.map(d => [d.id, d.id]));
    const auffang = { id: null };
    const cards = o.cards.map(k => {
      const roheId = sichereId((k && k.deckId) || '');
      let ziel = bekannt.get(roheId);
      if (!ziel) {                       // Karte ohne passenden Kasten auffangen
        if (!auffang.id) {
          const d = deckNormalisieren({ name: 'Ohne Kasten' }, decks.length);
          auffang.id = d.id; decks.push(d);
        }
        ziel = auffang.id;
      }
      return karteNormalisieren(k, ziel, ivL2 || aktuelleIntervalle());
    });
    // Kartenkennungen können beim Einlesen entschärft werden (sichereId).
    // Dann müssen die quelleId-Verweise mitwandern, sonst hinge eine
    // Rückwärtsabfrage im Leeren und wäre nicht mehr zu bearbeiten.
    const idKarteNeu = new Map();
    o.cards.forEach((roh, i) => {
      const alt = String(roh && roh.id != null ? roh.id : '');
      if (alt && cards[i]) idKarteNeu.set(alt, cards[i].id);
    });
    const vorhandeneIds = new Set(cards.map(c => c.id));
    cards.forEach(c => {
      if (!c.quelleId) return;
      const neu = idKarteNeu.get(String(c.quelleId)) || c.quelleId;
      // Zeigt der Verweis ins Nichts, wird aus der Abfrage eine eigenständige
      // Karte — besser als ein Datensatz, den niemand mehr öffnen kann.
      if (vorhandeneIds.has(neu) && neu !== c.id) c.quelleId = neu;
      else { c.quelleId = null; c.variante = 'v'; }
    });
    return {
      // Ältere Sicherungen tragen noch den alten Namen — den auch so nennen,
      // sonst wundert man sich, warum eine Datei von 2026 als „HAN CROCO“
      // ausgewiesen wird, obwohl sie aus der Vorgängerversion stammt.
      quelle: o.app === 'HAN CROCO' ? 'HAN CROCO' : (o.app || o.appAlt || 'Lernkartei 2'),
      konto: typeof o.konto === 'string' ? o.konto : '',
      decks, cards,
      intervalle: ivL2,
      meta: {
        streak: zahl(o.settings?.streak, 0, 99999, 0),
        lastLearnDate: isoOder(o.settings?.lastLearnDate, null)
      },
      /* Die Sicherung enthält auch Anzeigename, Abzeichensatz und die
         persönlichen Einstellungen. Die blieben beim Einspielen bisher liegen:
         Nach einer Wiederherstellung war der von Hand gepflegte Abzeichensatz
         weg, obwohl er in der Datei stand. */
      einstellungen: (() => {
        const q = o.settings || {};
        const raus = {};
        if (typeof q.name === 'string' && q.name.trim()) raus.name = q.name.trim().slice(0, 40);
        if (['auto', 'hell', 'dunkel'].includes(q.theme)) raus.theme = q.theme;
        /* zahl() rundet auf ganze Zahlen — für einen Bruchwert wie 0,88 käme
           dabei 1 heraus und damit geklemmt 0,98. Der Scheduler rechnete danach
           mit dem Extremwert und verkürzte alle Intervalle. */
        if (Number.isFinite(Number(q.retention)))
          raus.retention = Math.min(0.95, Math.max(0.80, Number(q.retention)));
        if (typeof q.klassikModus === 'boolean') raus.klassikModus = q.klassikModus;
        if (Number.isFinite(Number(q.neuProTag))) raus.neuProTag = zahl(q.neuProTag, 5, 50, 20);
        // Stufe 6
        if (typeof q.lernboxAn === 'boolean') raus.lernboxAn = q.lernboxAn;
        if (Number.isFinite(Number(q.lernboxKriterium))) raus.lernboxKriterium = zahl(q.lernboxKriterium, 1, 5, 2);
        if (Number.isFinite(Number(q.lernboxAbstand))) raus.lernboxAbstand = zahl(q.lernboxAbstand, 0, 10, 2);
        if (q.lernboxAusloeser === '1' || q.lernboxAusloeser === '12') raus.lernboxAusloeser = q.lernboxAusloeser;
        if (typeof q.lernboxNeue === 'boolean') raus.lernboxNeue = q.lernboxNeue;
        if (typeof q.lernboxTippen === 'boolean') raus.lernboxTippen = q.lernboxTippen;
        if (Number.isFinite(Number(q.zielMinuten))) raus.zielMinuten = zahl(q.zielMinuten, 1, 600, 15);
        if (Number.isFinite(Number(q.zielKarten))) raus.zielKarten = zahl(q.zielKarten, 1, 2000, 30);
        if (['minuten', 'karten'].includes(q.zielEinheit)) raus.zielEinheit = q.zielEinheit;
        if (Number.isFinite(Number(q.leechGrenze))) raus.leechGrenze = zahl(q.leechGrenze, 3, 20, 7);
        const ab = abzeichenPruefen(q.abzeichen);
        if (ab) raus.abzeichen = ab;
        return Object.keys(raus).length ? raus : null;
      })(),
      reviews: Array.isArray(o.reviews) ? o.reviews.filter(r => r && typeof r === 'object') : []
    };
  }

  const hol = k => jsonSanft(o[k]) ?? (typeof o[k] === 'object' ? o[k] : null);
  const boxen = hol('lk:boxes');
  if (!Array.isArray(boxen)) return null;

  const meta = hol('lk:meta') || {};
  const ivRoh = intervalleNormalisieren(hol('lk:intervals'));
  const ivListe = ivRoh || aktuelleIntervalle();

  const decks = [], cards = [];
  const idKarte = new Map();     // alte deckId -> neue deckId

  boxen.forEach(b => {
    if (!b || typeof b !== 'object') return;
    const alt = String(b.id ?? '');
    const d = deckNormalisieren(b, decks.length);
    idKarte.set(alt, d.id);
    decks.push(d);
  });

  // Kartenlisten einsammeln — auch für Kästen, die in lk:boxes fehlen
  Object.keys(o).filter(k => /^lk:cards:/.test(k)).forEach(schluessel => {
    const altDeck = schluessel.slice('lk:cards:'.length);
    let deckId = idKarte.get(altDeck);
    if (!deckId) {                                    // verwaister Kartenstapel
      const d = deckNormalisieren({ id: altDeck, name: 'Wiederhergestellt' }, decks.length);
      deckId = d.id;
      idKarte.set(altDeck, deckId);
      decks.push(d);
    }
    const liste = hol(schluessel);
    if (!Array.isArray(liste)) return;
    liste.forEach(k => cards.push(karteNormalisieren(k, deckId, ivListe)));
  });

  return {
    quelle: 'Vorgängerversion', decks, cards, reviews: [],
    intervalle: ivRoh,
    meta: {
      streak: zahl(meta.streak, 0, 99999, 0),
      lastLearnDate: isoOder(meta.lastLearnDate, null)
    }
  };
}

/** Deuten mit Netz und doppeltem Boden: eine kaputte Sicherungsdatei darf
 *  nicht dazu führen, dass beim Klick einfach nichts geschieht. */
function sicherDeuten(roh) {
  try {
    return altdatenDeuten(roh);
  } catch (e) {
    console.error('[Import]', e);
    modal({
      titel: 'Die Datei ließ sich nicht lesen',
      html: `<p>Beim Auswerten der Daten ist etwas schiefgegangen. Der Bestand
             im Konto wurde nicht angefasst.</p>
             <p class="mini">Technische Meldung: ${esc(e?.message || String(e))}</p>
             <p class="mini">Wenn es die JSON-Sicherung der alten App ist, hilft
             oft der Weg über „Aus diesem Browser“ — dort werden die Daten direkt
             gelesen statt aus der Datei.</p>`,
      knoepfe: [{ text: 'Schließen', wert: 'ok', art: 'primary' }]
    });
    return null;
  }
}

/* --- 14e. Import ausführen --- */

async function importAusfuehren(geparst, quelleName) {
  const leer = !geparst || (!geparst.decks.length && !geparst.cards.length);
  if (leer) return toast('Keine übernehmbaren Daten gefunden.', 'fehler');

  const gueltig = geparst.cards.filter(k => k.frage || k.antwort);
  const bestand = S.cards.length;
  /* Aus dem eigenen Konto sind die Einstellungen erwünscht — aus einem fremden
     wären sie eine stille Übernahme fremder Vorlieben, bis hin zum Umschalten
     des Schedulers. Deshalb nur dort vorangehakt. */
  const eigenesKonto = !geparst.konto || geparst.konto === S.email;

  const wahl = await modal({
    titel: 'Import',
    breit: true,
    html: `
      <p>Gefunden in <strong>${esc(quelleName)}</strong> (${esc(geparst.quelle)}):</p>
      <div class="kennzahlen" style="margin:12px 0">
        <div class="kennzahl"><b>${geparst.decks.length}</b><span>Kästen</span></div>
        <div class="kennzahl"><b>${gueltig.length}</b><span>Karten</span></div>
      </div>
      ${bestand ? `
        <p>In diesem Konto liegen bereits <strong>${bestand}</strong> Karten. Was soll passieren?</p>
        <label class="karo"><input type="radio" name="konflikt" value="merge" checked>
          <span><strong>Zusammenführen</strong> — Vorhandenes bleibt, Neues kommt dazu.
          Karten mit gleicher Kennung werden übersprungen, gleichnamige Kästen wiederverwendet.</span></label>
        <label class="karo"><input type="radio" name="konflikt" value="replace">
          <span><strong>Ersetzen</strong> — alle bestehenden Kästen und Karten dieses Kontos
          werden vorher gelöscht.</span></label>`
        : '<p class="mini">Das Konto ist leer — es wird einfach alles angelegt.</p>'}
      ${geparst.intervalle ? `<label class="karo" style="margin-top:8px">
        <input type="checkbox" id="m-iv" checked>
        <span>Intervalle aus der Sicherung übernehmen
        (${esc(geparst.intervalle.slice(0, 6).join(' · '))} …)</span></label>` : ''}
      ${geparst.einstellungen ? `<label class="karo">
        <input type="checkbox" id="m-einst" ${eigenesKonto ? 'checked' : ''}>
        <span>Einstellungen übernehmen — Anzeigename, Abzeichen, Retention, Tagespensum.
        ${eigenesKonto ? '' : `<br><strong>Achtung:</strong> Die Sicherung stammt aus einem
          anderen Konto${geparst.konto ? ` (${esc(geparst.konto)})` : ''}. Deine eigenen
          Einstellungen würden überschrieben.`}</span></label>` : ''}`,
    knoepfe: [{ text: 'Abbrechen', wert: null },
              { text: 'Übernehmen', wert: 'ok', art: 'primary' }]
  });
  if (wahl !== 'ok') return;

  const modus = bestand ? WRadio('konflikt', 'merge') : 'merge';
  const ivUebernehmen = letzteWerte['m-iv'] === true;
  const einstUebernehmen = letzteWerte['m-einst'] === true;

  await importSchreiben(geparst, modus, ivUebernehmen, einstUebernehmen);
}

async function importSchreiben(geparst, modus, ivUebernehmen, einstUebernehmen) {
  const ops = [];

  if (modus === 'replace') {
    // Nur das löschen, was nicht ohnehin gleich überschrieben wird. Sonst
    // könnten Löschen und Neuschreiben in getrennten Stapeln in falscher
    // Reihenfolge beim Server ankommen und die Karte wäre weg.
    const kommtNeu = new Set(geparst.cards.map(k => k.id));
    const deckKommtNeu = new Set(geparst.decks.map(d => d.id));
    S.decks.forEach(d => { if (!deckKommtNeu.has(d.id)) ops.push(['del', FB.doc(colDecks(), d.id)]); });
    S.cards.forEach(k => { if (!kommtNeu.has(k.id)) ops.push(['del', FB.doc(colCards(), k.id)]); });
    /* Auch die Tagesstatistik. Sonst ergäbe „Ersetzen“ eine Mischung: neue
       Karten, aber der alte Lernverlauf — die Statistik nennt dann Abfragen
       für Kästen, die es nicht mehr gibt. */
    await reviewsLaden(true);
    const reviewsNeu = new Set((geparst.reviews || [])
      .map(r => String(r.datum || r.id || '').slice(0, 10)));
    (S.reviews || []).forEach(r => {
      const tag = String(r.datum || r.id || '').slice(0, 10);
      if (tag && !reviewsNeu.has(tag)) ops.push(['del', FB.doc(colReviews(), tag)]);
    });
  }

  // Kästen: bei Zusammenführen gleichnamige wiederverwenden
  const deckZuordnung = new Map();
  const vorhandenNachName = new Map(
    modus === 'replace' ? [] : S.decks.map(d => [(d.name || '').toLowerCase(), d.id]));
  const vorhandenIds = new Set(modus === 'replace' ? [] : S.decks.map(d => d.id));

  geparst.decks.forEach(d => {
    const gleichName = vorhandenNachName.get((d.name || '').toLowerCase());
    if (modus === 'merge' && gleichName) { deckZuordnung.set(d.id, gleichName); return; }
    if (modus === 'merge' && vorhandenIds.has(d.id)) { deckZuordnung.set(d.id, d.id); return; }
    deckZuordnung.set(d.id, d.id);
    const { id, ...rest } = d;
    ops.push(['set', FB.doc(colDecks(), d.id), rest]);
  });

  const vorhandeneKarten = new Set(modus === 'replace' ? [] : S.cards.map(k => k.id));
  let uebersprungen = 0, geschrieben = 0;

  geparst.cards.forEach(k => {
    if (!k.frage && !k.antwort) return;
    if (modus === 'merge' && vorhandeneKarten.has(k.id)) { uebersprungen++; return; }
    const { id, ...rest } = k;
    rest.deckId = deckZuordnung.get(k.deckId) || k.deckId;
    if (!rest.deckId) return;
    ops.push(['set', FB.doc(colCards(), id), rest]);
    geschrieben++;
  });

  // Beides in EINEN Schreibvorgang: zwei Änderungen am selben Dokument
  // innerhalb eines Stapels lehnt Firestore ab.
  const einstellungenPatch = {};
  if (ivUebernehmen && geparst.intervalle)
    einstellungenPatch.intervalle = geparst.intervalle.slice(0, 12);
  /* Streak und Lerndatum gehören zu den Einstellungen und dürfen ohne den
     Haken nicht angerührt werden. Vorher überschrieb jede Sicherung sie —
     auch eine aus fremdem Konto, bei der der Haken bewusst leer ist. Der
     Streak war damit endgültig weg, samt der davon abhängigen Abzeichen.
     Beim Zusammenführen gewinnt zudem der höhere Stand: Wer eine ältere
     Sicherung einspielt, soll seine Serie nicht verlieren. */
  /* Beim Altbestand aus der Vorgängerversion gibt es keinen Haken — dort ist
     die Übernahme der ganze Zweck des Vorgangs. */
  const metaUebernehmen = einstUebernehmen || !geparst.einstellungen;
  if (metaUebernehmen && geparst.meta && (geparst.meta.streak || geparst.meta.lastLearnDate)) {
    const alt = modus === 'replace' ? 0 : (Number(S.einstellungen.streak) || 0);
    const neu = Number(geparst.meta.streak) || 0;
    einstellungenPatch.streak = Math.max(alt, neu);
    const altDatum = modus === 'replace' ? null : (S.einstellungen.lastLearnDate || null);
    const neuDatum = geparst.meta.lastLearnDate || null;
    einstellungenPatch.lastLearnDate =
      (altDatum && neuDatum) ? (altDatum > neuDatum ? altDatum : neuDatum) : (altDatum || neuDatum);
  }
  if (geparst.einstellungen && einstUebernehmen) {
    Object.assign(einstellungenPatch, geparst.einstellungen);
    Object.assign(S.einstellungen, geparst.einstellungen);
  }
  if (Object.keys(einstellungenPatch).length)
    ops.push(['set', refEinstellungen(), einstellungenPatch, true]);
  (geparst.reviews || []).forEach(r => {
    const tag = String(r.datum || r.id || '').slice(0, 10);
    if (/^\d{4}-\d{2}-\d{2}$/.test(tag)) {
      const { id, ...rest } = r;
      ops.push(['set', FB.doc(colReviews(), tag), { ...rest, datum: tag }, true]);
    }
  });

  // In Häppchen schreiben (Firestore erlaubt 500 Vorgänge pro Stapel)
  const GROESSE = 400;
  for (let i = 0; i < ops.length; i += GROESSE) {
    const b = FB.writeBatch(db);
    ops.slice(i, i + GROESSE).forEach(([art, ref, daten, merge]) => {
      if (art === 'del') b.delete(ref);
      else b.set(ref, daten, merge ? { merge: true } : undefined);
    });
    schreibe(b.commit(), 'Import-Stapel ' + (i / GROESSE + 1));
  }

  S.reviewsGeladen = false;
  await modal({
    titel: 'Import abgeschlossen',
    html: `<p><strong>${geschrieben}</strong> Karten und
      <strong>${geparst.decks.length}</strong> Kästen übernommen.
      ${uebersprungen ? `<br>${uebersprungen} Karten waren schon vorhanden und wurden übersprungen.` : ''}</p>
      <p class="mini">Die Daten sind sofort nutzbar. Die Übertragung zu Firestore läuft im
      Hintergrund weiter — der Punkt oben rechts wird grün, sobald alles angekommen ist.</p>
      <p class="mini">Wenn ein Kasten Rückwärtsabfragen oder Lückentexte vorsieht, prüft
      <em>Einstellungen → Diagnose → Abfragen abgleichen</em>, ob dazu alle Abfragen vorhanden sind.</p>`,
    knoepfe: [{ text: 'Gut', wert: 'ok', art: 'primary' }]
  });
  seiteZeigen('kaesten');
}

/* ---------- 15. Aktionen verdrahten ------------------------------------ */

function aktionsFehler(e) {
  console.error('[Aktion]', e);
  toast('Das hat nicht geklappt: ' + (e?.message || e), 'fehler');
}

function verdrahten(wurzel) {
  $$('[data-tu]', wurzel).forEach(el => {
    if (el._verdrahtet) return;
    el._verdrahtet = true;
    el.addEventListener('click', () => {
      // Ohne diesen Mantel würde ein Fehler in einer Aktion stumm in der
      // Konsole verschwinden — der Nutzer sähe nur, dass nichts passiert.
      try {
        const r = AKTION[el.dataset.tu]?.(el.dataset.id, el);
        if (r && typeof r.then === 'function') r.catch(aktionsFehler);
      } catch (e) { aktionsFehler(e); }
    });
  });
}

    const unberuehrt = [], behalten = [];

      const k = S.cards.find(c => c.id === id);

    for (let i = 0; i < ids.length; i += 400) {
      const b = FB.writeBatch(db);
      ids.slice(i, i + 400).forEach(x => b.delete(FB.doc(colCards(), x)));
      schreibe(b.commit(), 'Karten löschen');
    }
    S.auswahl.clear();
    toast(ids.length + ' Karten gelöscht.');

  massAufnehmen: async () => {
    const ids = mitVarianten(Array.from(S.auswahl));
    const betroffen = ids.map(x => S.cards.find(y => y.id === x)).filter(Boolean);
    if (!betroffen.length) return;
    if (!await frage('Wieder aufnehmen',
      `<strong>${betroffen.length}</strong> Abfragen wieder aufnehmen? Kennzeichnung und Ruhen
       werden aufgehoben, der Lernstand bleibt. Der Zähler beginnt von vorn.`, 'Aufnehmen')) return;
    const ops = betroffen.map(k => {
      const patch = { leech: false, suspendiert: false, leechBasis: Number(k.lapses) || 0 };
      Object.assign(k, patch);
      return ['merge', k.id, patch];
    });
    variantenOpsSchreiben(ops, 'Problemkarten aufnehmen');
    S.auswahl.clear();
    toast(betroffen.length + ' Abfragen wieder aufgenommen.');
    malKarten();
  },
  massVerschieben: async () => {
    if (!S.decks.length) return;
    /* „In einen neuen Kasten“ steht ganz oben: Wer einen zerstückelten Import
       einsammelt, hat den Sammelkasten noch gar nicht — sonst müsste er den
       Dialog abbrechen, den Kasten anlegen und von vorn beginnen. */
    const r = await modal({
      titel: 'Karten verschieben',
      html: `<p>${S.auswahl.size} Karten in welchen Kasten?</p>
        <label class="feld"><span>Ziel</span><select id="m-deck">
          <option value="neu">＋ In einen neuen Kasten …</option>
          ${S.decks.map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}
        </select></label>
        <label class="feld" id="m-deck-neu-feld" hidden><span>Name des neuen Kastens</span>
          <input id="m-deck-neu" maxlength="120" placeholder="z. B. Englisch"></label>`,
      knoepfe: [{ text: 'Abbrechen', wert: null }, {
        text: 'Verschieben', wert: 'ok', art: 'primary',
        pruefen: () => {
          const m = $('#modal');
          if ($('#m-deck', m)?.value === 'neu' && !String($('#m-deck-neu', m)?.value || '').trim()) {
            toast('Bitte einen Namen für den neuen Kasten eingeben.'); return false;
          }
        }
      }],
      beimOeffnen: m => {
        const s = $('#m-deck', m);
        const zeig = () => { $('#m-deck-neu-feld', m).hidden = s.value !== 'neu'; };
        s.addEventListener('change', zeig); zeig();
      }
    });
    if (r !== 'ok') return;
    let ziel = W('m-deck', S.decks[0].id);
    if (ziel === 'neu') {
      const name = String(W('m-deck-neu', '')).trim();
      if (!name) return;
      const gleich = S.decks.find(d => (d.name || '').toLowerCase() === name.toLowerCase());
      if (gleich) ziel = gleich.id;
      else {
        ziel = neueId();
        const daten = neuesDeck(name);
        schreibe(FB.setDoc(FB.doc(colDecks(), ziel), daten), 'Kasten anlegen');
        if (!S.decks.some(d => d.id === ziel)) S.decks.push({ id: ziel, ...daten });
      }
    }
    // Nur vorhandene Karten: ein update auf ein gelöschtes Dokument ließe den
    // gesamten Stapel scheitern, nicht nur die eine Karte. Zusätzliche
    // Abfragen ziehen mit, sonst lägen sie im alten Kasten.
    const vorhanden = new Set(S.cards.map(k => k.id));
    const ids = mitVarianten(Array.from(S.auswahl)).filter(x => vorhanden.has(x));
    if (!ids.length) { S.auswahl.clear(); return toast('Keine der Karten ist noch vorhanden.'); }

    // Hat der Zielkasten eine andere Abfragerichtung, entfallen dabei
    // Abfragen. Vorher prüfen — ohne dabei schon etwas zu verändern.
    const zielDeck = deckVon(ziel);
    const index = ableitungsIndex();
    const bewegteQuellen = ids.map(x => S.cards.find(c => c.id === x)).filter(c => c && istQuellkarte(c));
    const wegfallen = bewegteQuellen.reduce((n, q) => n + variantenPlan(q, zielDeck, index).entfernt, 0);
    if (wegfallen && !await frage('Karten verschieben',
      `Der Zielkasten fragt in eine andere Richtung ab. Dadurch
       ${wegfallen === 1 ? 'entfällt eine Abfrage' : `entfallen ${wegfallen} Abfragen`}
       mitsamt Lernfortschritt.`, 'Trotzdem verschieben', 'gefahr')) return;

    for (let i = 0; i < ids.length; i += 400) {
      const b = FB.writeBatch(db);
      ids.slice(i, i + 400).forEach(x => b.update(FB.doc(colCards(), x), { deckId: ziel }));
      schreibe(b.commit(), 'Karten verschieben');
    }
    // Lokal sofort nachziehen, damit der anschließende Abgleich schon die
    // Abfragerichtung des Zielkastens sieht statt der des alten.
    const bewegt = new Set(ids);
    S.cards.forEach(k => { if (bewegt.has(k.id)) k.deckId = ziel; });
    const bilanz = alleVariantenAbgleichen(k => bewegt.has(k.id));
    S.auswahl.clear();
    toast(bilanz.angelegt || bilanz.entfernt
      ? `Verschoben. ${bilanz.angelegt} Abfragen angelegt, ${bilanz.entfernt} entfernt.`
      : 'Verschoben.');
  },

  /* Ein Klick statt elf: alle Karten aus den Ein-Karten-Kästen in einen Kasten,
     danach die leer gewordenen Kästen weg. */
  importEinsammeln: async () => {
    const winzig = S.decks.filter(d => !d.archiviert
      && kartenVon(d.id).filter(istQuellkarte).length === 1);
    if (!winzig.length) return toast('Es gibt keine Kästen mit nur einer Karte.');
    /* Der neue Zielkasten erbt Abfragerichtung, Modi und Sprachen der
       Herkunftskästen. Sonst legte `neuesDeck` ihn mit „vorwärts“ an, und der
       anschließende Abgleich löschte alle Rückwärtsabfragen mitsamt Lernstand —
       bei einem Knopf, der Aufräumen verspricht. */
    const haeufigste = feld => {
      const zaehler = new Map();
      winzig.forEach(d => {
        const wert = JSON.stringify(d[feld] ?? null);
        zaehler.set(wert, (zaehler.get(wert) || 0) + 1);
      });
      let best = 'null', wie = -1;
      zaehler.forEach((n, wert) => { if (n > wie) { wie = n; best = wert; } });
      try { return JSON.parse(best); } catch (_) { return null; }
    };
    const vorlage = {
      richtung: haeufigste('richtung') || 'vorwaerts',
      modi: haeufigste('modi') || ['aufdecken'],
      sprache: haeufigste('sprache') || 'de-DE',
      spracheAntwort: haeufigste('spracheAntwort') || 'de-DE'
    };
    const r = await modal({
      titel: 'Karten zusammenführen',
      html: `<p>Die Karten aus <strong>${winzig.length} Kästen</strong> mit je einer Karte
        in einen gemeinsamen Kasten verschieben. Fach, Termine und Lernstand wandern mit.</p>
        <div id="m-ziel-warnung"></div>
        <label class="feld"><span>Ziel</span><select id="m-ziel-deck">
          <option value="neu">＋ In einen neuen Kasten …</option>
          ${S.decks.filter(d => !winzig.some(w => w.id === d.id))
            .map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}
        </select></label>
        <label class="feld" id="m-ziel-neu-feld"><span>Name des neuen Kastens</span>
          <input id="m-ziel-neu" maxlength="120" value="Gesammelt"></label>
        <label class="karo"><input type="checkbox" id="m-ziel-leer" checked>
          <span>Die leer gewordenen Kästen anschließend entfernen</span></label>`,
      knoepfe: [{ text: 'Abbrechen', wert: null }, {
        text: 'Zusammenführen', wert: 'ok', art: 'primary',
        pruefen: () => {
          const m = $('#modal');
          if ($('#m-ziel-deck', m)?.value === 'neu' && !String($('#m-ziel-neu', m)?.value || '').trim()) {
            toast('Bitte einen Namen für den neuen Kasten eingeben.'); return false;
          }
        }
      }],
      beimOeffnen: m => {
        const s = $('#m-ziel-deck', m);
        const index = ableitungsIndex();
        const zeig = () => {
          $('#m-ziel-neu-feld', m).hidden = s.value !== 'neu';
          /* Bei einem vorhandenen Zielkasten kann die Abfragerichtung abweichen.
             Dann entfallen Abfragen mitsamt Lernstand — das muss vorher
             dastehen, nicht hinterher in der Diagnose. */
          const ziel = s.value === 'neu' ? { ...neuesDeck('x'), ...vorlage } : deckVon(s.value);
          const weg = winzig.flatMap(d => kartenVon(d.id).filter(istQuellkarte))
            .reduce((n, q) => n + variantenPlan(q, ziel, index).entfernt, 0);
          $('#m-ziel-warnung', m).innerHTML = weg
            ? `<div class="hinweis rot">Der Zielkasten fragt in eine andere Richtung ab.
                 Dadurch ${weg === 1 ? 'entfällt eine Abfrage' : `entfallen ${weg} Abfragen`}
                 mitsamt Lernfortschritt.</div>` : '';
        };
        s.addEventListener('change', zeig); zeig();
      }
    });
    if (r !== 'ok') return;

    let ziel = W('m-ziel-deck', 'neu');
    if (ziel === 'neu') {
      const name = String(W('m-ziel-neu', 'Gesammelt')).trim() || 'Gesammelt';
      const gleich = S.decks.find(d => (d.name || '').toLowerCase() === name.toLowerCase());
      if (gleich) ziel = gleich.id;
      else {
        ziel = neueId();
        const daten = { ...neuesDeck(name), ...vorlage };
        schreibe(FB.setDoc(FB.doc(colDecks(), ziel), daten), 'Kasten anlegen');
        if (!S.decks.some(d => d.id === ziel)) S.decks.push({ id: ziel, ...daten });
      }
    }
    const quellen = winzig.filter(d => d.id !== ziel);
    const ids = quellen.flatMap(d => kartenVon(d.id)).map(k => k.id);
    for (let i = 0; i < ids.length; i += 400) {
      const b = FB.writeBatch(db);
      ids.slice(i, i + 400).forEach(x => b.set(FB.doc(colCards(), x), { deckId: ziel }, { merge: true }));
      schreibe(b.commit(), 'Karten zusammenführen');
    }
    ids.forEach(x => { const k = S.cards.find(c => c.id === x); if (k) k.deckId = ziel; });
    if (W('m-ziel-leer', true) !== false) {
      const weg = quellen.filter(d => !kartenVon(d.id).length).map(d => d.id);
      for (let i = 0; i < weg.length; i += 400) {
        const b = FB.writeBatch(db);
        weg.slice(i, i + 400).forEach(x => b.delete(FB.doc(colDecks(), x)));
        schreibe(b.commit(), 'Leere Kästen entfernen');
      }
      S.decks = S.decks.filter(d => !weg.includes(d.id));
      weg.forEach(x => lernAuswahl?.delete(x));
    }
    /* Der Zielkasten kann eine andere Abfragerichtung vorsehen als die
       Herkunftskästen — dann fehlen oder stören jetzt Gegenabfragen. */
    const nach = new Set(ids);
    alleVariantenAbgleichen(k => nach.has(k.id) || nach.has(k.quelleId));
    toast(`${ids.length} Karten in „${deckName(ziel)}“ zusammengeführt.`);
    malEinstellungen();
  },

  leereKaesten: async () => {
    const leer = S.decks.filter(d => !kartenVon(d.id).length);
    if (!leer.length) return toast('Es gibt keine leeren Kästen.');
    if (!await frage('Leere Kästen entfernen',
      `<strong>${leer.length}</strong> ${leer.length === 1 ? 'Kasten enthält' : 'Kästen enthalten'}
       keine einzige Karte. Entfernen?<br>
       <span class="mini">${esc(leer.slice(0, 12).map(d => d.name).join(', '))}${
         leer.length > 12 ? ` und ${leer.length - 12} weitere` : ''}</span>`,
      'Entfernen', 'gefahr')) return;
    /* Während die Rückfrage offen stand, kann von einem anderen Gerät eine
       Karte eingetroffen sein. Dann wäre der Kasten weg und die Karte
       heimatlos — deshalb hier noch einmal frisch nachsehen. */
    const nochLeer = leer.filter(d => S.decks.some(x => x.id === d.id) && !kartenVon(d.id).length);
    if (!nochLeer.length) return toast('Die Kästen sind nicht mehr leer — nichts entfernt.');
    const geblieben = leer.length - nochLeer.length;
    const ids = nochLeer.map(d => d.id);
    for (let i = 0; i < ids.length; i += 400) {
      const b = FB.writeBatch(db);
      ids.slice(i, i + 400).forEach(x => b.delete(FB.doc(colDecks(), x)));
      schreibe(b.commit(), 'Leere Kästen entfernen');
    }
    ids.forEach(x => lernAuswahl?.delete(x));
    toast(`${ids.length} ${ids.length === 1 ? 'leerer Kasten' : 'leere Kästen'} entfernt.`
      + (geblieben ? ` ${geblieben} ${geblieben === 1 ? 'Kasten hat' : 'Kästen haben'}`
        + ' inzwischen Karten und bleibt stehen.' : ''));
    malEinstellungen();
  },

  variantenAbgleich: async () => {
    // Erst rechnen, dann fragen: Der Abgleich löscht Abfragen mitsamt
    // Lernstand. Als einziger Knopf auf der Diagnoseseite sähe er wie eine
    // harmlose Prüfung aus — er darf nicht ungefragt löschen.
    const bedarf = variantenBedarf();
    const trocken = alleVariantenAbgleichenProbe();
    if (trocken.entfernt && !await frage('Abfragen abgleichen',
      `<strong>${trocken.angelegt}</strong> fehlende Abfragen werden angelegt und
       <strong>${trocken.entfernt}</strong> nicht mehr vorgesehene entfernt — Letztere
       samt ihrem Lernfortschritt.
       ${bedarf.verwaist ? `<br><span class="mini">Darunter ${bedarf.verwaist} Abfragen,
         deren Quellkarte fehlt.</span>` : ''}`,
      'Abgleichen', 'gefahr')) return;
    const bilanz = alleVariantenAbgleichen();
    await modal({
      titel: 'Abfragen abgeglichen',
      html: bilanz.angelegt || bilanz.entfernt
        ? `<p><strong>${bilanz.angelegt}</strong> Abfragen angelegt,
             <strong>${bilanz.entfernt}</strong> entfernt —
             betroffen waren ${bilanz.betroffen} Karten.</p>
           <p class="mini">Angelegt werden Rückwärtsabfragen und Cloze-Lücken, die der Kasten
             vorsieht; entfernt werden Abfragen, die nicht mehr vorgesehen sind oder deren
             Quellkarte fehlt.</p>`
        : `<p>Alles in Ordnung — jede Karte hat genau die Abfragen, die ihr Kasten vorsieht.</p>`,
      knoepfe: [{ text: 'Gut', wert: 'ok', art: 'primary' }]
    });
    malEinstellungen();
  },

  verwaisteEinsammeln: async () => {
    const verwaist = verwaisteKarten();
    if (!verwaist.length) return toast('Es gibt keine Karten ohne Kasten.');
    const r = await modal({
      titel: 'Karten ohne Kasten einsammeln',
      html: `<p><strong>${verwaist.length}</strong> Karten gehören zu keinem
             vorhandenen Kasten. Wohin damit?</p>
             <label class="feld"><span>Ziel</span><select id="m-deck">
               <option value="neu">Neuer Kasten „Wiederhergestellt“</option>
               ${S.decks.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
             </select></label>`,
      knoepfe: [{ text: 'Abbrechen', wert: null },
                { text: 'Einsammeln', wert: 'ok', art: 'primary' }]
    });
    if (r !== 'ok') return;
    let ziel = W('m-deck', 'neu');
    if (ziel === 'neu') {
      ziel = neueId();
      schreibe(FB.setDoc(FB.doc(colDecks(), ziel), neuesDeck('Wiederhergestellt')), 'Kasten anlegen');
      lernAuswahl?.add(ziel);
    }
    // merge-set statt update: Fehlt eines der Dokumente inzwischen, scheiterte
    // sonst der ganze Stapel und keine einzige Karte käme an.
    verwaist.forEach(k => { k.deckId = ziel; });
    variantenOpsSchreiben(verwaist.map(k => ['merge', k.id, { deckId: ziel }]), 'Verwaiste einsammeln');
    const bilanz = alleVariantenAbgleichen(k => verwaist.some(v => v.id === k.id));
    toast(bilanz.angelegt
      ? `${verwaist.length} Karten eingesammelt, ${bilanz.angelegt} Abfragen ergänzt.`
      : verwaist.length + ' Karten eingesammelt.');
    seiteZeigen('karten');
  },

  allesLoeschen: async () => {
    if (!await frage('Alles löschen',
      `Sämtliche <strong>${S.cards.length} Karten</strong> und
       <strong>${S.decks.length} Kästen</strong> dieses Kontos werden gelöscht — auf allen Geräten.
       <br><br>Vorher sichern? Dann jetzt abbrechen und „Alles als JSON sichern“ nutzen.`,
      'Weiter', 'gefahr')) return;
    const bestaetigt = await modal({
      titel: 'Wirklich alles löschen?',
      html: `<p>Zum Bestätigen bitte <strong>LÖSCHEN</strong> eintippen.</p>
             <input id="m-conf" placeholder="LÖSCHEN" autocapitalize="characters">`,
      knoepfe: [{ text: 'Abbrechen', wert: null },
        { text: 'Endgültig löschen', wert: 'ok', art: 'gefahr',
          pruefen: () => { if ($('#m-conf').value.trim().toUpperCase() !== 'LÖSCHEN') {
            toast('Bitte LÖSCHEN eintippen.'); return false; } } }]
    });
    if (bestaetigt !== 'ok') return;

    await reviewsLaden(true);      // alle Tagesstatistiken, nicht nur die letzten 70 Tage
    const ops = [
      ...S.cards.map(k => FB.doc(colCards(), k.id)),
      ...S.decks.map(d => FB.doc(colDecks(), d.id)),
      ...S.reviews.map(r => FB.doc(colReviews(), r.id || r.datum))
    ];
    for (let i = 0; i < ops.length; i += 400) {
      const b = FB.writeBatch(db);
      ops.slice(i, i + 400).forEach(r => b.delete(r));
      schreibe(b.commit(), 'Alles löschen');
    }
    schreibe(FB.setDoc(refEinstellungen(),
      Object.assign(STANDARD_EINSTELLUNGEN(), { theme: S.einstellungen.theme })), 'Zurücksetzen');
    S.auswahl.clear(); S.reviewsGeladen = false;
    toast('Alle Daten gelöscht.');
    seiteZeigen('lernen');
  }
};


/* ---------- 16. Tastatur ------------------------------------------------ */

document.addEventListener('keydown', e => {
  if (!S.uid) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (!$('#modal-bg').hidden) return;

  if (MATHE?.laeuft()) {
    if (MATHE.taste(e)) { e.preventDefault(); return; }
    return;
  }

  if (uebung?.aktiv) {
    if (lernboxTaste(e)) { e.preventDefault(); return; }
    if (e.key === 'Escape') { e.preventDefault(); return uebungBeenden(); }
    return;
  }

  if (sitzung?.aktiv) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      // Im Tipp- und Auswahlmodus deckt die Leertaste nicht auf — dort wird
      // erst geantwortet. Ausnahme: die Antwort liegt schon offen.
      if (!sitzung.aufgedeckt && sitzung.modus !== 'tippen' && sitzung.modus !== 'mc') umdrehen();
      return;
    }
    if (['1', '2', '3', '4'].includes(e.key) && sitzung.aufgedeckt) {
      e.preventDefault();
      sitzung.letzteEingabeTastatur = true;
      bewerten(Number(e.key));
      return;
    }
    // Multiple Choice mit A–D
    if (sitzung.modus === 'mc' && !sitzung.aufgedeckt && /^[a-dA-D]$/.test(e.key)) {
      e.preventDefault();
      mcWaehlen(MC_BUCHSTABEN.indexOf(e.key.toUpperCase()));
      return;
    }
    // Nach automatischer Auswertung übernimmt die Eingabetaste den Vorschlag
    if (e.key === 'Enter' && sitzung.aufgedeckt && sitzung.urteil) {
      const v = urteilVorschlag(sitzung.urteil.art);
      if (v) { e.preventDefault(); sitzung.letzteEingabeTastatur = true; bewerten(v); return; }
    }
    if (e.key === 'Escape') { e.preventDefault(); sitzungBeenden(false); return; }
  }
  if (e.key === 'Escape' && S.seite !== 'lernen') seiteZeigen('lernen');
});

/* Beim Verlassen der Seite nur die Sprachausgabe stoppen. Die Sitzung wird
   bewusst NICHT beendet: Bewertungen sind ohnehin einzeln geschrieben, und
   ein „aktiv = false“ hätte zwei unangenehme Folgen — die Karte reagierte
   nach der Rückkehr auf keine Taste mehr, und die Schutzabfrage in
   alleSeitenMalen() griffe nicht mehr, sodass die nächste
   Firestore-Aktualisierung mitten in der Sitzung den Startbildschirm
   darüberzeichnet. */
window.addEventListener('pagehide', () => {
  sprechenStoppen();
  // Die Liste der gemeldeten Schlüssel wird gepuffert geschrieben. Ohne
  // dieses Nachziehen ginge die letzte Meldung vor dem Schließen verloren —
  // beim nächsten Start würde sie erneut geschrieben.
  bedarfJetztSichern();
});

/* Nach einer Unterbrechung — Anruf, Bildschirmsperre, App-Wechsel — zählt
   die Zeit auf der aktuellen Karte neu. Sonst flössen zwölf Minuten
   Telefonat als Lernzeit in die Tagesstatistik und füllten den Zielring. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sitzung?.aktiv) sitzung.kartenStart = Date.now();
  if (document.visibilityState === 'hidden') sprechenStoppen();
});

/* ---------- 16b. Prüfhaken ---------------------------------------------- */

/* Ein kleines Fenster in den Modulbereich, damit die Abnahmeprüfungen die
   reinen Funktionen einzeln aufrufen können — allen voran den Sanitizer.
   Ohne diesen Haken ließe sich XSS nur über die Oberfläche prüfen, also
   immer nur an den Stellen, an die man beim Testschreiben gerade denkt.

   Unbedenklich: Es sind ausschließlich Funktionen, die ohnehin im Browser
   des angemeldeten Nutzers laufen. Sie eröffnen keinen Zugriff, den die
   Entwicklerkonsole nicht ohnehin hätte, und die Security Rules gelten
   unabhängig davon auf dem Server. */
window.__T = {
  htmlSauber, htmlZuText, feldHtml, feldText, textAufraeumen,
  audioSchluessel, sprechen, sprechenStoppen, stimmeFuer,
  audioVerzeichnisLaden, textHaeppchen, tagsAusWert,
  karteNormalisieren, deckNormalisieren, exportDaten,
  tippErsteBuchstaben, tippErstesWort, lernboxKriterium, lernboxAbstand,
  inLernbox, lernboxKarten,
  frageText, antwortText, frageHtml, antwortHtml,
  /* Stufe 7: Fenster in das Mathematik-Modul. Als Getter, weil window.__T
     schon steht, bevor start() das Modul geladen hat. */
  get mathe() { return MATHE?.__T || null; },
  aktion: AKTION,
  version: VERSION
};

/* ---------- 17. Los ----------------------------------------------------- */

start().catch(e => {
  console.error(e);
  fatal(`<div class="hinweis rot">Unerwarteter Fehler beim Start.</div>
    <pre class="code">${esc(e?.stack || e?.message || String(e))}</pre>`);
});
</script>
