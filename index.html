             <label class="feld"><span>Abfragerichtung</span>
               <select id="m-richtung">${RICHTUNGEN.map(x =>
                 `<option value="${x}" ${richtungAlt === x ? 'selected' : ''}>${esc(RICHTUNG_NAME[x])}</option>`).join('')}</select></label>
             <p class="mini" style="margin-top:-8px;margin-bottom:14px">Bei „beide Richtungen“ entsteht
               je Karte eine zweite, getrennt terminierte Abfrage — aktiv und passiv sind
               unterschiedlich schwer und dürfen sich keinen Termin teilen. Lückentexte sind davon
               ausgenommen, dort zählen die Lücken.</p>

             <div class="row" style="gap:10px">
               <label class="feld" style="flex:1"><span>Sprache der Frageseite</span>
                 <select id="m-sprache">${SPRACHEN.map(([c, n]) =>
                   `<option value="${c}" ${spracheAlt === c ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
               <label class="feld" style="flex:1"><span>Sprache der Antwortseite</span>
                 <select id="m-sprache-antwort">${SPRACHEN.map(([c, n]) =>
                   `<option value="${c}" ${spracheAntwortAlt === c ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
             </div>
             <p class="mini" style="margin-top:-8px">Für den Hörmodus. Bei Vokabelkästen
               gehören Frage und Antwort zu verschiedenen Sprachen — sonst liest eine
               englische Stimme die deutschen Wörter.</p>

             <label class="feld"><span>Prüfungstermin (optional)</span>
               <input type="date" id="m-pruefung" value="${esc(deckPruefung(id) || '')}"></label>
             <p class="mini" style="margin-top:-8px">Ist ein Termin gesetzt, zieht die App
               Fälligkeiten vor, die sonst dahinter lägen — so kommt jede Karte vorher noch
               mindestens einmal dran. Auf dem Startbildschirm steht dann, wie viel täglich
               nötig ist und ob das zu schaffen ist.</p>
             <p class="mini">${kartenVon(id).length} Karten in diesem Kasten.</p>`,
      knoepfe: [{ text: 'Abbrechen', wert: null }, {
        text: 'Speichern', wert: 'ok', art: 'primary',
        pruefen: () => {
          if (!$('#m-name').value.trim()) { toast('Bitte einen Namen eingeben.'); return false; }
        }
      }],
      beimOeffnen: m => {
        farbwahlVerdrahten(m, d.farbe);
        $('#m-modi', m)?.addEventListener('change', ev => {
          const chip = ev.target.closest('.modus-chip');
          if (chip) chip.classList.toggle('an', ev.target.checked);
        });
      }
    });
    if (r !== 'ok') return;

    // ALLE Werte einlesen, bevor unten ein weiterer Dialog aufgeht: modal()
    // überschreibt letzteWerte beim Schließen, und die Rückfrage hat selbst
    // keine Felder. Wer danach noch W() aufruft, bekommt nur die Vorgaben.
    const modiNeu = MODI_ALLE.filter(m => letzteWerte['m-modus-' + m] === true);
    const richtungRoh = W('m-richtung', richtungAlt);
    const richtungNeu = RICHTUNGEN.includes(richtungRoh) ? richtungRoh : richtungAlt;
    const patch = {
      name: String(W('m-name', d.name)).trim().slice(0, 120),
      farbe: W('farbe', d.farbe),
      modi: modiNeu.length ? modiNeu : ['aufdecken'],
      richtung: richtungNeu,
      sprache: W('m-sprache', spracheAlt),
      spracheAntwort: W('m-sprache-antwort', spracheAntwortAlt),
      pruefungsdatum: /^\d{4}-\d{2}-\d{2}$/.test(String(letzteWerte['m-pruefung'] || ''))
        ? letzteWerte['m-pruefung'] : null
    };

    // Jede Änderung der Abfragerichtung greift tief in den Bestand ein und
    // wird deshalb angekündigt — auch der Wechsel vorwärts ↔ rückwärts, der
    // keine Karte löscht: Dort behält jede Karte ihren Termin, wird aber ab
    // sofort spiegelverkehrt gefragt. Der Lernstand gehört dann zu einer
    // Frage, die so nie geübt wurde, und die erste Sitzung danach besteht
    // aus lauter Einsen — mit entsprechendem Rückwurf der Intervalle.
    if (richtungNeu !== richtungAlt && kartenVon(id).length) {
      const nurQuellen = kartenVon(id).filter(istQuellkarte).length;
      const rueck = kartenVon(id).filter(k => k.quelleId && varianteVon(k) === 'r').length;
      const text = richtungAlt === 'beide'
        ? `Je Karte wird eine der beiden Abfragen entfernt — insgesamt
           <strong>${rueck}</strong>. Der Lernstand der Richtung, die bleibt, wird
           übernommen; der Stand der wegfallenden Richtung geht verloren.`
        : richtungNeu === 'beide'
        ? `Zu jeder der <strong>${nurQuellen}</strong> Karten kommt eine zweite,
           getrennt terminierte Abfrage in der Gegenrichtung dazu. Sie sind sofort
           fällig und verdoppeln auf Dauer die tägliche Wiederholungsmenge.`
        : `Alle <strong>${nurQuellen}</strong> Karten dieses Kastens werden ab sofort
           in der anderen Richtung gefragt. Sie behalten dabei ihren Termin, obwohl
           die neue Frageform noch nie geübt wurde — rechne mit einigen Durchfällern
           in der nächsten Sitzung.`;
      if (!await frage('Abfragerichtung ändern', text, 'Trotzdem ändern',
        richtungAlt === 'beide' ? 'gefahr' : '')) return;
    }
    Object.assign(d, patch);                       // lokal sofort, damit der Abgleich stimmt
    schreibe(FB.updateDoc(FB.doc(colDecks(), id), patch), 'Kasten ändern');

    // Ein neuer Termin muss die Fälligkeiten einmalig einsammeln, die schon
    // dahinter liegen — sonst kämen genau die reifen Karten bis zur Prüfung
    // kein einziges Mal dran.
    const terminNeu = !!patch.pruefungsdatum && patch.pruefungsdatum !== pruefungAlt;
    if (richtungNeu !== richtungAlt) {
      const bilanz = alleVariantenAbgleichen(k => k.deckId === id);
      toast(bilanz.angelegt || bilanz.entfernt
        ? `Gespeichert. ${bilanz.angelegt} Abfragen angelegt, ${bilanz.entfernt} entfernt.`
        : 'Gespeichert.');
    } else {
      toast('Gespeichert.');
    }
    if (terminNeu) {
      if (patch.pruefungsdatum < heute()) {
        toast('Der eingetragene Termin liegt in der Vergangenheit und bleibt deshalb wirkungslos.', 'fehler');
      } else {
        const vorgezogen = pruefungTermineVorziehen(id);
        if (vorgezogen) setTimeout(() => toast(
          `${vorgezogen} ${vorgezogen === 1 ? 'Karte wurde' : 'Karten wurden'} vorgezogen, ` +
          'damit sie vor der Prüfung noch drankommen.'), 900);
      }
    }
    if (!modiNeu.length) toast('Ohne Auswahl bleibt es beim Modus „Aufdecken“.');
  },
  deckLoeschen: async id => {
    const d = S.decks.find(x => x.id === id); if (!d) return;
    const anzahl = kartenVon(id).length;
    if (!await frage('Kasten löschen',
      `„${esc(d.name)}“ mit <strong>${anzahl}</strong> ${anzahl === 1 ? 'Karte' : 'Karten'}
       endgültig löschen? Das lässt sich nicht rückgängig machen.`,
      'Endgültig löschen', 'gefahr')) return;
    // Erst die Karten, dann der Kasten. Bricht etwas dazwischen ab, bleibt der
    // Kasten stehen — besser als Karten, die zu nichts mehr gehören.
    const ops = [...kartenVon(id).map(k => FB.doc(colCards(), k.id)), FB.doc(colDecks(), id)];
    for (let i = 0; i < ops.length; i += 400) {
      const b = FB.writeBatch(db);
      ops.slice(i, i + 400).forEach(r => b.delete(r));
      schreibe(b.commit(), 'Kasten löschen');
    }
    lernAuswahl?.delete(id);
    toast('Kasten gelöscht.');
  },
  deckCsv: id => {
    const karten = kartenVon(id);
    if (!karten.length) return toast('Dieser Kasten ist leer.');
    dateiHerunterladen(`lernkartei-${dateiTeil(deckName(id))}-${heute()}.csv`,
      csvBauen(karten), 'text/csv');
    toast('CSV heruntergeladen.');
  },

  /* Karten */
  neueKarte: () => karteBearbeiten(null),
  karteBearbeiten: id => karteBearbeiten(id),
  karteLoeschen: async id => {
    const k = S.cards.find(x => x.id === id); if (!k) return;
    const alle = mitVarianten([id]);
    const zusatz = alle.length - 1;
    if (!await frage('Karte löschen',

        ? `<br><span class="mini">Dazu ${zusatz} weitere eigenständig terminierte
           ${zusatz === 1 ? 'Abfrage' : 'Abfragen'} derselben Karte.</span>` : ''}`,
      'Löschen', 'gefahr')) return;
    alle.forEach(x => S.auswahl.delete(x));
    variantenOpsSchreiben(alle.map(x => ['delete', x]), 'Karte löschen');
    toast(zusatz ? `Karte mit ${zusatz + 1} Abfragen gelöscht.` : 'Karte gelöscht.');
  },
  mehrKarten: () => { S.kartenLimit += 60; malKarten(); },
  massAus: () => { S.auswahl.clear(); malKarten(); },
  massLoeschen: async () => {
    const n = S.auswahl.size;
    const ids = mitVarianten(Array.from(S.auswahl));
    const zusatz = ids.length - n;
    if (!await frage('Karten löschen',
      `<strong>${n}</strong> ausgewählte Karten löschen?${zusatz > 0
        ? `<br><span class="mini">Dazu ${zusatz} weitere Abfragen derselben Karten
           (Rückwärtsrichtung, Lückentext).</span>` : ''}`,
      'Löschen', 'gefahr')) return;
    for (let i = 0; i < ids.length; i += 400) {
      const b = FB.writeBatch(db);
      ids.slice(i, i + 400).forEach(x => b.delete(FB.doc(colCards(), x)));
      schreibe(b.commit(), 'Karten löschen');
    }
    S.auswahl.clear();
    toast(ids.length + ' Karten gelöscht.');
  },
  massAufnehmen: async () => {
    const ids = mitVarianten(Array.from(S.auswahl));
    const betroffen = ids.map(x => S.cards.find(y => y.id === x)).filter(Boolean);
    if (!betroffen.length) return;
    if (!await frage('Wieder aufnehmen',
      `<strong>${betroffen.length}</strong> Abfragen wieder aufnehmen? Kennzeichnung und Ruhen
       werden aufgehoben, der Lernstand bleibt. Der Zähler beginnt von vorn.`, 'Aufnehmen')) return;
    const ops = betroffen.map(k => {
      const patch = { leech: false, suspendiert: false, leechBasis: Number(k.lapses) || 0 };
      Object.assign(k, patch);
      return ['merge', k.id, patch];
    });
    variantenOpsSchreiben(ops, 'Problemkarten aufnehmen');
    S.auswahl.clear();
    toast(betroffen.length + ' Abfragen wieder aufgenommen.');
    malKarten();
  },
  massVerschieben: async () => {
    if (!S.decks.length) return;
    const r = await modal({
      titel: 'Karten verschieben',
      html: `<p>${S.auswahl.size} Karten in welchen Kasten?</p>
        <label class="feld"><span>Ziel</span><select id="m-deck">${S.decks.map(d =>
          `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}</select></label>`,
      knoepfe: [{ text: 'Abbrechen', wert: null }, { text: 'Verschieben', wert: 'ok', art: 'primary' }]
    });
    if (r !== 'ok') return;
    const ziel = W('m-deck', S.decks[0].id);
    // Nur vorhandene Karten: ein update auf ein gelöschtes Dokument ließe den
    // gesamten Stapel scheitern, nicht nur die eine Karte. Zusätzliche
    // Abfragen ziehen mit, sonst lägen sie im alten Kasten.
    const vorhanden = new Set(S.cards.map(k => k.id));
    const ids = mitVarianten(Array.from(S.auswahl)).filter(x => vorhanden.has(x));
    if (!ids.length) { S.auswahl.clear(); return toast('Keine der Karten ist noch vorhanden.'); }

    // Hat der Zielkasten eine andere Abfragerichtung, entfallen dabei
    // Abfragen. Vorher prüfen — ohne dabei schon etwas zu verändern.
    const zielDeck = deckVon(ziel);
    const index = ableitungsIndex();
    const bewegteQuellen = ids.map(x => S.cards.find(c => c.id === x)).filter(c => c && istQuellkarte(c));
    const wegfallen = bewegteQuellen.reduce((n, q) => n + variantenPlan(q, zielDeck, index).entfernt, 0);
    if (wegfallen && !await frage('Karten verschieben',
      `Der Zielkasten fragt in eine andere Richtung ab. Dadurch
       ${wegfallen === 1 ? 'entfällt eine Abfrage' : `entfallen ${wegfallen} Abfragen`}
       mitsamt Lernfortschritt.`, 'Trotzdem verschieben', 'gefahr')) return;

    for (let i = 0; i < ids.length; i += 400) {
      const b = FB.writeBatch(db);
      ids.slice(i, i + 400).forEach(x => b.update(FB.doc(colCards(), x), { deckId: ziel }));
      schreibe(b.commit(), 'Karten verschieben');
    }
    // Lokal sofort nachziehen, damit der anschließende Abgleich schon die
    // Abfragerichtung des Zielkastens sieht statt der des alten.
    const bewegt = new Set(ids);
    S.cards.forEach(k => { if (bewegt.has(k.id)) k.deckId = ziel; });
    const bilanz = alleVariantenAbgleichen(k => bewegt.has(k.id));
    S.auswahl.clear();
    toast(bilanz.angelegt || bilanz.entfernt
      ? `Verschoben. ${bilanz.angelegt} Abfragen angelegt, ${bilanz.entfernt} entfernt.`
      : 'Verschoben.');
  },

      'Intervalle auf die Voreinstellung 1 · 3 · 7 · 14 · 21 · 30 · 45 · 60 · 90 · 120 · 180 · 365 zurücksetzen?',
      'Zurücksetzen')) return;

  tagespensumSpeichern: async () => {
    const neuProTag = zahl($('#s-neuprotag')?.value, 5, 50, 20);
    const zielMinuten = zahl($('#s-zielminuten')?.value, 1, 600, 15);
    const zielKarten = zahl($('#s-zielkarten')?.value, 1, 2000, 30);
    const zielEinheit = $('input[name=s-zieleinheit]:checked')?.value === 'karten' ? 'karten' : 'minuten';
    const leech = zahl($('#s-leech')?.value, 3, 20, 7);
    // Die Grenze wirkt rückwirkend auf alle bisherigen Aussetzer. Wird sie
    // gesenkt, sind auf einen Schlag deutlich mehr Karten betroffen — das
    // darf nicht hinter einem beiläufigen „Gespeichert“ verschwinden.
    if (leech < leechGrenze()) {
      const vorher = problemkarten().length;
      const nachher = S.cards.filter(k => !!k.leech || leechZaehler(k) >= leech).length;
      if (nachher > vorher && !await frage('Grenze senken',
        `Damit gelten <strong>${nachher}</strong> statt bisher ${vorher} Karten als Problemkarten.
         Sie ruhen, sobald sie das nächste Mal nicht gewusst werden.`, 'Übernehmen')) return;
    }
    Object.assign(S.einstellungen, { neuProTag, zielMinuten, zielKarten, zielEinheit, leechGrenze: leech });
    schreibe(FB.setDoc(refEinstellungen(),
      { neuProTag, zielMinuten, zielKarten, zielEinheit, leechGrenze: leech }, { merge: true }), 'Tagespensum');
    toast('Tagespensum gespeichert.');
  },

  expJson: () => exportJson(),
  expCsv: async () => {
    if (!S.decks.length) return toast('Keine Kästen vorhanden.');
    const r = await modal({
      titel: 'Als CSV sichern',
      html: `<label class="feld"><span>Kasten</span><select id="m-deck">
        <option value="alle">Alle Kästen zusammen (${S.cards.length} Karten)</option>
        ${S.decks.map(d => `<option value="${esc(d.id)}">${esc(d.name)} (${kartenVon(d.id).length})</option>`).join('')}
        </select></label><p class="mini">Format: Frage;Antwort;Kasten</p>`,
      knoepfe: [{ text: 'Abbrechen', wert: null }, { text: 'Herunterladen', wert: 'ok', art: 'primary' }]
    });
    if (r !== 'ok') return;
    const wahl = W('m-deck', 'alle');
    const karten = wahl === 'alle' ? S.cards : kartenVon(wahl);
    if (!karten.length) return toast('Keine Karten zum Sichern.');
    dateiHerunterladen(
      `lernkartei-${wahl === 'alle' ? 'alle' : dateiTeil(deckName(wahl))}-${heute()}.csv`,
      csvBauen(karten), 'text/csv');
    toast('CSV heruntergeladen.');
  },
  impCsv: async () => {
    const d = await dateiWaehlen('.csv,.txt,text/csv');
    if (!d) return;
    let zeilen = csvZerlegen(d.text);
    if (!zeilen.length) return toast('Die Datei ist leer.', 'fehler');
    const kopf = zeilen[0].map(x => x.trim().toLowerCase());
    if (kopf[0] === 'frage' && (kopf[1] || '') === 'antwort') zeilen = zeilen.slice(1);

    const decksNeu = new Map(S.decks.map(d2 => [(d2.name || '').toLowerCase(), d2.id]));
    const anzulegen = [];
    const karten = [];
    let fehler = 0;

    zeilen.forEach(z => {
      const frage = (z[0] || '').trim(), antwort = (z[1] || '').trim();
      if (!frage || !antwort) { fehler++; return; }
      const kastenName = (z[2] || 'Import').trim() || 'Import';
      let deckId = decksNeu.get(kastenName.toLowerCase());
      if (!deckId) {
        deckId = neueId();
        decksNeu.set(kastenName.toLowerCase(), deckId);
        anzulegen.push({ id: deckId, ...neuesDeck(kastenName) });
      }
      karten.push({ id: neueId(), ...neueKarte({ deckId, frage, antwort, notiz: (z[3] || '').trim() }) });
    });

    if (!karten.length) return toast('Keine gültigen Zeilen gefunden.', 'fehler');

    const ok = await frage('CSV einlesen',
      `<strong>${karten.length}</strong> Karten in
       <strong>${anzulegen.length ? anzulegen.length + ' neue' : 'bestehende'}</strong> Kästen einlesen?
       ${fehler ? `<br><span class="mini">${fehler} Zeilen ohne Frage oder Antwort werden übersprungen.</span>` : ''}`,
      'Einlesen');
    if (!ok) return;

    const ops = [
      ...anzulegen.map(d2 => { const { id, ...rest } = d2; return ['set', FB.doc(colDecks(), id), rest]; }),
      ...karten.map(k => { const { id, ...rest } = k; return ['set', FB.doc(colCards(), id), rest]; })
    ];
    for (let i = 0; i < ops.length; i += 400) {
      const b = FB.writeBatch(db);
      ops.slice(i, i + 400).forEach(([, ref, daten]) => b.set(ref, daten));
      schreibe(b.commit(), 'CSV-Import');
    }
    // Sieht der Zielkasten Rückwärtsabfragen vor, fehlen sie den frisch
    // eingelesenen Karten noch. Gleich nachziehen statt den Nutzer später
    // über die Diagnose stolpern zu lassen.
    const neueIds = new Set(karten.map(k2 => k2.id));
    karten.forEach(k2 => { if (!S.cards.some(c => c.id === k2.id)) S.cards.push(k2); });
    const bilanz = alleVariantenAbgleichen(k2 => neueIds.has(k2.id));
    toast(bilanz.angelegt
      ? `${karten.length} Karten eingelesen, ${bilanz.angelegt} Gegenabfragen ergänzt.`
      : karten.length + ' Karten eingelesen.');
    seiteZeigen('karten');
  },

  variantenAbgleich: async () => {
    // Erst rechnen, dann fragen: Der Abgleich löscht Abfragen mitsamt
    // Lernstand. Als einziger Knopf auf der Diagnoseseite sähe er wie eine
    // harmlose Prüfung aus — er darf nicht ungefragt löschen.
    const bedarf = variantenBedarf();
    const trocken = alleVariantenAbgleichenProbe();
    if (trocken.entfernt && !await frage('Abfragen abgleichen',
      `<strong>${trocken.angelegt}</strong> fehlende Abfragen werden angelegt und
       <strong>${trocken.entfernt}</strong> nicht mehr vorgesehene entfernt — Letztere
       samt ihrem Lernfortschritt.
       ${bedarf.verwaist ? `<br><span class="mini">Darunter ${bedarf.verwaist} Abfragen,
         deren Quellkarte fehlt.</span>` : ''}`,
      'Abgleichen', 'gefahr')) return;
    const bilanz = alleVariantenAbgleichen();
    await modal({
      titel: 'Abfragen abgeglichen',
      html: bilanz.angelegt || bilanz.entfernt
        ? `<p><strong>${bilanz.angelegt}</strong> Abfragen angelegt,
             <strong>${bilanz.entfernt}</strong> entfernt —
             betroffen waren ${bilanz.betroffen} Karten.</p>
           <p class="mini">Angelegt werden Rückwärtsabfragen und Cloze-Lücken, die der Kasten
             vorsieht; entfernt werden Abfragen, die nicht mehr vorgesehen sind oder deren
             Quellkarte fehlt.</p>`
        : `<p>Alles in Ordnung — jede Karte hat genau die Abfragen, die ihr Kasten vorsieht.</p>`,
      knoepfe: [{ text: 'Gut', wert: 'ok', art: 'primary' }]
    });
    malEinstellungen();
  },

  verwaisteEinsammeln: async () => {
    const verwaist = verwaisteKarten();
    if (!verwaist.length) return toast('Es gibt keine Karten ohne Kasten.');
    const r = await modal({
      titel: 'Karten ohne Kasten einsammeln',
      html: `<p><strong>${verwaist.length}</strong> Karten gehören zu keinem
             vorhandenen Kasten. Wohin damit?</p>
             <label class="feld"><span>Ziel</span><select id="m-deck">
               <option value="neu">Neuer Kasten „Wiederhergestellt“</option>
               ${S.decks.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
             </select></label>`,
      knoepfe: [{ text: 'Abbrechen', wert: null },
                { text: 'Einsammeln', wert: 'ok', art: 'primary' }]
    });
    if (r !== 'ok') return;
    let ziel = W('m-deck', 'neu');
    if (ziel === 'neu') {
      ziel = neueId();
      schreibe(FB.setDoc(FB.doc(colDecks(), ziel), neuesDeck('Wiederhergestellt')), 'Kasten anlegen');
      lernAuswahl?.add(ziel);
    }
    // merge-set statt update: Fehlt eines der Dokumente inzwischen, scheiterte
    // sonst der ganze Stapel und keine einzige Karte käme an.
    verwaist.forEach(k => { k.deckId = ziel; });
    variantenOpsSchreiben(verwaist.map(k => ['merge', k.id, { deckId: ziel }]), 'Verwaiste einsammeln');
    const bilanz = alleVariantenAbgleichen(k => verwaist.some(v => v.id === k.id));
    toast(bilanz.angelegt
      ? `${verwaist.length} Karten eingesammelt, ${bilanz.angelegt} Abfragen ergänzt.`
      : verwaist.length + ' Karten eingesammelt.');
    seiteZeigen('karten');
  },

  allesLoeschen: async () => {
    if (!await frage('Alles löschen',
      `Sämtliche <strong>${S.cards.length} Karten</strong> und
       <strong>${S.decks.length} Kästen</strong> dieses Kontos werden gelöscht — auf allen Geräten.
       <br><br>Vorher sichern? Dann jetzt abbrechen und „Alles als JSON sichern“ nutzen.`,
      'Weiter', 'gefahr')) return;
    const bestaetigt = await modal({
      titel: 'Wirklich alles löschen?',
      html: `<p>Zum Bestätigen bitte <strong>LÖSCHEN</strong> eintippen.</p>
             <input id="m-conf" placeholder="LÖSCHEN" autocapitalize="characters">`,
      knoepfe: [{ text: 'Abbrechen', wert: null },
        { text: 'Endgültig löschen', wert: 'ok', art: 'gefahr',
          pruefen: () => { if ($('#m-conf').value.trim().toUpperCase() !== 'LÖSCHEN') {
            toast('Bitte LÖSCHEN eintippen.'); return false; } } }]
    });
    if (bestaetigt !== 'ok') return;

    await reviewsLaden(true);      // alle Tagesstatistiken, nicht nur die letzten 70 Tage
    const ops = [
      ...S.cards.map(k => FB.doc(colCards(), k.id)),
      ...S.decks.map(d => FB.doc(colDecks(), d.id)),
      ...S.reviews.map(r => FB.doc(colReviews(), r.id || r.datum))
    ];
    for (let i = 0; i < ops.length; i += 400) {
      const b = FB.writeBatch(db);
      ops.slice(i, i + 400).forEach(r => b.delete(r));
      schreibe(b.commit(), 'Alles löschen');
    }
    schreibe(FB.setDoc(refEinstellungen(),
      Object.assign(STANDARD_EINSTELLUNGEN(), { theme: S.einstellungen.theme })), 'Zurücksetzen');
    S.auswahl.clear(); S.reviewsGeladen = false;
    toast('Alle Daten gelöscht.');
    seiteZeigen('lernen');
  }
};


/* ---------- 16. Tastatur ------------------------------------------------ */

document.addEventListener('keydown', e => {
  if (!S.uid) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (!$('#modal-bg').hidden) return;

  if (sitzung?.aktiv) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      // Im Tipp- und Auswahlmodus deckt die Leertaste nicht auf — dort wird
      // erst geantwortet. Ausnahme: die Antwort liegt schon offen.
      if (!sitzung.aufgedeckt && sitzung.modus !== 'tippen' && sitzung.modus !== 'mc') umdrehen();
      return;
    }
    if (['1', '2', '3', '4'].includes(e.key) && sitzung.aufgedeckt) {
      e.preventDefault();
      bewerten(Number(e.key));
      return;
    }
    // Multiple Choice mit A–D
    if (sitzung.modus === 'mc' && !sitzung.aufgedeckt && /^[a-dA-D]$/.test(e.key)) {
      e.preventDefault();
      mcWaehlen(MC_BUCHSTABEN.indexOf(e.key.toUpperCase()));
      return;
    }
    // Nach automatischer Auswertung übernimmt die Eingabetaste den Vorschlag
    if (e.key === 'Enter' && sitzung.aufgedeckt && sitzung.urteil) {
      const v = urteilVorschlag(sitzung.urteil.art);
      if (v) { e.preventDefault(); bewerten(v); return; }
    }
    if (e.key === 'Escape') { e.preventDefault(); sitzungBeenden(false); return; }
  }
  if (e.key === 'Escape' && S.seite !== 'lernen') seiteZeigen('lernen');
});

/* Beim Verlassen der Seite nur die Sprachausgabe stoppen. Die Sitzung wird
   bewusst NICHT beendet: Bewertungen sind ohnehin einzeln geschrieben, und
   ein „aktiv = false“ hätte zwei unangenehme Folgen — die Karte reagierte
   nach der Rückkehr auf keine Taste mehr, und die Schutzabfrage in
   alleSeitenMalen() griffe nicht mehr, sodass die nächste
   Firestore-Aktualisierung mitten in der Sitzung den Startbildschirm
   darüberzeichnet. */
window.addEventListener('pagehide', sprechenStoppen);

/* Nach einer Unterbrechung — Anruf, Bildschirmsperre, App-Wechsel — zählt
   die Zeit auf der aktuellen Karte neu. Sonst flössen zwölf Minuten
   Telefonat als Lernzeit in die Tagesstatistik und füllten den Zielring. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sitzung?.aktiv) sitzung.kartenStart = Date.now();
  if (document.visibilityState === 'hidden') sprechenStoppen();
});

/* ---------- 17. Los ----------------------------------------------------- */

start().catch(e => {
  console.error(e);
  fatal(`<div class="hinweis rot">Unerwarteter Fehler beim Start.</div>
    <pre class="code">${esc(e?.stack || e?.message || String(e))}</pre>`);
});
</script>
