<script type="module">
/* =========================================================================
   Lernkartei 2 — Stufe 1
   Fundament: Firebase Auth (E-Mail/Passwort), Firestore mit Offline-Cache,
   Datenmodell nach KONZEPT §3, Import des Altbestands.
   Funktionsumfang entspricht der Vorgängerversion; Scheduler (FSRS) und die
   neue Oberfläche folgen in Stufe 2.
   ========================================================================= */

/* ---------- 0. Kleine Helfer, die schon vor dem Start gebraucht werden ---- */

const $  = (s, w = document) => w.querySelector(s);
const $$ = (s, w = document) => Array.from(w.querySelectorAll(s));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fatal(titelHtml) {
  $('#boot').hidden = true;
  $('#login').hidden = true;
  $('#app').hidden = true;
  $('#fatal-text').innerHTML = titelHtml;
  $('#fatal').hidden = false;
}

function bootText(t) { const e = $('#boot-text'); if (e) e.textContent = t; }

/* Theme so früh wie möglich setzen, damit es nicht weiß aufblitzt.
   localStorage dient hier ausschließlich als Anzeige-Zwischenspeicher —
   die verbindliche Einstellung liegt in Firestore. */
function themeAnwenden(wunsch) {
  const dunkelSystem = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
  const wirklich = wunsch === 'dunkel' ? 'dark'
                 : wunsch === 'hell'   ? 'light'
                 : (dunkelSystem ? 'dark' : 'light');
  document.documentElement.dataset.theme = wirklich;
}
let themeWunsch = 'auto';
try { themeWunsch = localStorage.getItem('lk2:theme') || 'auto'; } catch (_) {}
themeAnwenden(themeWunsch);
window.matchMedia?.('(prefers-color-scheme: dark)')
  .addEventListener?.('change', () => themeAnwenden(themeWunsch));

/* ---------- 1. Konfiguration und SDK laden ------------------------------ */

let CFG, SDK_VERSION, KONTEN_HINWEIS = [], TAGESGRENZE = 4;
let FB = null;   // gebündelte Firebase-Funktionen
let FSRS = null; // gebündeltes ts-fsrs-Modul (Stufe 2)

async function start() {
  // 1a. firebase-config.js
  let cfgModul;
  try {
    cfgModul = await import('./firebase-config.js');
  } catch (e) {
    return fatal(`
      <div class="hinweis rot">Die Datei <code>firebase-config.js</code> konnte nicht geladen werden.</div>
      <p class="mt">Sie muss im selben Ordner liegen wie <code>index.html</code>. Prüfe:</p>
      <ul><li>Ist die Datei im Repository vorhanden?</li>
      <li>Heißt sie exakt <code>firebase-config.js</code> (klein geschrieben)?</li>
      <li>Wurde GitHub Pages nach dem Hochladen neu gebaut? Das dauert ein bis zwei Minuten.</li></ul>
      <p class="mini">Technische Meldung: ${esc(e.message)}</p>`);
  }

  CFG = cfgModul.firebaseConfig;
  SDK_VERSION = cfgModul.SDK_VERSION || '12.15.0';
  KONTEN_HINWEIS = cfgModul.KONTEN_HINWEIS || [];
  TAGESGRENZE = Number.isFinite(cfgModul.TAGESGRENZE_STUNDE) ? cfgModul.TAGESGRENZE_STUNDE : 4;

  // 1b. Platzhalter erkennen, bevor Firebase mit kryptischen Fehlern um sich wirft
  const fehlend = ['apiKey', 'authDomain', 'projectId', 'appId']
    .filter(k => !CFG?.[k] || /HIER_|DEIN-PROJEKT|^0+$|^1:0+:/.test(String(CFG[k])));
  if (fehlend.length) {
    return fatal(`
      <div class="hinweis">In <code>firebase-config.js</code> stehen noch Platzhalter.</div>
      <p class="mt">Nicht ausgefüllt: <code>${fehlend.map(esc).join('</code>, <code>')}</code></p>
      <p>Die Werte stehen in der Firebase-Konsole unter
         <em>Projekteinstellungen → Meine Apps → Web-App → Konfiguration</em>.
         Schritt für Schritt steht das in der <code>README.md</code>.</p>`);
  }

  // 1c. Firebase-SDK vom Google-CDN
  bootText('Firebase wird geladen …');
  const basis = `https://www.gstatic.com/firebasejs/${SDK_VERSION}`;
  try {
    const [app, auth, fs] = await Promise.all([
      import(`${basis}/firebase-app.js`),
      import(`${basis}/firebase-auth.js`),
      import(`${basis}/firebase-firestore.js`)
    ]);
    FB = { ...app, ...auth, ...fs };
  } catch (e) {
    return fatal(`
      <div class="hinweis rot">Das Firebase-SDK konnte nicht geladen werden.</div>
      <p class="mt">Versucht wurde Version <code>${esc(SDK_VERSION)}</code> von
         <code>www.gstatic.com</code>. Mögliche Ursachen:</p>
      <ul><li>Keine Internetverbindung beim allerersten Start (danach läuft die App offline).</li>
      <li>Die Versionsnummer <code>SDK_VERSION</code> in <code>firebase-config.js</code> gibt es nicht.
          Aktuelle Nummer: <a href="https://firebase.google.com/docs/web/setup" target="_blank" rel="noopener">firebase.google.com/docs/web/setup</a></li>
      <li>Ein Inhaltsblocker verhindert den Zugriff auf gstatic.com.</li></ul>
      <p class="mini">Technische Meldung: ${esc(e.message)}</p>`);
  }

  // 1c2. FSRS-Bibliothek (Stufe 2) — eigenständiges Bundle ohne Abhängigkeiten
  bootText('Lernalgorithmus wird geladen …');
  try {
    FSRS = await import('https://unpkg.com/ts-fsrs@5.4.1/dist/index.mjs');
  } catch (e) {
    return fatal(`
      <div class="hinweis rot">Die FSRS-Bibliothek (ts-fsrs) konnte nicht geladen werden.</div>
      <p class="mt">Versucht wurde <code>unpkg.com/ts-fsrs@5.4.1</code>. Mögliche Ursachen:</p>
      <ul><li>Keine Internetverbindung beim allerersten Start (danach läuft die App offline).</li>
      <li>Ein Inhaltsblocker verhindert den Zugriff auf unpkg.com.</li></ul>
      <p class="mini">Technische Meldung: ${esc(e.message)}</p>`);
  }

  // 1d. Initialisieren
  bootText('Verbindung wird hergestellt …');
  try {
    fbApp = FB.initializeApp(CFG);
    auth  = FB.getAuth(fbApp);
    db    = FB.initializeFirestore(fbApp, {
      localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() })
    });
  } catch (e) {
    return fatal(`
      <div class="hinweis rot">Firebase ließ sich nicht initialisieren.</div>
      <p class="mt">Meist stimmt ein Wert in <code>firebase-config.js</code> nicht.</p>
      <p class="mini">Technische Meldung: ${esc(e.message)}</p>`);
  }

  // Angemeldet bleiben, bis ausdrücklich abgemeldet wird
  try { await FB.setPersistence(auth, FB.browserLocalPersistence); } catch (_) {}

  loginVorbereiten();
  FB.onAuthStateChanged(auth, benutzerGewechselt);
}

let fbApp = null, auth = null, db = null;

/* ---------- 2. Zustand -------------------------------------------------- */

const STANDARD_INTERVALLE = [1, 3, 7, 14, 21, 30, 45, 60, 90, 120, 180, 365];

const STANDARD_EINSTELLUNGEN = () => ({
  version: 3,
  intervalle: STANDARD_INTERVALLE.slice(),
  klassikModus: false,    // Stufe 2: FSRS ist der neue Standard (KONZEPT §4.1)
  retention: 0.88,        // KONZEPT §4.2 — Bereich 0,80–0,95
  neuProTag: 20,          // KONZEPT §6 Punkt 2 — Bereich 5–50
  zielMinuten: 15,
  zielKarten: 30,
  zielEinheit: 'minuten', // 'minuten' | 'karten'
  leechGrenze: 7,         // Stufe 4: ab so vielen Aussetzern gilt eine Karte als Problemkarte
  theme: 'auto',
  modi: ['aufdecken'],    // Stufe 3
  streak: 0,
  lastLearnDate: null,
  lastSeen: null
});

const S = {
  uid: null, email: null,
  einstellungen: STANDARD_EINSTELLUNGEN(),
  decks: [], cards: [], reviews: [],
  seite: 'lernen',
  bereitDecks: false, bereitCards: false, bereitSettings: false,
  abmelder: [],            // aktive onSnapshot-Abmeldefunktionen
  kartenFilterDeck: 'alle',
  kartenFilter: 'alle',    // Stufe 4: alle | faellig | neu | problem | ruht
  kartenSuche: '',
  kartenLimit: 60,
  auswahl: new Set(),
  statDeck: 'alle',
  reviewsGeladen: false,
  heutigeNeu: 0,           // Stufe 2: heute bereits eingeführte neue Karten (Tagesdeckel)
  heutigeAnzahl: 0, heutigeSekunden: 0   // Stufe 2: für den Tagesziel-Ring
};

let sitzung = null;
let bekannteDecks = new Set();
let migrationshinweisAusstehend = false;
let hoerenHinweisGezeigt = false;

/* ---------- 3. Datum, Zufall, IDs -------------------------------------- */

function isoDatum(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
/** Heutiges Lerndatum. Tagesgrenze liegt lokal um TAGESGRENZE Uhr (KONZEPT §2):
 *  wer um 01:30 Uhr lernt, arbeitet noch am Vortag weiter. */
function heute() {
  const d = new Date();
  d.setHours(d.getHours() - TAGESGRENZE);
  return isoDatum(d);
}
/** Alles, was als Datum hereinkommt, auf YYYY-MM-DD zwingen. Fremde
 *  Sicherungen enthalten mitunter Zeitstempel als Zahl oder gar nichts —
 *  ein solcher Wert darf die Oberfläche nicht lahmlegen. */
function isoOder(v, ersatz) {
  if (typeof v === 'number' && Number.isFinite(v)) {
    const d = new Date(v);
    if (!isNaN(d.getTime())) return isoDatum(d);
  }
  if (v instanceof Date && !isNaN(v.getTime())) return isoDatum(v);
  if (v && typeof v === 'object' && typeof v.seconds === 'number') {   // Firestore-Timestamp
    const d = new Date(v.seconds * 1000);
    if (!isNaN(d.getTime())) return isoDatum(d);
  }
  const s = String(v ?? '').slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ersatz;
}
function plusTage(iso, n) {
  const [y, m, t] = isoOder(iso, heute()).split('-').map(Number);
  return isoDatum(new Date(y, m - 1, t + Number(n || 0)));
}
function tageDiff(isoA, isoB) {           // isoA - isoB in Tagen
  const p = s => {
    const [y, m, t] = isoOder(s, heute()).split('-').map(Number);
    return Date.UTC(y, m - 1, t);
  };
  return Math.round((p(isoA) - p(isoB)) / 86400000);
}
function datumDeutsch(iso) {
  const s = isoOder(iso, null);
  if (!s) return '—';
  const [y, m, t] = s.split('-');
  return `${t}.${m}.${y}`;
}
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
/** Firestore-Dokument-IDs dürfen kein "/" enthalten, nicht "." oder ".." sein
 *  und nicht dem Muster __xyz__ folgen. Alt-IDs werden entsprechend entschärft. */
function sichereId(roh) {
  let s = String(roh ?? '').replace(/\//g, '_').trim();
  if (!s || s === '.' || s === '..' || /^__.*__$/.test(s) || s.length > 200) return neueId();
  return s;
}
function mischen(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function zahl(v, min, max, ersatz) {
  const n = Number(v);
  if (!Number.isFinite(n)) return ersatz;
  return Math.min(max, Math.max(min, Math.round(n)));
}

/* ---------- 4. Toast und Modal ----------------------------------------- */

let toastTimer = null;
function toast(text, art) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.toggle('fehler', art === 'fehler');
  t.classList.add('an');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('an'), art === 'fehler' ? 5200 : 2600);
}

/* Werte des zuletzt geschlossenen Dialogs. Notwendig, weil der Dialog beim
   Schließen geleert wird — nach dem await gibt es die Felder nicht mehr. */
let letzteWerte = {};
function W(id, ersatz) {
  const v = letzteWerte[id];
  return v === undefined || v === '' ? ersatz : v;
}
function WRadio(name, ersatz) {
  return letzteWerte['radio:' + name] ?? ersatz;
}

/**
 * @param {{titel:string, html:string, knoepfe:Array, breit?:boolean,
 *          beimOeffnen?:Function}} opt
 * Knopf: {text, wert, art:'primary'|'gefahr'|'', pruefen?:Function}
 * Liefert den Wert des gedrückten Knopfes oder null bei Abbruch.
 * Die Feldinhalte stehen danach über W('feld-id') bereit.
 */
function modal(opt) {
  return new Promise(fertig => {
    const bg = $('#modal-bg'), m = $('#modal');
    Object.keys(m.dataset).forEach(k => delete m.dataset[k]);
    m.innerHTML =
      `<h2>${esc(opt.titel)}</h2><div id="modal-body">${opt.html || ''}</div>
       <div class="modal-btns">${(opt.knoepfe || []).map((k, i) =>
        `<button class="btn ${k.art || ''}" data-i="${i}">${esc(k.text)}</button>`).join('')}</div>`;
    m.style.maxWidth = opt.breit ? '640px' : '480px';
    bg.hidden = false;

    const schliesse = wert => {
      letzteWerte = Object.assign({}, m.dataset);
      $$('input,textarea,select', m).forEach(el => {
        if (el.id) letzteWerte[el.id] =
          (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
        if (el.type === 'radio' && el.checked && el.name) letzteWerte['radio:' + el.name] = el.value;
      });
      bg.hidden = true; m.innerHTML = '';
      document.removeEventListener('keydown', beiTaste, true);
      bg.removeEventListener('click', beiHintergrund);
      fertig(wert);
    };

    $$('.modal-btns button', m).forEach(b => b.addEventListener('click', () => {
      const k = opt.knoepfe[Number(b.dataset.i)];
      if (k.pruefen && k.pruefen() === false) return;
      schliesse(k.wert);
    }));
    function beiHintergrund(e) { if (e.target === bg) schliesse(null); }
    bg.addEventListener('click', beiHintergrund);

    function beiTaste(e) {
      if (e.key === 'Escape') { e.stopPropagation(); schliesse(null); }
      if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA') {
        const prim = opt.knoepfe?.findIndex(k => k.art === 'primary');
        if (prim >= 0) {
          e.preventDefault();
          $(`.modal-btns button[data-i="${prim}"]`, m)?.click();
        }
      }
    }
    document.addEventListener('keydown', beiTaste, true);
    opt.beimOeffnen?.(m);
    // Sofort setzen, nicht über einen Timer: sonst springt der Fokus dem
    // Nutzer unter den Fingern weg, wenn er gleich lostippt.
    (m.querySelector('input,textarea,select') || m.querySelector('button'))?.focus();
  });
}

function frage(titel, text, jaText = 'Ja', art = '') {
  return modal({
    titel, html: `<p>${text}</p>`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, { text: jaText, wert: true, art: art || 'primary' }]
  }).then(v => v === true);
}

/* ---------- 5. Anmeldung ------------------------------------------------ */

function loginVorbereiten() {
  if (KONTEN_HINWEIS.length) {
    $('#login-konten').textContent = KONTEN_HINWEIS.length + ' Konten eingerichtet';
    $('#login-konten').title = KONTEN_HINWEIS.join('\n');
  }
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#login-btn'), fehler = $('#login-fehler');
    fehler.hidden = true;
    btn.disabled = true; btn.textContent = 'Anmeldung läuft …';
    try {
      await FB.signInWithEmailAndPassword(auth, $('#login-mail').value.trim(), $('#login-pw').value);
      $('#login-pw').value = '';
    } catch (err) {
      fehler.innerHTML = esc(authFehler(err));
      fehler.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Anmelden';
    }
  });

  $('#login-reset').addEventListener('click', async () => {
    const mail = $('#login-mail').value.trim();
    if (!mail) { $('#login-mail').focus(); return toast('Bitte zuerst die E-Mail-Adresse eintragen.'); }
    if (!await frage('Passwort zurücksetzen',
      `An <strong>${esc(mail)}</strong> eine E-Mail zum Zurücksetzen des Passworts schicken?`,
      'E-Mail senden')) return;
    try {
      await FB.sendPasswordResetEmail(auth, mail);
      toast('E-Mail ist unterwegs. Bitte auch den Spam-Ordner prüfen.');
    } catch (err) { toast(authFehler(err), 'fehler'); }
  });
}

function authFehler(err) {
  const c = err?.code || '';
  const t = {
    'auth/invalid-credential':   'E-Mail oder Passwort stimmt nicht.',
    'auth/wrong-password':       'E-Mail oder Passwort stimmt nicht.',
    'auth/user-not-found':       'E-Mail oder Passwort stimmt nicht.',
    'auth/invalid-email':        'Diese E-Mail-Adresse sieht nicht gültig aus.',
    'auth/user-disabled':        'Dieses Konto wurde in der Firebase-Konsole deaktiviert.',
    'auth/too-many-requests':    'Zu viele Fehlversuche. Bitte einige Minuten warten.',
    'auth/network-request-failed': 'Keine Verbindung. Für die Anmeldung wird Internet gebraucht.',
    'auth/operation-not-allowed': 'E-Mail/Passwort ist in der Firebase-Konsole nicht aktiviert (Authentication → Sign-in method).',
    'auth/unauthorized-domain':  'Diese Domain ist in Firebase nicht freigegeben (Authentication → Settings → Authorized domains).',
    'auth/missing-password':     'Bitte ein Passwort eingeben.'
  }[c];
  return t || (err?.message || 'Unbekannter Fehler') + (c ? ` (${c})` : '');
}

async function benutzerGewechselt(user) {
  S.abmelder.forEach(f => { try { f(); } catch (_) {} });
  S.abmelder = [];
  sprechenStoppen();
  sitzung = null;

  if (!user) {
    S.uid = null; S.email = null;
    S.decks = []; S.cards = []; S.reviews = [];
    S.bereitDecks = S.bereitCards = S.bereitSettings = false;
    S.einstellungen = STANDARD_EINSTELLUNGEN();
    S.kartenFilterDeck = 'alle'; S.kartenSuche = ''; S.kartenLimit = 60;
    S.statDeck = 'alle'; S.reviewsGeladen = false;
    S.auswahl.clear();
    lernAuswahl = null; letzteSitzung = null; bekannteDecks = new Set();
    // Wichtig: die gezeichneten Seiten leeren. Sonst stünden die Kästen und
    // Karten des abgemeldeten Kontos noch im (verborgenen) Dokument, wenn sich
    // jemand anderes an demselben Gerät anmeldet.
    S.seite = 'lernen';
    SEITEN.forEach(s => {
      const el = $('#seite-' + s);
      if (el) { el.innerHTML = ''; el.hidden = (s !== 'lernen'); }
    });
    $$('#nav button').forEach(b => b.classList.toggle('aktiv', b.dataset.seite === 'lernen'));
    $('#app').hidden = true; $('#boot').hidden = true; $('#fatal').hidden = true;
    $('#login').hidden = false;
    setTimeout(() => $('#login-mail')?.focus(), 40);
    return;
  }

  S.uid = user.uid; S.email = user.email;
  $('#login').hidden = true;
  $('#boot').hidden = false;
  bootText('Daten werden geladen …');
  try {
    await datenAnbinden();
  } catch (e) {
    console.error(e);
    fatal(`<div class="hinweis rot">Die Daten konnten nicht geladen werden.</div>
      <p class="mt">${esc(firestoreFehler(e))}</p>
      <button class="btn mt" onclick="location.reload()">Neu laden</button>`);
  }
}

function firestoreFehler(e) {
  const c = e?.code || '';
  if (c === 'permission-denied' || /permission/i.test(e?.message || ''))
    return 'Firestore verweigert den Zugriff. Sind die Security Rules aus firestore.rules veröffentlicht?';
  if (c === 'unavailable')
    return 'Firestore ist gerade nicht erreichbar. Die App arbeitet mit den lokal gespeicherten Daten weiter.';
  if (c === 'failed-precondition')
    return 'Der Offline-Zwischenspeicher konnte nicht angelegt werden (privates Fenster oder mehrere Tabs?).';
  if (c === 'not-found')
    return 'Diese Karte gibt es nicht mehr — vermutlich auf einem anderen Gerät gelöscht.';
  if (c === 'resource-exhausted')
    return 'Das Tageskontingent von Firestore ist aufgebraucht. Morgen geht es weiter; bis dahin wird lokal gespeichert.';
  return (e?.message || String(e)) + (c ? ` (${c})` : '');
}

/* ---------- 6. Firestore-Anbindung ------------------------------------- */

const refEinstellungen = () => FB.doc(db, 'users', S.uid, 'settings', 'app');
const colDecks   = () => FB.collection(db, 'users', S.uid, 'decks');
const colCards   = () => FB.collection(db, 'users', S.uid, 'cards');
const colReviews = () => FB.collection(db, 'users', S.uid, 'reviews');

/**
 * Firestore-Schreibvorgänge lösen ihr Promise erst auf, wenn der Server
 * bestätigt hat — offline bleiben sie liegen. Deshalb wird nirgends auf einen
 * Schreibvorgang gewartet: der lokale Zwischenspeicher aktualisiert die
 * Oberfläche sofort, der Server zieht nach, sobald wieder Netz da ist.
 */
function schreibe(promise, wobei) {
  Promise.resolve(promise).catch(e => {
    console.error('[Schreibfehler]', wobei, e);
    toast('Nicht gespeichert: ' + firestoreFehler(e), 'fehler');
  });
}

let statusZustand = { cache: false, offen: false };

function statusMalen() {
  const p = $('#status-punkt'), t = $('#status-text');
  if (!p) return;
  let klasse = 'ok', text = 'Synchronisiert';
  if (statusZustand.offen)      { klasse = 'warte'; text = 'Wird gespeichert …'; }
  else if (!navigator.onLine)   { klasse = 'aus';   text = 'Offline'; }
  else if (statusZustand.cache) { klasse = 'aus';   text = 'Aus Zwischenspeicher'; }
  p.className = 'punkt ' + klasse;
  t.textContent = text;
  $('#status').title = statusZustand.offen
    ? 'Änderungen liegen lokal und werden übertragen, sobald wieder Verbindung besteht.'
    : (navigator.onLine ? 'Alle Änderungen sind bei Firestore angekommen.'
                        : 'Ohne Netz. Lernen funktioniert weiter, alles wird lokal gespeichert.');
  const d = $('#diag-status'); if (d) diagnoseMalen();
}
window.addEventListener('online',  statusMalen);
window.addEventListener('offline', statusMalen);

function datenAnbinden() {
  return new Promise((fertig, schiefgegangen) => {
    let erledigt = false;
    const pruefen = () => {
      if (erledigt) return;
      if (S.bereitSettings && S.bereitDecks && S.bereitCards) {
        erledigt = true;
        // Der Erststart-Test darf den Programmstart nicht aufhalten, falls
        // Firestore ohne Netz keine Antwort liefert.
        Promise.race([
          erstStartPruefen().catch(e => console.warn('Erststart', e)),
          new Promise(r => setTimeout(r, 4000))
        ]).then(() => {
          $('#boot').hidden = true;
          $('#app').hidden = false;
          alleSeitenMalen();
          heutigeStatistikLaden().then(() => { if (S.seite === 'lernen' && !sitzung?.aktiv && !letzteSitzung) malLernen(); });
          if (migrationshinweisAusstehend) {
            migrationshinweisAusstehend = false;
            setTimeout(() => toast(
              'Neue Bewertungen laufen jetzt über FSRS statt feste Fachintervalle. ' +
              'Bereits vergebene Termine bleiben erhalten. Umschaltbar in Einstellungen.'), 500);
          }
          fertig();
        });
      }
    };
    const meta = { includeMetadataChanges: true };

    S.abmelder.push(FB.onSnapshot(refEinstellungen(), meta, snap => {
      const daten = snap.exists() ? snap.data() : null;
      S.einstellungen = Object.assign(STANDARD_EINSTELLUNGEN(), daten || {});
      if (!Array.isArray(S.einstellungen.intervalle) || S.einstellungen.intervalle.length !== 12)
        S.einstellungen.intervalle = STANDARD_INTERVALLE.slice();
      S.einstellungen.intervalle = S.einstellungen.intervalle.map((v, i) =>
        zahl(v, 1, 3650, STANDARD_INTERVALLE[i]));

      // Migration Stufe 1 -> Stufe 2: Konten von vor Stufe 2 (version < 3)
      // wechseln einmalig auf FSRS als neuen Standard-Scheduler (KONZEPT
      // §4.1). Termine bereits gelernter Karten bleiben unangetastet — nur
      // künftige Bewertungen laufen ab jetzt über FSRS statt feste Intervalle.
      if (daten && (!Number.isFinite(daten.version) || daten.version < 3)) {
        S.einstellungen.klassikModus = false;
        S.einstellungen.version = 3;
        schreibe(FB.setDoc(refEinstellungen(),
          { klassikModus: false, version: 3 }, { merge: true }), 'Stufe-2-Migration');
        migrationshinweisAusstehend = true;
      }

      themeWunsch = S.einstellungen.theme || 'auto';
      themeAnwenden(themeWunsch);
      try { localStorage.setItem('lk2:theme', themeWunsch); } catch (_) {}
      S.bereitSettings = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));

    S.abmelder.push(FB.onSnapshot(colDecks(), meta, snap => {
      S.decks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de'));
      // Neu hinzugekommene Kästen sind beim Lernen von Anfang an dabei
      if (lernAuswahl) S.decks.forEach(d => {
        if (!bekannteDecks.has(d.id)) lernAuswahl.add(d.id);
      });
      bekannteDecks = new Set(S.decks.map(d => d.id));
      statusAusSnapshot(snap);
      S.bereitDecks = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));

    S.abmelder.push(FB.onSnapshot(colCards(), meta, snap => {
      S.cards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (S.auswahl.size) {                       // gelöschte Karten aus der Auswahl nehmen
        const da = new Set(S.cards.map(k => k.id));
        S.auswahl.forEach(x => { if (!da.has(x)) S.auswahl.delete(x); });
      }
      statusAusSnapshot(snap);
      S.bereitCards = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));
  });
}

function statusAusSnapshot(snap) {
  statusZustand.cache = !!snap.metadata?.fromCache;
  statusZustand.offen = !!snap.metadata?.hasPendingWrites;
  statusMalen();
}

/** Erster Start eines Kontos: Einstellungen und Beispielkasten anlegen. */
async function erstStartPruefen() {
  if (S.decks.length || S.cards.length) {
    schreibe(FB.setDoc(refEinstellungen(),
      { lastSeen: new Date().toISOString() }, { merge: true }), 'lastSeen');
    return;
  }
  // Nur anlegen, wenn sicher feststeht, dass es noch keine Einstellungen gibt.
  // Schlägt die Abfrage fehl (offline, kein Cache), wird nichts erzeugt —
  // sonst entstünde bei jedem Start ein weiterer Beispielkasten.
  let snap = null;
  try { snap = await FB.getDoc(refEinstellungen()); } catch (_) { return; }
  if (!snap || snap.exists()) return;

  const deckId = neueId();
  const b = FB.writeBatch(db);
  b.set(refEinstellungen(), Object.assign(STANDARD_EINSTELLUNGEN(),
    { lastSeen: new Date().toISOString() }));
  b.set(FB.doc(colDecks(), deckId), neuesDeck('Beispiel'));
  [
    ['Was bedeutet „Spaced Repetition“?',
     'Wiederholen in wachsenden Abständen — kurz vor dem Vergessen.',
     'Der Effekt ist gut belegt: gleiche Behaltensleistung bei deutlich weniger Wiederholungen.'],
    ['Wofür stehen die Bewertungen 1 bis 4?',
     '1 = nicht gewusst, 2 = schwer, 3 = gewusst, 4 = sehr leicht',
     '1 setzt die Karte zurück, 4 verlängert den Abstand bis zur nächsten Abfrage am stärksten.'],
    ['Wie kommen meine alten Karten hierher?',
     'Einstellungen → Daten → Altbestand übernehmen',
     'Entweder aus dem Browser dieser Domain oder aus der JSON-Datei der alten App.']
  ].forEach(([f, a, n]) => {
    b.set(FB.doc(colCards(), neueId()), neueKarte({ deckId, frage: f, antwort: a, notiz: n }));
  });
  schreibe(b.commit(), 'Erststart');
}

/* ---------- 7. Datenmodell (KONZEPT §3) --------------------------------- */

function neuesDeck(name, farbe) {
  return {
    name: String(name || 'Neuer Kasten').slice(0, 120),
    farbe: farbe || DECK_FARBEN[Math.floor(Math.random() * DECK_FARBEN.length)],
    modi: ['aufdecken'],        // Stufe 3: aufdecken | tippen | mc | hoeren
    richtung: 'vorwaerts',      // vorwaerts | rueckwaerts | beide
    sprache: 'de-DE',           // Hörmodus: Sprache der Frageseite
    spracheAntwort: 'de-DE',    // Hörmodus: Sprache der Antwortseite
    pruefungsdatum: null,       // Stufe 4
    createdAt: heute(),
    archiviert: false
  };
}
const DECK_FARBEN = ['#378add', '#639922', '#ef9f27', '#e24b4a', '#8e6bd6', '#1B9AAA', '#d6538e', '#5b7083'];

function neueKarte({ deckId, frage, antwort, notiz, typ, quelleId, variante }) {
  return {
    deckId,
    frage: String(frage || '').trim(),
    antwort: String(antwort || '').trim(),
    notiz: String(notiz || '').trim(),
    tags: [],
    typ: KARTEN_TYPEN.includes(typ) ? typ : 'standard',   // standard | cloze
    // Stufe 3: Eine Quellkarte kann mehrere eigenständig terminierte
    // Abfragen erzeugen (Cloze-Lücken, Rückwärtsrichtung). Die Quellkarte
    // selbst trägt quelleId:null; abgeleitete Karten zeigen darauf.
    quelleId: quelleId || null,
    variante: variante || 'v',  // 'v' | 'r' | 'c1', 'c2', …
    fach: 1,
    stability: 0,
    // difficulty MUSS bei einer noch nie gelernten Karte zusammen mit
    // stability:0 auf 0 stehen — ts-fsrs erkennt eine "frische" Karte genau
    // an dieser Kombination und initialisiert sie über die Erstbewertungs-
    // formel. Jeder andere Wert hier lässt FSRS bei der ersten Bewertung
    // mit "Invalid memory state" abstürzen.
    difficulty: 0,
    due: heute(),               // neue Karten sind sofort dran
    lastReview: null,
    reps: 0,
    lapses: 0,
    state: 0,                   // 0 neu, 1 lernen, 2 Wiederholung, 3 erneut lernen
    suspendiert: false,
    leech: false,               // Stufe 4: als Problemkarte erkannt
    leechBasis: 0,              // Aussetzer-Stand beim letzten Wiederaufnehmen
    zeitGesamt: 0,              // Stufe 4: aufsummierte Lernzeit in Sekunden
    zeitReps: 0,                // dazugehörige Anzahl gemessener Abfragen
    createdAt: heute()
  };
}

/** Karten, deren Kasten nicht (mehr) existiert. Sie kämen sonst in keiner
 *  Sitzung mehr vor, würden aber weiter mitgezählt. */
function verwaisteKarten() {
  const da = new Set(S.decks.map(d => d.id));
  return S.cards.filter(k => !da.has(k.deckId));
}

const istFaellig    = k => !k.suspendiert && (k.due || heute()) <= heute();
/** Umfang „Nur heute“: heute fällig — und zusätzlich alles, was noch nie
 *  dran war. Eine neue Karte hat kein Intervall verpasst; mit reiner
 *  Gleichheit wäre sie ab dem Tag nach dem Anlegen aus diesem Umfang
 *  verschwunden und nur noch unter „alle fälligen“ auffindbar gewesen. */
const istHeuteGenau = k => !k.suspendiert &&
  ((k.due || heute()) === heute() || (istNeu(k) && (k.due || heute()) <= heute())
   // Vor einer Prüfung zählt auch alles Liegengebliebene: Die vorgezogenen
   // Termine liegen auf bestimmten Tagen, und ein verpasster Tag darf die
   // Karten nicht bis nach der Prüfung aus dem Blick nehmen.
   || (!!deckPruefungAktiv(k.deckId) && (k.due || heute()) <= heute()));
const istNeu        = k => !k.reps;
const deckName      = id => S.decks.find(d => d.id === id)?.name || 'Ohne Kasten';
const deckFarbe     = id => S.decks.find(d => d.id === id)?.farbe || 'var(--txt3)';
const kartenVon     = id => S.cards.filter(k => k.deckId === id);

/** Fach ist die Anzeige-Ebene der Karteikarten-Metapher (KONZEPT §4.3).
 *  Klassik-Modus: Fach ist eine gespeicherte Terminierungsgröße (wie Stufe 1).
 *  FSRS-Modus: Fach ist eine reine Ableitung aus der Stabilität — keine
 *  gespeicherte Größe, ändert sich also automatisch mit jeder Bewertung. */
function fachVon(k) {
  if (S.einstellungen.klassikModus) {
    return Number.isFinite(k.fach) && k.fach >= 1 ? Math.min(12, Math.round(k.fach)) : 1;
  }
  const s = Number(k.stability) || 0;
  const schwellen = STANDARD_INTERVALLE.filter(g => s >= g).length;
  return Math.max(1, Math.min(12, schwellen + 1));
}

/* ---------- 7b. Lernmodi und Varianten (Stufe 3, KONZEPT §5) ------------ */

const MODI_ALLE   = ['aufdecken', 'tippen', 'mc', 'hoeren'];
const MODUS_NAME  = { aufdecken: 'Aufdecken', tippen: 'Tippen', mc: 'Multiple Choice', hoeren: 'Hören' };
const MODUS_HILFE = {
  aufdecken: 'Frage lesen, Antwort aufdecken, selbst bewerten.',
  tippen:    'Antwort eintippen, automatische Auswertung mit Tippfehlertoleranz.',
  mc:        'Vier Vorgaben — nur bei Karten, die noch nie gelernt wurden.',
  hoeren:    'Frage und Antwort werden vorgelesen.'
};
const KARTEN_TYPEN = ['standard', 'cloze'];
const RICHTUNGEN   = ['vorwaerts', 'rueckwaerts', 'beide'];
const RICHTUNG_NAME = {
  vorwaerts:   'Vorwärts — Frage → Antwort',
  rueckwaerts: 'Rückwärts — Antwort → Frage',
  beide:       'Beide Richtungen — zwei getrennt terminierte Karten'
};
const SPRACHEN = [
  ['de-DE', 'Deutsch'], ['en-US', 'Englisch (US)'], ['en-GB', 'Englisch (UK)'],
  ['fr-FR', 'Französisch'], ['es-ES', 'Spanisch'], ['it-IT', 'Italienisch'],
  ['nl-NL', 'Niederländisch'], ['pt-PT', 'Portugiesisch'], ['pl-PL', 'Polnisch'],
  ['ru-RU', 'Russisch'], ['tr-TR', 'Türkisch'], ['sv-SE', 'Schwedisch']
];

const deckVon = id => S.decks.find(d => d.id === id) || null;
function deckModi(deckId) {
  const m = deckVon(deckId)?.modi;
  const gefiltert = Array.isArray(m) ? m.filter(x => MODI_ALLE.includes(x)) : [];
  return gefiltert.length ? gefiltert : ['aufdecken'];
}
function deckRichtung(deckId) {
  const r = deckVon(deckId)?.richtung;
  return RICHTUNGEN.includes(r) ? r : 'vorwaerts';
}
function deckSprache(deckId) {
  const s = deckVon(deckId)?.sprache;
  return typeof s === 'string' && s ? s : 'de-DE';
}
function deckSpracheAntwort(deckId) {
  const s = deckVon(deckId)?.spracheAntwort;
  return typeof s === 'string' && s ? s : deckSprache(deckId);
}
/** Welche Stimme gehört zu welcher Seite? Die Sprache hängt am Feld, nicht
 *  an der Abfragerichtung: Bei einer Rückwärtsabfrage steht vorne die
 *  Antwort, die also in der Antwortsprache zu lesen ist. Ohne diese
 *  Unterscheidung läse eine englische Stimme die deutschen Vokabeln — im
 *  Hörmodus ausgerechnet das, worauf es ankommt. */
function spracheFuer(k, seite) {
  if (istClozeVariante(k)) return deckSprache(k.deckId);   // beides derselbe Text
  const zeigtAntwortFeld = (seite === 'frage') === (varianteVon(k) === 'r');
  return zeigtAntwortFeld ? deckSpracheAntwort(k.deckId) : deckSprache(k.deckId);
}

/* --- Cloze: {{c1::Lösung}} oder {{c1::Lösung::Hinweis}} ------------------ */

/* Bewusst als Funktion: ein geteiltes globales RegExp mit /g-Flag würde
   seinen lastIndex zwischen den Aufrufern verschleppen. */
/* Die Längenbegrenzung ist kein Schönheitsfehler: mit unbegrenzten faulen
   Quantoren braucht ein Text mit vielen offenen „{{c1::“ ohne Abschluss
   quadratisch bis kubisch viel Zeit. 600 Zeichen je Lücke sind reichlich. */
const clozeRegex = () => /\{\{c(\d{1,2})::([\s\S]{0,600}?)(?:::([\s\S]{0,600}?))?\}\}/g;

function clozeTeile(text) {
  const out = [];
  const re = clozeRegex();
  let m;
  while ((m = re.exec(String(text ?? ''))) !== null) {
    out.push({ nr: Number(m[1]), loesung: m[2], hinweis: m[3] == null ? null : m[3] });
    if (m.index === re.lastIndex) re.lastIndex++;   // Endlosschleife bei Leertreffer verhindern
  }
  return out;
}
function clozeNummern(text) {
  return Array.from(new Set(clozeTeile(text).map(t => t.nr)))
    .filter(n => Number.isFinite(n) && n >= 1 && n <= 20).sort((a, b) => a - b);
}
function clozeLoesung(text, nr) {
  const t = clozeTeile(text).filter(x => x.nr === nr).map(x => x.loesung.trim()).filter(Boolean);
  return Array.from(new Set(t)).join(' / ');
}
/** Cloze-Text als HTML. aufgedeckt=false zeigt die abgefragte Lücke als
 *  Platzhalter (oder Hinweis), alle anderen Lücken im Klartext. */
function clozeHtml(text, zielNr, aufgedeckt) {
  const s = String(text ?? '');
  const re = clozeRegex();
  let out = '', letzte = 0, m;
  while ((m = re.exec(s)) !== null) {
    out += esc(s.slice(letzte, m.index));
    const nr = Number(m[1]), loesung = m[2], hinweis = m[3];
    if (nr === zielNr) {
      out += aufgedeckt
        ? `<span class="cloze-loesung">${esc(loesung)}</span>`
        : `<span class="cloze-luecke">${hinweis ? esc(hinweis) : '&nbsp;…&nbsp;'}</span>`;
    } else {
      out += esc(loesung);
    }
    letzte = m.index + m[0].length;
    if (m.index === re.lastIndex) re.lastIndex++;
  }
  return out + esc(s.slice(letzte));
}

/* --- Varianten: eigenständig terminierte Abfragen einer Quellkarte ------- */

const istQuellkarte    = k => !k.quelleId;
const varianteVon      = k => (typeof k.variante === 'string' && k.variante) ? k.variante : 'v';
const istClozeVariante = k => /^c\d+$/.test(varianteVon(k));
function clozeNrVon(k) { const m = /^c(\d+)$/.exec(varianteVon(k)); return m ? Number(m[1]) : 0; }
const abgeleiteteVon   = quelleId => S.cards.filter(k => k.quelleId === quelleId);

/** Welche eigenständig terminierten Abfragen soll diese Quellkarte erzeugen?
 *  Cloze und Abfragerichtung schließen sich aus: bei einem Lückentext ergibt
 *  die Rückwärtsfrage keinen Sinn, dort zählen die Lücken. */
function gewuenschteVarianten(quelle, deck) {
  if (quelle.typ === 'cloze') {
    const nummern = clozeNummern(quelle.frage);
    if (nummern.length) return nummern.map(n => 'c' + n);
    return ['v'];    // als Lückentext markiert, aber (noch) ohne Lücke
  }
  const r = RICHTUNGEN.includes(deck?.richtung) ? deck.richtung : 'vorwaerts';
  if (r === 'beide') return ['v', 'r'];
  if (r === 'rueckwaerts') return ['r'];
  return ['v'];
}

/** Soll-Ist-Abgleich der Varianten einer Quellkarte. Schreibt nichts, liefert
 *  nur die nötigen Schritte — so lässt sich derselbe Plan einzeln ausführen
 *  oder für viele Karten zu einem Stapel zusammenfassen.
 *
 *  Grundregel: Die Quellkarte behält ihre Variante, solange diese gebraucht
 *  wird, sonst übernimmt sie die erste offene. Ihr Lernfortschritt geht damit
 *  nie verloren — anders als bei abgeleiteten Karten, die beim Abwählen einer
 *  Richtung tatsächlich verschwinden (dann ist die Abfrage ja nicht mehr
 *  gewollt). */
/* Felder, die zum Lernstand einer einzelnen Abfrage gehören. */
const TERMIN_FELDER = ['due', 'stability', 'difficulty', 'reps', 'lapses', 'state', 'fach',
  'lastReview', 'zeitGesamt', 'zeitReps', 'leech', 'leechBasis'];

/** Weicht der gespiegelte Inhalt ab? Nur dann muss geschrieben werden —
 *  sonst würde jeder Abgleich Dokumente anfassen, obwohl alles stimmt, und
 *  die Diagnose meldete dauerhaft Handlungsbedarf. */
function inhaltAbweicht(k, inhalt) {
  return String(k.deckId ?? '')  !== String(inhalt.deckId ?? '')
      || String(k.frage ?? '')   !== String(inhalt.frage ?? '')
      || String(k.antwort ?? '') !== String(inhalt.antwort ?? '')
      || String(k.notiz ?? '')   !== String(inhalt.notiz ?? '')
      || String(k.typ ?? 'standard') !== String(inhalt.typ ?? 'standard')
      || !!k.suspendiert !== !!inhalt.suspendiert
      || JSON.stringify(Array.isArray(k.tags) ? k.tags : []) !== JSON.stringify(inhalt.tags || []);
}

function variantenPlan(quelle, deck, index) {
  const soll = gewuenschteVarianten(quelle, deck);
  const ops = [];
  // Bei Massenabgleichen wird der Index einmal gebaut statt je Karte den
  // gesamten Bestand zu durchsuchen — sonst wäre das quadratisch.
  const vorhanden = index ? (index.get(quelle.id) || []) : abgeleiteteVon(quelle.id);

  // 1. Jede vorhandene Abfrage behält ihre Variante, solange sie gebraucht
  //    wird. Die Quellkarte hat dabei Vorrang vor gleichnamigen Ableitungen.
  const quellAlt = varianteVon(quelle);
  const belegt = new Map();     // variante -> abgeleitete Karte
  const weg = [];
  vorhanden.forEach(a => {
    const v = varianteVon(a);
    if (soll.includes(v) && v !== quellAlt && !belegt.has(v)) belegt.set(v, a);
    else weg.push(a);
  });

  // 2. Wird die Variante der Quellkarte nicht mehr gebraucht, übernimmt sie
  //    eine offene. Ist keine offen, liegt der gesuchte Lernstand bei einer
  //    abgeleiteten Abfrage — der wird dann auf die Quellkarte übertragen.
  //    Ohne diesen Schritt würde beim Wechsel „beide → rückwärts“ genau die
  //    Karte gelöscht, deren Fortschritt zur verbleibenden Frage gehört.
  let quellVariante = quellAlt;
  const quellPatch = {};
  if (!soll.includes(quellAlt)) {
    const offen = soll.find(v => !belegt.has(v));
    if (offen !== undefined) {
      quellVariante = offen;
    } else {
      const spender = belegt.get(soll[0]);
      quellVariante = soll[0];
      TERMIN_FELDER.forEach(f => { if (spender[f] !== undefined) quellPatch[f] = spender[f]; });
      belegt.delete(soll[0]);
      weg.push(spender);
    }
    quellPatch.variante = quellVariante;
  }

  const inhalt = {
    deckId: quelle.deckId,
    frage: quelle.frage, antwort: quelle.antwort, notiz: quelle.notiz || '',
    typ: KARTEN_TYPEN.includes(quelle.typ) ? quelle.typ : 'standard',
    tags: Array.isArray(quelle.tags) ? quelle.tags : [],
    // Ruhen gilt für die ganze Karte: abgeleitete Abfragen lassen sich in der
    // Oberfläche nicht einzeln öffnen, blieben sonst also unstoppbar.
    suspendiert: !!quelle.suspendiert
  };

  let angelegt = 0;
  soll.forEach(v => {
    if (v === quellVariante) return;
    const da = belegt.get(v);
    if (da) { if (inhaltAbweicht(da, inhalt)) ops.push(['merge', da.id, { ...inhalt }]); }
    else {
      const karte = neueKarte({ ...inhalt, quelleId: quelle.id, variante: v });
      karte.tags = inhalt.tags;
      karte.suspendiert = inhalt.suspendiert;
      ops.push(['set', neueId(), karte]);
      angelegt++;
    }
  });
  weg.forEach(a => ops.push(['delete', a.id]));
  if (Object.keys(quellPatch).length) ops.unshift(['merge', quelle.id, quellPatch]);

  return { ops, quellVariante, quellPatch, angelegt, entfernt: weg.length };
}

/** Schreibt die Schritte eines oder mehrerer Variantenpläne.
 *  Bewusst ohne update(): ein merge-set gelingt auch, wenn das Dokument
 *  gerade erst angelegt wurde und noch nicht beim Server angekommen ist. */
function variantenOpsSchreiben(ops, wobei) {
  if (!ops.length) return;
  for (let i = 0; i < ops.length; i += 400) {
    const b = FB.writeBatch(db);
    ops.slice(i, i + 400).forEach(([art, id, daten]) => {
      const ref = FB.doc(colCards(), id);
      if (art === 'delete') b.delete(ref);
      else b.set(ref, daten, art === 'merge' ? { merge: true } : undefined);
    });
    schreibe(b.commit(), wobei || 'Kartenvarianten');
  }
}

function variantenAbgleichen(quelle, deck) {
  const plan = variantenPlan(quelle, deck || deckVon(quelle.deckId));
  variantenOpsSchreiben(plan.ops, 'Kartenvarianten');
  Object.assign(quelle, plan.quellPatch);     // lokal sofort, s. quellPatch oben
  return plan;
}

/** Mehrere Quellkarten auf einmal abgleichen — nach Import, Massen-
 *  verschiebung oder einer geänderten Abfragerichtung. `nurWenn` grenzt auf
 *  einen Teilbestand ein (z. B. einen Kasten); ohne Filter wird zusätzlich
 *  nach Karteileichen gesucht. Liefert die Zusammenfassung. */
function ableitungsIndex() {
  const m = new Map();
  S.cards.forEach(k => {
    if (!k.quelleId) return;
    if (!m.has(k.quelleId)) m.set(k.quelleId, []);
    m.get(k.quelleId).push(k);
  });
  return m;
}

function alleVariantenAbgleichen(nurWenn) {
  const ops = [];
  const index = ableitungsIndex();
  let angelegt = 0, entfernt = 0, betroffen = 0;
  S.cards.filter(k => istQuellkarte(k) && (!nurWenn || nurWenn(k))).forEach(q => {
    const plan = variantenPlan(q, deckVon(q.deckId), index);
    if (!plan.ops.length) return;
    betroffen++; angelegt += plan.angelegt; entfernt += plan.entfernt;
    ops.push(...plan.ops);
    Object.assign(q, plan.quellPatch);
  });
  if (!nurWenn) {
    // Abfragen, deren Quellkarte es nicht mehr gibt, sind Karteileichen:
    // sie kämen weiter in Sitzungen vor, ließen sich aber nicht bearbeiten.
    const quellen = new Set(S.cards.filter(istQuellkarte).map(k => k.id));
    const verwaist = S.cards.filter(k => k.quelleId && !quellen.has(k.quelleId));
    verwaist.forEach(k => ops.push(['delete', k.id]));
    entfernt += verwaist.length;
  }
  variantenOpsSchreiben(ops, 'Varianten abgleichen');
  return { betroffen, angelegt, entfernt };
}

/** Trockenlauf des vollständigen Abgleichs: liefert dieselbe Bilanz wie
 *  alleVariantenAbgleichen(), ohne etwas zu schreiben. */
function alleVariantenAbgleichenProbe() {
  const index = ableitungsIndex();
  let angelegt = 0, entfernt = 0, betroffen = 0;
  S.cards.filter(istQuellkarte).forEach(q => {
    const plan = variantenPlan(q, deckVon(q.deckId), index);
    if (!plan.ops.length) return;
    betroffen++; angelegt += plan.angelegt; entfernt += plan.entfernt;
  });
  const bekannt = new Set(S.cards.filter(istQuellkarte).map(k => k.id));
  entfernt += S.cards.filter(k => k.quelleId && !bekannt.has(k.quelleId)).length;
  return { betroffen, angelegt, entfernt };
}

/** Wie viele Karten weichen vom Soll ab? Nur zählen, nicht schreiben — für
 *  die Diagnose. */
function variantenBedarf() {
  const index = ableitungsIndex();
  const quellen = S.cards.filter(istQuellkarte);
  let karten = 0;
  quellen.forEach(q => { if (variantenPlan(q, deckVon(q.deckId), index).ops.length) karten++; });
  const bekannt = new Set(quellen.map(k => k.id));
  const verwaist = S.cards.filter(k => k.quelleId && !bekannt.has(k.quelleId)).length;
  return { karten, verwaist };
}

/** Alle Kennungen, die zu denselben Quellkarten gehören wie die übergebenen.
 *  Löschen und Verschieben dürfen keine halben Kartenfamilien hinterlassen —
 *  eine Rückwärtsabfrage ohne ihre Quellkarte wäre nicht mehr bearbeitbar. */
function mitVarianten(ids) {
  const quellen = new Set();
  ids.forEach(x => {
    const k = S.cards.find(y => y.id === x);
    if (k) quellen.add(k.quelleId || k.id);
  });
  const out = new Set();
  quellen.forEach(q => {
    if (S.cards.some(c => c.id === q)) out.add(q);
    abgeleiteteVon(q).forEach(a => out.add(a.id));
  });
  return Array.from(out);
}

/* --- Inhalt einer Abfrage ------------------------------------------------ */

/** Klartext der Frageseite — auch für die Sprachausgabe. */
function frageText(k) {
  if (istClozeVariante(k)) {
    const ziel = clozeNrVon(k);
    return String(k.frage || '').replace(clozeRegex(),
      (_, nr, loesung, hinweis) => Number(nr) === ziel ? (hinweis || '…') : loesung);
  }
  return varianteVon(k) === 'r' ? String(k.antwort || '') : String(k.frage || '');
}
/** Klartext der erwarteten Antwort — für Tippen, Multiple Choice, Vorlesen. */
function antwortText(k) {
  if (istClozeVariante(k)) return clozeLoesung(k.frage, clozeNrVon(k));
  return varianteVon(k) === 'r' ? String(k.frage || '') : String(k.antwort || '');
}
function frageHtml(k)   { return istClozeVariante(k) ? clozeHtml(k.frage, clozeNrVon(k), false) : esc(frageText(k)); }
function antwortHtml(k) { return istClozeVariante(k) ? clozeHtml(k.frage, clozeNrVon(k), true)  : esc(antwortText(k)); }
function variantenMarke(k) {
  if (istClozeVariante(k)) return 'Lücke ' + clozeNrVon(k);
  return varianteVon(k) === 'r' ? 'rückwärts' : '';
}

/* --- Tippen: Auswertung mit Tippfehlertoleranz --------------------------- */

function levenshtein(a, b) {
  a = String(a); b = String(b);
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let vorher = Array.from({ length: b.length + 1 }, (_, i) => i);
  let jetzt = new Array(b.length + 1);
  for (let i = 0; i < a.length; i++) {
    jetzt[0] = i + 1;
    for (let j = 0; j < b.length; j++) {
      jetzt[j + 1] = Math.min(jetzt[j] + 1, vorher[j + 1] + 1, vorher[j] + (a[i] === b[j] ? 0 : 1));
    }
    const tausch = vorher; vorher = jetzt; jetzt = tausch;
  }
  return vorher[b.length];
}

/** Vergleichsform einer Antwort.
 *  Akzente und ß werden bewusst eingeebnet: Auf einer Handytastatur tippt
 *  kaum jemand „hôtel“ oder „Straße“ mit dem richtigen Sonderzeichen. Ohne
 *  diese Einebnung gälte eine sachlich richtige Antwort als falsch — und
 *  weil daraufhin die Bewertung 1 vorgeschlagen wird, kostete das der Karte
 *  Monate an Intervall. */
function antwortNormalisieren(s) {
  return String(s ?? '').toLowerCase()
    .replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // Akzente ablegen
    .replace(/[.,;:!?¿¡"'„“”‚‘’()[\]{}]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
/** Zulässige Schreibweisen: „a / b“, „a; b“ und „a oder b“ gelten als
 *  Alternativen, Klammerzusätze sind optional. */
function antwortAlternativen(erwartet) {
  const roh = String(erwartet ?? '');
  const teile = roh.split(/\s*[/;]\s*|\s+oder\s+/i).map(t => t.trim()).filter(Boolean);
  const menge = new Set();
  (teile.length ? teile : [roh]).forEach(t => {
    menge.add(antwortNormalisieren(t));
    menge.add(antwortNormalisieren(t.replace(/\([^)]*\)/g, ' ')));
  });
  menge.add(antwortNormalisieren(roh));
  return Array.from(menge).filter(Boolean);
}
/** 'richtig' | 'fast' | 'falsch' | 'leer'.
 *  KONZEPT §5: Tippfehlertoleranz erst über fünf Zeichen, Levenshtein ≤ 2.
 *  Die erlaubte Distanz ist nach Länge gestaffelt, weil ein pauschales „≤ 2“
 *  bei kurzen Wörtern keine Vertipper mehr erkennt, sondern andere Wörter:
 *  „Ratten“ für „Katzen“, „fahnen“ für „fahren“. Ein falsches Zeichen ab
 *  sechs Zeichen, zwei erst ab zwölf. */
function antwortPruefen(eingabe, erwartet) {
  const e = antwortNormalisieren(eingabe);
  if (!e) return 'leer';
  const alt = antwortAlternativen(erwartet);
  if (!alt.length) return 'falsch';
  if (alt.includes(e)) return 'richtig';
  const fast = alt.some(a => {
    if (a.length <= 5) return false;
    return levenshtein(e, a) <= (a.length >= 12 ? 2 : 1);
  });
  return fast ? 'fast' : 'falsch';
}

/* --- Multiple Choice ----------------------------------------------------- */

/** Drei Distraktoren aus demselben Kasten (KONZEPT §5). Liefert null, wenn
 *  der Kasten zu wenige unterschiedliche Antworten hergibt — dann greift ein
 *  anderer Modus. */
function mcOptionenBauen(k) {
  const richtig = antwortText(k).trim();
  if (!richtig) return null;
  // Die eigene Frage darf nie unter den Vorgaben stehen — bei „beide
  //  Richtungen“ ist die Antwort der Geschwisterabfrage genau dieser Text.
  const gesehen = new Set([antwortNormalisieren(richtig), antwortNormalisieren(frageText(k))]);
  const familie = k.quelleId || k.id;
  const richtung = varianteVon(k);
  const pool = [];
  S.cards.forEach(x => {
    if (x.id === k.id || x.deckId !== k.deckId || x.suspendiert) return;
    if ((x.quelleId || x.id) === familie) return;      // Geschwisterabfragen
    // Nur Vorgaben derselben Richtung: In einem Kasten mit beiden Richtungen
    // lieferten die Rückwärtsabfragen sonst Wörter der anderen Sprache. Die
    // Aufgabe wäre dann „welches ist das englische Wort“ statt „welches ist
    // die richtige Übersetzung“.
    if (varianteVon(x) !== richtung) return;
    const t = antwortText(x).trim();
    const n = antwortNormalisieren(t);
    if (!t || !n || gesehen.has(n)) return;
    gesehen.add(n); pool.push(t);
  });
  if (pool.length < 3) return null;
  return mischen(mischen(pool).slice(0, 3).concat([richtig]))
    .map(t => ({ text: t, richtig: t === richtig }));
}

/* --- Modusauswahl je Karte ---------------------------------------------- */

/** Kleiner, stabiler Hash für die Formatvielfalt (KONZEPT §7): dieselbe Karte
 *  wird mal getippt, mal aufgedeckt abgefragt — aber nicht zufällig innerhalb
 *  einer Sitzung, sondern reproduzierbar aus Kennung und Wiederholungszahl. */
function textHash(s) {
  let h = 2166136261;
  const t = String(s);
  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h | 0);
}

function modusFuer(k) {
  const modi = deckModi(k.deckId);
  // Multiple Choice ist der Einstieg für Karten, die noch nie dran waren.
  // Danach greift automatisch Tippen bzw. Aufdecken (KONZEPT §5).
  if (modi.includes('mc') && istNeu(k) && !istClozeVariante(k) && mcOptionenBauen(k)) return 'mc';
  const kandidaten = [];
  if (modi.includes('tippen')) kandidaten.push('tippen');
  if (modi.includes('aufdecken')) kandidaten.push('aufdecken');
  // „Hören“ allein trägt keine Bewertung — dann bleibt Aufdecken der Träger.
  if (!kandidaten.length) kandidaten.push('aufdecken');
  return kandidaten[textHash(k.id + ':' + (Number(k.reps) || 0)) % kandidaten.length];
}

/* --- Sprachausgabe ------------------------------------------------------- */

const sprachAusgabeDa = () => typeof window !== 'undefined' && 'speechSynthesis' in window;
function sprechen(text, sprache) {
  const t = String(text ?? '').trim();
  if (!sprachAusgabeDa() || !t) return false;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.slice(0, 500));
    u.lang = sprache || 'de-DE';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { console.warn('[Sprachausgabe]', e); return false; }
}
function sprechenStoppen() {
  try { if (sprachAusgabeDa()) window.speechSynthesis.cancel(); } catch (_) {}
}

/* ---------- 7c. Prüfung, Problemkarten, Karten-Check (Stufe 4) ---------- */

/* --- Prüfungstermin je Kasten (KONZEPT §6.6) ---------------------------- */

/* Auch auf Gültigkeit prüfen, nicht nur auf die Form: „2026-02-30“ rollt in
   JavaScript stillschweigend auf den 2. März weiter, und aus einer von Hand
   bearbeiteten Sicherung kommt so etwas durchaus. */
const deckPruefung = deckId => {
  const p = deckVon(deckId)?.pruefungsdatum;
  if (typeof p !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(p)) return null;
  const [y, m, t] = p.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1, t));
  return (d.getUTCFullYear() === y && d.getUTCMonth() === m - 1 && d.getUTCDate() === t) ? p : null;
};

/** Stauchen: Liegt der errechnete Termin hinter der Prüfung, wäre die Karte
 *  bis dahin kein einziges Mal mehr dran. Sie wird deshalb in die letzten
 *  Tage davor vorgezogen — verteilt über ein Fenster statt alles auf den
 *  Prüfungstag, sonst entstünde am Vortag ein unbearbeitbarer Berg. */
function terminStauchen(iso, deckId, kartenId) {
  const p = deckPruefung(deckId);
  if (!p || p < heute()) return iso;      // kein Termin oder schon vorbei
  if (iso <= p) return iso;               // passt ohnehin davor
  const rest = tageDiff(p, heute());
  // In den letzten beiden Tagen nicht mehr eingreifen: Die Karte war ja
  // gerade dran, ein weiterer Termin davor bringt nichts. Früher wurde hier
  // auf „morgen“ gesetzt — dadurch türmten sich am Prüfungstag und am Tag
  // danach sämtliche Karten des Kastens auf.
  if (rest <= 1) return iso;
  const fenster = Math.min(rest, 7);
  return plusTage(p, -(textHash(String(kartenId)) % fenster));
}

/** Ein Termin allein bewirkt nichts: Karten, deren Fälligkeit schon hinter
 *  der Prüfung liegt, kommen bis dahin nie dran und werden folglich auch nie
 *  neu terminiert. Beim Setzen des Termins müssen sie deshalb einmalig
 *  vorgezogen werden — sonst bleibt genau der reife Teil des Bestands, um
 *  den es vor einer Prüfung geht, unangetastet liegen. */
function pruefungTermineVorziehen(deckId) {
  const p = deckPruefung(deckId);
  if (!p || p < heute()) return 0;
  const ops = [];
  kartenVon(deckId).forEach(k => {
    if (k.suspendiert) return;
    const alt = k.due || heute();
    if (alt <= p) return;
    const neu = terminStauchen(alt, deckId, k.id);
    if (neu === alt) return;
    k.due = neu;                                   // lokal sofort
    ops.push(['merge', k.id, { due: neu }]);
  });
  variantenOpsSchreiben(ops, 'Termine vorziehen');
  return ops.length;
}

const deckPruefungAktiv = deckId => {
  const p = deckPruefung(deckId);
  return (p && p >= heute()) ? p : null;
};

/** Gemessene Sekunden je Abfrage aus dem eigenen Bestand. Damit rechnet die
 *  Machbarkeitsschätzung statt mit einer Pauschale — die App weiß ja, wie
 *  schnell dieser Nutzer tatsächlich ist. */
function gemesseneSekundenJeKarte() {
  let zeit = 0, n = 0;
  S.cards.forEach(k => {
    const z = Number(k.zeitGesamt) || 0, r = Number(k.zeitReps) || 0;
    if (z > 0 && r > 0) { zeit += z; n += r; }
  });
  return n >= 20 ? zeit / n : null;      // erst ab 20 Messungen aussagekräftig
}

/** Wie viele Abfragen fallen bis zum Termin voraussichtlich an? Eine Karte
 *  kommt in dieser Zeit nicht einmal dran, sondern so oft, wie ihr Intervall
 *  in die verbleibenden Tage passt. Genau das war der Fehler der ersten
 *  Fassung: Sie zählte jede Karte einmal und versprach damit ein Vielfaches
 *  zu wenig Aufwand. */
function erwarteteAbfragen(karten, tage) {
  if (tage <= 0) return karten.length;
  const retention = Math.min(0.95, Math.max(0.8, Number(S.einstellungen.retention) || 0.88));
  const iv = S.einstellungen.intervalle;
  let summe = 0;
  karten.forEach(k => {
    // Neue Karten: Einführung plus die kurzen Folgewiederholungen.
    if (istNeu(k)) { summe += Math.min(tage, 3); return; }
    const s = Number(k.stability) || 0;
    const intervall = S.einstellungen.klassikModus
      ? Math.max(1, iv[Math.min(11, Math.max(0, fachVon(k) - 1))] || 1)
      : Math.max(1, fsrsIntervallTage(s || 1, retention, FSRS_STANDARD_GEWICHTE));
    summe += Math.max(1, Math.round(tage / intervall));
  });
  return Math.round(summe);
}

/** Wie steht es vor der Prüfung? Liefert die nötige Tagesmenge und ein
 *  Urteil dazu, gemessen an der tatsächlichen eigenen Geschwindigkeit. */
function pruefungsLage(deckId) {
  const datum = deckPruefung(deckId);
  if (!datum) return null;
  const tage = tageDiff(datum, heute());
  const alle = kartenVon(deckId);
  const karten = alle.filter(k => !k.suspendiert);
  const ruhend = alle.length - karten.length;
  const dran = karten.filter(k => istNeu(k) || (k.due || heute()) <= datum);
  const offen = dran.length;
  const neue = dran.filter(istNeu).length;

  // Je Kartenfamilie kommt pro Sitzung nur eine Abfrage dran (Geschwister
  // werden zurückgestellt, Stufe 3).
  const jeFamilie = new Map();
  dran.forEach(k => {
    const f = k.quelleId || k.id;
    jeFamilie.set(f, (jeFamilie.get(f) || 0) + 1);
  });
  const familien = jeFamilie.size;
  const maxJeFamilie = Math.max(0, ...jeFamilie.values());

  const abfragen = erwarteteAbfragen(dran, tage);
  const proTag = tage > 0 ? Math.ceil(abfragen / tage) : abfragen;

  // Tagesziel in Karten. Liegen eigene Messungen vor, wird damit gerechnet —
  // sonst mit 15 Sekunden je Karte als Näherung.
  const sekJeKarte = gemesseneSekundenJeKarte() || 15;
  const ziel = S.einstellungen.zielEinheit === 'karten'
    ? zahl(S.einstellungen.zielKarten, 1, 2000, 30)
    : Math.max(5, Math.round(zahl(S.einstellungen.zielMinuten, 1, 600, 15) * 60 / sekJeKarte));
  const minutenNoetig = Math.round(proTag * sekJeKarte / 60);

  // Harte Schranken, unabhängig vom Tempo:
  //  – mehr Lücken/Richtungen an einer Karte als Tage übrig,
  //  – mehr Abfragen je Tag als es überhaupt Kartenfamilien gibt,
  //  – mehr neue Karten als der Tagesdeckel bis dahin durchlässt.
  const deckel = zahl(S.einstellungen.neuProTag, 5, 50, 20);
  const unmoeglich = maxJeFamilie > Math.max(1, tage)
    || (tage > 0 && proTag > familien)
    || neue > deckel * Math.max(1, tage + 1);

  const urteil = tage < 0 ? 'vorbei'
    : offen === 0 ? 'gut'
    : unmoeglich ? 'kritisch'
    : proTag <= ziel ? 'gut'
    : proTag <= ziel * 1.5 ? 'eng' : 'kritisch';
  return { datum, tage, offen, neue, ruhend, proTag, abfragen, ziel, minutenNoetig,
           urteil, familien, maxJeFamilie, sekJeKarte };
}
const PRUEFUNG_URTEIL = {
  gut:      ['machbar', 'var(--bewertung-3)'],
  eng:      ['eng', 'var(--faellig)'],
  kritisch: ['kaum zu schaffen', 'var(--bewertung-1)'],
  vorbei:   ['Termin vorbei', 'var(--txt3)']
};
/** Kästen mit anstehender Prüfung, die nächste zuerst. */
function anstehendePruefungen(nurDecks) {
  return S.decks
    .filter(d => (!nurDecks || nurDecks.has(d.id)) && deckPruefungAktiv(d.id))
    .map(d => ({ deck: d, lage: pruefungsLage(d.id) }))
    .sort((a, b) => a.lage.datum.localeCompare(b.lage.datum));
}
/** Termine, die verstrichen sind und noch am Kasten hängen. Ohne Hinweis
 *  bliebe der Kasten dauerhaft auf Prüfungsbetrieb getrimmt. */
function abgelaufenePruefungen(nurDecks) {
  return S.decks
    .filter(d => (!nurDecks || nurDecks.has(d.id)) && deckPruefung(d.id) && deckPruefung(d.id) < heute())
    .map(d => ({ deck: d, datum: deckPruefung(d.id) }));
}

/* --- Problemkarten (KONZEPT §6.3) --------------------------------------- */

const leechGrenze = () => zahl(S.einstellungen.leechGrenze, 3, 20, 7);
/** Aussetzer seit dem letzten Wiederaufnehmen. Ohne diesen Bezugspunkt würde
 *  eine wieder aufgenommene Karte beim allerersten Fehler sofort erneut
 *  ausgesetzt — sie liegt ja weiterhin über der Grenze. */
const leechZaehler = k => Math.max(0, (Number(k.lapses) || 0) - (Number(k.leechBasis) || 0));
const istProblemkarte = k => !!k.leech || leechZaehler(k) >= leechGrenze();
const problemkarten = () => S.cards.filter(istProblemkarte);

/* --- Karten-Check beim Anlegen (KONZEPT §6.4) --------------------------- */

/* Eine gewöhnliche deutsche Definition hat gut 20 Wörter. Bei 15 hätte der
   Hinweis bei fast jeder Prüfungskarte angeschlagen und wäre zur reinen
   Belästigung geworden. */
const WORTGRENZE = 28;

/** Zerlegt eine Antwort in Aufzählungspunkte — aber nur, wenn sie wirklich
 *  wie eine Aufzählung aussieht. Ein Komma allein reicht nicht: „Berlin, die
 *  Hauptstadt Deutschlands“ ist keine Liste. Deshalb greift die
 *  Komma-Trennung erst ab drei kurzen Gliedern. */
const LISTEN_MARKE = /^\s*(?:[-–—•*·]|\d{1,2}[.)])\s+/;
function aufzaehlungTeilen(text) {
  const leer = { stamm: '', teile: [] };
  const s = String(text ?? '').trim();
  if (!s) return leer;
  const abstreifen = z => z.replace(LISTEN_MARKE, '').trim();
  const zeilen = s.split(/\r?\n+/).map(z => z.trim()).filter(Boolean);

  if (zeilen.length >= 2) {
    // Eine Einleitungszeile mit Doppelpunkt gehört in den Kartenkopf und
    // nicht in eine eigene Lücke — sonst würde „Die drei Gewalten sind:“
    // zu einer eigenständig terminierten Abfrage.
    let stamm = '';
    let roh = zeilen;
    if (zeilen.length >= 3 && /:$/.test(zeilen[0]) && !LISTEN_MARKE.test(zeilen[0])) {
      stamm = zeilen[0]; roh = zeilen.slice(1);
    }
    const mitMarke = roh.length >= 2 && roh.every(z => LISTEN_MARKE.test(z));
    const teile = roh.map(abstreifen).filter(Boolean);
    // Ohne Aufzählungszeichen nur dann als Liste werten, wenn die Zeilen
    // wirklich kurz sind. Zwei Sätze auf zwei Zeilen sind keine Liste, und
    // daraus zwei „Satz wörtlich wiedergeben“-Lücken zu machen wäre schlimmer
    // als die Ausgangskarte.
    const kurz = teile.length >= 2 && teile.every(t => t.split(/\s+/).length <= 6);
    if (teile.length >= 2 && (mitMarke || kurz)) return { stamm, teile };
    return leer;
  }

  // Einzeilig: „Die drei Gewalten: Legislative, Exekutive, Judikative“
  let stamm = '', rest = s;
  const dp = s.indexOf(':');
  if (dp > 0 && dp < 60) { stamm = s.slice(0, dp + 1).trim(); rest = s.slice(dp + 1); }
  const kandidaten = rest.split(/\s*;\s*|\s*,\s*(?=\S)/).map(t => abstreifen(t)).filter(Boolean);
  if (kandidaten.length >= 3 && kandidaten.every(t => t.split(/\s+/).length <= 4))
    return { stamm, teile: kandidaten };
  return leer;
}

/** Prüft eine Karte auf die beiden Muster, die erfahrungsgemäß viel Zeit
 *  kosten und schlecht behalten werden: sehr lange Antworten und getarnte
 *  Aufzählungen. Nur ein Hinweis, nie eine Sperre (KONZEPT §6.4). */
function kartenCheck(antwort) {
  const woerter = String(antwort ?? '').trim().split(/\s+/).filter(Boolean).length;
  const { stamm, teile } = aufzaehlungTeilen(antwort);
  const gruende = [];
  if (woerter > WORTGRENZE)
    gruende.push(`Die Antwort hat <strong>${woerter} Wörter</strong>. Lange Antworten werden
      schlechter behalten, weil beim Abfragen unklar bleibt, wie viel davon genau gefragt ist.`);
  if (teile.length >= 2)
    gruende.push(`Die Antwort sieht nach einer Aufzählung mit <strong>${teile.length} Punkten</strong>
      aus. Aufzählungen lernt man einzeln deutlich schneller als am Stück.`);
  return { woerter, liste: teile, stamm, gruende };
}

/* --- Zeitauswertung (KONZEPT §6.7) -------------------------------------- */

/** Durchschnittliche Sekunden je gemessener Abfrage. null, wenn noch nichts
 *  gemessen wurde. Geteilt wird durch zeitReps, nicht durch reps: Karten aus
 *  Stufe 1–3 haben Wiederholungen aus einer Zeit ohne Zeitmessung, und die
 *  würden den Schnitt dauerhaft gegen null drücken. */
function schnittSekunden(k) {
  const zeit = Number(k.zeitGesamt) || 0;
  const n = Number(k.zeitReps) || 0;
  return (zeit > 0 && n > 0) ? zeit / n : null;
}
/** Die Karten, die am meisten Zeit kosten — erst ab zwei gemessenen
 *  Abfragen, damit ein einzelner Ausreißer (Telefonat mitten in der Sitzung)
 *  niemanden in die Liste bringt. */
function zeitfresser(karten, anzahl = 8) {
  return karten
    .map(k => ({ k, schnitt: schnittSekunden(k) }))
    .filter(x => x.schnitt !== null && (Number(x.k.zeitReps) || 0) >= 2)
    .sort((a, b) => b.schnitt - a.schnitt)
    .slice(0, anzahl);
}

/* ---------- 8. Navigation ---------------------------------------------- */

const SEITEN = ['lernen', 'kaesten', 'karten', 'statistik', 'einstellungen'];

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-seite]');
  if (b) seiteZeigen(b.dataset.seite);
});

function seiteZeigen(name) {
  if (!SEITEN.includes(name)) return;
  // Ein Klick auf die ohnehin offene Seite darf eine laufende Sitzung nicht
  // neu zeichnen — sonst wäre eine halb getippte Antwort weg.
  if (name === S.seite && sitzung?.aktiv) return;
  if (name !== 'lernen') { sprechenStoppen(); sitzung = null; letzteSitzung = null; }
  S.seite = name;
  SEITEN.forEach(s => { $('#seite-' + s).hidden = (s !== name); });
  $$('#nav button').forEach(b => b.classList.toggle('aktiv', b.dataset.seite === name));
  window.scrollTo({ top: 0 });
  seiteMalen(name);
}

/* Wird nach jeder Firestore-Aktualisierung aufgerufen. Eine laufende Sitzung
   wird dabei bewusst nicht neu gezeichnet — sonst springt die Karte oder der
   Abschlussbildschirm verschwindet, sobald der eigene Schreibvorgang
   zurückkommt. */
function alleSeitenMalen() {
  if (sitzung?.aktiv || letzteSitzung) return;
  // Nicht mitten in eine Eingabe hineinzeichnen — sonst verliert das Suchfeld
  // den Fokus, sobald eine Aktualisierung von Firestore eintrifft.
  const f = document.activeElement;
  if (f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA') && f.closest('main')) return;
  seiteMalen(S.seite);
}

function seiteMalen(name) {
  if (!S.uid) return;
  ({
    lernen: malLernen, kaesten: malKaesten, karten: malKarten,
    statistik: malStatistik, einstellungen: malEinstellungen
  })[name]?.();
}

    ${anstehendePruefungen(lernAuswahl).slice(0, 3).map(({ deck, lage }) => {

      return `<div class="hinweis" style="border-left-color:${farbe};margin-bottom:10px">

        : alleN ? `Überfällige lernen — ${alleN} ${alleN === 1 ? 'Karte' : 'Karten'}`
        : 'Nichts fällig'}
    </button>

    ${!dran && !alleN ? `<p class="mini mt" style="text-align:center">
