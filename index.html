<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>HAN CROCO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231B9AAA'/><rect x='22' y='30' width='56' height='40' rx='6' fill='white'/><rect x='30' y='22' width='56' height='40' rx='6' fill='white' opacity='.55'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">
<style>
/* ===== Design-Tokens =====================================================
   KONZEPT §8: türkiser Akzent, warmes Orange für Fälligkeiten, eigene
   Bewertungsfarben 1–4. Alte Namen (--red/--orange/--green/--blue) bleiben
   als Aliase erhalten, damit nicht jede Fundstelle einzeln angefasst werden
   musste — sie zeigen jetzt auf die neuen Tokens. Einzige Ausnahme: die
   Bewertungsknöpfe (.bew1–4) und die Auswertungsfarben in malAbschluss()
   referenzieren --bewertung-1..4 direkt, weil --blue (jetzt Akzent-Türkis)
   und --bewertung-4 (Blau) zwei bewusst verschiedene Farben sind.
   ======================================================================== */
:root{
  --bg:#fff; --bg2:#f5f4f0; --bg3:#eeecea;
  --txt:#1a1a1a; --txt2:#555; --txt3:#888;
  --border:rgba(0,0,0,.12); --border2:rgba(0,0,0,.22);

  --akzent:#1B9AAA; --akzent-bg:#e3f3f4;
  --faellig:#F2994A; --faellig-bg:#fdeee0;
  --bewertung-1:#E2584D; --bewertung-1-bg:#fcebea;
  --bewertung-2:#F2994A; --bewertung-2-bg:#fdeee0;
  --bewertung-3:#27AE60; --bewertung-3-bg:#e3f6ec;
  --bewertung-4:#2D7FF9; --bewertung-4-bg:#e5effe;

  /* Alt-Namen — bewusst als Alias, siehe Kommentar oben */
  --red:var(--bewertung-1);   --red-bg:var(--bewertung-1-bg);
  --orange:var(--faellig);    --orange-bg:var(--faellig-bg);
  --green:var(--bewertung-3); --green-bg:var(--bewertung-3-bg);
  --blue:var(--akzent);       --blue-bg:var(--akzent-bg);

  --radius:16px; --radius2:var(--radius);
  --schatten:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --font:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
html[data-theme="dark"]{
  --bg:#1e1e1e; --bg2:#262626; --bg3:#323232;
  --txt:#ececec; --txt2:#b3b3b3; --txt3:#8a8a8a;
  --border:rgba(255,255,255,.14); --border2:rgba(255,255,255,.28);

  --akzent:#3dbbcb; --akzent-bg:#16333a;
  --faellig:#f5ac69; --faellig-bg:#3a2e1b;
  --bewertung-1:#ea7267; --bewertung-1-bg:#3b2321;
  --bewertung-2:#f5ac69; --bewertung-2-bg:#3a2e1b;
  --bewertung-3:#4fcb89; --bewertung-3-bg:#173828;
  --bewertung-4:#5b9bfb; --bewertung-4-bg:#1d2c3c;

  --schatten:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--txt);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0 0 12px;line-height:1.25}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
p{margin:0 0 10px}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px;flex:1;min-width:0}
.muted{color:var(--txt2)}
.mini{font-size:13px;color:var(--txt3)}
.mt{margin-top:18px}.mt2{margin-top:28px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--border);margin:22px 0}

/* ===== Bedienelemente =================================================== */
button{font:inherit;cursor:pointer}
.btn{
  border:1px solid var(--border2);background:var(--bg);color:var(--txt);
  border-radius:var(--radius);padding:9px 15px;font-size:14px;font-weight:500;
  transition:background .12s,transform .06s,border-color .12s;
}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.btn.primary:hover{opacity:.87;background:var(--txt)}
.btn.klein{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.gefahr{color:var(--red);border-color:var(--red)}
.btn.gefahr:hover{background:var(--red-bg)}
.btn.breit{width:100%;justify-content:center}
.btn.gross{padding:13px 22px;font-size:16px}
input,textarea,select{
  font:inherit;font-size:14px;background:var(--bg);color:var(--txt);
  border:1px solid var(--border2);border-radius:var(--radius);padding:9px 11px;width:100%;
}
input[type=checkbox],input[type=radio],input[type=range]{width:auto;accent-color:var(--akzent)}
input[type=range]{width:100%;padding:0}
textarea{resize:vertical;min-height:76px;line-height:1.45}
label.feld{display:block;margin-bottom:12px}
label.feld > span{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:4px}
.karo{display:flex;gap:8px;align-items:center;padding:7px 0;cursor:pointer}
.karo input{flex:none}

/* ===== Navigation: Seitenleiste (Desktop) / Bottom-Bar (Mobil) ========== */
#app{display:flex;min-height:100vh}
#topbar-mobil{
  display:none;position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);padding:12px 16px;
}
#seitenleiste{
  position:sticky;top:0;align-self:flex-start;height:100vh;
  width:220px;flex:none;display:flex;flex-direction:column;gap:4px;
  padding:20px 14px;border-right:1px solid var(--border);background:var(--bg);
}
.sl-marke{font-weight:800;font-size:17px;padding:0 10px 14px;white-space:nowrap;letter-spacing:.3px}
.sl-version{font-weight:600;font-size:11px;color:var(--txt3);margin-left:6px;letter-spacing:0}
.marke{font-weight:700;font-size:15px;white-space:nowrap}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{
  display:flex;align-items:center;gap:10px;
  border:0;background:transparent;color:var(--txt2);padding:10px 12px;
  border-radius:var(--radius);font-size:14.5px;font-weight:500;text-align:left;width:100%;
}
nav button:hover{background:var(--bg2);color:var(--txt)}
nav button.aktiv{background:var(--akzent-bg);color:var(--akzent);font-weight:700}
.nav-ico{font-size:16px;flex:none;line-height:1}
.statuszeile{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--txt3);white-space:nowrap;padding:10px 12px}
.punkt{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex:none}
.punkt.ok{background:var(--green)}
.punkt.warte{background:var(--orange)}
.punkt.aus{background:var(--txt3)}
.punkt.fehler{background:var(--red)}

/* ===== Karten / Listen ================================================== */
.box{
  border:1px solid var(--border);border-radius:var(--radius2);
  padding:16px 18px;background:var(--bg);margin-bottom:12px;
}
.box.flach{background:var(--bg2);border-color:transparent}
.liste-item{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:8px;background:var(--bg);
}
.liste-item .haupt{flex:1;min-width:0}
.liste-item .frage{font-weight:600;word-break:break-word}
.liste-item .antwort{color:var(--txt2);font-size:13.5px;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.liste-item .werkzeuge{display:flex;gap:5px;flex:none}
.badge{
  display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;
  border-radius:99px;background:var(--bg3);color:var(--txt2);white-space:nowrap;
}
.badge.faellig{background:var(--orange-bg);color:var(--orange)}
.badge.neu{background:var(--blue-bg);color:var(--blue)}
.badge.ruht{background:var(--bg3);color:var(--txt3)}
.punkt-farbe{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px}
.leer{text-align:center;color:var(--txt3);padding:36px 16px;font-size:14px}

/* ===== Startbildschirm (Dashboard) ======================================= */
.dash-kopf{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.dash-ring{position:relative;width:112px;height:112px;flex:none}
.dash-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.dash-ring circle{fill:none;stroke-width:10}
.dash-ring .spur{stroke:var(--bg3)}
.dash-ring .fuell{stroke:var(--akzent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.dash-ring-mitte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dash-ring-mitte b{font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.dash-ring-mitte span{font-size:10.5px;color:var(--txt3)}
.dash-kennzahlen{display:flex;gap:22px;flex-wrap:wrap}
.dash-kennzahl b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.dash-kennzahl span{font-size:12px;color:var(--txt2)}

.dash-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.dash-deck{
  border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg);
  cursor:pointer;transition:border-color .12s,background .12s;text-align:left;font:inherit;color:inherit;
}
.dash-deck:hover{background:var(--bg2)}
.dash-deck.gewaehlt{border-color:var(--akzent);background:var(--akzent-bg)}
.dash-deck .dd-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dash-deck .dd-faellig{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--faellig)}
.dash-deck .dd-rest{font-size:11.5px;color:var(--txt3);margin-top:2px}

.dash-fachleiste{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--bg3);margin:10px 0 4px}
.dash-fachleiste > div{height:100%}
.dash-fach-legende{display:flex;justify-content:space-between;font-size:10.5px;color:var(--txt3)}

/* ===== Lernen =========================================================== */
.flip-buehne{perspective:1400px;margin:14px 0}
.flip-karte{
  position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.15,.2,1);
  min-height:230px;
}
.flip-karte.gedreht{transform:rotateY(180deg)}
/* Linksbündig, nicht mittig: Der Karteikasten stand auf `center`, die
   Lernbox auf `start` — dieselbe Karte sah je nach Reiter anders aus, und
   eine umbrechende Antwort begann gemessen 23 px vom linken Rand entfernt
   in einer Treppe. Beide Oberflächen laufen jetzt linksbündig.
   Senkrecht wird weiter zentriert: Die Seite hat 230 px Mindesthöhe, eine
   kurze Antwort soll nicht oben kleben. */
.flip-seite{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--border2);border-radius:var(--radius2);background:var(--bg);
  padding:26px 22px;display:flex;flex-direction:column;justify-content:center;
  align-items:stretch;text-align:left;overflow:auto;box-shadow:var(--schatten);
}
/* Ohne align-self würde die Merker-Pille als Flexkind auf volle Breite
   gezogen und wäre keine Pille mehr. */
.flip-seite > .flip-mark{align-self:flex-start}
.flip-seite.hinten{transform:rotateY(180deg);background:var(--bg2)}
.flip-text{font-size:20px;font-weight:600;white-space:pre-wrap;word-break:break-word;max-width:100%}
.flip-seite.hinten .flip-text{font-weight:500}
.flip-notiz{margin-top:14px;font-size:13.5px;color:var(--txt2);white-space:pre-wrap;
  border-top:1px solid var(--border);padding-top:10px;max-width:100%}
.flip-kopf{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 14px;font-size:11.5px;color:var(--txt3);font-weight:600}
.fortschritt{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.fortschritt > div{height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
.bewertung{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.bew{
  border:1px solid;border-radius:var(--radius);padding:11px 6px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .06s,background .12s;
}
.bew:active{transform:scale(.96)}
.bew b{font-size:17px;line-height:1.1}
.bew span{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.bew small{font-size:10.5px;color:var(--txt3);font-weight:500}
.bew.empfohlen{outline:2px solid currentColor;outline-offset:2px}
.bew1{color:var(--bewertung-1);border-color:var(--bewertung-1)} .bew1:hover{background:var(--bewertung-1-bg)}
.bew2{color:var(--bewertung-2);border-color:var(--bewertung-2)} .bew2:hover{background:var(--bewertung-2-bg)}
.bew3{color:var(--bewertung-3);border-color:var(--bewertung-3)} .bew3:hover{background:var(--bewertung-3-bg)}
.bew4{color:var(--bewertung-4);border-color:var(--bewertung-4)} .bew4:hover{background:var(--bewertung-4-bg)}
.tastenhilfe{font-size:12px;color:var(--txt3);text-align:center;margin-top:12px}
kbd{
  font-family:var(--font);font-size:11px;border:1px solid var(--border2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--txt2);background:var(--bg2);
}

/* ===== Lernmodi (Stufe 3) =============================================== */
.cloze-luecke{
  display:inline-block;min-width:64px;padding:0 8px;margin:0 2px;border-radius:6px;
  background:var(--bg3);border-bottom:2px solid var(--akzent);color:var(--txt3);
}
.cloze-loesung{
  display:inline-block;padding:0 6px;margin:0 2px;border-radius:6px;
  background:var(--akzent-bg);color:var(--akzent);font-weight:700;
}
.cloze-hinweis{font-size:.82em;color:var(--txt3);font-weight:400}

.tipp-zeile{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.tipp-zeile input{flex:1;font-size:16px;padding:12px 14px}
.urteil{
  display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius);
  padding:11px 14px;margin-bottom:12px;font-size:14px;border:1px solid transparent;
}
.urteil b{display:block;margin-bottom:2px}
.urteil.richtig{background:var(--bewertung-3-bg);color:var(--bewertung-3);border-color:var(--bewertung-3)}
.urteil.fast{background:var(--bewertung-2-bg);color:var(--bewertung-2);border-color:var(--bewertung-2)}
.urteil.falsch{background:var(--bewertung-1-bg);color:var(--bewertung-1);border-color:var(--bewertung-1)}
.urteil .ihre{color:var(--txt2);font-size:13px;word-break:break-word}
.urteil .ihre s{opacity:.75}

.mc-liste{display:grid;gap:8px;margin-bottom:12px}
.mc-option{
  display:flex;gap:10px;align-items:center;text-align:left;font:inherit;color:inherit;
  border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);
  padding:13px 15px;cursor:pointer;transition:background .12s,border-color .12s;
}
.mc-option:hover:not(:disabled){background:var(--bg2);border-color:var(--akzent)}
.mc-option:disabled{cursor:default}
.mc-option .mc-buchstabe{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg3);color:var(--txt2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.mc-option.richtig{border-color:var(--bewertung-3);background:var(--bewertung-3-bg)}
.mc-option.richtig .mc-buchstabe{background:var(--bewertung-3);color:#fff}
.mc-option.falsch{border-color:var(--bewertung-1);background:var(--bewertung-1-bg)}
.mc-option.falsch .mc-buchstabe{background:var(--bewertung-1);color:#fff}

.sprech-knopf{
  flex:none;border:1px solid var(--border2);background:var(--bg);border-radius:50%;
  width:38px;height:38px;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.sprech-knopf:hover{background:var(--bg2)}
.flip-seite .sprech-knopf{position:absolute;right:12px;bottom:12px;width:34px;height:34px;font-size:15px}
.nur-hoeren{font-size:15px;color:var(--txt3);text-align:center}
.nur-hoeren .gross-ico{font-size:40px;display:block;margin-bottom:8px}

.modus-chips{display:flex;flex-wrap:wrap;gap:6px}
.modus-chip{
  display:flex;gap:7px;align-items:center;border:1px solid var(--border2);
  border-radius:99px;padding:7px 13px;cursor:pointer;font-size:13.5px;user-select:none;
}
.modus-chip input{flex:none;margin:0}
.modus-chip.an{border-color:var(--akzent);background:var(--akzent-bg);color:var(--akzent);font-weight:700}

/* ===== Abzeichen ======================================================== */
.abzeichen{
  display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ab);
  background:color-mix(in srgb, var(--ab) 12%, transparent);
  color:var(--ab);border-radius:99px;padding:5px 12px 5px 8px;font-size:13px;font-weight:700;
}
.abzeichen .ab-icon{font-size:16px;line-height:1}
.abzeichen.klein{padding:3px 5px;border-width:1px}
.abzeichen.klein .ab-icon{font-size:15px}
.abzeichen.offen{border-color:var(--border2);background:transparent;color:var(--txt3);font-weight:500}
.abzeichen.offen .ab-icon{filter:grayscale(1);opacity:.5}
.abzeichen-reihe{display:flex;flex-wrap:wrap;gap:8px}
.abzeichen .ab-text{display:flex;flex-direction:column;line-height:1.25}
/* Der Fortschritt stand nur im title-Attribut — auf dem Handy also nirgends. */
.ab-rest{font-size:10.5px;opacity:.75;font-weight:500}
.mini.warn,.warn{color:var(--bewertung-1)}
nav button.nav-laeuft{position:relative}
nav button.nav-laeuft::after{
  content:'';position:absolute;top:5px;right:9px;width:7px;height:7px;
  border-radius:50%;background:var(--faellig);
}
.ab-fortschritt{font-size:11.5px;color:var(--txt3);margin-top:4px}
.dash-deckwahl>summary{cursor:pointer;padding:6px 0;color:var(--txt2)}
.ab-zeile{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.ab-zeile:last-child{border-bottom:0}
.ab-zeile .ab-haupt{flex:1;min-width:0}
.dash-gruss{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.25}
.dash-unter{color:var(--txt2);font-size:14px;margin:0 0 16px}

/* ===== CSV-Vorschau ===================================================== */
.csv-vorschau{overflow-x:auto;border:1px solid var(--border);border-radius:10px;max-height:190px}
.csv-vorschau table{font-size:12.5px;margin:0}
.csv-vorschau th,.csv-vorschau td{white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;padding:5px 8px}
.csv-vorschau th{position:sticky;top:0;background:var(--bg2);font-size:11px}
.csv-vorschau .rolle{color:var(--akzent)}
.csv-vorschau th.rolle{font-weight:700}

/* ===== Karteneditor (Stufe 5) =========================================== */
.ed-leiste{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:3px;padding:6px;
  margin:0 0 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius)}
.ed-leiste .tr{width:1px;background:var(--border);margin:2px 3px;align-self:stretch}
.ed-knopf{min-width:30px;height:29px;padding:0 7px;border:1px solid transparent;border-radius:7px;
  background:none;color:var(--txt2);font:inherit;font-size:13.5px;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center}
.ed-knopf:hover{background:var(--bg3);color:var(--txt)}
.ed-knopf:disabled{opacity:.35;cursor:default;background:none}
.ed-knopf.an{background:var(--akzent-bg);color:var(--akzent);border-color:var(--akzent)}
.ed-knopf b,.ed-knopf i,.ed-knopf u,.ed-knopf s{font-size:14px}
.ed-farbe{width:15px;height:15px;border-radius:4px;border:1px solid var(--border2);display:inline-block}
.ed-kopf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 3px}
.ed-kopf span{font-size:12.5px;font-weight:600;color:var(--txt2)}
.ed-kopf .ed-knopf{height:22px;min-width:24px;font-size:11px;font-family:ui-monospace,monospace}
.ed-feld{min-height:62px;max-height:210px;overflow-y:auto;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg);color:var(--txt);font:inherit;line-height:1.5;
  white-space:pre-wrap;word-break:break-word}
.ed-feld:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 3px var(--akzent-bg)}
.ed-feld:empty::before{content:attr(data-leer);color:var(--txt3);pointer-events:none}
.ed-feld ul,.ed-feld ol{margin:4px 0;padding-left:22px}
.ed-feld hr{border:0;border-top:1px solid var(--border2);margin:8px 0}
.ed-feld.quelle{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  white-space:pre-wrap;background:var(--bg2)}
.ed-block{margin:0 0 12px}
.ed-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg);min-height:40px}
.ed-tags input{border:none;background:none;flex:1;min-width:110px;padding:3px 4px;color:var(--txt);font:inherit}
.ed-tags input:focus{outline:none}
.ed-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 4px 3px 9px;border-radius:20px;
  background:var(--akzent-bg);color:var(--akzent);font-size:12.5px;font-weight:600}
.ed-tag button{border:none;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;
  padding:0 3px;opacity:.65}
.ed-tag button:hover{opacity:1}
.ed-vorschau{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ed-vorschau .vs-seite{padding:14px 16px}
.ed-vorschau .vs-seite+.vs-seite{border-top:1px solid var(--border)}
.ed-vorschau .vs-marke{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);
  font-weight:700;margin-bottom:7px}
.ed-vorschau .vs-text{font-size:18px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.ed-vorschau .vs-extra{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border2);
  font-size:14px;color:var(--txt2);white-space:pre-wrap}
.ed-vorschau .vs-mark{display:inline-block;margin-bottom:8px;padding:2px 9px;border-radius:20px;
  background:var(--bewertung-2-bg);color:var(--bewertung-2);font-size:12px;font-weight:700}
.ed-umschalt{display:flex;gap:4px;margin:0 0 10px;padding:3px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--radius)}
.ed-umschalt button{flex:1;padding:6px 10px;border:none;border-radius:8px;background:none;color:var(--txt2);
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.ed-umschalt button.an{background:var(--bg);color:var(--txt);box-shadow:var(--schatten)}
.ed-mehr>summary{cursor:pointer;font-size:12.5px;color:var(--txt2);padding:5px 0;user-select:none}
.ed-mehr>summary:hover{color:var(--txt)}
.ed-ipa{font-family:'Doulos SIL','Charis SIL','Gentium Plus',serif}
.flip-mark{display:inline-block;margin-bottom:8px;padding:2px 9px;border-radius:20px;
  background:var(--bewertung-2-bg);color:var(--bewertung-2);font-size:12px;font-weight:700}
.flip-extra{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border2);
  font-size:14.5px;color:var(--txt2);line-height:1.5;white-space:pre-wrap;text-align:left}
.flip-text b,.flip-text strong{font-weight:700}
/* display:inline-block war der Trick, um eine Liste in einer MITTIG
   gesetzten Karte trotzdem links auszurichten. Seit die Karte linksbündig
   läuft, ist ein Block das Richtige — sonst bliebe die Liste so schmal wie
   ihr längster Eintrag und ein Umbruch säße falsch. */
.flip-text ul,.flip-text ol{margin:6px 0;padding-left:24px;display:block}
.flip-text hr{border:0;border-top:1px solid var(--border2);margin:10px 0}

/* ===== Lernbox (Stufe 6) ================================================ */
/* Kurze Sperre nach dem Aufdecken: Der Nachtipp („hat es reagiert?") landete
   gemessen nach 450 ms auf „Konnte ich nicht" und setzte einen erarbeiteten
   Stand von 1 auf 0. Reines CSS, kein Zeitgeber — und weil die Zeile bei
   jedem Neuzeichnen neu entsteht, setzt sich die Sperre von selbst zurück. */
.ueb-sperre{pointer-events:none;animation:ueb-frei 1ms 350ms forwards}
@keyframes ueb-frei{to{pointer-events:auto}}
@media (prefers-reduced-motion:reduce){
  .ueb-sperre{animation-duration:1ms !important;animation-delay:350ms !important}
}
.nav-zahl{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  padding:0 4px;margin-left:5px;border-radius:9px;background:var(--akzent);color:#fff;
  font-size:10.5px;font-weight:700;line-height:1}
/* margin-bottom ist kein Schönheitsmaß: Ohne sie lag die Knopfzeile
   gemessen mit 0 px Abstand direkt an der Karte — „Antwort zeigen“ sah aus
   wie ein Teil der Karteikarte. 14 px ist dasselbe Maß, das die Bühne des
   Karteikastens (.flip-buehne) schon hat. */
.ueb-karte{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);
  padding:20px 22px;margin:14px 0;box-shadow:var(--schatten)}
.ueb-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;font-weight:600;color:var(--txt3);margin-bottom:12px}
.ueb-treffer{display:inline-flex;gap:4px;align-items:center}
.ueb-treffer .punkt{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border2);
  display:inline-block}
.ueb-treffer .punkt.voll{background:var(--bewertung-3);border-color:var(--bewertung-3)}
.ueb-frage{font-size:21px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.ueb-antwort{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  font-size:19px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:var(--txt2)}
.ueb-antwort.voll{font-family:inherit;letter-spacing:normal;color:var(--txt);font-weight:600}
.ueb-zugedeckt{margin-top:16px;padding:14px;border-top:1px dashed var(--border2);
  background:var(--bg2);border-radius:10px;font-size:13.5px;color:var(--txt2);text-align:center}
.abschluss{text-align:center;padding:26px 0}
.abschluss .gross-ico{font-size:44px;line-height:1;margin-bottom:12px}

/* ===== Statistik ======================================================== */
.kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kennzahl{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg)}
.kennzahl b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kennzahl span{font-size:12.5px;color:var(--txt2)}
.balken{display:flex;align-items:center;gap:9px;margin-bottom:5px;font-size:13px}
.balken .lab{width:62px;flex:none;color:var(--txt2);font-variant-numeric:tabular-nums}
.balken .spur{display:block;flex:1;height:17px;background:var(--bg3);border-radius:5px;overflow:hidden}
/* display:block ist zwingend — als inline-Element würde das span Breite und
   Höhe schlicht ignorieren und der Balken bliebe unsichtbar. */
.balken .fuell{display:block;height:100%;background:var(--blue);border-radius:5px;min-width:2px;transition:width .3s}
.balken .val{width:44px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2)}
/* Nur die Bewertungsbalken der Abschlussseite brauchen die breite Spalte —
   „Fach 12“ in der Statistik passt weiter in 62 px. */
.bew-balken .lab{width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){ .bew-balken .lab{width:88px;font-size:12px} }
.tage{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px}
.tage > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.tage .saeule{width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.tage .saeule.null{background:var(--bg3)}
.tage .tag{font-size:10px;color:var(--txt3);white-space:nowrap}
table.daten{width:100%;border-collapse:collapse;font-size:14px}
/* Auf schmalen Bildschirmen lieber die Tabelle scrollen lassen als die ganze
   Seite über den Rand schieben — sonst zoomt das Handy alles heraus. */
.box{overflow-x:auto}
table.daten th,table.daten td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
table.daten th{font-size:12px;color:var(--txt2);font-weight:600}
table.daten td.num,table.daten th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ===== Modal / Toast / Overlays ========================================= */
#modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#modal{
  background:var(--bg);border-radius:var(--radius2);width:100%;max-width:480px;
  max-height:88vh;overflow:auto;padding:20px;box-shadow:0 12px 48px rgba(0,0,0,.3);
}
#modal h2{margin-bottom:14px}
/* Die Knopfleiste klebt am unteren Rand des Dialogs. Auf dem Handy war der
   Dialog sonst höher als der Bildschirm: Die Knöpfe lagen halb hinter der
   Navileiste, und ein Tipp knapp daneben traf den Hintergrund — der Dialog
   schloss sich kommentarlos samt aller Eingaben. */
.modal-btns{
  display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;
  position:sticky;bottom:-20px;background:var(--bg);padding:12px 0 4px;
  box-shadow:0 -10px 12px -10px rgba(0,0,0,.18);
}
#toast{
  /* Versteckt = eigene Höhe + 120px nach unten: garantiert außerhalb des
     Bildes, egal ob bottom 26px (Desktop) oder 74px (über der Bottom-Bar
     auf Mobil) — mit festen 140% lugte oben ein Streifen hervor. */
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 120px));
  background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:99px;
  font-size:14px;font-weight:500;z-index:200;transition:transform .25s;
  max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--schatten);
}
#toast.an{transform:translate(-50%,0)}
#toast.fehler{background:var(--red);color:#fff}
#boot,#fatal,#login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:60;padding:20px;
}
#boot{flex-direction:column;gap:14px;color:var(--txt2)}
.spinner{
  width:26px;height:26px;border:3px solid var(--border2);border-top-color:var(--blue);
  border-radius:50%;animation:dreh .8s linear infinite;
}
@keyframes dreh{to{transform:rotate(360deg)}}
#fatal,#login{overflow:auto;align-items:flex-start}
.mittig{width:100%;max-width:430px;margin:auto;padding:24px 0}
#fatal .mittig{max-width:640px}
.hinweis{
  border:1px solid var(--border);border-left:3px solid var(--orange);
  background:var(--orange-bg);color:var(--txt);border-radius:8px;padding:11px 13px;font-size:13.5px;
}
.hinweis.rot{border-left-color:var(--red);background:var(--red-bg)}
.hinweis.blau{border-left-color:var(--blue);background:var(--blue-bg)}
.hinweis code{font-size:12.5px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;word-break:break-all}
html[data-theme="dark"] .hinweis code{background:rgba(255,255,255,.1)}
pre.code{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px;
  font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:220px;
}
[hidden]{display:none !important}

@media(max-width:900px){
  #app{display:block}
  #topbar-mobil{display:flex;align-items:center;padding:12px 16px}
  #seitenleiste{
    position:fixed;top:auto;bottom:0;left:0;right:0;z-index:40;
    width:auto;height:auto;flex-direction:row;align-items:center;
    padding:6px 6px env(safe-area-inset-bottom);gap:0;
    border-right:0;border-top:1px solid var(--border);
  }
  .sl-marke{display:none}
  nav{flex-direction:row;gap:1px}
  /* Stufe 7: Mit dem siebten Reiter (Mathematik) blieben je Knopf nur noch
     rund 53 px statt 62 — „Karteikasten“ und „Einstellungen“ ragten wieder
     über ihre Fläche. Die seitliche Polsterung fällt deshalb weg, und die
     Beschriftung darf bei Bedarf schrumpfen. Die Tippfläche selbst bleibt
     unverändert groß, sie wird nur besser ausgenutzt. */
  /* `min-height` fest setzen: Sonst hängt die Knopfhöhe daran, ob die
     Beschriftung gerade umbricht — auf einem 390 px breiten Gerät passte
     „Zahlenakrobat“ einzeilig und der Knopf schrumpfte auf 42,8 px, unter
     Apples Mindestmaß von 44. */
  nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;padding:7px 0;
    min-height:52px;
    font-size:11px;text-align:center;justify-content:center;border-radius:10px;
    overflow:hidden}
  /* Mit sieben Reitern bleiben je Knopf rund 50 px. „Zahlenakrobat“ ist
     53 px breit und ragte darüber hinaus, auf 360-px-Geräten auch
     „Karteikasten“ und „Einstellungen“. Statt die Schrift weiter zu
     verkleinern (8,5 px sind schon die Untergrenze des Lesbaren) darf die
     Beschriftung jetzt umbrechen — an einer weichen Trennstelle, die im
     Text steht (`&shy;`), damit der Bruch dort passiert, wo er hingehört,
     und nicht mitten im Wort. Der Knopf wird dadurch höher, nicht enger:
     die Tippfläche wächst. */
  .nav-txt{font-size:10.5px;max-width:100%;white-space:normal;
    line-height:1.15;hyphens:manual;-webkit-hyphens:manual;overflow:hidden}
  .nav-ico{font-size:17px}
  .statuszeile{flex:none;padding:0 6px}
  #status-text{display:none}
  #toast{bottom:86px}
  .wrap{padding:14px 12px 96px}
  .bew span{font-size:10.5px}
  .bew small{display:none}
  .flip-text{font-size:18px}
  /* Über der Navileiste Platz lassen, sonst liegt die Knopfleiste des Dialogs
     dahinter und lässt sich nicht mehr sicher treffen. */
  #modal-bg{align-items:flex-start;padding:12px 12px 78px}

  /* ---- Stufe 6: gemessene Nachbesserungen fürs Telefon -----------------
     Die Nutzerinnen sind 14 und 16 und lernen am Handy, oft einhändig.
     Gemessen wurde auf iPhone SE (375 px), iPhone 14, Android und quer. */

  /* „Karteikasten“ und „Einstellungen“ ragten 2–3 px über ihre Knopffläche.
     Mit dem siebten Reiter aus Stufe 7 wurde es wieder eng — gemessen
     8,5 px reichen für „Karteikasten“ in 53 px Knopfbreite. */
  .nav-txt{font-size:8.5px;letter-spacing:-.1px;line-height:1.15}
  /* Der Verbindungsstatus braucht auf dem Handy keinen Platz — er stand
     2,7 px vor „Einstellungen“. */
  #status{display:none}

  /* Alle Knöpfe waren 41 px hoch. Apple nennt 44, Android 48 als Mindestmaß
     für eine Tippfläche; darunter trifft man regelmäßig daneben. */
  .btn{padding:12px 15px}
  /* 9 px ergaben 40 px Höhe — unter Apples 44 und Androids 48. In der
     Lernbox sind „Kann ich schon“, „Für heute genug“ und „Zudecken und
     selbst prüfen“ genau solche kleinen Knöpfe, und sie liegen dort, wo
     man einhändig hinkommt. */
  .btn.klein{padding:13px 12px}
  /* Der erste „Kann ich schon“-Knopf lag auf dem iPhone SE bei y 589–629,
     die Navileiste beginnt bei 602 — der Tipp traf die Navigation. */
  #seite-ueben{padding-bottom:16px}
  #seite-ueben select{min-height:48px}

  /* Die Werkzeugleiste des Karteneditors hatte 30 × 29 px große Ziele, die
     Quelltext-Knöpfe sogar 36 × 22. Die Leiste wächst dadurch auf drei
     Zeilen — das passt in den Dialog. */
  .ed-knopf{min-width:44px;height:44px}
  .ed-kopf .ed-knopf{height:44px;min-width:44px}
  /* Die Palette hing an `left:0` ihres Auslösers und ragte beim rechten
     Knopf 180 px aus dem Fenster; mit `right:0` kippte sie stattdessen nach
     links hinaus. Am Handy läuft sie deshalb über die volle Leistenbreite. */
  .ed-leiste{position:relative}
  .ed-palette{position:absolute;left:6px !important;right:6px;top:auto;
    justify-content:flex-start;flex-wrap:wrap}
  .ed-farbe{width:20px;height:20px}

  /* Die Bewertungszeile der Lernbox lag auf halber Bildhöhe, rund 160 px
     über dem unteren Rand — außerhalb dessen, was der Daumen erreicht. Im
     Querformat lag sie sogar HINTER der Navileiste. */
  /* Fest verankert statt klebend: Bei kurzem Inhalt gibt es nichts zum
     Kleben, und die Zeile blieb auf halber Bildhöhe stehen — gemessen
     y=395 von 667, also außerhalb dessen, was der Daumen einhändig
     erreicht. */
  #ueb-aktionen{position:fixed;left:0;right:0;bottom:78px;z-index:5;
    padding:10px 14px 12px;background:var(--bg);
    border-top:1px solid var(--border)}
  #seite-ueben{padding-bottom:150px}
  /* „Konnte ich“ ist der häufigste Knopf und soll allein in der unteren
     Zeile stehen, nicht zufällig dort landen. */
  #ueb-aktionen .row{gap:8px}
  /* „Sitzung starten“ stand 133 px unter der Bildkante — erst Zielring,
     Kennzahlen, Abzeichen, Fachbalken und Kastenliste. Der wichtigste Knopf
     der App läuft jetzt am unteren Rand mit. */
  #seite-lernen .start-klebt{position:sticky;bottom:82px;z-index:2;
    background:linear-gradient(to bottom, transparent, var(--bg) 22%);
    padding:14px 0 4px}
}

/* Wenig Höhe heißt fast immer: die Bildschirmtastatur ist offen. Dann
   verdeckte die 75 px hohe Navileiste die Bedienelemente um 37 bis 99 px —
   „Konnte ich“ lag komplett außerhalb des sichtbaren Bereichs.

   Die Grenze liegt bei 380 px und nicht höher: Ein quer gehaltenes Telefon
   ist rund 390 px hoch OHNE Tastatur. Bei 460 px verschwand dort die
   gesamte Navigation — gemessen 0 × 0 px für alle sechs Reiter. Für das
   Querformat genügt die klebende Aktionszeile weiter unten. */
@media (max-width: 900px) and (max-height: 380px) {
  #seitenleiste{display:none}
  main{padding-bottom:12px}
  #ueb-aktionen{position:static;background:none;border:0;padding:10px 0 0}
  /* Bei offener Bildschirmtastatur zählt jeder Pixel: Die 14 px Luft ober-
     und unterhalb der Karte schoben das Eingabefeld gemessen 2 px unter die
     Navileiste. Die Aktionszeile bringt hier ohnehin 10 px eigenes Polster
     mit — zusammen mit den 4 px unten bleiben es 14 px Abstand zu den
     Knöpfen, nur eben nicht doppelt gezählt. */
  .ueb-karte{margin:6px 0 4px;padding:14px 16px}
  #seite-ueben{padding-bottom:12px}
  #modal{max-height:calc(100vh - 96px);margin-top:12px}
  table.daten{font-size:12.5px}
  table.daten th,table.daten td{padding:6px 5px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation-duration:.01ms !important}
  .flip-karte{transition:none !important}
}
</style>
</head>
<body>

<!-- ===== Ladeindikator ================================================= -->
<div id="boot">
  <div class="spinner"></div>
  <div id="boot-text">HAN CROCO wird geladen …</div>
</div>

<!-- ===== Harter Fehler (Konfiguration/SDK) ============================= -->
<div id="fatal" hidden><div class="mittig">
  <h1>HAN CROCO startet nicht</h1>
  <div id="fatal-text"></div>
</div></div>

<!-- ===== Anmeldung ==================================================== -->
<div id="login" hidden><div class="mittig">
  <h1 style="margin-bottom:4px">HAN CROCO</h1>
  <p class="mini" style="margin-bottom:22px">Digitale Lernkartei · Version <span id="login-version"></span></p>
  <form id="login-form" autocomplete="on">
    <label class="feld"><span>E-Mail</span>
      <input type="email" id="login-mail" required autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
    </label>
    <label class="feld"><span>Passwort</span>
      <input type="password" id="login-pw" required autocomplete="current-password">
    </label>
    <div id="login-fehler" class="hinweis rot" hidden style="margin-bottom:12px"></div>
    <button class="btn primary breit gross" id="login-btn" type="submit">Anmelden</button>
  </form>
  <div class="row" style="justify-content:space-between;margin-top:14px">
    <button class="btn klein" id="login-reset" type="button">Passwort vergessen</button>
    <span class="mini" id="login-konten"></span>
  </div>
  <p class="mini mt2">
    Neue Konten werden ausschließlich in der Firebase-Konsole angelegt.
    Eine Registrierung in der App gibt es bewusst nicht.
  </p>
</div></div>

<!-- ===== App ========================================================== -->
<div id="app" hidden>

     So fehlt im schlimmsten Fall ein Reiter, und der Rest läuft weiter. */
  try {
    const modul = await import('./js/mathe.js');
    MATHE = modul.matheStarten({
      $, $$, esc, toast, modal, frage, verdrahten, AKTION,          // Oberfläche
      heute, zahl, mischen, neueId, textHash, anzeigeName,           // Helfer
      S, FB, get db() { return db; }, schreibe, colMathe, colReviews, // Daten
      refEinstellungen, seiteZeigen, streakPflegen                    // Einbindung
    });
  } catch (e) {
    console.warn('[Mathematik] Modul nicht geladen', e);
    const knopf = $('#nav-mathe');
    if (knopf) knopf.hidden = true;
    SEITEN.splice(SEITEN.indexOf('mathe'), 1);
  }

  loginVorbereiten();
  FB.onAuthStateChanged(auth, benutzerGewechselt);
}

/* ---------- 3. Datum, Zufall, IDs -------------------------------------- */

function isoDatum(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
/** Heutiges Lerndatum. Tagesgrenze liegt lokal um TAGESGRENZE Uhr (KONZEPT §2):
 *  wer um 01:30 Uhr lernt, arbeitet noch am Vortag weiter. */
function heute() {
  const d = new Date();
  d.setHours(d.getHours() - TAGESGRENZE);
  return isoDatum(d);
}
/** Alles, was als Datum hereinkommt, auf YYYY-MM-DD zwingen. Fremde
 *  Sicherungen enthalten mitunter Zeitstempel als Zahl oder gar nichts —
 *  ein solcher Wert darf die Oberfläche nicht lahmlegen. */
function isoOder(v, ersatz) {
  if (typeof v === 'number' && Number.isFinite(v)) {
    const d = new Date(v);
    if (!isNaN(d.getTime())) return isoDatum(d);
  }
  if (v instanceof Date && !isNaN(v.getTime())) return isoDatum(v);
  if (v && typeof v === 'object' && typeof v.seconds === 'number') {   // Firestore-Timestamp
    const d = new Date(v.seconds * 1000);
    if (!isNaN(d.getTime())) return isoDatum(d);
  }
  const s = String(v ?? '').slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ersatz;
}
function plusTage(iso, n) {
  const [y, m, t] = isoOder(iso, heute()).split('-').map(Number);
  return isoDatum(new Date(y, m - 1, t + Number(n || 0)));
}
function tageDiff(isoA, isoB) {           // isoA - isoB in Tagen
  const p = s => {
    const [y, m, t] = isoOder(s, heute()).split('-').map(Number);
    return Date.UTC(y, m - 1, t);
  };
  return Math.round((p(isoA) - p(isoB)) / 86400000);
}
function datumDeutsch(iso) {
  const s = isoOder(iso, null);
  if (!s) return '—';
  const [y, m, t] = s.split('-');
  return `${t}.${m}.${y}`;
}
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
/** Firestore-Dokument-IDs dürfen kein "/" enthalten, nicht "." oder ".." sein
 *  und nicht dem Muster __xyz__ folgen. Alt-IDs werden entsprechend entschärft. */
function sichereId(roh) {
  let s = String(roh ?? '').replace(/\//g, '_').trim();
  if (!s || s === '.' || s === '..' || /^__.*__$/.test(s) || s.length > 200) return neueId();
  return s;
}
function mischen(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function zahl(v, min, max, ersatz) {
  const n = Number(v);
  if (!Number.isFinite(n)) return ersatz;
  return Math.min(max, Math.max(min, Math.round(n)));
}

/* ---------- 4. Toast und Modal ----------------------------------------- */

let toastTimer = null;
function toast(text, art) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.toggle('fehler', art === 'fehler');
  t.classList.add('an');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('an'), art === 'fehler' ? 5200 : 2600);
}

/* Werte des zuletzt geschlossenen Dialogs. Notwendig, weil der Dialog beim
   Schließen geleert wird — nach dem await gibt es die Felder nicht mehr. */
let letzteWerte = {};
function W(id, ersatz) {
  const v = letzteWerte[id];
  return v === undefined || v === '' ? ersatz : v;
}
function WRadio(name, ersatz) {
  return letzteWerte['radio:' + name] ?? ersatz;
}

/**
 * @param {{titel:string, html:string, knoepfe:Array, breit?:boolean,
 *          beimOeffnen?:Function}} opt
 * Knopf: {text, wert, art:'primary'|'gefahr'|'', pruefen?:Function}
 * Liefert den Wert des gedrückten Knopfes oder null bei Abbruch.
 * Die Feldinhalte stehen danach über W('feld-id') bereit.
 */
function modal(opt) {
  return new Promise(fertig => {
    const bg = $('#modal-bg'), m = $('#modal');
    Object.keys(m.dataset).forEach(k => delete m.dataset[k]);
    m.innerHTML =
      `<h2>${esc(opt.titel)}</h2><div id="modal-body">${opt.html || ''}</div>
       <div class="modal-btns">${(opt.knoepfe || []).map((k, i) =>
        `<button class="btn ${k.art || ''}" data-i="${i}">${esc(k.text)}</button>`).join('')}</div>`;
    m.style.maxWidth = opt.breit ? '640px' : '480px';
    bg.hidden = false;

    const schliesse = wert => {
      letzteWerte = Object.assign({}, m.dataset);
      $$('input,textarea,select', m).forEach(el => {
        if (el.id) letzteWerte[el.id] =
          (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
        if (el.type === 'radio' && el.checked && el.name) letzteWerte['radio:' + el.name] = el.value;
      });
      bg.hidden = true; m.innerHTML = '';
      document.removeEventListener('keydown', beiTaste, true);
      bg.removeEventListener('click', beiHintergrund);
      fertig(wert);
    };

    $$('.modal-btns button', m).forEach(b => b.addEventListener('click', () => {
      const k = opt.knoepfe[Number(b.dataset.i)];
      if (k.pruefen && k.pruefen() === false) return;
      schliesse(k.wert);
    }));
    /* Ein Klick daneben schließt nur Dialoge ohne Eingaben. Sonst wäre bei
       einem Fehlgriff neben die Knopfleiste alles weg, was gerade eingetragen
       wurde — auf dem Handy passiert genau das ständig. */
    function beiHintergrund(e) {
      if (e.target !== bg) return;
      if (m.querySelector('input,textarea,select')) return;
      schliesse(null);
    }
    bg.addEventListener('click', beiHintergrund);

    function beiTaste(e) {
      if (e.key === 'Escape') { e.stopPropagation(); schliesse(null); }
      /* Dialoge, in denen erst etwas eingestellt und geprüft werden soll,
         dürfen nicht auf Enter losschreiben: Wer den Kastennamen tippt und
         gewohnheitsmäßig Enter drückt, hätte den Import ausgelöst, ohne
         Vorschau und Bilanz je angesehen zu haben. */
      /* `data-enter-eigen` nimmt ein Feld von der Enter-Regel aus. Nötig für
         die Schlagwort-Eingabe (Stufe 5): Dieser Handler hängt mit `capture`
         am Dokument und läuft damit VOR dem Handler des Feldes — ein
         stopPropagation() dort käme zu spät. Ohne die Ausnahme legt Enter
         kein Schlagwort an, sondern speichert die Karte. */
      if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA'
          && !e.target.closest?.('[data-enter-eigen]') && !opt.ohneEnter) {
        const prim = opt.knoepfe?.findIndex(k => k.art === 'primary');
        if (prim >= 0) {
          e.preventDefault();
          $(`.modal-btns button[data-i="${prim}"]`, m)?.click();
        }
      }
    }
    document.addEventListener('keydown', beiTaste, true);
    opt.beimOeffnen?.(m);
    // Sofort setzen, nicht über einen Timer: sonst springt der Fokus dem
    // Nutzer unter den Fingern weg, wenn er gleich lostippt.
    (m.querySelector('input,textarea,select') || m.querySelector('button'))?.focus();
  });
}

function frage(titel, text, jaText = 'Ja', art = '') {
  return modal({
    titel, html: `<p>${text}</p>`,
    knoepfe: [{ text: 'Abbrechen', wert: null }, { text: jaText, wert: true, art: art || 'primary' }]
  }).then(v => v === true);
}

function loginVorbereiten() {

    $('#login-konten').title = KONTEN_HINWEIS.join('\n');

    btn.disabled = true; btn.textContent = 'Anmeldung läuft …';
    try {
      await FB.signInWithEmailAndPassword(auth, $('#login-mail').value.trim(), $('#login-pw').value);
      $('#login-pw').value = '';
    } catch (err) {
      fehler.innerHTML = esc(authFehler(err));
      fehler.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Anmelden';
    }
  });

    const mail = $('#login-mail').value.trim();
    if (!mail) { $('#login-mail').focus(); return toast('Bitte zuerst die E-Mail-Adresse eintragen.'); }
    if (!await frage('Passwort zurücksetzen',
      `An <strong>${esc(mail)}</strong> eine E-Mail zum Zurücksetzen des Passworts schicken?`,
      'E-Mail senden')) return;
    try {
      await FB.sendPasswordResetEmail(auth, mail);
      toast('E-Mail ist unterwegs. Bitte auch den Spam-Ordner prüfen.');
    } catch (err) { toast(authFehler(err), 'fehler'); }
  });
}

    'auth/operation-not-allowed': 'E-Mail/Passwort ist in der Firebase-Konsole nicht aktiviert (Authentication → Sign-in method).',
    'auth/unauthorized-domain':  'Diese Domain ist in Firebase nicht freigegeben (Authentication → Settings → Authorized domains).',

function firestoreFehler(e) {
  const c = e?.code || '';
  if (c === 'permission-denied' || /permission/i.test(e?.message || ''))
    return 'Firestore verweigert den Zugriff. Sind die Security Rules aus firestore.rules veröffentlicht?';
  if (c === 'unavailable')
    return 'Firestore ist gerade nicht erreichbar. Die App arbeitet mit den lokal gespeicherten Daten weiter.';
  if (c === 'failed-precondition')
    return 'Der Offline-Zwischenspeicher konnte nicht angelegt werden (privates Fenster oder mehrere Tabs?).';
  if (c === 'not-found')
    return 'Diese Karte gibt es nicht mehr — vermutlich auf einem anderen Gerät gelöscht.';
  if (c === 'resource-exhausted')
    return 'Das Tageskontingent von Firestore ist aufgebraucht. Morgen geht es weiter; bis dahin wird lokal gespeichert.';
  return (e?.message || String(e)) + (c ? ` (${c})` : '');
}

/* ---------- 6. Firestore-Anbindung ------------------------------------- */

const refEinstellungen = () => FB.doc(db, 'users', S.uid, 'settings', 'app');
const colDecks   = () => FB.collection(db, 'users', S.uid, 'decks');
const colCards   = () => FB.collection(db, 'users', S.uid, 'cards');
const colReviews = () => FB.collection(db, 'users', S.uid, 'reviews');
/* Stufe 7: ein Dokument je Mathematik-Bereich, nicht eines je Set. */
const colMathe   = () => FB.collection(db, 'users', S.uid, 'mathe');

/**
 * Firestore-Schreibvorgänge lösen ihr Promise erst auf, wenn der Server
 * bestätigt hat — offline bleiben sie liegen. Deshalb wird nirgends auf einen
 * Schreibvorgang gewartet: der lokale Zwischenspeicher aktualisiert die
 * Oberfläche sofort, der Server zieht nach, sobald wieder Netz da ist.
 */
function schreibe(promise, wobei) {
  Promise.resolve(promise).catch(e => {
    console.error('[Schreibfehler]', wobei, e);
    toast('Nicht gespeichert: ' + firestoreFehler(e), 'fehler');
  });
}

let statusZustand = { cache: false, offen: false };

function statusMalen() {
  const p = $('#status-punkt'), t = $('#status-text');
  if (!p) return;
  let klasse = 'ok', text = 'Synchronisiert';
  if (statusZustand.offen)      { klasse = 'warte'; text = 'Wird gespeichert …'; }
  else if (!navigator.onLine)   { klasse = 'aus';   text = 'Offline'; }
  else if (statusZustand.cache) { klasse = 'aus';   text = 'Aus Zwischenspeicher'; }
  p.className = 'punkt ' + klasse;
  t.textContent = text;
  $('#status').title = statusZustand.offen
    ? 'Änderungen liegen lokal und werden übertragen, sobald wieder Verbindung besteht.'
    : (navigator.onLine ? 'Alle Änderungen sind bei Firestore angekommen.'
                        : 'Ohne Netz. Lernen funktioniert weiter, alles wird lokal gespeichert.');
  const d = $('#diag-status'); if (d) diagnoseMalen();
}
window.addEventListener('online',  statusMalen);
window.addEventListener('offline', statusMalen);

function datenAnbinden() {
  return new Promise((fertig, schiefgegangen) => {
    let erledigt = false;
    const pruefen = () => {
      if (erledigt) return;
      if (S.bereitSettings && S.bereitDecks && S.bereitCards) {
        erledigt = true;
        // Der Erststart-Test darf den Programmstart nicht aufhalten, falls
        // Firestore ohne Netz keine Antwort liefert.
        Promise.race([
          erstStartPruefen().catch(e => console.warn('Erststart', e)),
          new Promise(r => setTimeout(r, 4000))
        ]).then(() => {
          $('#boot').hidden = true;
          $('#app').hidden = false;
          alleSeitenMalen();
          heutigeStatistikLaden().then(() => { if (S.seite === 'lernen' && !sitzung?.aktiv && !letzteSitzung) malLernen(); });
          if (migrationshinweisAusstehend) {
            migrationshinweisAusstehend = false;
            setTimeout(() => toast(
              'Neue Bewertungen laufen jetzt über FSRS statt feste Fachintervalle. ' +
              'Bereits vergebene Termine bleiben erhalten. Umschaltbar in Einstellungen.'), 500);
          }
          fertig();
        });
      }
    };
    const meta = { includeMetadataChanges: true };

    S.abmelder.push(FB.onSnapshot(refEinstellungen(), meta, snap => {
      const daten = snap.exists() ? snap.data() : null;
      S.einstellungen = Object.assign(STANDARD_EINSTELLUNGEN(), daten || {});
      if (!Array.isArray(S.einstellungen.intervalle) || S.einstellungen.intervalle.length !== 12)
        S.einstellungen.intervalle = STANDARD_INTERVALLE.slice();
      S.einstellungen.intervalle = S.einstellungen.intervalle.map((v, i) =>
        zahl(v, 1, 3650, STANDARD_INTERVALLE[i]));

      // Migration Stufe 1 -> Stufe 2: Konten von vor Stufe 2 (version < 3)
      // wechseln einmalig auf FSRS als neuen Standard-Scheduler (KONZEPT
      // §4.1). Termine bereits gelernter Karten bleiben unangetastet — nur
      // künftige Bewertungen laufen ab jetzt über FSRS statt feste Intervalle.
      if (daten && (!Number.isFinite(daten.version) || daten.version < 3)) {
        S.einstellungen.klassikModus = false;
        S.einstellungen.version = 3;
        schreibe(FB.setDoc(refEinstellungen(),
          { klassikModus: false, version: 3 }, { merge: true }), 'Stufe-2-Migration');
        migrationshinweisAusstehend = true;
      }

      themeWunsch = S.einstellungen.theme || 'auto';
      themeAnwenden(themeWunsch);
      try { localStorage.setItem('lk2:theme', themeWunsch); } catch (_) {}
      S.bereitSettings = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));

    S.abmelder.push(FB.onSnapshot(colDecks(), meta, snap => {
      S.decks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de'));
      // Neu hinzugekommene Kästen sind beim Lernen von Anfang an dabei
      if (lernAuswahl) S.decks.forEach(d => {
        if (!bekannteDecks.has(d.id)) lernAuswahl.add(d.id);
      });
      bekannteDecks = new Set(S.decks.map(d => d.id));
      statusAusSnapshot(snap);
      S.bereitDecks = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));

    S.abmelder.push(FB.onSnapshot(colCards(), meta, snap => {
      S.cards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (S.auswahl.size) {                       // gelöschte Karten aus der Auswahl nehmen
        const da = new Set(S.cards.map(k => k.id));
        S.auswahl.forEach(x => { if (!da.has(x)) S.auswahl.delete(x); });
      }
      statusAusSnapshot(snap);
      S.bereitCards = true;
      if (erledigt) alleSeitenMalen(); else pruefen();
    }, e => { console.error(e); if (!erledigt) schiefgegangen(e); }));
  });
}

function statusAusSnapshot(snap) {
  statusZustand.cache = !!snap.metadata?.fromCache;
  statusZustand.offen = !!snap.metadata?.hasPendingWrites;
  statusMalen();
}

/** Erster Start eines Kontos: Einstellungen und Beispielkasten anlegen. */
async function erstStartPruefen() {
  if (S.decks.length || S.cards.length) {
    schreibe(FB.setDoc(refEinstellungen(),
      { lastSeen: new Date().toISOString() }, { merge: true }), 'lastSeen');
    return;
  }
  // Nur anlegen, wenn sicher feststeht, dass es noch keine Einstellungen gibt.
  // Schlägt die Abfrage fehl (offline, kein Cache), wird nichts erzeugt —
  // sonst entstünde bei jedem Start ein weiterer Beispielkasten.
  let snap = null;
  try { snap = await FB.getDoc(refEinstellungen()); } catch (_) { return; }
  if (!snap || snap.exists()) return;

  const deckId = neueId();
  const b = FB.writeBatch(db);
  b.set(refEinstellungen(), Object.assign(STANDARD_EINSTELLUNGEN(),
    { lastSeen: new Date().toISOString() }));
  b.set(FB.doc(colDecks(), deckId), neuesDeck('Beispiel'));
  [
    ['Was bedeutet „Spaced Repetition“?',
     'Wiederholen in wachsenden Abständen — kurz vor dem Vergessen.',
     'Der Effekt ist gut belegt: gleiche Behaltensleistung bei deutlich weniger Wiederholungen.'],
    ['Wofür stehen die Bewertungen 1 bis 4?',
     '1 = nicht gewusst, 2 = schwer, 3 = gewusst, 4 = sehr leicht',
     '1 setzt die Karte zurück, 4 verlängert den Abstand bis zur nächsten Abfrage am stärksten.'],
    ['Wie kommen meine alten Karten hierher?',
     'Einstellungen → Daten → Altbestand übernehmen',
     'Entweder aus dem Browser dieser Domain oder aus der JSON-Datei der alten App.']
  ].forEach(([f, a, n]) => {
    b.set(FB.doc(colCards(), neueId()), neueKarte({ deckId, frage: f, antwort: a, notiz: n }));
  });
  schreibe(b.commit(), 'Erststart');
}

/* ---------- 7. Datenmodell (KONZEPT §3) --------------------------------- */

function neuesDeck(name, farbe) {
  return {
    name: String(name || 'Neuer Kasten').slice(0, 120),
    farbe: farbe || DECK_FARBEN[Math.floor(Math.random() * DECK_FARBEN.length)],
    modi: ['aufdecken'],        // Stufe 3: aufdecken | tippen | mc | hoeren
    richtung: 'vorwaerts',      // vorwaerts | rueckwaerts | beide
    sprache: 'de-DE',           // Hörmodus: Sprache der Frageseite
    spracheAntwort: 'de-DE',    // Hörmodus: Sprache der Antwortseite
    pruefungsdatum: null,       // Stufe 4
    createdAt: heute(),
    archiviert: false
  };
}
const DECK_FARBEN = ['#378add', '#639922', '#ef9f27', '#e24b4a', '#8e6bd6', '#1B9AAA', '#d6538e', '#5b7083'];

function neueKarte({ deckId, frage, antwort, notiz, extra, mark, lautschrift,
                    lautschriftAntwort, format, tags, typ, quelleId, variante }) {
  return {
    deckId,
    frage: String(frage || '').trim(),
    antwort: String(antwort || '').trim(),
    notiz: String(notiz || '').trim(),
    // Stufe 5, nach dem Vorbild der Anki-Notizfelder:
    // „Extra“ erscheint zusammen mit der Antwort, „Mark“ ist ein Merker, der
    // auf beiden Seiten oben steht.
    extra: String(extra || '').trim(),
    mark: String(mark || '').trim(),
    // Lautschrift (IPA) je Seite. Wird an Chirp 3 HD durchgereicht und
    // erzwingt dort die Aussprache — bei Vokabeln der eigentliche Zweck der
    // ganzen Sprachausgabe.
    lautschrift: String(lautschrift || '').trim(),
    lautschriftAntwort: String(lautschriftAntwort || '').trim(),
    // 'text' = die Felder sind Klartext und werden beim Anzeigen escaped
    // (alles vor Stufe 5). 'html' = die Felder enthalten ausgezeichneten Text
    // und laufen beim Anzeigen durch htmlSauber(). Ein Bestandsfeld ohne
    // Kennzeichnung bleibt Klartext — sonst würde eine alte Karte mit „a < b“
    // beim ersten Anzeigen zerbrechen.
    format: format === 'html' ? 'html' : 'text',
    tags: Array.isArray(tags) ? tags.slice(0, 30).map(t => String(t).slice(0, 40)) : [],
    typ: KARTEN_TYPEN.includes(typ) ? typ : 'standard',   // standard | cloze
    // Stufe 3: Eine Quellkarte kann mehrere eigenständig terminierte
    // Abfragen erzeugen (Cloze-Lücken, Rückwärtsrichtung). Die Quellkarte
    // selbst trägt quelleId:null; abgeleitete Karten zeigen darauf.
    quelleId: quelleId || null,
    variante: variante || 'v',  // 'v' | 'r' | 'c1', 'c2', …
    fach: 1,
    stability: 0,
    // difficulty MUSS bei einer noch nie gelernten Karte zusammen mit
    // stability:0 auf 0 stehen — ts-fsrs erkennt eine "frische" Karte genau
    // an dieser Kombination und initialisiert sie über die Erstbewertungs-
    // formel. Jeder andere Wert hier lässt FSRS bei der ersten Bewertung
    // mit "Invalid memory state" abstürzen.
    difficulty: 0,
    due: heute(),               // neue Karten sind sofort dran
    lastReview: null,
    reps: 0,
    learningSteps: 0,
    lapses: 0,
    state: 0,                   // 0 neu, 1 lernen, 2 Wiederholung, 3 erneut lernen
    suspendiert: false,
    leech: false,               // Stufe 4: als Problemkarte erkannt
    leechBasis: 0,              // Aussetzer-Stand beim letzten Wiederaufnehmen
    zeitGesamt: 0,              // Stufe 4: aufsummierte Lernzeit in Sekunden
    zeitReps: 0,                // dazugehörige Anzahl gemessener Abfragen
    // Stufe 6 — Lernbox. `uebung` ist null, solange die Karte nicht darin
    // liegt, sonst die Zahl der bereits erreichten Treffer MIT ABSTAND.
    // Bewusst ein Zählstand und kein Ja/Nein: Das Kriterium ist der Kern des
    // Verfahrens, und ein Fehlversuch setzt ihn zurück.
    uebung: null,
    uebungTag: null,            // Tag des letzten Treffers (Stand verfällt danach)
    uebungFertig: null,         // ISO-Tag des letzten Verlassens der Lernbox
    createdAt: heute()
  };
}

/** Karten, deren Kasten nicht (mehr) existiert. Sie kämen sonst in keiner
 *  Sitzung mehr vor, würden aber weiter mitgezählt. */
function verwaisteKarten() {
  const da = new Set(S.decks.map(d => d.id));
  return S.cards.filter(k => !da.has(k.deckId));
}

const istFaellig    = k => !k.suspendiert && (k.due || heute()) <= heute();
/** Umfang „Nur heute“: heute fällig — und zusätzlich alles, was noch nie
 *  dran war. Eine neue Karte hat kein Intervall verpasst; mit reiner
 *  Gleichheit wäre sie ab dem Tag nach dem Anlegen aus diesem Umfang
 *  verschwunden und nur noch unter „alle fälligen“ auffindbar gewesen. */
const istHeuteGenau = k => !k.suspendiert &&
  ((k.due || heute()) === heute() || (istNeu(k) && (k.due || heute()) <= heute())
   // Vor einer Prüfung zählt auch alles Liegengebliebene: Die vorgezogenen
   // Termine liegen auf bestimmten Tagen, und ein verpasster Tag darf die
   // Karten nicht bis nach der Prüfung aus dem Blick nehmen.
   || (!!deckPruefungAktiv(k.deckId) && (k.due || heute()) <= heute()));
const istNeu        = k => !k.reps;
const deckName      = id => S.decks.find(d => d.id === id)?.name || 'Ohne Kasten';
const deckFarbe     = id => S.decks.find(d => d.id === id)?.farbe || 'var(--txt3)';
const kartenVon     = id => S.cards.filter(k => k.deckId === id);

/** Fach ist die Anzeige-Ebene der Karteikarten-Metapher (KONZEPT §4.3).
 *  Klassik-Modus: Fach ist eine gespeicherte Terminierungsgröße (wie Stufe 1).
 *  FSRS-Modus: Fach ist eine reine Ableitung aus der Stabilität — keine
 *  gespeicherte Größe, ändert sich also automatisch mit jeder Bewertung. */
function fachVon(k) {
  if (S.einstellungen.klassikModus) {
    return Number.isFinite(k.fach) && k.fach >= 1 ? Math.min(12, Math.round(k.fach)) : 1;
  }
  const s = Number(k.stability) || 0;
  const schwellen = STANDARD_INTERVALLE.filter(g => s >= g).length;
  return Math.max(1, Math.min(12, schwellen + 1));
}

/* ---------- 7b. Lernmodi und Varianten (Stufe 3, KONZEPT §5) ------------ */

const MODI_ALLE   = ['aufdecken', 'tippen', 'mc', 'hoeren'];
const MODUS_NAME  = { aufdecken: 'Aufdecken', tippen: 'Tippen', mc: 'Multiple Choice', hoeren: 'Hören' };
const MODUS_HILFE = {
  aufdecken: 'Frage lesen, Antwort aufdecken, selbst bewerten.',
  tippen:    'Antwort eintippen, automatische Auswertung mit Tippfehlertoleranz.',
  mc:        'Vier Vorgaben — nur bei Karten, die noch nie gelernt wurden.',
  hoeren:    'Frage und Antwort werden vorgelesen.'
};
const KARTEN_TYPEN = ['standard', 'cloze'];
const RICHTUNGEN   = ['vorwaerts', 'rueckwaerts', 'beide'];
const RICHTUNG_NAME = {
  vorwaerts:   'Vorwärts — Frage → Antwort',
  rueckwaerts: 'Rückwärts — Antwort → Frage',
  beide:       'Beide Richtungen — zwei getrennt terminierte Karten'
};
const SPRACHEN = [
  ['de-DE', 'Deutsch'], ['en-US', 'Englisch (US)'], ['en-GB', 'Englisch (UK)'],
  ['fr-FR', 'Französisch'], ['es-ES', 'Spanisch'], ['it-IT', 'Italienisch'],
  ['nl-NL', 'Niederländisch'], ['pt-PT', 'Portugiesisch'], ['pl-PL', 'Polnisch'],
  ['ru-RU', 'Russisch'], ['tr-TR', 'Türkisch'], ['sv-SE', 'Schwedisch']
];

const deckVon = id => S.decks.find(d => d.id === id) || null;
function deckModi(deckId) {
  const m = deckVon(deckId)?.modi;
  const gefiltert = Array.isArray(m) ? m.filter(x => MODI_ALLE.includes(x)) : [];
  return gefiltert.length ? gefiltert : ['aufdecken'];
}
function deckRichtung(deckId) {
  const r = deckVon(deckId)?.richtung;
  return RICHTUNGEN.includes(r) ? r : 'vorwaerts';
}
function deckSprache(deckId) {
  const s = deckVon(deckId)?.sprache;
  return typeof s === 'string' && s ? s : 'de-DE';
}
function deckSpracheAntwort(deckId) {
  const s = deckVon(deckId)?.spracheAntwort;
  return typeof s === 'string' && s ? s : deckSprache(deckId);
}
/** Welche Stimme gehört zu welcher Seite? Die Sprache hängt am Feld, nicht
 *  an der Abfragerichtung: Bei einer Rückwärtsabfrage steht vorne die
 *  Antwort, die also in der Antwortsprache zu lesen ist. Ohne diese
 *  Unterscheidung läse eine englische Stimme die deutschen Vokabeln — im
 *  Hörmodus ausgerechnet das, worauf es ankommt. */
function spracheFuer(k, seite) {
  if (istClozeVariante(k)) return deckSprache(k.deckId);   // beides derselbe Text
  const zeigtAntwortFeld = (seite === 'frage') === (varianteVon(k) === 'r');
  return zeigtAntwortFeld ? deckSpracheAntwort(k.deckId) : deckSprache(k.deckId);
}
/** Lautschrift der gerade gezeigten Seite — nach derselben Regel wie die
 *  Sprache, denn sie hängt am selben Feld. */
function lautschriftFuer(k, seite) {
  if (!k || istClozeVariante(k)) return '';
  const zeigtAntwortFeld = (seite === 'frage') === (varianteVon(k) === 'r');
  return String((zeigtAntwortFeld ? k.lautschriftAntwort : k.lautschrift) || '').trim();
}

/* --- Cloze: {{c1::Lösung}} oder {{c1::Lösung::Hinweis}} ------------------ */

/* Bewusst als Funktion: ein geteiltes globales RegExp mit /g-Flag würde
   seinen lastIndex zwischen den Aufrufern verschleppen. */
/* Die Längenbegrenzung ist kein Schönheitsfehler: mit unbegrenzten faulen
   Quantoren braucht ein Text mit vielen offenen „{{c1::“ ohne Abschluss
   quadratisch bis kubisch viel Zeit. 600 Zeichen je Lücke sind reichlich. */
const clozeRegex = () => /\{\{c(\d{1,2})::([\s\S]{0,600}?)(?:::([\s\S]{0,600}?))?\}\}/g;

function clozeTeile(text) {
  const out = [];
  const re = clozeRegex();
  let m;
  while ((m = re.exec(String(text ?? ''))) !== null) {
    out.push({ nr: Number(m[1]), loesung: m[2], hinweis: m[3] == null ? null : m[3] });
    if (m.index === re.lastIndex) re.lastIndex++;   // Endlosschleife bei Leertreffer verhindern
  }
  return out;
}
function clozeNummern(text) {
  return Array.from(new Set(clozeTeile(text).map(t => t.nr)))
    .filter(n => Number.isFinite(n) && n >= 1 && n <= 20).sort((a, b) => a - b);
}
function clozeLoesung(text, nr) {
  const t = clozeTeile(text).filter(x => x.nr === nr).map(x => x.loesung.trim()).filter(Boolean);
  return Array.from(new Set(t)).join(' / ');
}
/** Cloze-Text als HTML. aufgedeckt=false zeigt die abgefragte Lücke als
 *  Platzhalter (oder Hinweis), alle anderen Lücken im Klartext. */
function clozeHtml(text, zielNr, aufgedeckt) {
  const s = String(text ?? '');
  const re = clozeRegex();
  let out = '', letzte = 0, m;
  while ((m = re.exec(s)) !== null) {
    out += esc(s.slice(letzte, m.index));
    const nr = Number(m[1]), loesung = m[2], hinweis = m[3];
    if (nr === zielNr) {
      out += aufgedeckt
        ? `<span class="cloze-loesung">${esc(loesung)}</span>`
        : `<span class="cloze-luecke">${hinweis ? esc(hinweis) : '&nbsp;…&nbsp;'}</span>`;
    } else {
      out += esc(loesung);
    }
    letzte = m.index + m[0].length;
    if (m.index === re.lastIndex) re.lastIndex++;
  }
  return out + esc(s.slice(letzte));
}

/* --- Varianten: eigenständig terminierte Abfragen einer Quellkarte ------- */

const istQuellkarte    = k => !k.quelleId;
const varianteVon      = k => (typeof k.variante === 'string' && k.variante) ? k.variante : 'v';
const istClozeVariante = k => /^c\d+$/.test(varianteVon(k));
function clozeNrVon(k) { const m = /^c(\d+)$/.exec(varianteVon(k)); return m ? Number(m[1]) : 0; }
const abgeleiteteVon   = quelleId => S.cards.filter(k => k.quelleId === quelleId);

/** Welche eigenständig terminierten Abfragen soll diese Quellkarte erzeugen?
 *  Cloze und Abfragerichtung schließen sich aus: bei einem Lückentext ergibt
 *  die Rückwärtsfrage keinen Sinn, dort zählen die Lücken. */
function gewuenschteVarianten(quelle, deck) {
  if (quelle.typ === 'cloze') {
    const nummern = clozeNummern(quelle.frage);
    if (nummern.length) return nummern.map(n => 'c' + n);
    return ['v'];    // als Lückentext markiert, aber (noch) ohne Lücke
  }
  const r = RICHTUNGEN.includes(deck?.richtung) ? deck.richtung : 'vorwaerts';
  if (r === 'beide') return ['v', 'r'];
  if (r === 'rueckwaerts') return ['r'];
  return ['v'];
}

/** Soll-Ist-Abgleich der Varianten einer Quellkarte. Schreibt nichts, liefert
 *  nur die nötigen Schritte — so lässt sich derselbe Plan einzeln ausführen
 *  oder für viele Karten zu einem Stapel zusammenfassen.
 *
 *  Grundregel: Die Quellkarte behält ihre Variante, solange diese gebraucht
 *  wird, sonst übernimmt sie die erste offene. Ihr Lernfortschritt geht damit
 *  nie verloren — anders als bei abgeleiteten Karten, die beim Abwählen einer
 *  Richtung tatsächlich verschwinden (dann ist die Abfrage ja nicht mehr
 *  gewollt). */
/* Felder, die zum Lernstand einer einzelnen Abfrage gehören. */
const TERMIN_FELDER = ['due', 'stability', 'difficulty', 'reps', 'lapses', 'state', 'fach',
  'lastReview', 'zeitGesamt', 'zeitReps', 'leech', 'leechBasis',
  // Stufe 6: Der Übungsstand hängt an der einzelnen Abfrage. Eine
  // Rückwärtskarte kann noch geübt werden müssen, während die Vorwärtsrichtung
  // längst sitzt — beides sind eigene Gedächtnisspuren.
  'uebung', 'uebungTag', 'uebungFertig'];

/** Weicht der gespiegelte Inhalt ab? Nur dann muss geschrieben werden —
 *  sonst würde jeder Abgleich Dokumente anfassen, obwohl alles stimmt, und
 *  die Diagnose meldete dauerhaft Handlungsbedarf. */
/* Jedes neue Inhaltsfeld gehört in BEIDE Listen: hierher und in das
   inhalt-Objekt in variantenPlan(). Fehlt es hier, driftet die Rückwärts-
   kopie unbemerkt ab; fehlt es dort, wird bei jedem Abgleich geschrieben,
   obwohl alles stimmt. */
const INHALT_FELDER = ['deckId', 'frage', 'antwort', 'notiz', 'extra', 'mark',
  'lautschrift', 'lautschriftAntwort'];

function inhaltAbweicht(k, inhalt) {
  return INHALT_FELDER.some(f => String(k[f] ?? '') !== String(inhalt[f] ?? ''))
      // typ und format haben eine Vorgabe — ein Altbestand ohne das Feld
      // gilt als 'standard' bzw. 'text' und darf keinen Schreibvorgang
      // auslösen, nur weil das Feld fehlt.
      || String(k.typ ?? 'standard')  !== String(inhalt.typ ?? 'standard')
      || String(k.format ?? 'text')   !== String(inhalt.format ?? 'text')
      || !!k.suspendiert !== !!inhalt.suspendiert
      || JSON.stringify(Array.isArray(k.tags) ? k.tags : []) !== JSON.stringify(inhalt.tags || []);
}

function variantenPlan(quelle, deck, index) {
  const soll = gewuenschteVarianten(quelle, deck);
  const ops = [];
  // Bei Massenabgleichen wird der Index einmal gebaut statt je Karte den
  // gesamten Bestand zu durchsuchen — sonst wäre das quadratisch.
  const vorhanden = index ? (index.get(quelle.id) || []) : abgeleiteteVon(quelle.id);

  // 1. Jede vorhandene Abfrage behält ihre Variante, solange sie gebraucht
  //    wird. Die Quellkarte hat dabei Vorrang vor gleichnamigen Ableitungen.
  const quellAlt = varianteVon(quelle);
  const belegt = new Map();     // variante -> abgeleitete Karte
  const weg = [];
  vorhanden.forEach(a => {
    const v = varianteVon(a);
    if (soll.includes(v) && v !== quellAlt && !belegt.has(v)) belegt.set(v, a);
    else weg.push(a);
  });

  // 2. Wird die Variante der Quellkarte nicht mehr gebraucht, übernimmt sie
  //    eine offene. Ist keine offen, liegt der gesuchte Lernstand bei einer
  //    abgeleiteten Abfrage — der wird dann auf die Quellkarte übertragen.
  //    Ohne diesen Schritt würde beim Wechsel „beide → rückwärts“ genau die
  //    Karte gelöscht, deren Fortschritt zur verbleibenden Frage gehört.
  let quellVariante = quellAlt;
  const quellPatch = {};
  if (!soll.includes(quellAlt)) {
    const offen = soll.find(v => !belegt.has(v));
    if (offen !== undefined) {
      quellVariante = offen;
    } else {
      const spender = belegt.get(soll[0]);
      quellVariante = soll[0];
      TERMIN_FELDER.forEach(f => { if (spender[f] !== undefined) quellPatch[f] = spender[f]; });
      belegt.delete(soll[0]);
      weg.push(spender);
    }
    quellPatch.variante = quellVariante;
  }

  const inhalt = {
    deckId: quelle.deckId,
    frage: quelle.frage, antwort: quelle.antwort, notiz: quelle.notiz || '',
    extra: quelle.extra || '', mark: quelle.mark || '',
    lautschrift: quelle.lautschrift || '', lautschriftAntwort: quelle.lautschriftAntwort || '',
    format: quelle.format === 'html' ? 'html' : 'text',
    typ: KARTEN_TYPEN.includes(quelle.typ) ? quelle.typ : 'standard',
    tags: Array.isArray(quelle.tags) ? quelle.tags : [],
    // Ruhen gilt für die ganze Karte: abgeleitete Abfragen lassen sich in der
    // Oberfläche nicht einzeln öffnen, blieben sonst also unstoppbar.
    suspendiert: !!quelle.suspendiert
  };

  let angelegt = 0;
  soll.forEach(v => {
    if (v === quellVariante) return;
    const da = belegt.get(v);
    if (da) { if (inhaltAbweicht(da, inhalt)) ops.push(['merge', da.id, { ...inhalt }]); }
    else {
      const karte = neueKarte({ ...inhalt, quelleId: quelle.id, variante: v });
      karte.tags = inhalt.tags;
      karte.suspendiert = inhalt.suspendiert;
      ops.push(['set', neueId(), karte]);
      angelegt++;
    }
  });
  weg.forEach(a => ops.push(['delete', a.id]));
  if (Object.keys(quellPatch).length) ops.unshift(['merge', quelle.id, quellPatch]);

  return { ops, quellVariante, quellPatch, angelegt, entfernt: weg.length };
}

/** Schreibt die Schritte eines oder mehrerer Variantenpläne.
 *  Bewusst ohne update(): ein merge-set gelingt auch, wenn das Dokument
 *  gerade erst angelegt wurde und noch nicht beim Server angekommen ist. */
function variantenOpsSchreiben(ops, wobei) {
  if (!ops.length) return;
  for (let i = 0; i < ops.length; i += 400) {
    const b = FB.writeBatch(db);
    ops.slice(i, i + 400).forEach(([art, id, daten]) => {
      const ref = FB.doc(colCards(), id);
      if (art === 'delete') b.delete(ref);
      else b.set(ref, daten, art === 'merge' ? { merge: true } : undefined);
    });
    schreibe(b.commit(), wobei || 'Kartenvarianten');
  }
}

function variantenAbgleichen(quelle, deck) {
  const plan = variantenPlan(quelle, deck || deckVon(quelle.deckId));
  variantenOpsSchreiben(plan.ops, 'Kartenvarianten');
  Object.assign(quelle, plan.quellPatch);     // lokal sofort, s. quellPatch oben
  return plan;
}

/** Mehrere Quellkarten auf einmal abgleichen — nach Import, Massen-
 *  verschiebung oder einer geänderten Abfragerichtung. `nurWenn` grenzt auf
 *  einen Teilbestand ein (z. B. einen Kasten); ohne Filter wird zusätzlich
 *  nach Karteileichen gesucht. Liefert die Zusammenfassung. */
function ableitungsIndex() {
  const m = new Map();
  S.cards.forEach(k => {
    if (!k.quelleId) return;
    if (!m.has(k.quelleId)) m.set(k.quelleId, []);
    m.get(k.quelleId).push(k);
  });
  return m;
}

function alleVariantenAbgleichen(nurWenn) {
  const ops = [];
  const index = ableitungsIndex();
  let angelegt = 0, entfernt = 0, betroffen = 0;
  S.cards.filter(k => istQuellkarte(k) && (!nurWenn || nurWenn(k))).forEach(q => {
    const plan = variantenPlan(q, deckVon(q.deckId), index);
    if (!plan.ops.length) return;
    betroffen++; angelegt += plan.angelegt; entfernt += plan.entfernt;
    ops.push(...plan.ops);
    Object.assign(q, plan.quellPatch);
  });
  if (!nurWenn) {
    // Abfragen, deren Quellkarte es nicht mehr gibt, sind Karteileichen:
    // sie kämen weiter in Sitzungen vor, ließen sich aber nicht bearbeiten.
    const quellen = new Set(S.cards.filter(istQuellkarte).map(k => k.id));
    const verwaist = S.cards.filter(k => k.quelleId && !quellen.has(k.quelleId));
    verwaist.forEach(k => ops.push(['delete', k.id]));
    entfernt += verwaist.length;
  }
  variantenOpsSchreiben(ops, 'Varianten abgleichen');
  return { betroffen, angelegt, entfernt };
}

/** Trockenlauf des vollständigen Abgleichs: liefert dieselbe Bilanz wie
 *  alleVariantenAbgleichen(), ohne etwas zu schreiben. */
function alleVariantenAbgleichenProbe() {
  const index = ableitungsIndex();
  let angelegt = 0, entfernt = 0, betroffen = 0;
  S.cards.filter(istQuellkarte).forEach(q => {
    const plan = variantenPlan(q, deckVon(q.deckId), index);
    if (!plan.ops.length) return;
    betroffen++; angelegt += plan.angelegt; entfernt += plan.entfernt;
  });
  const bekannt = new Set(S.cards.filter(istQuellkarte).map(k => k.id));
  entfernt += S.cards.filter(k => k.quelleId && !bekannt.has(k.quelleId)).length;
  return { betroffen, angelegt, entfernt };
}

/** Wie viele Karten weichen vom Soll ab? Nur zählen, nicht schreiben — für
 *  die Diagnose. */
function variantenBedarf() {
  const index = ableitungsIndex();
  const quellen = S.cards.filter(istQuellkarte);
  let karten = 0;
  quellen.forEach(q => { if (variantenPlan(q, deckVon(q.deckId), index).ops.length) karten++; });
  const bekannt = new Set(quellen.map(k => k.id));
  const verwaist = S.cards.filter(k => k.quelleId && !bekannt.has(k.quelleId)).length;
  return { karten, verwaist };
}

/** Alle Kennungen, die zu denselben Quellkarten gehören wie die übergebenen.
 *  Löschen und Verschieben dürfen keine halben Kartenfamilien hinterlassen —
 *  eine Rückwärtsabfrage ohne ihre Quellkarte wäre nicht mehr bearbeitbar. */
function mitVarianten(ids) {
  const quellen = new Set();
  ids.forEach(x => {
    const k = S.cards.find(y => y.id === x);
    if (k) quellen.add(k.quelleId || k.id);
  });
  const out = new Set();
  quellen.forEach(q => {
    if (S.cards.some(c => c.id === q)) out.add(q);
    abgeleiteteVon(q).forEach(a => out.add(a.id));
  });
  return Array.from(out);
}

/* --- Ausgezeichneter Text (Stufe 5) -------------------------------------- */

/* Bis Stufe 4 lief jeder Kartentext durch esc(). Das war die einzige
   Absicherung gegen fremdes Markup und hat vier Prüfrunden gehalten. Mit dem
   Editor im Anki-Stil dürfen Karten jetzt Auszeichnung enthalten — damit
   verschiebt sich die Verantwortung von „alles escapen“ auf „nur eine
   Positivliste durchlassen“.

   Die Liste ist bewusst kurz und enthält nichts, was Inhalte nachladen oder
   Code ausführen könnte: kein <script>, <style>, <iframe>, <object>, <embed>,
   <link>, <img>, kein href, kein src, keine on*-Attribute, keine
   style-Eigenschaft, die eine URL aufnehmen kann.

   Verfahren: Der Text wird in ein *inertes* Dokument geparst (DOMParser mit
   'text/html' führt nichts aus und lädt nichts nach), dann wird der Baum
   durchlaufen. Alles, was nicht auf der Liste steht, verliert sein Element,
   behält aber seinen Textinhalt — so geht beim Einfügen aus Word oder Anki
   kein Inhalt verloren, nur die Formatierung. */

const HTML_ERLAUBT = {
  B: [], STRONG: [], I: [], EM: [], U: [], S: [], STRIKE: [], DEL: [],
  SUB: [], SUP: [], MARK: [], CODE: [],
  BR: [], HR: [], P: [], DIV: [], UL: [], OL: [], LI: [],
  SPAN: ['style'], FONT: ['color']
};
/* Nur Eigenschaften, die reine Darstellung sind. url() und alles mit
   Klammern fliegt unten ohnehin raus. */
const CSS_ERLAUBT = ['color', 'background-color', 'font-weight', 'font-style',
  'text-decoration', 'text-decoration-line'];

/** Ein einzelner style-Wert, auf die Positivliste eingedampft. */
function styleSauber(roh) {
  const raus = [];
  String(roh || '').split(';').forEach(teil => {
    const p = teil.indexOf(':');
    if (p < 0) return;
